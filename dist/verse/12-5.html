176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":12,\"verseId\":5,\"chapterTitle\":\"Examination of Suffering\",\"totalVerses\":10,\"verseData\":{\"id\":\"v12_5\",\"number\":5,\"title\":\"The Receiver Cannot Be Established\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If suffering comes from another person, Then who is that person— When suffering is given by another— Who exists distinct from suffering?\"},\"philosophy\":{\"insight\":\"Shifting to other-causation: if suffering is \\\"given\\\" by another, who is the RECEIVER? The recipient must be an inherently distinct person who exists apart from the suffering received. But as with v.4, no such inherently distinct recipient can be found.\",\"madhyamaka\":\"Other-causation requires both an inherent causer AND an inherent receiver. V.4 questioned the causer. V.5 questions the receiver: the person who \\\"receives\\\" suffering from another must exist inherently distinct from that suffering. But the person is designated upon aggregates that include suffering — the recipient can't be established independently.\",\"quantum\":\"Quantum properties are relational — they don't exist absolutely but are defined through interaction. A particle's spin isn't determined until measured. Similarly, the \\\"recipient\\\" of suffering isn't a fixed entity that exists before receiving — the recipient is constituted by the interaction.\",\"bridge\":\"Both relational quantum mechanics (RQM) and Mādhyamika show that properties/experiences are defined relationally, not absolutely. The \\\"recipient\\\" of suffering and the \\\"measured particle\\\" are both constituted through interaction, not pre-existing.\",\"accessible\":\"If someone \\\"gives\\\" you a gift, who are you apart from the act of receiving? The \\\"you\\\" receiving suffering doesn't exist as a fixed entity independent of the experience. You're partly defined by what happens to you.\",\"twoTruths\":\"Conventionally, people receive suffering from external causes — \\\"the accident caused my pain.\\\" Ultimately, neither the \\\"external cause\\\" nor the \\\"recipient\\\" can be established as inherently distinct entities.\",\"commonMisconception\":\"NOT saying people don't receive suffering from external events. Saying the RECIPIENT can't be established as an inherently distinct entity — the person is constituted partly by their experiences.\"},\"quantumResonance\":{\"concept\":\"Relational Quantum Mechanics\",\"score\":68,\"strength\":\"Medium\",\"explanation\":\"In RQM, properties don't exist absolutely — they're relative to the interacting system. A particle doesn't have a definite spin until interaction defines it. Similarly, the \\\"recipient\\\" of suffering doesn't exist as an inherent entity before the suffering occurs.\",\"caveat\":\"RQM is a specific interpretation of QM. The parallel is about the relational nature of properties/experiences, not a universal physics claim.\"},\"animation\":{\"visualBridge\":\"A figure trying to catch a ball labeled \\\"Suffering\\\" but the figure itself changes shape upon catching it — showing the recipient is constituted by the interaction.\",\"educationalGoal\":\"User sees that the receiver of suffering isn't a fixed entity — they're partly defined by the very suffering they receive.\"},\"deeperDive\":[{\"q\":\"How does this differ from verse 4?\",\"a\":\"V.4 questioned the causer (self) in self-causation. V.5 questions the receiver in other-causation. Both demonstrate that the agent/patient can't be established as inherently distinct from suffering — same logical structure, different direction.\",\"realLifeExample\":\"V.4 asks \\\"who is the pitcher?\\\" V.5 asks \\\"who is the catcher?\\\" Both pitcher and catcher are defined by the game — neither exists inherently outside it.\"},{\"q\":\"Why must the recipient be distinct from suffering?\",\"a\":\"For other-causation to work, you need: (1) an inherent cause (other person), (2) an inherent effect (suffering), and (3) an inherent recipient (this person distinct from the suffering). If the recipient can't be distinguished from the suffering, the model collapses.\",\"realLifeExample\":\"For a gift-giving to work, you need a giver, a gift, and a receiver. If the receiver can't be distinguished from the gift (like \\\"giving happiness to happiness\\\"), the model breaks down.\"},{\"q\":\"What does relational quantum mechanics show?\",\"a\":\"RQM (developed by Carlo Rovelli) holds that quantum properties exist only relative to other systems — there are no absolute, observer-independent properties. A particle's state is defined by its interactions, not by itself. The \\\"recipient\\\" of an interaction is constituted by the interaction.\",\"realLifeExample\":\"Your \\\"role\\\" in a conversation depends on the conversation itself. You're a listener when someone speaks to you, a speaker when you reply. The role is relational, not inherent.\"},{\"q\":\"If the recipient isn't distinct, what follows?\",\"a\":\"The model of other-causation breaks down: you can't have one separate entity causing something in another separate entity if the second entity can't be separated from the effect. The neat causal picture (A → B) dissolves into interdependence.\",\"realLifeExample\":\"If \\\"the teacher\\\" and \\\"the learning\\\" can't be fully separated (teaching IS partly what makes someone a teacher), the simple model of \\\"teacher causes learning\\\" becomes more complex — it's a mutual process.\"},{\"q\":\"Does this undermine ethical responsibility for harming others?\",\"a\":\"No — conventional responsibility operates through dependent arising. If I harm you, I'm conventionally responsible through the chain of conditions (intention → action → effect). This works without requiring inherently separate agent and patient.\",\"realLifeExample\":\"A company is responsible for pollution even though \\\"the company\\\" and \\\"the pollution\\\" are interdependent (the company is partly defined by its activities). Responsibility works through conditions.\"},{\"q\":\"How do vv.4-5 work as a pair?\",\"a\":\"V.4: the self-causer can't be found apart from suffering. V.5: the other-caused recipient can't be found apart from suffering. Neither the agent nor the patient can be inherently established. The entire causal framework of inherent entities acting on each other collapses.\",\"deeper\":\"This double move (questioning both agent and patient) is a sophisticated logical strategy. It's not enough to show the agent is problematic — the patient must also be examined. Together they dissolve the entire relational structure of inherent causation.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does v.5 question about other-causation?\",\"options\":[\"A) The cause\",\"B) The recipient — who is the person that \\\"receives\\\" suffering, existing distinct from that suffering?\",\"C) The suffering itself\",\"D) The temporal order\"],\"correct\":\"B\",\"explanation\":\"V.5 challenges the recipient in other-causation. For suffering to be \\\"given\\\" by another, there must be an inherently distinct recipient. But no such recipient can be found apart from the suffering.\"},\"intermediate\":{\"question\":\"How does relational quantum mechanics parallel the recipient analysis?\",\"options\":[\"A) No parallel\",\"B) RQM shows properties exist only through interactions, not absolutely — similarly, the \\\"recipient\\\" of suffering is constituted by the interaction, not pre-existing\",\"C) RQM proves recipients exist independently\",\"D) QM is unrelated to suffering\"],\"correct\":\"B\",\"explanation\":\"RQM: properties are relational, defined through interaction. Mādhyamika: the recipient is constituted by the experience. Both show that entities are defined through relations, not prior to them.\"},\"advanced\":{\"question\":\"Why must both agent (v.4) AND patient (v.5) be questioned to fully refute inherent causation?\",\"options\":[\"A) Only one needs questioning\",\"B) Inherent causation requires both an inherent agent AND an inherent patient — if either can't be established, the entire causal model collapses\",\"C) The patient is always clear\",\"D) Only the agent matters\"],\"correct\":\"B\",\"explanation\":\"Inherent causation needs distinct, inherent relata: an agent to cause and a patient to receive. Dissolving either one destroys the model. Dissolving both makes the case airtight.\"}},\"verseText\":\"If suffering comes from another person, Then who is that person— When suffering is given by another— Who exists distinct from suffering?\",\"madhyamakaConcept\":\"Other-causation requires both an inherent causer AND an inherent receiver. V.4 questioned the causer. V.5 questions the receiver: the person who \\\"receives\\\" suffering from another must exist inherently distinct from that suffering. But the person is designated upon aggregates that include suffering — the recipient can't be established independently.\",\"quantumPhysicsParallel\":\"Quantum properties are relational — they don't exist absolutely but are defined through interaction. A particle's spin isn't determined until measured. Similarly, the \\\"recipient\\\" of suffering isn't a fixed entity that exists before receiving — the recipient is constituted by the interaction.\"}},\"isShowcase\":false,\"chapterId\":12}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platfo

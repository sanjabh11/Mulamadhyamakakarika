176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":23,\"verseId\":7,\"chapterTitle\":\"Examination of Error\",\"totalVerses\":25,\"verseData\":{\"id\":\"v23_7\",\"number\":7,\"title\":\"Form, Sound, Taste, Touch, Smell, and Dharmas — From These Arise Desire and Hatred\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Form, sound, taste, touch, smell, and dharmas are the basis of desire and hatred and confusion. They are said to be the sixfold basis.\"},\"philosophy\":{\"insight\":\"Identifying the OBJECTS: the six sense objects (form, sound, taste, touch, smell, and mental objects/dharmas) are the basis from which desire, hatred, and confusion arise. These are the \\\"raw material\\\" of afflictions.\",\"madhyamaka\":\"Rūpa śabda rasa sparśa gandha dharma — the ṣaḍ-āyatana (six sense bases). These are the conditions for afflictions to arise. But as vv.8-14 will show, these too are empty.\",\"quantum\":\"Sensory data is analogous to measurement data — the \\\"inputs\\\" to our cognitive apparatus. QM: measurement data is apparatus-dependent. V.7: sensory data is sense-organ-dependent.\",\"bridge\":\"Both: the \\\"input data\\\" depends on the apparatus. QM: measurement data depends on detector. V.7: sensory experience depends on sense organs. Both: no raw, apparatus-independent data.\",\"accessible\":\"What triggers your emotions? What you see, hear, taste, touch, smell, and think about. These are the six doors through which afflictions enter. But the triggers are processed, not raw.\",\"twoTruths\":\"Conventionally: sense objects trigger afflictions. Ultimately: both sense objects and the triggering process are empty of inherent existence.\",\"commonMisconception\":\"NOT saying sense objects are evil. The objects are neutral. Afflictions arise from how we PROCESS them (vv.1-2). The objects are conditions, not inherent causes.\"},\"quantumResonance\":{\"concept\":\"Measurement Data Is Apparatus-Dependent\",\"score\":48,\"strength\":\"Medium\",\"explanation\":\"QM: measurement results depend on detector properties. V.7: sensory experience depends on sense organs. Both: no apparatus-independent raw data.\",\"caveat\":\"QM measurement is physics. V.7 is about sense perception.\"},\"animation\":{\"visualBridge\":\"Six doors (eyes, ears, tongue, body, nose, mind) with objects passing through. As they enter, they get \\\"colored\\\" by evaluation. Caption: \\\"Six doors of perception — neutral objects, constructed evaluations.\\\"\",\"educationalGoal\":\"Sense objects are the conditions for afflictions, but afflictions arise from processing, not from the objects themselves.\"},\"deeperDive\":[{\"q\":\"What are the six sense bases?\",\"a\":\"Form (rūpa) through sight, sound (śabda) through hearing, taste (rasa) through tongue, touch (sparśa) through body, smell (gandha) through nose, and dharmas (mental objects) through mind. These are the complete set of experience-sources in Buddhist epistemology.\",\"realLifeExample\":\"Everything you experience comes through these six channels. Right now: seeing this text (form), perhaps hearing background noise (sound), feeling the chair (touch), etc.\"},{\"q\":\"Are the objects inherently pleasant/unpleasant?\",\"a\":\"No — v.1-2 showed that pleasant/unpleasant is evaluative, not inherent. The objects are CONDITIONS for afflictions, not inherent causes. A beautiful sunset doesn't inherently cause desire — your evaluation does.\",\"realLifeExample\":\"A painting: same form, different evaluations. One viewer: \\\"beautiful!\\\" (desire). Another: \\\"ugly\\\" (aversion). A third: \\\"meh\\\" (confusion). Same object, different afflictions.\"},{\"q\":\"Why list all six?\",\"a\":\"To show that ALL experience-sources are potential bases for afflictions — and ALL are equally empty. The analysis isn't limited to physical objects (form, sound) but includes mental objects (dharmas). Comprehensiveness.\",\"realLifeExample\":\"A worry (mental object/dharma) can trigger afflictions just as much as a physical object. The analysis covers thoughts too.\"},{\"q\":\"How does this set up vv.8-14?\",\"a\":\"V.7 identifies the bases. VV.8-14 will analyze these bases and show they're empty. The strategy: identify the foundation (v.7), then show it's empty (vv.8-14), then conclude afflictions are empty (vv.15+).\",\"realLifeExample\":\"Step 1: identify what the building stands on (foundation). Step 2: show the foundation is sand. Step 3: conclude the building isn't solid.\"},{\"q\":\"What about dharmas (mental objects)?\",\"a\":\"Dharmas as sense objects include thoughts, memories, concepts, and mental images. Including these shows that MENTAL afflictions (like obsessive thoughts) are also based on empty objects, not just physical ones.\",\"realLifeExample\":\"A memory that triggers anger: the memory is a mental object (dharma). It's empty too — the memory isn't the event itself.\"},{\"q\":\"Significance?\",\"a\":\"V.7 completes the identification of afflictions' conditions: (1) conceptual evaluation (v.1), (2) pleasant/unpleasant judgments (v.2), (3) the self (v.3), and now (4) the six sense objects. All will be shown empty.\",\"deeper\":\"V.7 rounds out the identification of conditions for afflictions. With vv.1-7, ALL the components of the affliction-process have been named: the evaluating mind, the evaluative categories, the self that \\\"owns\\\" afflictions, and now the sense objects that trigger them. Vv.8+ will systematically show each component is empty.\"}],\"quiz\":{\"beginner\":{\"question\":\"What are the six sense bases?\",\"options\":[\"A) Only physical\",\"B) Form, sound, taste, touch, smell, and mental objects (dharmas). The complete set of experience-sources.\",\"C) Only three\",\"D) Random selection\"],\"correct\":\"B\",\"explanation\":\"Six complete channels of experience, including mental objects.\"},\"intermediate\":{\"question\":\"Are sense objects inherently pleasant/unpleasant?\",\"options\":[\"A) Yes\",\"B) No — evaluation is added by the mind (vv.1-2). Objects are neutral conditions. Afflictions arise from processing, not from objects themselves.\",\"C) Only some\",\"D) Only physical ones\"],\"correct\":\"B\",\"explanation\":\"Objects are conditions, not inherent causes. Evaluation is added by the mind.\"},\"advanced\":{\"question\":\"Why include dharmas (mental objects)?\",\"options\":[\"A) Completeness only\",\"B) Shows MENTAL afflictions are also based on empty objects. Obsessive thoughts, memories, and concepts are as empty as physical objects. The analysis covers all experience.\",\"C) Only physical matters\",\"D) Dharmas are different\"],\"correct\":\"B\",\"explanation\":\"Mental objects are equally empty. All experience sources included for comprehensive emptiness.\"}},\"verseText\":\"Form, sound, taste, touch, smell, and dharmas are the basis of desire and hatred and confusion. They are said to be the sixfold basis.\",\"madhyamakaConcept\":\"Rūpa śabda rasa sparśa gandha dharma — the ṣaḍ-āyatana (six sense bases). These are the conditions for afflictions to arise. But as vv.8-14 will show, these too are empty.\",\"quantumPhysicsParallel\":\"Sensory data is analogous to measurement data — the \\\"inputs\\\" to our cognitive apparatus. QM: measurement data is apparatus-dependent. V.7: sensory data is sense-organ-dependent.\"}},\"isShowcase\":false,\"chapterId\":23}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities

c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":9,\"verseId\":6,\"chapterTitle\":\"Examination of the Prior Entity\",\"totalVerses\":12,\"verseData\":{\"id\":\"v9_6\",\"number\":6,\"title\":\"Properties Through Interaction\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"While prior to all of seeing, etc., That prior entity doesn't exist, Through seeing, etc., by another one, That other one becomes disclosed.\"},\"philosophy\":{\"insight\":\"The self doesn't exist prior to experience — it is DISCLOSED (revealed, constituted) THROUGH specific experiences. The self becomes known only through seeing, hearing, feeling. Properties emerge through interaction, not pre-existence.\",\"madhyamaka\":\"The prior entity (ātman) is not found before experience. Instead, the self is conventionally established (\\\"disclosed\\\") through specific experiences. It's not that the self exists and then experiences things; the experiencing IS what constitutes the self. This aligns with the five-aggregate analysis.\",\"quantum\":\"This is precisely the quantum measurement paradigm: properties are not pre-existing but ESTABLISHED through measurement/interaction. Before measurement, a particle's spin is undefined (superposition). After measurement, it has a definite value. The interaction creates the property.\",\"bridge\":\"Both Nāgārjuna and QM assert that properties emerge through interaction, not pre-existence. QM: measurement establishes spin, position, momentum. Mādhyamika: experience establishes the self. In both cases, the \\\"thing\\\" is constituted by the interaction, not revealed as pre-existing.\",\"accessible\":\"You don't discover your \\\"self\\\" hiding backstage before the play of life begins. You BECOME yourself through experiences — through seeing, hearing, feeling, learning. The self is constituted by the play, not prior to it.\",\"twoTruths\":\"Conventionally, the self is known through experience: \\\"I saw that,\\\" \\\"I felt this.\\\" Ultimately, the self HAS no existence apart from these experiences. The conventional self is a useful designation; the inherent self is unfindable.\",\"commonMisconception\":\"NOT saying the self is an illusion or doesn't function. Saying the self is CONSTITUTED by experiences, not prior to them. The conventional self is perfectly real and functional.\"},\"quantumResonance\":{\"concept\":\"Quantum Measurement Establishing Properties\",\"score\":86,\"strength\":\"High\",\"explanation\":\"In QM, properties like spin are not pre-existing but established through measurement. Before measurement, the property is undefined (superposition). Nāgārjuna similarly argues the self is not pre-existing but disclosed/constituted through experience.\",\"caveat\":\"Quantum measurement is a specific physical process. The parallel is about the constitution of properties through interaction rather than pre-existence.\"},\"animation\":{\"visualBridge\":\"A blurry, undefined shape that sharpens into a \\\"Self\\\" only when beams of experience (sight, sound, feeling) converge on it. Properties through interaction.\",\"educationalGoal\":\"User sees that the self is constituted through experience, not pre-existing — like quantum properties established through measurement.\"},\"deeperDive\":[{\"q\":\"How does this relate to the five aggregates?\",\"a\":\"The Buddha taught that the self is conventionally designated in dependence upon the five aggregates (form, feeling, perception, formations, consciousness). Nāgārjuna affirms this: the self is disclosed THROUGH these aggregates and their activities, not existing prior to or independently of them.\",\"realLifeExample\":\"You know yourself through your body (form), emotions (feeling), perceptions, thoughts (formations), and awareness (consciousness). Remove all five and nothing remains to call \\\"self.\\\"\"},{\"q\":\"What does \\\"disclosed\\\" mean precisely?\",\"a\":\"The Sanskrit pratijñāyate means \\\"is made known, revealed, established.\\\" The self is MADE KNOWN through experience — it doesn't exist independently and then get discovered. The experience IS what constitutes the self's knowability and conventional existence.\",\"realLifeExample\":\"A song is \\\"disclosed\\\" (made known) only when played. Before playing, the song exists only as potential, not as actual music. The self is similarly disclosed through the \\\"playing\\\" of experience.\"},{\"q\":\"Does this mean the self is an illusion?\",\"a\":\"No. The self is conventionally real and functionally effective. What's denied is INHERENT PRE-EXISTENCE. The self is like a river — real, powerful, nameable, but constituted by its flowing water rather than pre-existing independently of it.\",\"realLifeExample\":\"A team is real — it wins games, has a name, earns trophies. But the team is constituted by its players and their actions, not existing independently of them. Still real; not inherently pre-existing.\"},{\"q\":\"How does quantum measurement create properties?\",\"a\":\"Before measurement, a quantum system is in superposition — no definite value for the measured property. The measurement interaction \\\"collapses\\\" this into a definite value. The property didn't pre-exist; it was established through the measurement interaction.\",\"realLifeExample\":\"A dice roll: before the roll, the outcome is undefined. The roll (interaction) establishes a definite number. The number didn't pre-exist — it was created by the process.\"},{\"q\":\"Is this a form of idealism?\",\"a\":\"No. Nāgārjuna isn't saying the mind creates reality. He's saying subject and object are mutually constituted through their interaction. Neither has priority. This avoids both idealism (mind-first) and materialism (matter-first) by embracing relational co-arising.\",\"realLifeExample\":\"Tango requires both dancers equally. Neither creates the other's dance. They co-create through interaction. Nāgārjuna's view is like this — neither subject nor object has priority.\"},{\"q\":\"How does this connect to decoherence in QM?\",\"a\":\"Decoherence describes how quantum systems lose coherence through interaction with their environment, effectively establishing classical-like properties. The self is similarly \\\"decohered\\\" into conventional existence through its interactions with experience — gaining definite properties through engagement, not pre-existence.\",\"deeper\":\"This is one of the strongest QM-Mādhyamika parallels. Both assert that definite properties emerge through interaction from an undefined prior state. The parallel operates at the level of the fundamental structure: properties through interaction, not properties through pre-existence.\"}],\"quiz\":{\"beginner\":{\"question\":\"When is the self \\\"disclosed\\\" (made known)?\",\"options\":[\"A) Before all experience\",\"B) THROUGH experiences — the self is constituted by seeing, hearing, feeling, not prior to them\",\"C) After all experience ends\",\"D) The self is never known\"],\"correct\":\"B\",\"explanation\":\"The self doesn't pre-exist experience. It is disclosed/constituted through experiences — through seeing, hearing, and feeling.\"},\"intermediate\":{\"question\":\"How does quantum measurement parallel the disclosure of the self?\",\"options\":[\"A) It doesn't\",\"B) Both establish properties THROUGH interaction rather than revealing pre-existing ones — measurement creates definite values, experience constitutes the self\",\"C) QM proves the self pre-exists\",\"D) Measurement doesn't create properties\"],\"correct\":\"B\",\"explanation\":\"Both QM measurement and Nāgārjuna's analysis show that properties are constituted through interaction, not pre-existing independently.\"},\"advanced\":{\"question\":\"Why is Nāgārjuna's view neither idealism nor materialism?\",\"options\":[\"A) It is idealism\",\"B) Neither subject nor object has priority — they are mutually constituted through interaction, avoiding both mind-first (idealism) and matter-first (materialism)\",\"C) It is materialism\",\"D) The distinction doesn't matter\"],\"correct\":\"B\",\"explanation\":\"Mutual constitution avoids giving priority to either subject (idealism) or object (materialism). Both arise together through their interaction.\"}},\"verseText\":\"While prior to all of seeing, etc., That prior entity doesn't exist, Through seeing, etc., by another one, That other one becomes disclosed.\",\"madhyamakaConcept\":\"The prior entity (ātman) is not found before experience. Instead, the self is conventionally established (\\\"disclosed\\\") through specific experiences. It's not that the self exists and then experiences things; the experiencing IS what constitutes the self. This aligns with the five-aggregate analysis.\",\"quantumPhysicsParallel\":\"This is precisely the quantum measurement paradigm: properties are not pre-existing but ESTABLISHED through measurement/interaction. Before measurement, a particle's spin is undefined (superposition). After measurement, it has a definite value. The interaction creates the property.\"}},\"isShowcase\":false,\"chapterId\":9}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$und

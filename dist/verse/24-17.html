88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":24,\"verseId\":17,\"chapterTitle\":\"Examination of the Noble Truths\",\"totalVerses\":40,\"verseData\":{\"id\":\"v24_17\",\"number\":17,\"title\":\"You Destroy Causation, Effects, the Agent, and Action\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"You thereby destroy causes and effects, the agent and the action, and also the arising and ceasing of all things.\"},\"philosophy\":{\"insight\":\"APPLYING v.16: if inherent existence destroys causation, it ALSO destroys effects, agents, actions, and all arising/ceasing. Everything the opponent accused emptiness of destroying is actually destroyed by THEIR position.\",\"madhyamaka\":\"Hetu-phala bādhase (you destroy causes and effects). Kartṛ-karma bādhase (you destroy agent and action). Sarva-bhāva utpāda-nirodha bādhase (you destroy arising and ceasing of all things). Mirror image of the opponent's accusation.\",\"quantum\":\"If particles had inherent states (no QM), there would be no transitions, no interactions, no dynamics. Classical determinism with fixed states → frozen physics.\",\"bridge\":\"Both: inherent fixity destroys all dynamism. QM: fixed states → no transitions. V.17: inherent existence → no causation, no action, no arising/ceasing.\",\"accessible\":\"If everything were permanently fixed, nothing could happen. No cooking (ingredients can't change), no growth (organisms can't develop), no creation (nothing new). Inherent existence = total stasis.\",\"twoTruths\":\"Conventionally: causes, effects, agents, and actions all function. The opponent's inherent existence destroys these conventional realities.\",\"commonMisconception\":\"The opponent accused EMPTINESS of this destruction (vv.1-6). V.17 shows it's INHERENT EXISTENCE that causes it. Perfect mirror reversal.\"},\"quantumResonance\":{\"concept\":\"Fixed States → No Dynamics\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"Inherently fixed states → no transitions, interactions, or dynamics. Inherent existence → no causation, agents, or arising. Both: fixity kills dynamism.\",\"caveat\":\"Physical dynamics vs. metaphysical dynamics.\"},\"animation\":{\"visualBridge\":\"The opponent's accusations from vv.1-6, now redirected back at \\\"Inherent Existence.\\\" Each accusation hits the opponent's own position. Caption: \\\"Your position destroys what you accused us of destroying.\\\"\",\"educationalGoal\":\"Inherent existence destroys causation, agency, and arising — exactly what the opponent accused emptiness of doing.\"},\"deeperDive\":[{\"q\":\"How is this a mirror reversal?\",\"a\":\"Opponent vv.1-6: \\\"Emptiness destroys arising, ceasing, Noble Truths, etc.\\\" V.17: \\\"YOUR inherent existence destroys causes, effects, agents, actions, arising, ceasing.\\\" Same charges, reversed direction.\",\"realLifeExample\":\"\\\"You poisoned the well!\\\" \\\"No — YOUR chemical is in the well. Let me show you the evidence.\\\"\"},{\"q\":\"Why does inherent existence destroy agents?\",\"a\":\"An \\\"inherent\\\" agent would be unchanging. But agents ACT (change from not-doing to doing). Action requires change. Inherent agents can't change → can't act. Inherent existence destroys agency.\",\"realLifeExample\":\"A statue can't act — it's fixed. If you were \\\"inherently existing\\\" like a statue, you couldn't do anything.\"},{\"q\":\"Why does it destroy effects?\",\"a\":\"An \\\"inherent\\\" effect would already exist (permanently). But effects ARISE from causes (they didn't exist before). If effects inherently existed, they'd have no beginning → not really \\\"effects.\\\" Inherent existence destroys the cause-effect relation.\",\"realLifeExample\":\"If the cake already \\\"inherently\\\" existed, baking wouldn't create it. The effect (cake) requires coming-into-being, which inherent existence denies.\"},{\"q\":\"How comprehensive is the reversal?\",\"a\":\"TOTAL. Every single charge from vv.1-6 is reversed. Nāgārjuna doesn't just defend — he turns every weapon back on the opponent.\",\"realLifeExample\":\"A martial artist who redirects every attack back at the attacker. Every strike returns to its source.\"},{\"q\":\"Is this fair?\",\"a\":\"Yes — logically impeccable. If inherent existence = independence from causes, and causes are needed for effects/agents/actions/arising, then inherent existence logically eliminates all of these.\",\"realLifeExample\":\"If X implies Y, and you hold X, you're committed to Y whether you like it or not. Logic is impartial.\"},{\"q\":\"Significance?\",\"a\":\"V.17 is the comprehensive application of v.16's principle. Every consequence the opponent feared from emptiness actually follows from inherent existence.\",\"deeper\":\"V.17 applies v.16's key insight (inherent existence → no causation) to EVERY domain the opponent raised in vv.1-6. The mirror reversal is now complete and comprehensive. The opponent's entire case has been turned against them.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does inherent existence destroy?\",\"options\":[\"A) Nothing\",\"B) Causes, effects, agents, actions, arising, and ceasing — EVERYTHING the opponent accused emptiness of destroying.\",\"C) Only some\",\"D) Only causes\"],\"correct\":\"B\",\"explanation\":\"Total mirror reversal: everything attributed to emptiness is actually caused by inherent existence.\"},\"intermediate\":{\"question\":\"Why can't inherent agents act?\",\"options\":[\"A) They can\",\"B) Inherent = unchanging. Action requires change (from not-doing to doing). Unchanging agents can't act. Inherent existence destroys agency.\",\"C) Only some actions\",\"D) Different reason\"],\"correct\":\"B\",\"explanation\":\"Inherent = fixed → can't change → can't act. Agency requires non-fixity.\"},\"advanced\":{\"question\":\"How comprehensive is the reversal?\",\"options\":[\"A) Partial\",\"B) TOTAL — every charge from vv.1-6 is reversed. Nāgārjuna redirects every single accusation back at the opponent's own position. Complete counterattack.\",\"C) Only half\",\"D) Different charges\"],\"correct\":\"B\",\"explanation\":\"Every single charge reversed. Total, systematic counterattack.\"}},\"verseText\":\"You thereby destroy causes and effects, the agent and the action, and also the arising and ceasing of all things.\",\"madhyamakaConcept\":\"Hetu-phala bādhase (you destroy causes and effects). Kartṛ-karma bādhase (you destroy agent and action). Sarva-bhāva utpāda-nirodha bādhase (you destroy arising and ceasing of all things). Mirror image of the opponent's accusation.\",\"quantumPhysicsParallel\":\"If particles had inherent states (no QM), there would be no transitions, no interactions, no dynamics. Classical determinism with fixed states → frozen physics.\"}},\"isShowcase\":false,\"chapterId\":24}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\

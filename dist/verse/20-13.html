88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":20,\"verseId\":13,\"chapterTitle\":\"Examination of Cause and Effect (Saṃbhava)\",\"totalVerses\":24,\"verseData\":{\"id\":\"v20_13\",\"number\":13,\"title\":\"No Simultaneous Connection Between Present Effect and Any Cause\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"There is never a simultaneous connection Of an arisen effect With a past, a nonarisen, Or an arisen cause.\"},\"philosophy\":{\"insight\":\"Second row of the 3×3 matrix: a PRESENT (arisen) effect cannot be simultaneously connected with (1) a past cause (different time), (2) a future/non-arisen cause (doesn't yet exist), or (3) a present/arisen cause (v.7's problem — producer and produced merge). All three fail.\",\"madhyamaka\":\"Utpanna-phala na saṃprayuktam with atīta-hetu, anutpanna-hetu, or utpanna-hetu. A present effect: can't be simultaneously connected to a past cause (past ≠ present); can't be connected to a future cause (effect before cause — absurd); and simultaneous with a present cause collapses the producer/produced distinction (v.7).\",\"quantum\":\"Relativity of simultaneity: \\\"simultaneous\\\" is frame-dependent. Even two \\\"present\\\" events may not be simultaneous in different reference frames. Inherent simultaneous connection is undermined by the relativity of \\\"now.\\\" Like v.13: even the most plausible case (present-present) fails.\",\"bridge\":\"Both relativity and v.13 challenge present-present simultaneity. Relativity: \\\"present\\\" is frame-dependent. V.13: present effect + present cause → producer/produced merge (v.7). Even the most intuitive case of simultaneous connection fails under analysis.\",\"accessible\":\"Can today's effect be simultaneously connected to yesterday's cause (no — different times), tomorrow's cause (no — it hasn't happened), or today's cause (no — which produced which?). None works for inherent simultaneous connection.\",\"twoTruths\":\"Conventionally: present effects ARE connected to their causes — through conventional causal sequence. Ultimately: this connection is not simultaneous inherent connection but conventional dependent arising.\",\"commonMisconception\":\"The present-present case seems most plausible — \\\"surely present cause and present effect can be simultaneously connected?\\\" But v.7 already showed: simultaneous cause-effect eliminates causal direction. Even this case fails.\"},\"quantumResonance\":{\"concept\":\"Frame-Dependent Simultaneity\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"Relativity: \\\"simultaneous\\\" is frame-dependent — even two \\\"present\\\" events may not be simultaneous in different frames. V.13: present effect can't be inherently simultaneous with any cause. Both: inherent simultaneity fails even for the most plausible case.\",\"caveat\":\"Frame-dependent simultaneity is a physics result. V.13 is a logical argument. The parallel is about the unreliability of simultaneous connection.\"},\"animation\":{\"visualBridge\":\"A present (glowing) effect with three attempted connections to past (faded), future (ghostly), and present (glowing) causes. All three connections fail — even the present-present one (which produces a \\\"merge\\\" flash — v.7's problem).\",\"educationalGoal\":\"User sees: even present effects can't be inherently simultaneously connected to ANY cause. The most intuitive case (present-present) also fails.\"},\"deeperDive\":[{\"q\":\"Why can't a present effect connect to a past cause?\",\"a\":\"The past cause no longer exists presently. \\\"Simultaneous\\\" requires both to exist at the same time. A past cause and present effect occupy different times — simultaneous connection is impossible.\",\"realLifeExample\":\"Today's bruise can't be \\\"simultaneously connected\\\" to yesterday's bump. They're at different times. The bruise is connected to the bump through causal SEQUENCE, not simultaneous connection.\"},{\"q\":\"Why can't a present effect connect to a future cause?\",\"a\":\"The future cause doesn't yet exist. A present effect connected to a non-existent future cause implies the effect precedes its cause — the absurdity of v.8. Plus: connecting to something non-existent is inherently impossible.\",\"realLifeExample\":\"Today's headache being \\\"simultaneously connected\\\" to tomorrow's stress? The stress hasn't happened yet. Effects can't be inherently connected to non-existent causes.\"},{\"q\":\"Why can't a present effect connect to a present cause?\",\"a\":\"This seems most plausible — both exist NOW. But v.7 showed: if cause and effect are simultaneous, the producer/produced distinction collapses. Which is the cause, which is the effect? Simultaneity eliminates causal directionality.\",\"realLifeExample\":\"If the chicken and the egg exist simultaneously, which caused which? The simultaneity destroys the asymmetry needed for causation.\"},{\"q\":\"How does this continue the 3×3 matrix?\",\"a\":\"V.12: past effect × (past, future, present) cause = 3 failures. V.13: present effect × (past, future, present) cause = 3 failures. V.14 will complete: future effect × (past, future, present) cause = 3 failures. Total: 9/9 combinations fail.\",\"realLifeExample\":\"Testing the second row of a 3×3 grid of possible combinations. Row 1 (v.12): all 3 failed. Row 2 (v.13): all 3 fail. Row 3 (v.14): will also fail.\"},{\"q\":\"What does this tell us about inherent connection?\",\"a\":\"Inherent simultaneous connection between cause and effect is impossible regardless of temporal combinations. Since all 9 combinations fail, inherent connection through simultaneity is comprehensively refuted.\",\"realLifeExample\":\"If no key fits any lock (9 combinations tested, all failed), the locks can't be opened by any key. Similarly: no temporal combination allows inherent simultaneous connection.\"},{\"q\":\"What is the philosophical method here?\",\"a\":\"Exhaustive enumeration: list ALL possible combinations, test each, show all fail. This is Nāgārjuna's characteristic method — systematic, complete, leaving no escape route. The 3×3 matrix is one of the most organized arguments in the MMK.\",\"deeper\":\"V.13 is the middle row of the 3×3 matrix. Philosophically, it's the most interesting row because the present-present case (both cause and effect existing now) seems like it SHOULD work for simultaneous connection. But v.7's argument (producer/produced merge) applies: even present-present simultaneity destroys causal directionality. This shows that the problem isn't just about cross-temporal connection — it's about SIMULTANEITY ITSELF being incompatible with causation.\"}],\"quiz\":{\"beginner\":{\"question\":\"Can a present effect be simultaneously connected to a present cause?\",\"options\":[\"A) Yes — both exist now\",\"B) No — simultaneity eliminates causal direction. If both exist at the same time, which produced which? Producer and produced become indistinguishable (v.7).\",\"C) Only sometimes\",\"D) Only for special causes\"],\"correct\":\"B\",\"explanation\":\"Even present-present simultaneity fails: it collapses the producer/produced distinction. Causal direction requires asymmetry.\"},\"intermediate\":{\"question\":\"How does v.13 continue the 3×3 matrix of vv.12-14?\",\"options\":[\"A) It doesn't\",\"B) V.12: past effect (row 1, 3 failures). V.13: present effect (row 2, 3 failures). V.14: future effect (row 3, 3 failures). Total: 9/9 fail. Every temporal combination of cause-effect simultaneity is refuted.\",\"C) Only v.13 matters\",\"D) The matrix is incomplete\"],\"correct\":\"B\",\"explanation\":\"Row 2 of 3: present effect × all cause-types = 3 failures. Combined with rows 1 and 3: 9/9 total failures.\"},\"advanced\":{\"question\":\"Why is the present-present case philosophically most interesting?\",\"options\":[\"A) It's not\",\"B) It seems most plausible — both cause and effect exist NOW. But v.7 shows even this fails: simultaneity eliminates causal direction. The problem is not just cross-temporal but SIMULTANEITY ITSELF being incompatible with inherent causation.\",\"C) It works\",\"D) Only cross-temporal matters\"],\"correct\":\"B\",\"explanation\":\"The strongest case (present-present) still fails, showing the problem is deep: simultaneity itself undermines causation, not just temporal difference.\"}},\"verseText\":\"There is never a simultaneous connection Of an arisen effect With a past, a nonarisen, Or an arisen cause.\",\"madhyamakaConcept\":\"Utpanna-phala na saṃprayuktam with atīta-hetu, anutpanna-hetu, or utpanna-hetu. A present effect: can't be simultaneously connected to a past cause (past ≠ present); can't be connected to a future cause (effect before cause — absurd); and simultaneous with a present cause collapses the producer/produced distinction (v.7).\",\"quantumPhysicsParallel\":\"Relativity of simultaneity: \\\"simultaneous\\\" is frame-dependent. Even two \\\"present\\\" events may not be simultaneous in different reference frames. Inherent simultaneous connection is undermined by the relativity of \\\"now.\\\" Like v.13: even the most plausible case (present-present) fails.\"}},\"isShowcase\":false,\"chapterId\":20}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],

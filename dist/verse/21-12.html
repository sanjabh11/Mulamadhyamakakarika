88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":21,\"verseId\":12,\"chapterTitle\":\"Examination of Becoming and Destruction\",\"totalVerses\":21,\"verseData\":{\"id\":\"v21_12\",\"number\":12,\"title\":\"An Entity Does Not Arise from Itself, Another, Both, or Neither\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"An entity does not arise from an entity. An entity does not arise from a nonentity. A nonentity does not arise from a nonentity. A nonentity does not arise from an entity.\"},\"philosophy\":{\"insight\":\"The TETRALEMMA (catuṣkoṭi) applied to arising — the four-fold negation from Ch.1 now applied specifically to becoming. (1) Entity from entity: if already existent, no need to arise. (2) Entity from nonentity: something can't come from nothing. (3) Nonentity from nonentity: nothing from nothing. (4) Nonentity from entity: existent can't produce non-existent. ALL four modes of inherent arising are impossible.\",\"madhyamaka\":\"Bhāva bhāvāt na utpadyate (entity not from entity). Bhāva abhāvāt na (entity not from nonentity). Abhāva abhāvāt na (nonentity not from nonentity). Abhāva bhāvāt na (nonentity not from entity). This is the catuṣkoṭi from Ch.1 v.1 applied specifically to becoming/destruction.\",\"quantum\":\"Quantum field theory: particles don't arise from pre-existing particles (entity from entity), from absolute nothingness (entity from nonentity), vacuums don't create vacuums (nonentity from nonentity), or particles create voids (nonentity from entity). They arise from field excitations — a process that transcends all four classical categories.\",\"bridge\":\"Both QFT and v.12 show that arising transcends the four-fold categorical framework. QFT: particle creation through field excitation (not any of the 4 classical modes). V.12: arising is not from entity/nonentity in any combination. Both: the process of arising exceeds inherent categorical description.\",\"accessible\":\"Where does a wave come from? Not from another wave (entity from entity — it's a NEW wave). Not from flat water (entity from nonentity — flat water isn't nothing, and the wave isn't from nothing). Not from flatness to flatness (nonentity from nonentity). Not from a wave to flatness (nonentity from entity). It arises from CONDITIONS (wind, depth, etc.) — transcending the four-fold scheme.\",\"twoTruths\":\"Conventionally: entities arise from causes and conditions (dependent origination). Ultimately: this arising doesn't fit any of the four inherent modes (from entity, nonentity, both, neither). Convention works; inherent categories don't.\",\"commonMisconception\":\"NOT saying nothing arises. CONVENTIONAL arising from causes/conditions works perfectly. V.12 denies INHERENT arising within the four-fold categorical framework. Dependent origination is the positive alternative.\"},\"quantumResonance\":{\"concept\":\"Field Excitation Transcends Classical Arising Categories\",\"score\":58,\"strength\":\"Medium\",\"explanation\":\"QFT: particles arise through field excitation — not from pre-existing particles, nothingness, or any classical mode. V.12: arising doesn't fit entity-from-entity, entity-from-nonentity, etc. Both: the process of arising transcends inherent categorical frameworks.\",\"caveat\":\"Field excitation is physics. V.12 is the catuṣkoṭi. The parallel is about arising transcending simple categorical modes.\"},\"animation\":{\"visualBridge\":\"Four boxes, each representing one mode of arising, each with an X through it: (1) Entity → Entity. (2) Nonentity → Entity. (3) Nonentity → Nonentity. (4) Entity → Nonentity. All fail. Center: \\\"Dependent Arising\\\" — transcending all four.\",\"educationalGoal\":\"User sees: all four modes of inherent arising are impossible. Only dependent arising — which transcends these categories — accounts for conventional becoming.\"},\"deeperDive\":[{\"q\":\"Why doesn't an entity arise from an entity?\",\"a\":\"If the entity already exists (as an entity), there's no need for it to arise — it's already there. \\\"Arising\\\" means coming into existence, but an existent entity has already come into existence. Redundant production.\",\"realLifeExample\":\"You can't \\\"create\\\" a building that already stands. It's already there. Entity from entity = creating what's already created.\"},{\"q\":\"Why doesn't an entity arise from a nonentity?\",\"a\":\"A nonentity (absolute nothingness) has no power, no potential, no capacity to produce anything. Something can't come from absolute nothing — there's no mechanism, no process, no source.\",\"realLifeExample\":\"You can't get water from an absolutely dry well. Nothing from nothing. A nonentity has zero productive capacity.\"},{\"q\":\"Why doesn't a nonentity arise from a nonentity?\",\"a\":\"Nothing from nothing yields nothing. Two nothings don't produce anything. If neither the source nor the result exists, there's no arising at all — just continued nonexistence.\",\"realLifeExample\":\"An empty room with empty hands: nothing is created. Nonexistence meeting nonexistence = continued nonexistence.\"},{\"q\":\"Why doesn't a nonentity arise from an entity?\",\"a\":\"An existing entity has no reason to produce nonexistence. Existence doesn't generate non-existence — that would be inherent self-destruction, which contradicts the permanence implied by inherent existence.\",\"realLifeExample\":\"A healthy tree doesn't inherently produce its own death. Existence doesn't generate non-existence (from its own inherent nature).\"},{\"q\":\"How does this connect to Ch.1?\",\"a\":\"Ch.1 v.1: \\\"Not from self, not from another, not from both, not from neither does any entity arise.\\\" V.12 restates the tetralemma in terms of entity/nonentity rather than self/other. Same conclusion: inherent arising is impossible from any of the four logical alternatives.\",\"realLifeExample\":\"Two versions of the same exam: Ch.1 uses \\\"self/other\\\" wording; Ch.21 uses \\\"entity/nonentity\\\" wording. Same test, same result: inherent arising fails.\"},{\"q\":\"What is the tetralemma (catuṣkoṭi)?\",\"a\":\"The four-fold logical framework examining all combinations: A, not-A, both, neither. In Madhyamaka, all four are rejected for inherent arising. This isn't logical nihilism — it's demonstrating that inherent arising doesn't fit ANY logical category. The resolution is dependent arising, which transcends inherent categorization.\",\"deeper\":\"V.12 marks the beginning of the tetralemma section (vv.12-16), which applies the catuṣkoṭi — Madhyamaka's most powerful logical tool — to becoming/destruction. The tetralemma exhausts all logical possibilities for inherent arising (from entity, nonentity, both, neither), finding each impossible. This is not logical nihilism but a demonstration that inherent arising is logically incoherent from EVERY angle. The positive resolution is pratītyasamutpāda (dependent arising), which transcends the four-fold inherent framework.\"}],\"quiz\":{\"beginner\":{\"question\":\"What is the tetralemma?\",\"options\":[\"A) Two options\",\"B) The four-fold negation: entity from entity, entity from nonentity, nonentity from nonentity, nonentity from entity. All four are impossible for inherent arising. Dependent arising transcends all four.\",\"C) Three options\",\"D) One option\"],\"correct\":\"B\",\"explanation\":\"Four possibilities, all rejected. Inherent arising fails from every angle. Dependent arising is the alternative.\"},\"intermediate\":{\"question\":\"How does v.12 connect to Ch.1?\",\"options\":[\"A) No connection\",\"B) Ch.1 v.1: not from self, other, both, neither. V.12: not entity-from-entity, entity-from-nonentity, etc. Same tetralemma, different formulation. Same conclusion: inherent arising is impossible.\",\"C) Different argument\",\"D) Only Ch.1 matters\"],\"correct\":\"B\",\"explanation\":\"Same logical tool (tetralemma), different wording. Both conclude: inherent arising is impossible from all four angles.\"},\"advanced\":{\"question\":\"How does QFT particle creation transcend the tetralemma?\",\"options\":[\"A) It doesn't\",\"B) Particles arise through field excitation — not from pre-existing particles (entity→entity), nothingness (nonentity→entity), etc. Field excitation is a PROCESS that doesn't fit any of the four inherent modes. Like dependent arising: it transcends the categorical framework.\",\"C) QFT fits one mode\",\"D) The tetralemma is wrong\"],\"correct\":\"B\",\"explanation\":\"Field excitation is a process transcending inherent categories. Like dependent arising: the actual mechanism exceeds the four-fold scheme.\"}},\"verseText\":\"An entity does not arise from an entity. An entity does not arise from a nonentity. A nonentity does not arise from a nonentity. A nonentity does not arise from an entity.\",\"madhyamakaConcept\":\"Bhāva bhāvāt na utpadyate (entity not from entity). Bhāva abhāvāt na (entity not from nonentity). Abhāva abhāvāt na (nonentity not from nonentity). Abhāva bhāvāt na (nonentity not from entity). This is the catuṣkoṭi from Ch.1 v.1 applied specifically to becoming/destruction.\",\"quantumPhysicsParallel\":\"Quantum field theory: particles don't arise from pre-existing particles (entity from entity), from absolute nothingness (entity from nonentity), vacuums don't create vacuums (nonentity from nonentity), or particles create voids (nonentity from entity). They arise from field excitations — a process that transcends all four classical categories.\"}},\"isShowcase\":false,\"chapterId\":21}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$

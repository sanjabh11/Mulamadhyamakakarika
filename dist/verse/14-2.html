176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":14,\"verseId\":2,\"chapterTitle\":\"Examination of Association\",\"totalVerses\":8,\"verseData\":{\"id\":\"v14_2\",\"number\":2,\"title\":\"Extension to Desire, Afflictions, and All Sense-Fields\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Likewise desire, desiring and the desired, the remaining afflictions and also the remaining sense-fields do not connect by three aspects.\"},\"philosophy\":{\"insight\":\"The argument generalizes immediately: not just seeing, but DESIRE (desirer-desiring-desired), ALL afflictions (anger, ignorance, etc.), and ALL sense-fields (hearing, tasting, touching, etc.) follow the same pattern. No relational triad can inherently connect.\",\"madhyamaka\":\"Rāga (desire), the act of desiring, and the desired object form the same interdependent triad as seeing. The remaining kleśa (afflictions — anger, delusion, pride, etc.) and the remaining āyatana (sense-fields — hearing, smelling, tasting, touching, thinking) all exhibit the same structure. Universal emptiness of inherent connection.\",\"quantum\":\"Quantum entanglement: correlated particles are not independently established — measuring one instantly affects the other. The correlation doesn't arise from independently existing particles \\\"connecting\\\" but from the entangled system being fundamentally non-separable.\",\"bridge\":\"Both entanglement and the affliction triads show non-separability. Entangled particles aren't independent things that then connect — they're correlated from the start. Desire-desiring-desired aren't independent entities that then associate — they co-arise dependently.\",\"accessible\":\"Not just seeing — wanting something (desire), being angry (affliction), hearing a sound (sense-field) — ALL follow the same pattern. The wanter, the wanting, and the wanted aren't three separate things that connect. They arise together as one dependent event.\",\"twoTruths\":\"Conventionally, we desire things and experience through our senses. Ultimately, no desirer-desiring-desired triad (or any sense-field triad) consists of inherently existing entities in inherent connection.\",\"commonMisconception\":\"NOT denying desire or sense experience. These happen conventionally. The point is that no relational triad — desire, anger, hearing, tasting, thinking — consists of inherently independent members that inherently connect.\"},\"quantumResonance\":{\"concept\":\"Quantum Entanglement and Non-Separability\",\"score\":73,\"strength\":\"High\",\"explanation\":\"Entangled particles are non-separable — they don't exist independently and then \\\"connect.\\\" Their correlation is fundamental. Like desire triads: desirer and desired don't exist independently and then associate. They co-arise dependently.\",\"caveat\":\"Entanglement is a specific quantum phenomenon with experimental verification. The parallel is about non-separability of relational structures.\"},\"animation\":{\"visualBridge\":\"Multiple triads (desire, anger, hearing, seeing) each showing the same pattern: three nodes that can't be separated — they blur into each other when you try to isolate them.\",\"educationalGoal\":\"User sees that the non-connection argument applies universally — every subject-action-object triad in human experience follows the same pattern.\"},\"deeperDive\":[{\"q\":\"Why does the argument generalize so easily?\",\"a\":\"Because the LOGICAL STRUCTURE is the same in every case: subject-action-object. If the seer can't inherently connect to the seen (because they're interdependent), then the desirer can't inherently connect to the desired for the exact same reason. The logic is content-independent.\",\"realLifeExample\":\"If you prove that \\\"buying\\\" requires a buyer and something to buy (they co-arise), the same logic proves \\\"selling\\\" requires a seller and something to sell. The structure is identical.\"},{\"q\":\"How does entanglement show non-separability?\",\"a\":\"Entangled particles can't be described independently — the quantum state of the whole system can't be decomposed into separate states for each particle. Measuring one instantly determines the other. They were never \\\"separate entities that then connected\\\" — the correlation is fundamental.\",\"realLifeExample\":\"Identical twins raised apart may show uncanny similarities — not because they \\\"connected\\\" later, but because their shared origin creates inherent correlation. Entanglement is even stronger: the particles are fundamentally one system.\"},{\"q\":\"What are the \\\"remaining afflictions\\\"?\",\"a\":\"Beyond desire (rāga): aversion/anger (dveṣa), ignorance/delusion (moha), pride (māna), doubt (vicikitsā), wrong views (dṛṣṭi). Each has the same triad: the angry person-anger-object of anger. None of these triads consists of inherently independent members.\",\"realLifeExample\":\"Anger requires an angry person, the anger itself, and something to be angry about. These three co-arise — you can't be \\\"angry\\\" without something to be angry about. The anger defines the angry person.\"},{\"q\":\"What are the \\\"remaining sense-fields\\\"?\",\"a\":\"Beyond seeing: hearing (ear-hearing-sound), smelling (nose-smelling-odor), tasting (tongue-tasting-flavor), touching (body-touching-tactile), thinking (mind-thinking-mental objects). Six sense-fields total. Each follows the same triad pattern.\",\"realLifeExample\":\"You can't be a \\\"listener\\\" without a sound to hear. The sound doesn't exist as a \\\"heard sound\\\" without a listener. Listener-listening-sound co-arise as one dependent event.\"},{\"q\":\"Does this have practical implications for dealing with desire?\",\"a\":\"Yes — if you realize that \\\"I\\\" (desirer), \\\"my desire\\\" (desiring), and \\\"the object I want\\\" (desired) aren't three separate things but one interdependent event, the grip of desire loosens. You can't have a desire problem if there's no inherent \\\"desirer\\\" separate from the desire.\",\"realLifeExample\":\"Realizing you're not separate from your craving for chocolate — the craving, the craver, and the chocolate are one event — makes it easier to let go. There's no solid \\\"you\\\" being attacked by \\\"desire.\\\"\"},{\"q\":\"How does v.2 complete the generalization from v.1?\",\"a\":\"V.1 proved it for vision. V.2 extends to ALL relational triads — desire, afflictions, and all sense-fields. This is exhaustive: every possible subject-action-object relationship in human experience is covered. The emptiness of inherent connection is universal.\",\"deeper\":\"V.2 is strategically important because it connects the abstract analysis (emptiness of inherent connection) to the practical Buddhist concern with afflictions (kleśa). If afflictions don't inherently connect to the afflicted person, then liberation from afflictions is possible. The analysis isn't just theoretical — it has soteriological (liberating) implications.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does v.2 generalize from v.1?\",\"options\":[\"A) Only vision has this problem\",\"B) The non-connection argument extends to ALL relational triads — desire, anger, hearing, tasting, thinking — every subject-action-object structure\",\"C) Only desire follows this pattern\",\"D) The argument doesn't generalize\"],\"correct\":\"B\",\"explanation\":\"V.2 extends the v.1 analysis to every relational triad in human experience. The logical structure is the same in every case: interdependent members can't inherently connect.\"},\"intermediate\":{\"question\":\"How does quantum entanglement parallel the non-separability of relational triads?\",\"options\":[\"A) No parallel\",\"B) Entangled particles are fundamentally non-separable — they don't exist independently and then connect. Like desire triads: desirer and desired co-arise dependently, never existing independently first.\",\"C) Entanglement proves things are separate\",\"D) Only classical particles are non-separable\"],\"correct\":\"B\",\"explanation\":\"Entangled particles can't be described independently — the whole system is one. Like the desire triad: desirer, desiring, desired are one dependent event, not three independent things.\"},\"advanced\":{\"question\":\"What soteriological implication does v.2 have for liberation from afflictions?\",\"options\":[\"A) None\",\"B) If afflictions don't inherently connect to the afflicted person (they co-arise dependently), then the person isn't inherently \\\"afflicted\\\" and liberation is possible — the grip of afflictions loosens when their interdependence is seen\",\"C) Afflictions are permanent\",\"D) Liberation is impossible\"],\"correct\":\"B\",\"explanation\":\"If the angry person, anger, and object of anger aren't inherently connected, the person isn't inherently angry. Understanding this interdependence loosens the grip of afflictions and makes liberation possible.\"}},\"verseText\":\"Likewise desire, desiring and the desired, the remaining afflictions and also the remaining sense-fields do not connect by three aspects.\",\"madhyamakaConcept\":\"Rāga (desire), the act of desiring, and the desired object form the same interdependent triad as seeing. The remaining kleśa (afflictions — anger, delusion, pride, etc.) and the remaining āyatana (sense-fields — hearing, smelling, tasting, touching, thinking) all exhibit the same structure. Universal emptiness of inherent connection.\",\"quantumPhysicsParallel\":\"Quantum entanglement: correlated particles are not independently established — measuring one instantly affects the other. The correlation doesn't arise from independently existing particles \\\"connecting\\\" but from the entangled system being fundamentally non-separable.\"}},\"isShowcase\":false,\"chapterId\":14}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet

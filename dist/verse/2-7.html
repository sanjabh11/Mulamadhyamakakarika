c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":7,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_7\",\"number\":7,\"title\":\"Mutual Dependence of Motion and Mover\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If without a mover It would not be correct to say that there is motion, Then if there were no motion, How could there be a mover?\"},\"philosophy\":{\"insight\":\"The pivotal verse of Chapter 2: motion and mover are mutually dependent. Neither can be established independently. This is pratītyasamutpāda (dependent origination) applied to motion — and the key to understanding emptiness of motion.\",\"madhyamaka\":\"Garfield: this verse states the mutual entailment starkly — no mover without motion, no motion without mover. Neither has logical or ontological priority. Kalupahana: this is the chapter's clearest expression of dependent origination — \\\"mover\\\" and \\\"motion\\\" co-arise and co-cease. Siderits/Katsura: the verse functions as the hinge between the regress arguments (v.3-6) and the identity/difference analysis (v.18-25).\",\"quantum\":\"Quantum Entanglement (EPR correlations): Two entangled particles define each other's state — measuring one instantly determines the other. Neither particle has independent properties prior to measurement. Their states are mutually constituted, not independently pre-existing.\",\"bridge\":\"Both reveal mutual constitution without independent priority. Entangled particle A's spin is defined relative to particle B's spin — neither has a pre-existing value. Similarly, \\\"mover\\\" is defined relative to \\\"motion\\\" and vice versa. Both are cases of relational existence without independent ground.\",\"accessible\":\"Which came first — the buyer or the seller? Neither! A buyer only exists because there's a seller, and vice versa. Remove one and the other vanishes. They define each other. That's exactly Nāgārjuna's point: \\\"mover\\\" and \\\"motion\\\" co-define each other. Neither is primary.\",\"twoTruths\":\"Conventionally, we distinguish movers from motion in language. Ultimately, neither mover nor motion can be established independently — they are mutually dependent.\",\"commonMisconception\":\"Nāgārjuna is NOT saying movers and motion are identical. He is showing they cannot exist INDEPENDENTLY — each depends on the other for its designation.\"},\"quantumResonance\":{\"concept\":\"Quantum Entanglement (Mutual Constitution)\",\"score\":92,\"strength\":\"High\",\"explanation\":\"Entangled particles mutually constitute each other's properties with no independent priority. Direct structural parallel to mover-motion co-dependence.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Entangled Dual Orbits\",\"anchor\":\"Two luminous orbs orbiting a shared center of gravity. When one orb is labelled \\\"Mover,\\\" the other automatically becomes \\\"Motion.\\\" Swap labels — the other adjusts instantly.\",\"texture\":\"Orbs: Polished chrome with internal galaxy texture. Connection: Shimmering golden thread. Labels: Floating holographic text.\",\"mood\":\"Elegant, interconnected, balanced\",\"colors\":[\"#F59E0B\",\"#8B5CF6\",\"#06B6D4\",\"#1E293B\"],\"orchestration\":{\"start\":\"Two orbs orbit together, connected by golden thread. Labels: \\\"Mover\\\" and \\\"Motion.\\\"\",\"click\":\"Click either orb to try to remove it — the other instantly fades too. Neither can exist alone.\",\"reveal\":\"Both reappear together. Text: \\\"Neither is primary. Both arise together, or not at all.\\\"\"},\"interaction\":{\"click\":\"Click an orb to try removing it — both vanish, proving co-dependence\",\"drag\":\"Rotate to see the orbital relationship from all angles\",\"hover\":\"Hover swaps labels between orbs — showing the assignment is arbitrary\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.5},\"speed\":{\"default\":60,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Custom galaxy shader inside sphere meshes (noise + spiral UV)\",\"drei Line for golden connection thread with animated dash pattern\",\"drei Text3D for floating holographic labels\",\"Bloom + Vignette post-processing for elegant atmosphere\",\"useFrame-driven orbital mechanics with shared center of mass\"],\"camera\":{\"position\":[0,3,9],\"fov\":45,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c300MB memory, 60 FPS. Two spheres with shared galaxy shader. Thread is a simple animated line.\",\"tripoPrompt\":\"Two chrome orbs with internal galaxies orbiting a shared center, connected by a golden shimmering thread, floating holographic labels, dark space, 8K.\",\"visualBridge\":\"The co-orbiting orbs that cannot exist alone directly show the mutual dependence of mover and motion — remove one, both vanish.\",\"educationalGoal\":\"User understands mutual dependence: mover and motion arise together, neither preceding the other — like entangled particles sharing correlated states.\"},\"deeperDive\":[{\"q\":\"Is this verse just repeating the interdependence idea?\",\"a\":\"It states it with maximum clarity as mutual entailment: no motion → no mover, AND no mover → no motion. Neither can be established first. This is the chapter's strongest positive statement about dependent origination.\",\"realLifeExample\":\"No \\\"left\\\" without \\\"right.\\\" No \\\"teacher\\\" without \\\"student.\\\" These aren't just linguistic connections — they describe how these concepts actually function. Remove one and the other becomes meaningless.\"},{\"q\":\"How is this dependent origination (pratītyasamutpāda)?\",\"a\":\"Dependent origination means things arise in dependence upon conditions. Here, \\\"mover\\\" arises in dependence upon \\\"motion\\\" and vice versa. Neither has independent existence (svabhāva). This mutual dependence IS what emptiness means applied to motion.\",\"realLifeExample\":\"A \\\"parent\\\" exists only because there's a \\\"child.\\\" Have a child and you become a parent. The child makes you a parent; your parenthood defines them as a child. Neither status exists independently.\"},{\"q\":\"How does quantum entanglement precisely parallel this?\",\"a\":\"In an EPR pair, particle A's spin measurement is correlated with particle B's. Before measurement, NEITHER has a definite spin value (Bell's theorem proves this). The values are mutually constituted at measurement — A's spin-up determines B's spin-down simultaneously. No priority, no independence.\",\"realLifeExample\":\"Two people shaking hands — you can't have a \\\"handshaker\\\" without a \\\"hand being shaken.\\\" The handshake IS the mutual act. Neither hand is primary.\"},{\"q\":\"Does this mean motion and mover are the same thing?\",\"a\":\"No! Nāgārjuna will address this in v.18 — they are neither identical nor completely different. They are mutually dependent without being the same. Conventional distinction is preserved; inherent distinction is denied.\",\"realLifeExample\":\"A lock and its key are different objects but mutually defining — this key fits that lock, that lock is opened by this key. Different but inseparable in function.\"},{\"q\":\"What does this imply for all categories?\",\"a\":\"If even something as basic as \\\"mover\\\" and \\\"motion\\\" are mutually dependent, ALL categories are likely mutually dependent. This verse establishes the template Nāgārjuna applies throughout the MMK to agent-action, cause-effect, subject-object, etc.\",\"realLifeExample\":\"If \\\"buyer\\\" and \\\"seller\\\" are mutually dependent, so are \\\"employer\\\" and \\\"employee,\\\" \\\"host\\\" and \\\"guest,\\\" \\\"doctor\\\" and \\\"patient.\\\" Every relational pair works this way.\"},{\"q\":\"How does this verse function as the chapter's hinge?\",\"a\":\"V.1-6 deconstructed the opponent's views (trilemma, circularity, regress). V.7 states the positive insight: mutual dependence. V.8-25 will extend this insight to examine all remaining aspects of motion (beginning, stopping, identity/difference, path).\",\"deeper\":\"Siderits/Katsura note that v.7 is the \\\"constructive\\\" moment — not constructing a positive view, but revealing the dependent structure that the deconstruction has uncovered.\"}],\"quiz\":{\"beginner\":{\"question\":\"According to verse 7, what is the relationship between motion and mover?\",\"options\":[\"A) Motion comes first, then the mover appears\",\"B) They are mutually dependent — neither can exist without the other\",\"C) The mover creates motion from nothing\",\"D) They are completely independent\"],\"correct\":\"B\",\"explanation\":\"Motion and mover are mutually dependent. No motion without a mover, and no mover without motion. Neither is primary — they co-arise.\"},\"intermediate\":{\"question\":\"In quantum entanglement, when does each particle's spin value become definite?\",\"options\":[\"A) At the moment of creation\",\"B) Only at measurement — and both values are determined simultaneously, not independently\",\"C) When they are separated\",\"D) They always have definite values\"],\"correct\":\"B\",\"explanation\":\"Entangled particles' values become definite only at measurement, and they're determined simultaneously. Neither has a pre-existing independent value — just as mover and motion have no independent existence.\"},\"advanced\":{\"question\":\"Why is verse 7 considered the \\\"hinge\\\" of Chapter 2?\",\"options\":[\"A) Because it's in the middle\",\"B) It transitions from deconstruction (v.1-6) to the positive insight of mutual dependence, which then structures the remaining analysis (v.8-25)\",\"C) Because it contradicts verse 1\",\"D) Because it introduces a new topic\"],\"correct\":\"B\",\"explanation\":\"V.1-6 deconstruct inherent motion through trilemma, circularity, and regress. V.7 reveals the underlying structure: mutual dependence. V.8-25 extend this insight to beginnings, stationarity, and identity/difference.\"}},\"verseText\":\"If without a mover It would not be correct to say that there is motion, Then if there were no motion, How could there be a mover?\",\"madhyamakaConcept\":\"Garfield: this verse states the mutual entailment starkly — no mover without motion, no motion without mover. Neither has logical or ontological priority. Kalupahana: this is the chapter's clearest expression of dependent origination — \\\"mover\\\" and \\\"motion\\\" co-arise and co-cease. Siderits/Katsura: the verse functions as the hinge between the regress arguments (v.3-6) and the identity/difference analysis (v.18-25).\",\"quantumPhysicsParallel\":\"Quantum Entanglement (EPR correlations): Two entangled particles define each other's state — measuring one instantly determines the other. Neither particle has independent properties prior to measurement. Their states are mutually constituted, not independently pre-existing.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"hr

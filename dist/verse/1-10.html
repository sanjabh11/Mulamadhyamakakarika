176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":1,\"verseId\":10,\"chapterTitle\":\"Examination of Conditions\",\"totalVerses\":14,\"verseData\":{\"id\":\"v1_10\",\"number\":10,\"title\":\"Emptiness Enables Dependent Origination\",\"sanskrit\":{\"text\":\"bhāvānāṃ niḥsvabhāvānāṃ na sattā vidyate yataḥ | satīdam asmin bhavatīty etan naivopapadyate ||\",\"transliteration\":\"bhāvānāṃ niḥsvabhāvānāṃ na sattā vidyate yataḥ | satīdam asmin bhavatīty etan naivopapadyate ||\",\"translation\":\"Since the existence of things without essence is not established, \\\"When this exists, that arises\\\" is not tenable.\"},\"philosophy\":{\"insight\":\"Nāgārjuna inverts the opponent's expectation: emptiness doesn't undermine \\\"When this exists, that arises\\\" — rather, it's inherent existence that would make that formula impossible. If things had fixed essences, they couldn't depend on conditions to arise. Emptiness is what makes dependent origination coherent.\",\"madhyamaka\":\"This is one of the most misunderstood verses. Garfield argues Nāgārjuna is not rejecting pratītyasamutpāda but showing that the formula \\\"When this exists, that arises\\\" cannot work if things have svabhāva. If essences are fixed and independent, no thing could arise in dependence on another. Kalupahana concurs: the verse targets those who try to combine inherent existence with dependent origination — an incoherent position. Siderits/Katsura note this verse sets up the resolution in v.14.\",\"quantum\":\"Quantum Non-Locality (Bell's Theorem): Bell's theorem proves that no theory of local hidden variables can reproduce quantum correlations. Correlations are real, but they cannot be explained by independently existing local properties. The \\\"mechanism\\\" of correlation is not locatable in either particle.\",\"bridge\":\"Both frameworks show: correlations/dependence are real, but they cannot be grounded in independently existing properties (svabhāva/local hidden variables). Emptiness enables dependence just as non-locality enables quantum correlations.\",\"accessible\":\"Imagine two friends who always wear matching colors without planning it. You might think each has a \\\"matching-color essence.\\\" But Bell's theorem (in quantum physics) proves there's no hidden mechanism — the correlation is real but can't be explained by each particle having its own fixed property. Similarly, Nāgārjuna shows that \\\"when this exists, that arises\\\" works precisely because things DON'T have fixed essences. Emptiness is what makes dependence possible.\",\"twoTruths\":\"Conventionally, conditions give rise to effects through dependence. Ultimately, the correlations are real but cannot be grounded in independently existing properties.\",\"commonMisconception\":\"NOT saying dependence is illusion. Dependence is REAL — what's empty is the inherent ground (svabhava) we assume underlies it.\"},\"quantumResonance\":{\"concept\":\"Non-Locality / Bell's Theorem\",\"score\":91,\"strength\":\"High\",\"explanation\":\"Bell's theorem proves correlations without local hidden variables. Parallel: dependent origination works without svabhāva.\",\"caveat\":\"Bell's theorem and dependent origination both reveal real correlations without local hidden variables / inherent essence. Structural analogy.\"},\"animation\":{\"geometry\":\"Bell Test Correlation Visualizer\",\"anchor\":\"Two detector stations at opposite sides of the scene, with a particle source in the center emitting pairs. Correlation arcs connect measurement results.\",\"texture\":\"Detectors: Sleek chrome instruments with LED readouts. Particles: Tiny luminous spheres in paired colors. Correlation arcs: Shimmering golden threads that defy the space between.\",\"mood\":\"Scientific elegance, \\\"spooky\\\" connectedness across void\",\"colors\":[\"#F59E0B\",\"#8B5CF6\",\"#3B82F6\",\"#10B981\"],\"orchestration\":{\"start\":\"Central source emits particle pairs. Each flies to opposite detector.\",\"click\":\"User clicks a detector to \\\"measure\\\" — both detectors show correlated results simultaneously. A scanner sweeps the space between and finds NO connecting signal.\",\"reveal\":\"Golden correlation arcs appear between results, floating in empty space. Text overlay: \\\"Correlation without inherent mechanism — dependent arising without essence.\\\"\"},\"interaction\":{\"click\":\"Click either detector to trigger measurement — see instant correlation appear\",\"drag\":\"Rotate to verify empty space between detectors (no hidden connection)\",\"hover\":\"Particle pairs glow to show their entangled status before measurement\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.3},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":65,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"InstancedMesh for particle pair emissions (100+ pairs)\",\"Custom shader for correlation arcs with animated dash pattern\",\"drei Sparkles for measurement flash effect\",\"Bloom post-processing on detector LEDs and correlation arcs\",\"drei Line for scanner beam sweeping between detectors\"],\"camera\":{\"position\":[0,3,12],\"fov\":50,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c400MB memory, 60 FPS. Particle emissions pooled via InstancedMesh. Scanner beam uses simple line geometry.\",\"tripoPrompt\":\"Two chrome scientific detector stations on opposite sides of a void, connected by golden shimmering arcs of light, a central particle source emitting paired glowing spheres, deep space, cinematic lighting, 8K.\",\"visualBridge\":\"The correlation arcs appear with no physical connection between detectors — showing that dependence/correlation is real even without inherent connecting mechanism (svabhāva/hidden variables).\",\"educationalGoal\":\"User grasps that dependence and correlation are real even without inherent connecting properties — emptiness enables, not prevents, dependence.\"},\"deeperDive\":[{\"q\":\"Is Nāgārjuna saying dependent origination doesn't work?\",\"a\":\"No — this is the most common misreading! He's saying dependent origination can't work IF things have inherent essence. It is precisely BECAUSE things lack essence that they can arise dependently. Emptiness enables dependent origination, not the reverse.\",\"realLifeExample\":\"If LEGO bricks were fused into one solid block (had \\\"inherent essence\\\"), you couldn't rearrange them into new shapes. It's because they're separable and flexible (empty of fixed form) that you can build anything.\"},{\"q\":\"What is the formula \\\"When this exists, that arises\\\"?\",\"a\":\"This is the idappaccayatā formula — the classic Buddhist expression of dependent origination (pratītyasamutpāda). It states: \\\"When this exists, that comes to be; from the arising of this, that arises. When this does not exist, that does not come to be; from the cessation of this, that ceases.\\\" It's the foundation of Buddhist understanding of causality.\",\"realLifeExample\":\"When there are clouds and moisture, rain comes. When clouds clear, rain ceases. This observable regularity IS dependent origination — no mysterious \\\"rain-essence\\\" needed.\"},{\"q\":\"Why would inherent essence make dependent origination impossible?\",\"a\":\"If a thing has svabhāva (inherent, fixed, independent nature), it exists on its own regardless of conditions. Such a thing cannot genuinely depend on something else — its nature is already complete. Dependence requires openness to influence, which is exactly what emptiness provides.\",\"realLifeExample\":\"A perfectly rigid steel ball can't be shaped by a potter's wheel. Only soft clay (which lacks inherent \\\"fixed form\\\") can be shaped. Emptiness is the \\\"softness\\\" that allows reality to be shaped by conditions.\"},{\"q\":\"How does Bell's theorem relate to this verse?\",\"a\":\"Bell's theorem (1964) proves mathematically that quantum correlations cannot be explained by \\\"local hidden variables\\\" — pre-existing properties carried independently by each particle. The correlations are real but have no locally inherent mechanism. This parallels Nāgārjuna: dependent arising is real but has no inherent causal mechanism (svabhāva).\",\"realLifeExample\":\"Two coins always land the same way despite being flipped in different cities. You might think each coin has a \\\"hidden magnet\\\" (local hidden variable). Bell's theorem proves: no hidden magnet exists. The correlation is real but not grounded in any independently existing property.\"},{\"q\":\"What's the difference between correlation and inherent causation?\",\"a\":\"Correlation: observed regularity where A and B co-occur or follow each other. Inherent causation: the claim that A contains within itself an inherent power that produces B. Nāgārjuna accepts the first and denies the second. Quantum physics similarly accepts correlations while denying local hidden mechanisms.\",\"realLifeExample\":\"A thermostat and a heater are correlated — when temperature drops, heat comes on. But the thermostat doesn't have \\\"heat-production essence.\\\" The correlation works through a relational system (wiring, sensors), not through inherent power in the thermostat itself.\"},{\"q\":\"How does this verse prepare for the chapter's conclusion?\",\"a\":\"By establishing that emptiness and dependent origination are not opposed but identical, this verse sets up the grand conclusion (v.14): conditions and effects are mutually empty. Neither can be established independently, but both function conventionally. The \\\"problem\\\" of causation dissolves when svabhāva is abandoned.\",\"deeper\":\"The progression: v.1 refutes inherent arising → v.2-9 dismantle each condition type → v.10 pivots to show emptiness enables dependence → v.11-13 deepen the argument → v.14 concludes with mutual emptiness of conditions and effects.\"}],\"quiz\":{\"beginner\":{\"question\":\"According to this verse, what makes dependent origination (\\\"When this exists, that arises\\\") possible?\",\"options\":[\"A) Things having strong inherent essences\",\"B) Things being empty of inherent essence — their openness to conditions\",\"C) Random chance\",\"D) A creator deity's will\"],\"correct\":\"B\",\"explanation\":\"Emptiness (lack of fixed, independent essence) is what allows things to arise in dependence on conditions. If things had fixed essences, they couldn't be influenced by conditions at all.\"},\"intermediate\":{\"question\":\"What does Bell's theorem prove about quantum correlations?\",\"options\":[\"A) Correlations are caused by hidden properties in each particle\",\"B) Correlations cannot be explained by independently existing local properties — they are irreducibly relational\",\"C) Correlations don't exist\",\"D) Classical physics fully explains quantum correlations\"],\"correct\":\"B\",\"explanation\":\"Bell's theorem rules out \\\"local hidden variables\\\" — pre-existing independent properties can't explain quantum correlations. The correlations are real but not grounded in inherent properties, paralleling dependent origination without svabhāva.\"},\"advanced\":{\"question\":\"How does Nāgārjuna's equation \\\"emptiness = dependent origination\\\" function in this verse?\",\"options\":[\"A) It doesn't — Nāgārjuna rejects dependent origination here\",\"B) The verse shows that IF things had inherent essence, dependent origination would be impossible — therefore, dependent origination requires emptiness\",\"C) Emptiness and dependent origination are opposed concepts\",\"D) The verse proves things have inherent essence\"],\"correct\":\"B\",\"explanation\":\"The verse is a reductio: inherent essence + dependent origination = contradiction. Since dependent origination is observed, inherent essence must be false. Therefore, emptiness (absence of svabhāva) is the precondition for dependent origination.\"}},\"verseText\":\"Since the existence of things without essence is not established, \\\"When this exists, that arises\\\" is not tenable.\",\"madhyamakaConcept\":\"This is one of the most misunderstood verses. Garfield argues Nāgārjuna is not rejecting pratītyasamutpāda but showing that the formula \\\"When this exists, that arises\\\" cannot work if things have svabhāva. If essences are fixed and independent, no thing could arise in dependence on another. Kalupahana concurs: the verse targets those who try to combine inherent existence with dependent origination — an incoherent position. Siderits/Katsura note this verse sets up the resolution in v.14.\",\"quantumPhysicsParallel\":\"Quantum Non-Locality (Bell's Theorem): Bell's theorem proves that no theory of local hidden variables can reproduce quantum correlations. Correlations are real, but they cannot be explained by independently existing local properties. The \\\"mechanism\\\" of correlation is not locatable in either particle.\"}},\"isShowcase\":false,\"chapterId\":1}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities

176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":24,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_24\",\"number\":24,\"title\":\"Neither Existent Nor Non-Existent Movers Move\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"A really existent mover Doesn't move in any of the three ways. A non-existent mover Doesn't move in any of the three ways.\"},\"philosophy\":{\"insight\":\"The penultimate verse applies the existential analysis: an inherently existent mover can't move (it would be unchanging by definition). An inherently non-existent mover can't move (nothing can't do anything). The \\\"three ways\\\" (gone, going, not-gone) fail for both. Motion transcends the existence/non-existence binary.\",\"madhyamaka\":\"Garfield: \\\"really existent\\\" (sat) means having svabhāva. Such a mover is unchanging — it can't transition through gone/going/not-gone. A non-existent (asat) mover has no basis for action. Kalupahana: this verse applies the catuṣkoṭi (tetralemma) — existence fails, non-existence fails, both fails, neither fails. Candrakīrti: the verse shows that the very concept of \\\"mover\\\" resists ontological categorisation.\",\"quantum\":\"Quantum Vacuum / Virtual Particles: Virtual particles are neither \\\"really existent\\\" (they violate energy conservation momentarily) nor \\\"really non-existent\\\" (they produce measurable effects like the Casimir force and Lamb shift). They transcend the classical existence/non-existence binary — existing as \\\"potentiality\\\" that produces real effects.\",\"bridge\":\"Both show that fundamental entities transcend the existence/non-existence binary. Virtual particles are neither fully real nor fully unreal. The mover is neither inherently existent nor inherently non-existent. Both exist in a dependent, relational mode that classical ontological categories can't capture.\",\"accessible\":\"Is a plan \\\"real\\\"? It doesn't physically exist (you can't touch it). But it's not \\\"nothing\\\" either (it guides actions). Plans exist dependently — neither inherently real nor inherently unreal. Nāgārjuna says the mover is like this: beyond the real/unreal binary.\",\"twoTruths\":\"Conventionally, we use motion-language successfully. Ultimately, neither existence, non-existence, both, nor neither can characterise motion — the catuṣkoṭi (tetralemma) applies.\",\"commonMisconception\":\"The tetralemma is NOT agnosticism or confusion. It's a precise logical tool showing that inherent motion cannot be characterised by ANY of the four logical possibilities.\"},\"quantumResonance\":{\"concept\":\"Virtual Particles / Quantum Vacuum\",\"score\":86,\"strength\":\"High\",\"explanation\":\"Virtual particles are neither fully existent nor non-existent — they transcend classical ontological categories while producing real effects. Parallels the mover's transcendence of existence/non-existence.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Flickering Entity\",\"anchor\":\"A figure that flickers between solid (existent) and transparent (non-existent). In neither state can it move through the three-way path. It's stuck — neither state supports motion.\",\"texture\":\"Solid state: Gold, opaque. Non-existent state: Transparent wireframe. Path: Three labelled sections (Gone, Going, Not-Gone). Both states: Figure frozen.\",\"mood\":\"Liminal, paradoxical, profound\",\"colors\":[\"#F59E0B\",\"#94A3B8\",\"#8B5CF6\",\"#1E293B\"],\"orchestration\":{\"start\":\"Figure flickering between solid and transparent on a three-section path.\",\"click\":\"Click \\\"Existent\\\" — figure solidifies but can't move (frozen). Click \\\"Non-existent\\\" — figure fades but has no basis for motion.\",\"reveal\":\"Text: \\\"Neither the existent nor the non-existent can move. The mover transcends this binary.\\\"\"},\"interaction\":{\"click\":\"Toggle between existent/non-existent — watch both freeze\",\"drag\":\"Try dragging the figure along the path — it resists in both states\",\"hover\":\"Hover shows why each state prevents motion\"},\"controls\":{\"rotation\":{\"default\":false,\"speed\":0},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Custom opacity shader toggling between solid and wireframe\",\"drei Wireframe material for non-existent state\",\"useSpring for flicker animation between states\",\"drei Plane for three-section path with UV labels\",\"Bloom post-processing for solid state glow\"],\"camera\":{\"position\":[0,3,8],\"fov\":50,\"autoRotate\":false},\"fps\":60,\"performanceNotes\":\"\u003c250MB memory, 60 FPS. Single mesh with opacity toggle. Path is textured plane.\",\"tripoPrompt\":\"A humanoid figure flickering between solid gold and transparent wireframe on a three-section labelled path, dark space, 8K.\",\"visualBridge\":\"The flickering figure that can't move in either state directly shows that neither existence nor non-existence supports inherent motion.\",\"educationalGoal\":\"User grasps the tetralemma applied to motion — all four logical positions fail, revealing motion's thorough emptiness.\"},\"deeperDive\":[{\"q\":\"Why can't an inherently existent mover move?\",\"a\":\"If a mover inherently EXISTS (has svabhāva), it's unchanging by definition — svabhāva means fixed, independent nature. But motion requires change (transitioning through gone/going/not-gone). An unchanging entity can't change. Therefore, an inherently existent mover can't move.\",\"realLifeExample\":\"If a rock were inherently, unchangeably a rock, it could never erode, break, or move. Its inherent nature would freeze it in place. Inherent existence = no change = no motion.\"},{\"q\":\"Why can't a non-existent mover move?\",\"a\":\"If a mover is inherently non-existent (like a square circle), it has no basis for any properties or actions whatsoever. Nothing can't move. You need something to be the subject of motion.\",\"realLifeExample\":\"Can \\\"nothing\\\" walk? Can a non-existent car drive? If there's no mover at all, there's no subject for motion. Non-existence can't do anything.\"},{\"q\":\"What are virtual particles and how do they transcend existence/non-existence?\",\"a\":\"Virtual particles are quantum fluctuations that briefly appear in the vacuum. They violate energy conservation (suggesting non-existence) but produce measurable forces (Casimir effect, Lamb shift — suggesting existence). They're neither \\\"really there\\\" nor \\\"really not there\\\" — they exist in a mode classical ontology can't categorise.\",\"realLifeExample\":\"Is a thought \\\"real\\\"? It has no physical substance (non-existent?) but it causes actions and emotions (existent?). Thoughts exist in a dependent mode — neither purely physical nor purely nothing.\"},{\"q\":\"What is the catuṣkoṭi (tetralemma)?\",\"a\":\"The tetralemma examines four logical possibilities: (1) X exists, (2) X doesn't exist, (3) X both exists and doesn't, (4) X neither exists nor doesn't. Nāgārjuna shows all four fail for inherent existence. V.24 handles (1) and (2); v.25 effectively closes (3) and (4) by extending to entities and non-entities.\",\"realLifeExample\":\"For the question \\\"Is the number 7 red?\\\" — (1) Yes → absurd, (2) No → maybe, but feels incomplete, (3) Both → contradictory, (4) Neither → the question itself was wrong. The tetralemma reveals when the question is flawed.\"},{\"q\":\"What are the \\\"three ways\\\"?\",\"a\":\"Gone (past motion), going (present motion), not-gone (future/potential motion). These are the trilemma from v.1 applied again. An inherently existent mover can't be located in any of these states (it's unchanging). A non-existent mover has no state to be in. The three ways fail for both.\",\"realLifeExample\":\"A statue (unchanging) can't have \\\"walked,\\\" be \\\"walking,\\\" or \\\"about to walk.\\\" And a non-existent ghost can't be in any of these states either. Both are motion-less for different reasons.\"},{\"q\":\"How does v.24 prepare for the grand conclusion?\",\"a\":\"V.24 eliminates the last escape routes: you can't save the mover by asserting it inherently exists OR by asserting it doesn't. Both fail. V.25 draws the devastating conclusion: motion, mover, AND the path of motion are all empty. No element of the motion-framework has inherent existence.\",\"deeper\":\"V.24 is the final analytical verse. V.25 is the conclusion. The chapter's argument is now complete — every angle (trilemma, beginning, rest, identity/difference, existence/non-existence) has been covered.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can't an inherently existent mover move?\",\"options\":[\"A) It's too heavy\",\"B) Inherent existence means unchanging — and motion requires change\",\"C) It doesn't want to\",\"D) There's no path\"],\"correct\":\"B\",\"explanation\":\"Svabhāva (inherent existence) means fixed, independent nature. Something truly unchanging can't transition through the states of motion. Inherent existence freezes everything.\"},\"intermediate\":{\"question\":\"How do virtual particles relate to the existence/non-existence binary?\",\"options\":[\"A) They are fully existent\",\"B) They are fully non-existent\",\"C) They transcend the binary — violating energy conservation yet producing measurable effects\",\"D) They have nothing to do with existence\"],\"correct\":\"C\",\"explanation\":\"Virtual particles are neither fully real (violate conservation) nor fully unreal (produce measurable forces). They exist in a dependent mode beyond classical categories.\"},\"advanced\":{\"question\":\"What is the catuṣkoṭi (tetralemma) and how does v.24 use it?\",\"options\":[\"A) A cooking method\",\"B) Four logical possibilities (exists, doesn't exist, both, neither) — all rejected for inherent existence. V.24 handles the first two horns\",\"C) A meditation technique\",\"D) A type of logic that proves existence\"],\"correct\":\"B\",\"explanation\":\"The tetralemma examines all four logical possibilities for inherent existence. V.24 eliminates options 1 (existent mover) and 2 (non-existent mover), preparing for v.25's grand conclusion.\"}},\"verseText\":\"A really existent mover Doesn't move in any of the three ways. A non-existent mover Doesn't move in any of the three ways.\",\"madhyamakaConcept\":\"Garfield: \\\"really existent\\\" (sat) means having svabhāva. Such a mover is unchanging — it can't transition through gone/going/not-gone. A non-existent (asat) mover has no basis for action. Kalupahana: this verse applies the catuṣkoṭi (tetralemma) — existence fails, non-existence fails, both fails, neither fails. Candrakīrti: the verse shows that the very concept of \\\"mover\\\" resists ontological categorisation.\",\"quantumPhysicsParallel\":\"Quantum Vacuum / Virtual Particles: Virtual particles are neither \\\"really existent\\\" (they violate energy conservation momentarily) nor \\\"really non-existent\\\" (they produce measurable effects like the Casimir force and Lamb shift). They transcend the classical existence/non-existence binary — existing as \\\"potentiality\\\" that produces real effects.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"d

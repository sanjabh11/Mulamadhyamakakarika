176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":20,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_20\",\"number\":20,\"title\":\"The Absurdity of Difference: Independent Existence\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"It would follow from A real distinction between motion and mover That there could be a mover without motion And motion without a mover.\"},\"philosophy\":{\"insight\":\"If mover and motion were completely different (inherently separate), each could exist without the other. But a mover without motion and motion without a mover are both absurd — so complete difference fails. This is the second horn of the v.18 dilemma.\",\"madhyamaka\":\"Garfield: \\\"real distinction\\\" (pṛthaktva) means inherent separateness — each could exist independently. But v.7 proved they're mutually dependent. Independent existence contradicts established interdependence. Kalupahana: the verse shows that inherent difference is as untenable as inherent identity. Siderits/Katsura: the argument is swift because the mutual dependence result (v.7) is already established.\",\"quantum\":\"Bell's Theorem / Non-Separability: Bell's theorem (1964) proves that no theory of independent local hidden variables can reproduce quantum correlations. Entangled particles CANNOT be described as independently existing entities with separate properties. Complete independence is experimentally refuted.\",\"bridge\":\"Both show complete independence leads to absurd or experimentally falsified consequences. Bell's theorem proves particles aren't independently real. Nāgārjuna proves mover and motion aren't independently real. Both deny \\\"real distinction\\\" — inherent separateness — while maintaining conventional distinguishability.\",\"accessible\":\"Can you have a \\\"buyer\\\" without anything being \\\"bought\\\"? Can something be \\\"bought\\\" without a buyer? These concepts need each other. Separating them completely makes both meaningless — just as separating mover from motion makes both empty.\",\"twoTruths\":\"Conventionally, mover and motion are related in everyday experience. Ultimately, neither mover, motion, nor their relation has inherent existence — all three are empty.\",\"commonMisconception\":\"Not nihilism — the relation between mover and motion WORKS conventionally. But the relation itself has no inherent ground; it too is dependently designated.\"},\"quantumResonance\":{\"concept\":\"Bell's Theorem / Non-Separability\",\"score\":91,\"strength\":\"High\",\"explanation\":\"Bell's theorem experimentally refutes independent local realism — particles aren't independently real. Direct parallel to the impossibility of inherently separate mover and motion.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Separating Entangled Pair\",\"anchor\":\"Two entangled orbs connected by a quantum thread. Pulling them apart stretches the thread — it never breaks. At maximum separation, the thread snaps them back. They cannot be truly independent.\",\"texture\":\"Orbs: Cyan and gold with internal swirl. Thread: Shimmering violet quantum correlation line. Snap-back: Elastic flash.\",\"mood\":\"Tense, elastic, revelatory\",\"colors\":[\"#06B6D4\",\"#F59E0B\",\"#8B5CF6\",\"#1E293B\"],\"orchestration\":{\"start\":\"Two orbs connected by violet thread, close together.\",\"click\":\"Click to pull apart — thread stretches but holds. Further clicks stretch more.\",\"reveal\":\"At maximum stretch, thread snaps them back together. Text: \\\"Complete independence is impossible. They are non-separable.\\\"\"},\"interaction\":{\"click\":\"Click to pull orbs apart — watch the thread resist\",\"drag\":\"Drag orbs to test the limits of separation\",\"hover\":\"Hover shows Bell inequality violation values\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.3},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Custom elastic thread shader with tension-based colour shift\",\"useSpring for elastic snap-back physics\",\"drei Line for quantum correlation thread with animated dash\",\"Bloom post-processing for thread glow at maximum tension\",\"drei Billboard for Bell inequality value display\"],\"camera\":{\"position\":[0,0,8],\"fov\":50,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c250MB memory, 60 FPS. Two spheres with elastic line. Very lightweight.\",\"tripoPrompt\":\"Two glowing orbs — cyan and gold — connected by a violet elastic quantum thread being stretched, dark space, 8K.\",\"visualBridge\":\"The unbreakable quantum thread between orbs directly shows non-separability — complete independence is impossible.\",\"educationalGoal\":\"User grasps that even RELATIONS between things are empty — not just the things themselves. Emptiness goes deeper than expected.\"},\"deeperDive\":[{\"q\":\"What does \\\"real distinction\\\" mean?\",\"a\":\"It means inherent, ontological separateness — each entity exists entirely on its own, with no necessary connection to the other. If mover and motion had a \\\"real distinction,\\\" each could exist independently.\",\"realLifeExample\":\"A \\\"real distinction\\\" between a cup and a table means each can exist without the other. That works for cups and tables. But can a \\\"husband\\\" exist without a \\\"wife\\\"? No — the \\\"real distinction\\\" fails for relational concepts.\"},{\"q\":\"Why is a mover without motion absurd?\",\"a\":\"A \\\"mover\\\" is defined as something that moves. Without motion, there's nothing to make it a \\\"mover\\\" — it's just an object. The concept \\\"mover\\\" is constituted BY motion. Remove motion and \\\"mover\\\" loses all content.\",\"realLifeExample\":\"A \\\"driver\\\" without driving is just a person. The concept \\\"driver\\\" is constituted by the act of driving. Without the act, the label is empty.\"},{\"q\":\"How does Bell's theorem prove non-separability?\",\"a\":\"Bell (1964) derived an inequality that any theory of independent local hidden variables must satisfy. Quantum mechanics predicts violations of this inequality. Experiments (Aspect, 1982; Hensen, 2015) confirm the violations. Therefore, particles cannot be described as independently existing entities with pre-assigned, separate properties.\",\"realLifeExample\":\"If two students independently took the same exam (no communication), their answers should be uncorrelated beyond chance. But if their answers are MORE correlated than chance allows, they MUST have some non-independent connection. Bell's theorem is like this — the correlations prove non-independence.\"},{\"q\":\"Is Nāgārjuna saying mover and motion are the same?\",\"a\":\"No! V.19 just showed identity is absurd. V.20 shows difference is absurd. The point is that BOTH options fail within the essentialist framework. The solution: they're dependently co-arising — conventionally distinct but not inherently separate.\",\"realLifeExample\":\"A melody and its rhythm are neither identical (you can change one without the other) nor completely separate (a melody without rhythm is just tones). They're aspects of one musical piece — distinct but inseparable.\"},{\"q\":\"What does Bell's theorem say about hidden variables?\",\"a\":\"Bell's theorem rules out LOCAL hidden variable theories — theories where particles have pre-existing, independent properties that determine measurement outcomes. Non-local hidden variable theories (like Bohmian mechanics) are still possible but require non-separability. Either way, complete independence is ruled out.\",\"realLifeExample\":\"If two detectives independently solve the same case with identical conclusions, you might think they had separate evidence (hidden variables). But if their conclusions are MORE correlated than separate evidence allows, they must have shared information. The independence assumption is falsified.\"},{\"q\":\"How does this verse complete the dilemma with v.19?\",\"a\":\"V.19: identity → agent-action collapse (absurd). V.20: difference → independent existence (absurd, since they're mutually dependent per v.7). Together: both horns fail. V.21 will draw the conclusion that inherent establishment is impossible.\",\"deeper\":\"The v.19-20 pair forms a complete dilemma: identity OR difference exhausts the logical options for inherently existing things. Both lead to absurdity. Therefore, the assumption (inherent existence) that generates these options is false.\"}],\"quiz\":{\"beginner\":{\"question\":\"What happens if mover and motion are treated as completely separate?\",\"options\":[\"A) They become clearer\",\"B) Each could exist without the other — a mover without motion and motion without a mover — which is absurd\",\"C) They merge\",\"D) Nothing changes\"],\"correct\":\"B\",\"explanation\":\"Complete difference means independence. But a \\\"mover\\\" without motion isn't a mover, and \\\"motion\\\" without a mover has no subject. Both are absurd.\"},\"intermediate\":{\"question\":\"What does Bell's theorem prove about entangled particles?\",\"options\":[\"A) They are identical\",\"B) They can be described as independently existing entities with separate properties\",\"C) No local hidden variable theory can reproduce their correlations — they are non-separable\",\"D) They don't exist\"],\"correct\":\"C\",\"explanation\":\"Bell's theorem, confirmed experimentally, proves that entangled particles cannot have independent pre-existing properties. Their correlations exceed what any theory of independent entities allows.\"},\"advanced\":{\"question\":\"How do verses 19 and 20 together form a complete dilemma?\",\"options\":[\"A) They don't form a dilemma\",\"B) V.19: identity → absurd collapse; v.20: difference → absurd independence. Together: both options fail → inherent existence is untenable\",\"C) Only v.19 matters\",\"D) They prove motion exists\"],\"correct\":\"B\",\"explanation\":\"Identity and difference exhaust the logical options for inherently existing things. V.19 shows identity fails, v.20 shows difference fails. Since both fail, the assumption generating them (inherent existence) must be false.\"}},\"verseText\":\"It would follow from A real distinction between motion and mover That there could be a mover without motion And motion without a mover.\",\"madhyamakaConcept\":\"Garfield: \\\"real distinction\\\" (pṛthaktva) means inherent separateness — each could exist independently. But v.7 proved they're mutually dependent. Independent existence contradicts established interdependence. Kalupahana: the verse shows that inherent difference is as untenable as inherent identity. Siderits/Katsura: the argument is swift because the mutual dependence result (v.7) is already established.\",\"quantumPhysicsParallel\":\"Bell's Theorem / Non-Separability: Bell's theorem (1964) proves that no theory of independent local hidden variables can reproduce quantum correlations. Entangled particles CANNOT be described as independently existing entities with separate properties. Complete independence is experimentally refuted.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learn

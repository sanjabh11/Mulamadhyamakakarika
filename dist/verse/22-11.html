88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":22,\"verseId\":11,\"chapterTitle\":\"Examination of the Tathāgata\",\"totalVerses\":16,\"verseData\":{\"id\":\"v22_11\",\"number\":11,\"title\":\"If All Were Permanent, There Would Be No Arising or Ceasing\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If all were truly permanent there would be no arising or ceasing. For how could that be transformed?\"},\"philosophy\":{\"insight\":\"Consequence of permanence: if everything were inherently permanent, nothing could arise, cease, or change. A frozen universe with no transformation — contradicting all experience.\",\"madhyamaka\":\"Sarva nitya cet (if all were permanent), na utpāda na nirodha (no arising, no ceasing). Na anyathā-bhāva (no transformation). This is the standard Madhyamaka refutation of eternalism via the svabhāva → nitya argument.\",\"quantum\":\"If all quantum states were inherently fixed (permanent), no transitions would occur — no emission, absorption, decay, or measurement outcomes. Physics would freeze.\",\"bridge\":\"Both: inherent permanence eliminates all dynamism. QM: fixed states → no transitions. V.11: permanent things → no change. Both: stasis contradicts observation.\",\"accessible\":\"If a candle flame were permanent, it could never go out. If seasons were permanent, spring would never come. Permanence = no change = contradicts experience.\",\"twoTruths\":\"Conventionally: things change (arise, cease, transform). Ultimately: this is possible because nothing is inherently permanent.\",\"commonMisconception\":\"NOT saying permanence is desirable. V.11 shows it would be CATASTROPHIC — a frozen, changeless universe.\"},\"quantumResonance\":{\"concept\":\"Fixed States → No Transitions\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"Inherently fixed quantum states → no transitions. Inherently permanent things → no change. Both: permanence eliminates dynamism.\",\"caveat\":\"Quantum transitions are physics. V.11 is about philosophical permanence.\"},\"animation\":{\"visualBridge\":\"A frozen world — everything locked in place. Nothing arises, nothing ceases. Caption: \\\"Permanence = no change.\\\"\",\"educationalGoal\":\"Inherent permanence eliminates all dynamism. Change requires non-permanence.\"},\"deeperDive\":[{\"q\":\"Why does permanence block change?\",\"a\":\"Permanent = unchanging by definition. If something's nature is permanent, it can't gain new properties (arise) or lose existing ones (cease).\",\"realLifeExample\":\"A permanent marker can't be erased. Permanent nature can't be changed.\"},{\"q\":\"What does \\\"transformed\\\" mean?\",\"a\":\"Anyathā-bhāva = becoming otherwise. Transformation = changing from one state to another. Permanence blocks all such transitions.\",\"realLifeExample\":\"Ice can't become water if \\\"being ice\\\" is permanent.\"},{\"q\":\"How does this refute eternalism?\",\"a\":\"Eternalism claims things permanently exist. V.11 shows this leads to a frozen universe — contradicting the observed dynamism of reality.\",\"realLifeExample\":\"If mountains were permanent, they couldn't erode. But they do. → Not permanent.\"},{\"q\":\"Quantum illustration?\",\"a\":\"If electron energy levels were permanently fixed, no emission or absorption of photons. No light, no chemistry, no life. Fixed states → dead universe.\",\"realLifeExample\":\"If your phone battery never discharged (permanent charge), it could never run down. But it does. Not permanent.\"},{\"q\":\"How does this connect to v.10?\",\"a\":\"V.10: world fixated on permanence. V.11: shows permanence leads to absurdity. The fixation is refuted by its consequence.\",\"realLifeExample\":\"V.10: people believe in permanence. V.11: but permanent things can't change. Look around — everything changes. Belief refuted.\"},{\"q\":\"What is the resolution?\",\"a\":\"Things are conventionally impermanent (they do change) but not inherently so. The Middle Way: neither permanent nor inherently impermanent.\",\"deeper\":\"V.11 applies the master argument (svabhāva → nitya → no change) to universally refute permanence. Change is the empirical evidence; emptiness is the conclusion.\"}],\"quiz\":{\"beginner\":{\"question\":\"What would happen if everything were permanent?\",\"options\":[\"A) Great stability\",\"B) No arising, ceasing, or change at all. A frozen universe. Contradicts all experience.\",\"C) Some change\",\"D) Only minor effects\"],\"correct\":\"B\",\"explanation\":\"Permanent = unchanging = no dynamism. Contradicts observation.\"},\"intermediate\":{\"question\":\"How does v.11 refute eternalism?\",\"options\":[\"A) Doesn't\",\"B) Permanence → no change. Change is observed. → Permanence is false. Empirical refutation.\",\"C) Only theoretical\",\"D) Permanence compatible with change\"],\"correct\":\"B\",\"explanation\":\"Permanence → no change. Change observed → permanence false.\"},\"advanced\":{\"question\":\"How does QM illustrate the point?\",\"options\":[\"A) No illustration\",\"B) Fixed quantum states → no transitions → no emission/absorption → dead universe. Dynamism requires non-fixed states.\",\"C) QM supports permanence\",\"D) Unrelated\"],\"correct\":\"B\",\"explanation\":\"Fixed states → no transitions → dead physics. Dynamism requires change.\"}},\"verseText\":\"If all were truly permanent there would be no arising or ceasing. For how could that be transformed?\",\"madhyamakaConcept\":\"Sarva nitya cet (if all were permanent), na utpāda na nirodha (no arising, no ceasing). Na anyathā-bhāva (no transformation). This is the standard Madhyamaka refutation of eternalism via the svabhāva → nitya argument.\",\"quantumPhysicsParallel\":\"If all quantum states were inherently fixed (permanent), no transitions would occur — no emission, absorption, decay, or measurement outcomes. Physics would freeze.\"}},\"isShowcase\":false,\"chapterId\":22}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Study the MMK with interactive verse exploration, research-mode transparency, and carefully caveated quantum analogies.\"}]],\"error\":null,\"digest\":\"$un

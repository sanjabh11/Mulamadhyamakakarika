88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":25,\"verseId\":21,\"chapterTitle\":\"Examination of Nirvana\",\"totalVerses\":24,\"verseData\":{\"id\":\"v25_21\",\"number\":21,\"title\":\"What Is Identical and What Is Different?\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"What is identical? What is different? What is permanent? What is impermanent? What is both? What is neither? Such is the auspicious cessation of all fabrication.\"},\"philosophy\":{\"insight\":\"PRAPAÑCOPAŚAMA — the cessation of conceptual elaboration. When all conceptual categories dissolve (identity/difference, permanence/impermanence, both/neither), what remains IS peace. This is nirvāṇa. Not a \\\"thing\\\" but the end of conceptual fabrication.\",\"madhyamaka\":\"Kim ekatva, kim anyatva, kim śāśvata, kim aśāśvata, ubhayam, anubhayam iti. Prapañcopaśamaṃ śivam. Prapañca = conceptual elaboration. Upaśama = cessation. Śiva = auspicious/peaceful.\",\"quantum\":\"When the measurement apparatus is removed, the quantum system returns to its natural state (superposition). When conceptual categories are removed, reality returns to its natural state (emptiness/peace).\",\"bridge\":\"Both: removing the imposed framework reveals the natural state. QM: remove measurement → natural quantum state. V.21: remove concepts → natural peace (nirvāṇa).\",\"accessible\":\"When you stop asking \\\"is it this or that?\\\" and just BE, that's peace. Nirvāṇa is what's left when all the mental noise stops.\",\"twoTruths\":\"Conventionally: we use identity, difference, permanence, etc. Ultimately: their cessation IS nirvāṇa.\",\"commonMisconception\":\"NOT saying conceptual thought is bad. Saying that when ALL conceptual elaboration ceases, what remains is peace. The CESSATION is nirvāṇa, not the suppression.\"},\"quantumResonance\":{\"concept\":\"Removing Apparatus Reveals Natural State\",\"score\":58,\"strength\":\"Medium\",\"explanation\":\"Remove measurement → natural quantum state. Remove concepts → natural peace. Both: the imposed framework was hiding the natural state.\",\"caveat\":\"Physical measurement vs. conceptual elaboration.\"},\"animation\":{\"visualBridge\":\"Conceptual labels dissolving one by one: identical/different, permanent/impermanent, both/neither. What remains: a luminous, peaceful emptiness. Caption: \\\"The auspicious cessation of all fabrication.\\\"\",\"educationalGoal\":\"When all conceptual categories dissolve, what remains IS nirvāṇa — peace from conceptual fabrication.\"},\"deeperDive\":[{\"q\":\"What is prapañcopaśama?\",\"a\":\"Prapañca: conceptual elaboration, fabrication, proliferation of concepts. Upaśama: cessation, peace, calming. Together: the peace that comes when conceptual proliferation ceases.\",\"realLifeExample\":\"When the noisy construction next door stops, the silence IS the peace. The peace isn't a new sound — it's the absence of noise.\"},{\"q\":\"Is this the definition of nirvāṇa?\",\"a\":\"Yes — one of the most precise definitions. Nirvāṇa = prapañcopaśama = the cessation of conceptual fabrication. Not a place, not a thing, but the end of mental noise.\",\"realLifeExample\":\"Health isn't a thing you add. It's what remains when disease is removed. Nirvāṇa = what remains when concepts are removed.\"},{\"q\":\"Why list these specific pairs?\",\"a\":\"Identity/difference (Ch.2-6), permanence/impermanence (Ch.15-21), both/neither (tetralemma throughout). These represent ALL the conceptual categories the MMK has analyzed. Their cessation = the MMK's goal.\",\"realLifeExample\":\"A symphony listing all its themes before the final chord. V.21 recapitulates the entire MMK in one verse.\"},{\"q\":\"Connection to meditation?\",\"a\":\"This IS meditation instruction. When you sit and concepts arise, let them go. When ALL concepts cease, what remains is nirvāṇa. The verse describes the meditative experience of liberation.\",\"realLifeExample\":\"The gap between thoughts in meditation — that's a taste of prapañcopaśama.\"},{\"q\":\"Why \\\"auspicious\\\" (śiva)?\",\"a\":\"The cessation isn't empty despair — it's AUSPICIOUS, positive, blessed. Peace isn't negative. It's the most positive state possible. Nirvāṇa is bliss, not blankness.\",\"realLifeExample\":\"Silence isn't the absence of joy — it can be the most joyful experience. Peace is positive, not merely the absence of noise.\"},{\"q\":\"Significance?\",\"a\":\"V.21 may be the single most important verse defining nirvāṇa in the entire MMK. It gives the most precise, practical, and profound definition.\",\"deeper\":\"V.21 connects Ch.25 to the entire MMK: every conceptual category analyzed throughout the text (identity/difference, permanence/impermanence) reaches its resolution in prapañcopaśama. The philosophical analysis wasn't an end in itself but a path to this cessation. Philosophy becomes liberation.\"}],\"quiz\":{\"beginner\":{\"question\":\"What is prapañcopaśama?\",\"options\":[\"A) A place\",\"B) The CESSATION of all conceptual elaboration/fabrication. When all mental categories dissolve, what remains IS peace = nirvāṇa.\",\"C) A technique\",\"D) A state of mind\"],\"correct\":\"B\",\"explanation\":\"Cessation of concepts = peace = nirvāṇa. Not a thing but the end of fabrication.\"},\"intermediate\":{\"question\":\"Why is prapañcopaśama called \\\"auspicious\\\"?\",\"options\":[\"A) Convention\",\"B) Because the cessation isn't empty despair but POSITIVE peace. Nirvāṇa is bliss, not blankness. The most positive state possible.\",\"C) Religious term\",\"D) Historical reason\"],\"correct\":\"B\",\"explanation\":\"Positive peace, not mere absence. Bliss, not blankness.\"},\"advanced\":{\"question\":\"How does v.21 connect to the entire MMK?\",\"options\":[\"A) Doesn't\",\"B) Every conceptual category analyzed throughout the MMK (identity/difference, permanence/impermanence) reaches resolution in prapañcopaśama. The entire philosophical analysis leads to this cessation. Philosophy becomes liberation.\",\"C) Only Ch.25\",\"D) Only theoretical\"],\"correct\":\"B\",\"explanation\":\"The entire MMK leads here. Philosophy → cessation → liberation.\"}},\"verseText\":\"What is identical? What is different? What is permanent? What is impermanent? What is both? What is neither? Such is the auspicious cessation of all fabrication.\",\"madhyamakaConcept\":\"Kim ekatva, kim anyatva, kim śāśvata, kim aśāśvata, ubhayam, anubhayam iti. Prapañcopaśamaṃ śivam. Prapañca = conceptual elaboration. Upaśama = cessation. Śiva = auspicious/peaceful.\",\"quantumPhysicsParallel\":\"When the measurement apparatus is removed, the quantum system returns to its natural state (superposition). When conceptual categories are removed, reality returns to its natural state (emptiness/peace).\"}},\"isShowcase\":false,\"chapterId\":25}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, fol

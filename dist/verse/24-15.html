88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":24,\"verseId\":15,\"chapterTitle\":\"Examination of the Noble Truths\",\"totalVerses\":40,\"verseData\":{\"id\":\"v24_15\",\"number\":15,\"title\":\"You Project Your Own Faults Onto Us\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"You, projecting your own faults onto us, are like a person who, having mounted a horse, forgets about the horse.\"},\"philosophy\":{\"insight\":\"TURNING THE TABLES: the opponent projected their OWN faults onto emptiness. The faults (destroying arising/ceasing, Noble Truths, etc.) actually belong to the opponent's position (inherent existence). Like forgetting you're ON a horse — the opponent forgot what they're standing on.\",\"madhyamaka\":\"Tvam ātma-doṣān asmāsu āropayasi (you project your own faults onto us). Aśvam ārūḍha aśvam eva smṛtaḥ (like mounting a horse and forgetting the horse). The faults belong to the opponent, not to Nāgārjuna.\",\"quantum\":\"A classical physicist accusing QM of \\\"destroying reality\\\" while standing on classical physics that CAN'T explain atomic structure. The accuser's own position has the faults they attribute to the new theory.\",\"bridge\":\"Both: the accuser projects their own position's faults onto the new theory. Classical physics can't explain atoms → blames QM. Inherent existence can't explain change → blames emptiness.\",\"accessible\":\"A person with dirty glasses accusing the world of being blurry. The problem is in their glasses (understanding), not the world (emptiness).\",\"twoTruths\":\"The opponent's position (inherent existence) actually HAS the faults they attributed to emptiness: inherent existence destroys arising, change, and the path.\",\"commonMisconception\":\"The opponent is projecting. The faults they see in emptiness are reflections of their own position's problems.\"},\"quantumResonance\":{\"concept\":\"Projecting Own Framework's Faults\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"Classical physics can't explain what QM can → blames QM for \\\"destroying reality.\\\" Inherent existence can't explain change → blames emptiness. Both: projection of own faults.\",\"caveat\":\"Physics debates. Philosophy debates. Same pattern of projection.\"},\"animation\":{\"visualBridge\":\"A person pointing accusingly at emptiness — but a mirror behind them shows the faults are ON THEM. Caption: \\\"You project your own faults onto us.\\\"\",\"educationalGoal\":\"The opponent's faults belong to their own position, not to emptiness. Projection reversal.\"},\"deeperDive\":[{\"q\":\"What \\\"horse\\\" has the opponent forgotten?\",\"a\":\"Their own position: inherent existence. They're \\\"standing on\\\" inherent existence but forgot to examine it. If they did, they'd find THEIR position has the faults they attribute to emptiness.\",\"realLifeExample\":\"Complaining about someone else's messy room while your own is messier. Forgetting to look at yourself.\"},{\"q\":\"What faults belong to inherent existence?\",\"a\":\"If things inherently exist: (1) Nothing can arise (already exists). (2) Nothing can cease (permanent). (3) No change (fixed). (4) No path (can't transform). (5) No liberation (afflictions permanent). ALL the faults from vv.1-6.\",\"realLifeExample\":\"If a building were \\\"inherently complete,\\\" you couldn't add rooms, fix it, or demolish it. Inherent existence = total rigidity.\"},{\"q\":\"How does this reverse the argument?\",\"a\":\"Opponent: \\\"Emptiness → no arising, no path, etc.\\\" Nāgārjuna: \\\"Inherent existence → no arising, no path, etc.\\\" The faults transfer from emptiness to inherent existence. Complete reversal.\",\"realLifeExample\":\"\\\"Your theory causes the problem!\\\" \\\"No — YOUR theory causes the problem. Let me show you why.\\\"\"},{\"q\":\"Why the horse analogy?\",\"a\":\"Someone riding a horse but forgetting they're on it is absurd — the horse is right there. The opponent is \\\"riding\\\" inherent existence but forgot to examine it. The thing they're standing on is the problem.\",\"realLifeExample\":\"Looking for your glasses when they're on your head. The thing you're seeking is the thing you're on.\"},{\"q\":\"Is this ad hominem?\",\"a\":\"No — it's a legitimate philosophical counter-argument. The ARGUMENT is: the faults the opponent attributed to emptiness actually belong to inherent existence. This is a logical reversal, not a personal attack.\",\"realLifeExample\":\"In a trial, showing that the accuser committed the crime isn't ad hominem — it's a legitimate defense that redirects the evidence.\"},{\"q\":\"Significance?\",\"a\":\"V.15 completes the reversal begun in v.14. V.14: emptiness enables. V.15: inherent existence is the actual problem. Together: the counterattack is devastating.\",\"deeper\":\"V.15 is the counterattack proper: not just defending emptiness but ACCUSING the opponent's position of the very faults it projected. This is philosophically elegant — the same evidence the opponent used against emptiness is turned against inherent existence. The mirror reversal is complete.\"}],\"quiz\":{\"beginner\":{\"question\":\"Who actually has the faults?\",\"options\":[\"A) Emptiness\",\"B) The OPPONENT'S position (inherent existence). The faults attributed to emptiness actually belong to inherent existence. Projection.\",\"C) Both equally\",\"D) Neither\"],\"correct\":\"B\",\"explanation\":\"Projection: the faults belong to inherent existence, not emptiness.\"},\"intermediate\":{\"question\":\"What faults does inherent existence have?\",\"options\":[\"A) None\",\"B) ALL the faults from vv.1-6: no arising, no ceasing, no change, no path, no liberation. Inherent existence freezes everything.\",\"C) Only some\",\"D) Different faults\"],\"correct\":\"B\",\"explanation\":\"All the faults transfer: inherent existence = total rigidity = nothing works.\"},\"advanced\":{\"question\":\"How is the reversal philosophically elegant?\",\"options\":[\"A) Not elegant\",\"B) The same evidence used against emptiness is turned against inherent existence. The opponent's own argument proves the opposite of what they intended. Mirror reversal.\",\"C) Only defensive\",\"D) Different argument\"],\"correct\":\"B\",\"explanation\":\"The opponent's own evidence refutes their position. Maximum philosophical elegance.\"}},\"verseText\":\"You, projecting your own faults onto us, are like a person who, having mounted a horse, forgets about the horse.\",\"madhyamakaConcept\":\"Tvam ātma-doṣān asmāsu āropayasi (you project your own faults onto us). Aśvam ārūḍha aśvam eva smṛtaḥ (like mounting a horse and forgetting the horse). The faults belong to the opponent, not to Nāgārjuna.\",\"quantumPhysicsParallel\":\"A classical physicist accusing QM of \\\"destroying reality\\\" while standing on classical physics that CAN'T explain atomic structure. The accuser's own position has the faults they attribute to the new theory.\"}},\"isShowcase\":false,\"chapterId\":24}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamaka

88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":20,\"verseId\":21,\"chapterTitle\":\"Examination of Cause and Effect (Saṃbhava)\",\"totalVerses\":24,\"verseData\":{\"id\":\"v20_21\",\"number\":21,\"title\":\"If the Effect Inherently Exists, Nothing to Produce; If Not, What Does the Cause Produce?\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If fruit existed essentially, what would a cause produce? If fruit did not exist essentially, what would a cause produce?\"},\"philosophy\":{\"insight\":\"Deepening the essential analysis: (1) If the effect INHERENTLY EXISTS — it's already there, so what would the cause produce? Nothing needs producing. (2) If the effect INHERENTLY DOESN'T EXIST — what is the cause producing? A non-existent thing can't be produced (you can't produce a square circle). Either way: inherent production is impossible.\",\"madhyamaka\":\"Phala svabhāvataḥ sat cet (if the effect exists essentially): kim hetu utpādayet (what would the cause produce?). Phala svabhāvataḥ asat cet (if the effect doesn't exist essentially): kim hetu utpādayet (what would the cause produce?). Neither inherent existence nor inherent non-existence of the effect allows for production.\",\"quantum\":\"Creation and annihilation operators in QFT: particles are created (from vacuum) and destroyed (back to vacuum). They don't inherently exist (can be destroyed) and don't inherently not-exist (can be created). Their existence is conditional/conventional. Like v.21: neither inherent existence nor inherent non-existence, but conventional arising.\",\"bridge\":\"Both QFT operators and v.21 show that entities are neither inherently existent nor inherently non-existent. QFT: particles created/destroyed conditionally. V.21: effects neither inherently exist (no need for production) nor inherently don't exist (nothing to produce). Both: conventional existence between the extremes.\",\"accessible\":\"If the painting already exists (inherently) — why paint? If the painting absolutely CAN'T exist (inherent non-existence) — painting is impossible. Real painting: the painting is CONVENTIONALLY non-existent before (can be created) and conventionally existent after (can be enjoyed). Neither extreme applies.\",\"twoTruths\":\"Conventionally: effects go from non-existence to existence through production. Ultimately: this is neither inherent existence (already there) nor inherent non-existence (impossible to produce). It's conventional transformation of conventionally empty entities.\",\"commonMisconception\":\"NOT saying effects are simultaneously existent and non-existent (paradox). V.21 shows that INHERENT existence and INHERENT non-existence both block production. Conventional existence (empty of inherence) is neither extreme.\"},\"quantumResonance\":{\"concept\":\"Creation/Annihilation Operators — Conditional Existence\",\"score\":60,\"strength\":\"Medium\",\"explanation\":\"QFT: particles created and destroyed conditionally (not inherently existent or non-existent). V.21: effects neither inherently exist (nothing to produce) nor inherently don't exist (can't be produced). Both: existence is conditional/conventional.\",\"caveat\":\"QFT operators are physics formalism. V.21 is about inherent vs. conventional existence. The parallel is about conditional existence between extremes.\"},\"animation\":{\"visualBridge\":\"Two panels: (1) Effect already exists — cause arrives but has nothing to do (\\\"Already produced!\\\"). (2) Effect can't exist — cause tries but can't produce non-existence. Neither works. Middle: conventional production as process.\",\"educationalGoal\":\"User sees: inherent existence → nothing to produce. Inherent non-existence → impossible to produce. Only conventional (empty) existence allows production.\"},\"deeperDive\":[{\"q\":\"How does inherent existence block production?\",\"a\":\"If the effect INHERENTLY exists, it exists by its own nature — permanently, independently. It was always there. \\\"Production\\\" (bringing into being) is meaningless for something that was never not-in-being. The cause has nothing to DO.\",\"realLifeExample\":\"You can't \\\"create\\\" gravity — it's already there (inherently, from the perspective of a specific universe). A cause that tries to \\\"produce\\\" something already existent is superfluous.\"},{\"q\":\"How does inherent non-existence block production?\",\"a\":\"If the effect INHERENTLY DOESN'T EXIST, it can NEVER exist — that's its permanent nature. You can't produce something that inherently can't exist. It's like trying to create a married bachelor — logically impossible.\",\"realLifeExample\":\"You can't produce a square circle — it inherently can't exist. If the effect's non-existence were its inherent nature, producing it would be equally impossible.\"},{\"q\":\"How does this differ from vv.16-18?\",\"a\":\"VV.16-18: the cause is empty/non-empty of the effect (analyzing the CAUSE's nature). V.21: the effect inherently exists/doesn't exist (analyzing the EFFECT's nature). Different perspective, same conclusion: inherent production fails.\",\"realLifeExample\":\"Same crime examined from two angles: the gun (cause, vv.16-18) and the bullet hole (effect, v.21). Different starting points, same conclusion: inherent causation is impossible.\"},{\"q\":\"What is the Madhyamaka resolution?\",\"a\":\"The effect is CONVENTIONALLY non-existent before production and CONVENTIONALLY existent after. Neither state is inherent. Production is the conventional transition from conventional non-existence to conventional existence. Empty entities undergoing empty processes.\",\"realLifeExample\":\"An unwritten book: conventionally doesn't exist (before writing). After writing: conventionally exists. Neither \\\"doesn't exist\\\" nor \\\"exists\\\" inherently. The transition (writing) is conventional production.\"},{\"q\":\"How do QFT creation/annihilation operators illustrate this?\",\"a\":\"The creation operator produces a particle from the vacuum. The annihilation operator returns it. Particles are neither inherently existent (can be annihilated) nor inherently non-existent (can be created). Their existence is conditional — exactly the \\\"conventional existence\\\" that v.21 points to.\",\"realLifeExample\":\"A job position: can be created (not inherently non-existent) and can be eliminated (not inherently existent). Its existence depends on conditions — like all conventional phenomena.\"},{\"q\":\"How does v.21 prepare for the conclusion?\",\"a\":\"V.21 completes the essential/identity section. VV.22-24 will draw the conclusion: inherent production is impossible from EVERY angle (spatial, temporal, connectional, essential, identity). Therefore: all production is conventional, empty, dependent.\",\"deeper\":\"V.21 brings together the themes of the essential section (vv.16-21): the cause is empty of the effect (v.16), non-empty effects are permanent (v.17), empty effects are also stuck (v.18), identity/difference fails (vv.19-20), and now the effect itself can't be inherently existent or non-existent (v.21). The essential section has examined the NATURES of cause and effect from every angle and found inherent production impossible. VV.22-24 will deliver the chapter's conclusion.\"}],\"quiz\":{\"beginner\":{\"question\":\"What happens to production if the effect inherently exists or doesn't exist?\",\"options\":[\"A) Both work\",\"B) Inherently exists → nothing to produce (already there). Inherently doesn't exist → impossible to produce (can't bring non-existent thing into being). Both block production. Only conventional existence allows it.\",\"C) Only existence blocks\",\"D) Only non-existence blocks\"],\"correct\":\"B\",\"explanation\":\"Inherent existence → superfluous production. Inherent non-existence → impossible production. Conventional existence → conventional production works.\"},\"intermediate\":{\"question\":\"How does v.21 analyze the EFFECT's nature?\",\"options\":[\"A) Only the cause matters\",\"B) V.21 asks: does the effect inherently exist (nothing to produce) or inherently not-exist (impossible to produce)? Neither allows production. The effect must be CONVENTIONALLY existent — empty of inherent existence or non-existence.\",\"C) The effect always exists\",\"D) The effect never exists\"],\"correct\":\"B\",\"explanation\":\"Effect analyzed: inherent existence → no need. Inherent non-existence → impossible. Conventional existence → production works.\"},\"advanced\":{\"question\":\"How do QFT creation/annihilation operators parallel v.21?\",\"options\":[\"A) No parallel\",\"B) Particles: can be created (not inherently non-existent) and annihilated (not inherently existent). Their existence is conditional/conventional. V.21: effects neither inherently exist nor inherently don't exist. Both: conventional/conditional existence between the extremes of inherent existence and non-existence.\",\"C) QFT proves inherent existence\",\"D) Particles are permanent\"],\"correct\":\"B\",\"explanation\":\"Both: conditional existence. Neither inherently existent (permanent) nor inherently non-existent (impossible). Conventional existence allows creation and destruction.\"}},\"verseText\":\"If fruit existed essentially, what would a cause produce? If fruit did not exist essentially, what would a cause produce?\",\"madhyamakaConcept\":\"Phala svabhāvataḥ sat cet (if the effect exists essentially): kim hetu utpādayet (what would the cause produce?). Phala svabhāvataḥ asat cet (if the effect doesn't exist essentially): kim hetu utpādayet (what would the cause produce?). Neither inherent existence nor inherent non-existence of the effect allows for production.\",\"quantumPhysicsParallel\":\"Creation and annihilation operators in QFT: particles are created (from vacuum) and destroyed (back to vacuum). They don't inherently exist (can be destroyed) and don't inherently not-exist (can be created). Their existence is conditional/conventional. Like v.21: neither inherent existence nor inherent non-existence, but conventional arising.\"}},\"isShowcase\":false,\"chapterId\":20}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"11\"

176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":7,\"verseId\":34,\"chapterTitle\":\"Examination of Arising, Abiding, and Ceasing\",\"totalVerses\":34,\"verseData\":{\"id\":\"v7_34\",\"number\":34,\"title\":\"Like a Dream, Like an Illusion\",\"sanskrit\":{\"text\":\"svapnamāyāgandharvanagarābhān tathā utpādas tathā sthitiḥ | tathā bhaṅga udāhṛtaḥ ||\",\"transliteration\":\"svapnamāyāgandharvanagarābhān tathā utpādas tathā sthitiḥ | tathā bhaṅga udāhṛtaḥ\",\"translation\":\"Like a dream, like an illusion, Like a city of Gandharvas, So have arising, abiding, And ceasing been explained.\"},\"philosophy\":{\"insight\":\"The chapter's magnificent conclusion: arising, abiding, and ceasing are like dreams, illusions, and mirages. They APPEAR, they FUNCTION, they structure experience — but under analysis, they reveal no inherent substance. This is not nihilism but liberation: the world is real enough to navigate, empty enough to be free.\",\"madhyamaka\":\"The three similes (dream, illusion, mirage city) are classic Mādhyamika images for conventional-without-ultimate-reality. Dreams are experientially vivid but lack external substance. Illusions function (a magic show entertains) but aren't what they appear. A gandharva city is seen but can't be entered. Arising, abiding, and ceasing are exactly like these.\",\"quantum\":\"In quantum mechanics, particles are excitations of underlying fields — not solid \\\"things\\\" in the classical sense. They appear, interact, and disappear, but their substance dissolves under analysis into probability amplitudes and field fluctuations. The classical \\\"thing\\\" is as illusory as Nāgārjuna's dream.\",\"bridge\":\"Both Nāgārjuna and quantum physics arrive at a similar conclusion: what appears substantial dissolves under analysis. Particles become field excitations; matter becomes mostly empty space; arising, abiding, and ceasing become conventional designations. Appearance and reality diverge — but appearance still functions.\",\"accessible\":\"Characters in a vivid video game appear real, interact, and affect each other — but are ultimately just code and light. Nāgārjuna says arising, abiding, and ceasing are like this: conventionally functional but lacking the solid, independent substance we project onto them.\",\"twoTruths\":\"This verse IS the two truths in poetic form. Dreams, illusions, and mirages are CONVENTIONALLY REAL (experienced, functional) but ULTIMATELY EMPTY (lacking inherent substance). So too with the characteristics of conditioned existence.\",\"commonMisconception\":\"NOT saying the world is unreal or doesn't exist. Saying it's like a dream: experienced, vivid, consequential — but empty of the independent, solid substance we assume. The similes are about the MODE of existence, not its denial.\"},\"quantumResonance\":{\"concept\":\"Particles as Field Excitations\",\"score\":83,\"strength\":\"High\",\"explanation\":\"In QFT, what we call \\\"particles\\\" are excitations of underlying quantum fields — not independent, solid entities. They appear, interact, and disappear, but their apparent substantiality dissolves under analysis. This parallels Nāgārjuna's similes: conditioned phenomena appear real but lack inherent substance.\",\"caveat\":\"QFT fields are real physical entities with mathematical precision. Nāgārjuna's \\\"illusion\\\" is about the mode of existence, not about unreality. The parallel is about appearance vs. deeper analysis.\"},\"animation\":{\"visualBridge\":\"A beautiful landscape that, when zoomed into, reveals it's made of shimmering, translucent particles — real enough to experience, empty enough to see through. The dream simile made visual.\",\"educationalGoal\":\"User experiences the beauty of the conclusion: the world is dream-like — vivid, functional, but empty of the solidity we assume. Freedom, not nihilism.\"},\"deeperDive\":[{\"q\":\"What is a \\\"city of Gandharvas\\\"?\",\"a\":\"Gandharvas are celestial musicians in Hindu/Buddhist mythology. A \\\"gandharva city\\\" is a mirage — an illusory city seen in the distance, often in clouds or desert heat, appearing real but impossible to enter or inhabit. It's the Indian equivalent of \\\"a mirage in the desert.\\\"\",\"realLifeExample\":\"A rainbow: visible, beautiful, apparently \\\"there\\\" — but walk toward it and it recedes. You can't enter it or touch it. It appears without being solid.\"},{\"q\":\"Are arising, abiding, and ceasing unreal?\",\"a\":\"They are unreal INHERENTLY — lacking independent substance or essence. They are NOT unreal conventionally: they describe how dependently arisen phenomena appear and function. The similes emphasize the MODE of reality, not its denial. Dreams are experienced; illusions function; mirages are seen.\",\"realLifeExample\":\"A movie is \\\"not real\\\" in that the events didn't happen, but it's \\\"real\\\" in that it affects your emotions, takes up time, and costs money. It's real as experience while empty as substance.\"},{\"q\":\"How does \\\"like a dream\\\" differ from \\\"doesn't exist\\\"?\",\"a\":\"Dreams are EXPERIENCED — vivid, emotional, consequential (they affect your mood upon waking). But they lack external, independent substance. Nāgārjuna isn't saying the world doesn't exist; he's saying it exists LIKE A DREAM: experientially real, ultimately insubstantial.\",\"realLifeExample\":\"Music exists — it moves you, structures time, creates community. But try to grab a note. Try to weigh a melody. It's real as experience, empty as a \\\"thing.\\\"\"},{\"q\":\"How do particles as field excitations parallel this?\",\"a\":\"In QFT, particles aren't tiny solid balls — they're excitations (vibrations) of underlying quantum fields. They appear, interact, and disappear. Their apparent solidity dissolves under analysis into probability amplitudes. Nāgārjuna's insight is structurally similar: what appears solid is actually process.\",\"realLifeExample\":\"A wave on the ocean looks like a \\\"thing\\\" moving across the water. But it's actually just water moving up and down — the \\\"wave\\\" has no independent substance apart from the water.\"},{\"q\":\"Is this nihilism?\",\"a\":\"Absolutely not. Nihilism says nothing exists or matters. Nāgārjuna says everything exists CONVENTIONALLY and matters profoundly (karma, compassion, ethics all function). What's denied is only INHERENT existence — the projected solidity and independence. Emptiness ENABLES conventional reality, not negates it.\",\"realLifeExample\":\"Recognizing that money is \\\"just paper\\\" doesn't make you stop using it. The conventional functionality remains even when the illusion of inherent value is seen through.\"},{\"q\":\"What is the chapter's final message?\",\"a\":\"The defining characteristics of conditioned existence (arising, abiding, ceasing) are empty. Therefore conditioned things are empty. Therefore unconditioned things are empty. EVERYTHING is empty of inherent existence — and this emptiness is what allows the world to function, change, and evolve. Emptiness is not the enemy of reality but its deepest nature.\",\"deeper\":\"This verse's similes (dream, illusion, gandharva city) recur throughout Māhāyāna literature, becoming central to the Prajñāpāramitā sūtras and later Yogācāra thought. They represent the most positive face of śūnyatā: liberation through seeing through appearances.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does \\\"like a dream\\\" mean for arising, abiding, and ceasing?\",\"options\":[\"A) They don't exist at all\",\"B) They are experienced and functional but lack inherent, independent substance\",\"C) They only happen at night\",\"D) Dreams are the source of all reality\"],\"correct\":\"B\",\"explanation\":\"Like dreams, arising/abiding/ceasing are experienced and functional but lack independent substance. The simile is about the MODE of existence, not its denial.\"},\"intermediate\":{\"question\":\"Why isn't Nāgārjuna's conclusion nihilism?\",\"options\":[\"A) It is nihilism\",\"B) Because conventional existence, functionality, and ethics are preserved — only inherent existence is denied\",\"C) Because he believes in God\",\"D) Because dreams are real\"],\"correct\":\"B\",\"explanation\":\"Nihilism denies all existence and meaning. Nāgārjuna denies only INHERENT existence while preserving conventional reality — ethics, causation, and experience all function through emptiness.\"},\"advanced\":{\"question\":\"How does the QFT picture of \\\"particles as field excitations\\\" parallel Nāgārjuna's dream simile?\",\"options\":[\"A) Both say nothing exists\",\"B) Both reveal that what appears substantial (particles/conditioned things) dissolves under analysis into processes lacking independent solidity\",\"C) QFT proves particles are dreams\",\"D) The simile only applies to Buddhist phenomena\"],\"correct\":\"B\",\"explanation\":\"Both QFT and Nāgārjuna show that apparent substantiality dissolves under analysis. Particles become field excitations; conditioned things become empty processes. Appearance is real; inherent solidity is not.\"}},\"verseText\":\"Like a dream, like an illusion, Like a city of Gandharvas, So have arising, abiding, And ceasing been explained.\",\"madhyamakaConcept\":\"The three similes (dream, illusion, mirage city) are classic Mādhyamika images for conventional-without-ultimate-reality. Dreams are experientially vivid but lack external substance. Illusions function (a magic show entertains) but aren't what they appear. A gandharva city is seen but can't be entered. Arising, abiding, and ceasing are exactly like these.\",\"quantumPhysicsParallel\":\"In quantum mechanics, particles are excitations of underlying fields — not solid \\\"things\\\" in the classical sense. They appear, interact, and disappear, but their substance dissolves under analysis into probability amplitudes and field fluctuations. The classical \\\"thing\\\" is as illusory as Nāgārjuna's dream.\"}},\"isShowcase\":false,\"chapterId\":7}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Study the MMK with interactive verse exploration, research-mode tran

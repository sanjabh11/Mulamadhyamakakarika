176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":23,\"verseId\":9,\"chapterTitle\":\"Examination of Error\",\"totalVerses\":25,\"verseData\":{\"id\":\"v23_9\",\"number\":9,\"title\":\"How Can the Pleasant and Unpleasant Arise in Such Things?\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"How can the pleasant and the unpleasant arise in such things as these, which are like a city of gandharvas, like a mirage, like a dream?\"},\"philosophy\":{\"insight\":\"If sense objects are mirage-like (v.8), how can they INHERENTLY produce pleasant/unpleasant experiences? Mirages can't inherently generate real evaluations. The pleasant/unpleasant that arise from empty objects are themselves empty.\",\"madhyamaka\":\"Gandharva-nagara svapna marīci ādisu katham śubha aśubha utpadyete. If the basis is illusory, what arises from it is equally illusory.\",\"quantum\":\"If input data comes from a virtual process (like virtual particles), the \\\"measurement\\\" of that data is equally virtual. Virtual input → virtual output.\",\"bridge\":\"Both: illusory/virtual inputs produce illusory/virtual outputs. Empty basis → empty result.\",\"accessible\":\"Can a dream meal really nourish you? Can a mirage lake really quench thirst? If objects are dream-like, the pleasantness they produce is dream-like too.\",\"twoTruths\":\"Conventionally: we experience pleasant/unpleasant. Ultimately: these experiences are as illusory as their objects.\",\"commonMisconception\":\"NOT denying that experiences feel real. Dreams feel real too. The point: the MODE of existence is illusory, not that there's no experience.\"},\"quantumResonance\":{\"concept\":\"Virtual Input → Virtual Output\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"Virtual particle input → virtual measurement output. V.9: mirage-like objects → mirage-like evaluations. Both: the output inherits the status of the input.\",\"caveat\":\"Virtual particles are physics. V.9 is about evaluations.\"},\"animation\":{\"visualBridge\":\"A mirage lake — someone reaches for water and their hand passes through. Similarly, \\\"pleasant\\\" evaluations reach for mirage-objects and find nothing solid.\",\"educationalGoal\":\"Mirage-like objects can't produce inherently real evaluations.\"},\"deeperDive\":[{\"q\":\"Why can't mirages produce real pleasantness?\",\"a\":\"An inherent pleasant experience would require an inherent basis. But v.8 showed the basis is mirage-like. A mirage can't be an inherent cause of anything real.\",\"realLifeExample\":\"A photo of food can make you hungry (conventionally effective), but it can't inherently nourish you. The response inherits the status of the stimulus.\"},{\"q\":\"How does this deepen v.8?\",\"a\":\"V.8: objects are mirage-like. V.9: THEREFORE evaluations are mirage-like. The illusory status propagates from objects to evaluations to afflictions.\",\"realLifeExample\":\"If the ingredients are virtual, the cake is virtual, and the taste is virtual. Illusion propagates.\"},{\"q\":\"Does this mean pleasure is unreal?\",\"a\":\"Conventionally real, ultimately empty. Like dream-pleasure: genuinely experienced but not inherently real. V.9 targets inherent pleasantness, not conventional experience.\",\"realLifeExample\":\"Movie enjoyment is real (you laugh, cry) but the events aren't inherently real. Convention works.\"},{\"q\":\"Practical significance?\",\"a\":\"If pleasantness is mirage-like, attachment to it is grasping at mirages. This reduces attachment without denying experience.\",\"realLifeExample\":\"Enjoy a sunset knowing it's transient and mirage-like. Enjoyment without attachment.\"},{\"q\":\"Connection to the chain?\",\"a\":\"V.7: objects identified. V.8: objects are mirages. V.9: evaluations from mirages are mirages. Next: specific emptiness of objects and evaluations.\",\"realLifeExample\":\"Foundation → building → decoration: if foundation is illusory, everything above is too.\"},{\"q\":\"Significance?\",\"a\":\"V.9 extends the mirage analogy from objects to evaluations, ensuring emptiness propagates through the entire affliction-process.\",\"deeper\":\"V.9 is a crucial link: it ensures the mirage-like nature of objects (v.8) propagates to evaluations. Without v.9, one might argue: \\\"OK, objects are mirages, but the pleasant/unpleasant experience is REAL.\\\" V.9 blocks this: if the basis is a mirage, the experience arising from it is equally a mirage.\"}],\"quiz\":{\"beginner\":{\"question\":\"Can mirage-like objects produce inherently real evaluations?\",\"options\":[\"A) Yes\",\"B) No — if objects are mirage-like, evaluations arising from them are equally mirage-like. Empty basis → empty result.\",\"C) Sometimes\",\"D) Only physical\"],\"correct\":\"B\",\"explanation\":\"Mirage → mirage. The evaluations inherit the status of their objects.\"},\"intermediate\":{\"question\":\"Does v.9 deny pleasant experiences?\",\"options\":[\"A) Yes\",\"B) No — experiences are conventionally real (like dream-experiences). What's denied is INHERENT pleasantness. Convention works; inherent existence doesn't.\",\"C) Partially\",\"D) Only unpleasant\"],\"correct\":\"B\",\"explanation\":\"Conventionally real, ultimately empty. Mode of existence, not non-existence.\"},\"advanced\":{\"question\":\"Why is v.9 a crucial link in the argument?\",\"options\":[\"A) It isn't\",\"B) Without v.9, one might accept empty objects but claim real evaluations. V.9 blocks this by showing evaluations inherit the mirage-nature of their objects. Emptiness propagates completely.\",\"C) Only about objects\",\"D) Separate issue\"],\"correct\":\"B\",\"explanation\":\"Ensures emptiness propagates from objects through evaluations to afflictions. No inherent link escapes.\"}},\"verseText\":\"How can the pleasant and the unpleasant arise in such things as these, which are like a city of gandharvas, like a mirage, like a dream?\",\"madhyamakaConcept\":\"Gandharva-nagara svapna marīci ādisu katham śubha aśubha utpadyete. If the basis is illusory, what arises from it is equally illusory.\",\"quantumPhysicsParallel\":\"If input data comes from a virtual process (like virtual particles), the \\\"measurement\\\" of that data is equally virtual. Virtual input → virtual output.\"}},\"isShowcase\":false,\"chapterId\":23}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\

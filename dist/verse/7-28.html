176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":7,\"verseId\":28,\"chapterTitle\":\"Examination of Arising, Abiding, and Ceasing\",\"totalVerses\":34,\"verseData\":{\"id\":\"v7_28\",\"number\":28,\"title\":\"Stasis Cannot Cause Its Own Cessation\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Being static does not cease Through being static itself. Nor does being static cease Through another instance of being static.\"},\"philosophy\":{\"insight\":\"The state of stasis itself contains nothing that would cause its own end. And invoking another stasis to end the first is incoherent — stability reinforces stability, it doesn't destroy it. If stasis were inherent, things could never change.\",\"madhyamaka\":\"Stasis cannot cause its own cessation (self-contradiction: stability destroying stability) nor be ended by another stasis (which would reinforce, not end, the first). This parallels the analysis of arising and shows the universal applicability of the emptiness argument.\",\"quantum\":\"In thermodynamics, a system in equilibrium will remain there unless disturbed by an external non-equilibrium force. Equilibrium doesn't spontaneously break itself. Similarly, inherent stasis contains no mechanism for its own cessation.\",\"bridge\":\"Both thermodynamic equilibrium and Nāgārjuna's stasis require external perturbation to change state. Self-disruption of a stable state is as thermodynamically paradoxical as it is philosophically contradictory.\",\"accessible\":\"Can \\\"stillness\\\" make itself stop being still? No — that's a contradiction. Can another \\\"stillness\\\" make the first one stop? More stillness just reinforces stillness! Neither route works.\",\"twoTruths\":\"Conventionally, stable states end when conditions change (a balanced rock falls when eroded). Inherent stasis, lacking dependence on conditions, would be eternal — and therefore could never cease.\",\"commonMisconception\":\"NOT saying things can't stop being stable. Saying INHERENT stasis (stability that exists independently of conditions) could never cease — which contradicts experience. Therefore, stasis is not inherent.\"},\"quantumResonance\":{\"concept\":\"Thermodynamic Equilibrium\",\"score\":68,\"strength\":\"Medium\",\"explanation\":\"Systems in thermodynamic equilibrium remain stable unless externally perturbed. Equilibrium doesn't spontaneously break itself. This parallels Nāgārjuna's point: inherent stasis contains no mechanism for its own cessation.\",\"caveat\":\"Thermodynamic equilibrium is a well-defined physical concept. The parallel is about the self-sustaining nature of stable states, not about Buddhist metaphysics.\"},\"animation\":{\"visualBridge\":\"A perfectly still sphere that cannot be moved by \\\"more stillness\\\" — only an external force (conditions) can disturb it.\",\"educationalGoal\":\"User understands that stability contains no self-disrupting mechanism, so inherent stasis could never cease.\"},\"deeperDive\":[{\"q\":\"Why can't stasis cease through itself?\",\"a\":\"Stasis IS stability. Asking stability to produce instability is a contradiction — like asking dryness to produce wetness. The nature of stasis contains nothing that would cause its own end.\",\"realLifeExample\":\"A locked safe doesn't unlock itself. The locking mechanism is designed to maintain the locked state, not to open.\"},{\"q\":\"Why can't another stasis end the first?\",\"a\":\"Another instance of stasis would reinforce stability, not undermine it. Adding more stillness to stillness produces more stillness, not movement. Furthermore, invoking a second stasis leads to infinite regress.\",\"realLifeExample\":\"Putting a sleeping person next to another sleeping person doesn't wake either of them up. More sleep doesn't produce wakefulness.\"},{\"q\":\"What would happen if stasis were truly inherent?\",\"a\":\"If stasis were an inherent, essential property of a thing (not dependent on conditions), the thing could NEVER change or cease. It would be eternally frozen. Since things DO change, stasis cannot be inherent.\",\"realLifeExample\":\"If a mountain's permanence were truly inherent (not condition-dependent), mountains could never erode. But they do — proving their stability depends on conditions.\"},{\"q\":\"How does thermodynamic equilibrium illustrate this?\",\"a\":\"A system in thermal equilibrium maintains its state indefinitely unless an external perturbation occurs. The equilibrium itself contains no mechanism for self-disruption. Similarly, inherent stasis would be self-perpetuating with no internal trigger for cessation.\",\"realLifeExample\":\"A ball at the bottom of a valley stays there forever unless something pushes it. The stable position itself provides no energy for escape.\"},{\"q\":\"How does this verse fit into the chapter's argument?\",\"a\":\"V.25 showed stasis can't self-sustain or be sustained by another stasis. V.28 shows stasis can't cease through itself or another stasis. Together they prove: inherent stasis can neither maintain itself coherently NOR cease coherently. It's empty in both directions.\",\"realLifeExample\":\"A character in a story who can neither live nor die — neither option works, proving the character isn't real.\"},{\"q\":\"What is the final implication?\",\"a\":\"Conventional stasis (persistence through conditions) works perfectly. Inherent stasis (persistence through own-nature) cannot be established, cannot be sustained, and cannot cease. It fails in every respect, proving abiding is empty.\",\"deeper\":\"This completes the analysis of sthiti (abiding), paralleling the complete dismantling of utpāda (arising) in vv.1-12. The chapter moves next to cessation itself (vv.29-32).\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can't stasis cause its own cessation?\",\"options\":[\"A) It can — things stop being stable all the time\",\"B) Stasis (stability) producing instability is self-contradictory\",\"C) Stasis is too weak\",\"D) Only arising can cause cessation\"],\"correct\":\"B\",\"explanation\":\"Stability producing instability through its own nature is a contradiction — like dryness producing wetness.\"},\"intermediate\":{\"question\":\"What happens if stasis were truly inherent (not condition-dependent)?\",\"options\":[\"A) Things would be more stable\",\"B) Things could never change or cease — they would be eternally frozen\",\"C) Things would cease faster\",\"D) There would be no effect\"],\"correct\":\"B\",\"explanation\":\"Inherent stasis, independent of conditions, would have no mechanism for cessation. The thing would be permanently, unchangeably stable.\"},\"advanced\":{\"question\":\"How do verses 25 and 28 together demonstrate the emptiness of abiding?\",\"options\":[\"A) They only address arising\",\"B) V.25 shows inherent stasis can't be sustained; V.28 shows it can't cease — together proving it fails in every respect\",\"C) They prove stasis is real\",\"D) They only address cessation\"],\"correct\":\"B\",\"explanation\":\"Inherent stasis can neither maintain itself (v.25) nor cease (v.28). It fails both as self-sustaining and as something that can end, proving it's empty.\"}},\"verseText\":\"Being static does not cease Through being static itself. Nor does being static cease Through another instance of being static.\",\"madhyamakaConcept\":\"Stasis cannot cause its own cessation (self-contradiction: stability destroying stability) nor be ended by another stasis (which would reinforce, not end, the first). This parallels the analysis of arising and shows the universal applicability of the emptiness argument.\",\"quantumPhysicsParallel\":\"In thermodynamics, a system in equilibrium will remain there unless disturbed by an external non-equilibrium force. Equilibrium doesn't spontaneously break itself. Similarly, inherent stasis contains no mechanism for its own cessation.\"}},\"isShowcase\":false,\"chapterId\":7}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Study the MMK with interactive verse exploration, research-mode transparency, and carefully caveated quantum analogies.\"}]],\"error\":nul

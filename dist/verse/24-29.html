88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":24,\"verseId\":29,\"chapterTitle\":\"Examination of the Noble Truths\",\"totalVerses\":40,\"verseData\":{\"id\":\"v24_29\",\"number\":29,\"title\":\"If Suffering, Origin, and Cessation Did Not Exist, What Path Would Lead to Cessation?\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"When suffering, its origin, and its cessation do not exist, what path to the cessation of suffering could one seek to pursue?\"},\"philosophy\":{\"insight\":\"SYNTHESIS: if the first three truths are destroyed (vv.21-27), the fourth (path) has no PURPOSE. A path to nowhere is no path. The opponent's position (inherent existence) destroys all four truths and their interconnections.\",\"madhyamaka\":\"Duḥkha samudaya nirodha na santi cet, duḥkha-nirodha-gāmī mārga kam abhiprepsyate. If the destination (cessation) doesn't exist, the path to it is meaningless.\",\"quantum\":\"If there's no observable to measure (no state to transition to, no correlation to detect), the experimental apparatus is purposeless.\",\"bridge\":\"Both: without the goal, the method is meaningless. QM: no observable → no experiment. V.29: no cessation → no path.\",\"accessible\":\"If there's no cure possible, there's no point in treatment. If cessation is impossible, the path is purposeless.\",\"twoTruths\":\"The four truths form an interconnected system. Destroying any one cascades to the others. Inherent existence destroys all four.\",\"commonMisconception\":\"NOT saying the truths are disconnected. They're a SYSTEM. The opponent's position destroys the system.\"},\"quantumResonance\":{\"concept\":\"No Goal → No Method\",\"score\":48,\"strength\":\"Medium\",\"explanation\":\"No observable → no experiment. No cessation → no path. Both: the method requires the goal.\",\"caveat\":\"Experimental goals vs. spiritual goals.\"},\"animation\":{\"visualBridge\":\"A path leading to... nothing (cessation destroyed). The path dissolves. Caption: \\\"Without the destination, the journey is meaningless.\\\"\",\"educationalGoal\":\"The four truths form a system. Destroying one destroys all.\"},\"deeperDive\":[{\"q\":\"How do the four truths form a system?\",\"a\":\"Suffering (what's wrong) → Origin (why) → Cessation (the goal) → Path (how). Each depends on the others. Removing any one makes the system incoherent.\",\"realLifeExample\":\"Diagnosis → Cause → Cure → Treatment. Remove any step and the medical process collapses.\"},{\"q\":\"Why does destroying three truths destroy the fourth?\",\"a\":\"The path is a path TO cessation FROM suffering THROUGH removing its origin. Without suffering (no problem), origin (no cause), or cessation (no goal), the path has no purpose.\",\"realLifeExample\":\"A road to nowhere is not a road. A treatment for no disease is not medicine.\"},{\"q\":\"Is the opponent aware of this?\",\"a\":\"The opponent WANTED to protect the four truths from emptiness. V.29 shows that their OWN position destroys the truths more thoroughly than emptiness ever could.\",\"realLifeExample\":\"The bodyguard accidentally destroys what they're protecting. The opponent's \\\"protection\\\" (inherent existence) is the real threat.\"},{\"q\":\"How does emptiness preserve the system?\",\"a\":\"Empty truths form a coherent system: empty suffering arises (First) from empty causes (Second), can cease (Third) through an empty path (Fourth). All empty, all functional, all interconnected.\",\"realLifeExample\":\"Conventional money forms a coherent economy: prices, wages, debts, investments. All conventional, all functional, all interconnected.\"},{\"q\":\"Significance?\",\"a\":\"V.29 shows the SYSTEMIC failure of inherent existence. Not just individual truths but their INTERCONNECTION is destroyed.\",\"realLifeExample\":\"Not just individual parts failing but the whole machine breaking down.\"},{\"q\":\"What comes next?\",\"a\":\"Having defended the Noble Truths (vv.20-29), Nāgārjuna will defend the remaining accusations: fruits, practitioners, Three Jewels, and worldly conventions.\",\"deeper\":\"V.29 completes the defense of the Four Noble Truths as a SYSTEM. The opponent's position doesn't just damage individual truths but destroys their interconnection. This systemic failure is more devastating than individual failures because Buddhism operates as a coherent system, not a collection of separate doctrines.\"}],\"quiz\":{\"beginner\":{\"question\":\"What happens to the path if the other three truths are destroyed?\",\"options\":[\"A) Still works\",\"B) Becomes purposeless — a path to nowhere. Without suffering, origin, and cessation, the path has no function. The system collapses.\",\"C) Partially works\",\"D) Adapts\"],\"correct\":\"B\",\"explanation\":\"No destination → no journey. The four truths form an interdependent system.\"},\"intermediate\":{\"question\":\"How do the four truths form a system?\",\"options\":[\"A) Independent\",\"B) Suffering → Origin → Cessation → Path. Each depends on the others. Removing any one makes the system incoherent. Inherent existence removes all.\",\"C) Only two connected\",\"D) Parallel\"],\"correct\":\"B\",\"explanation\":\"Interdependent system. Remove one → all collapse. Inherent existence removes all.\"},\"advanced\":{\"question\":\"Why is systemic failure worse than individual failure?\",\"options\":[\"A) Not worse\",\"B) Individual failures might be repaired. But systemic failure means the entire framework is incoherent — no piece works because all depend on each other. Total collapse.\",\"C) Same impact\",\"D) Individual is worse\"],\"correct\":\"B\",\"explanation\":\"Systemic collapse is total. The interconnected framework fails entirely.\"}},\"verseText\":\"When suffering, its origin, and its cessation do not exist, what path to the cessation of suffering could one seek to pursue?\",\"madhyamakaConcept\":\"Duḥkha samudaya nirodha na santi cet, duḥkha-nirodha-gāmī mārga kam abhiprepsyate. If the destination (cessation) doesn't exist, the path to it is meaningless.\",\"quantumPhysicsParallel\":\"If there's no observable to measure (no state to transition to, no correlation to detect), the experimental apparatus is purposeless.\"}},\"isShowcase\":false,\"chapterId\":24}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summar

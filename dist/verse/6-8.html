c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":6,\"verseId\":8,\"chapterTitle\":\"Examination of Desire and the Desirous\",\"totalVerses\":10,\"verseData\":{\"id\":\"v6_8\",\"number\":8,\"title\":\"The Opponent's Self-Contradiction\",\"sanskrit\":{\"text\":\"pṛthaktvam asiddhaṃ ced api sahabhāvaṃ prabhāṣase | sahabhāvasya siddhy artham pṛthaktvam api vā bravīṣi ||\",\"transliteration\":\"pṛthaktvam asiddhaṃ ced api sahabhāvaṃ prabhāṣase | sahabhāvasya siddhy artham pṛthaktvam api vā bravīṣi\",\"translation\":\"Since difference is not established, if you assert that they are simultaneous, since they are established as simultaneous, do you also assert that they are different?\"},\"philosophy\":{\"insight\":\"The definitive logical trap: the opponent needs difference for simultaneity (v.4), but can't establish difference (v.6). So they assert simultaneity anyway. But Nāgārjuna asks: are you then asserting difference just BECAUSE you asserted simultaneity? This is circular: simultaneity → needs difference → asserted because of simultaneity → needs difference → ... The whole reasoning is a vicious circle with no independent foundation.\",\"madhyamaka\":\"Garfield: this is the formal exposure of circularity (anyonyāśraya-doṣa = fault of mutual dependence of premises). The opponent's argument depends on two claims: (A) they are simultaneous, and (B) they are different. A requires B (simultaneity requires difference, v.4). B requires A (difference is asserted to make simultaneity work). Neither A nor B has independent support — each depends on the other. This is a textbook logical fallacy. Siderits/Katsura: the \\\"api vā\\\" (or also) is sarcastic — \\\"do you ALSO claim difference, just to prop up your simultaneity claim?\\\" Candrakīrti: the opponent has been caught in a self-referential trap from which there is no escape within the framework of inherent existence.\",\"quantum\":\"The Incompleteness of Hidden Variable Arguments: Hidden variable theories try to explain quantum correlations by assuming pre-existing (inherent) properties. But Bell's theorem shows this leads to contradictions — the assumed hidden variables can't reproduce the observed correlations without violating other assumptions (locality, realism). The hidden variable framework is internally inconsistent, just as the opponent's inherent existence framework is internally inconsistent. Both frameworks defeat themselves.\",\"bridge\":\"Both expose internal inconsistency in frameworks that assume independent, pre-existing properties. Nāgārjuna: the opponent's claims of simultaneity and difference are mutually circular. Bell: hidden variable theories' claims of pre-existing properties and local realism are mutually contradictory. Both frameworks collapse under their own logic.\",\"accessible\":\"It's like saying \\\"I can fly because I have wings, and I have wings because I can fly.\\\" Neither claim has independent support — each depends on the other. The opponent says \\\"they're simultaneous because they're different, and they're different because... well, they're simultaneous.\\\" Circular.\",\"twoTruths\":\"Conventionally, we can say desire and the desirous one are both different and simultaneous — these are useful conventional descriptions. Ultimately, grounding BOTH claims in inherent existence creates a vicious circle. Conventional truth escapes the circle; inherent existence cannot.\",\"commonMisconception\":\"NOT saying we can't describe desire and the desirous one as both different and simultaneous. Saying we can't ground BOTH descriptions in INHERENT EXISTENCE without circularity. Conventional description is fine; inherent grounding is not.\"},\"quantumResonance\":{\"concept\":\"Hidden Variable Inconsistency (Bell's Theorem)\",\"score\":82,\"strength\":\"Moderate-High\",\"explanation\":\"Hidden variable theories assume pre-existing properties to explain correlations, but Bell proves this assumption contradicts the observed correlations. Internal inconsistency parallels the opponent's circular reasoning.\",\"caveat\":\"Bell's theorem is about mathematical inequalities; Nāgārjuna's argument is about logical circularity. Both identify self-defeating frameworks, but through different mechanisms.\"},\"animation\":{\"geometry\":\"Vicious Circle — Circular Reasoning Exposed\",\"anchor\":\"Two cards: \\\"SIMULTANEOUS\\\" and \\\"DIFFERENT.\\\" An arrow points from Simultaneous to Different (needs difference). Another arrow points from Different to Simultaneous (asserted for simultaneity). They form a circle. Neither has a foundation outside the other. The circle spins faster and faster, then collapses.\",\"texture\":\"Cards: White with red-orange text. Arrows: Purple, directional. Circle: The arrows form a closed loop. Collapse: Everything dissolves to reveal \\\"No independent foundation.\\\"\",\"mood\":\"Logical trap → spinning faster → collapse → clarity\",\"colors\":[\"#EF4444\",\"#F59E0B\",\"#8B5CF6\",\"#0F172A\"],\"orchestration\":{\"start\":\"Two cards with arrows forming a circle.\",\"click\":\"Click to start the reasoning: \\\"Simultaneous? → Need difference. Different? → Why? Because simultaneous.\\\" Circle spins faster.\",\"reveal\":\"Circle collapses. Text: \\\"Vicious circle — neither claim has independent support. The framework of inherent existence defeats itself.\\\"\"},\"interaction\":{\"click\":\"Click to follow the circular reasoning — watch it accelerate and collapse\",\"drag\":\"Rotate the scene\",\"hover\":\"Hover over cards: \\\"Simultaneity\\\" / \\\"Difference.\\\" Hover over arrows: \\\"Requires\\\" / \\\"Asserted because of.\\\"\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.3},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true,\"autoRevealToggle\":true},\"r3fTechniques\":[\"drei Text/HTML for reasoning cards\",\"Animated arrow lines forming circle\",\"Rotation animation for spinning circle\",\"Particle dissolution for collapse\",\"Bloom for emphasis\",\"useSpring for all transitions\"],\"camera\":{\"position\":[0,2,8],\"fov\":50,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c200MB memory, 60 FPS. Text cards + arrow lines + rotation animation.\",\"visualBridge\":\"The circular arrows and collapsing loop encode the vicious circle: simultaneity requires difference, difference is asserted for simultaneity, neither has independent support.\",\"educationalGoal\":\"User follows the circular reasoning, sees it accelerate, and watches it collapse — viscerally understanding why the opponent's framework is self-defeating.\"},\"deeperDive\":[{\"q\":\"What exactly is the vicious circle?\",\"a\":\"Claim A: They are simultaneous. Claim B: They are (inherently) different. A requires B (simultaneity needs two distinct things, v.4). B requires A (difference is asserted to make simultaneity work, v.6). A depends on B, and B depends on A. Neither has independent support. This is anyonyāśraya-doṣa — the fault of mutual dependence of premises — a recognised logical fallacy in Indian logic.\",\"realLifeExample\":\"\\\"Why do you trust this news source?\\\" \\\"Because it's accurate.\\\" \\\"How do you know it's accurate?\\\" \\\"Because I trust it.\\\" No independent verification — each claim props up the other.\"},{\"q\":\"How does Bell's theorem expose a similar inconsistency?\",\"a\":\"Hidden variable theories assume: (1) particles have pre-existing properties (realism), and (2) measurements don't influence distant particles (locality). Bell proved that IF both assumptions are true, correlations must satisfy a mathematical inequality. But observed correlations VIOLATE the inequality. So assumptions (1) and (2) are mutually inconsistent — at least one must be false. Like the opponent's position, the framework defeats itself.\",\"realLifeExample\":\"A company claims (1) all products are organic AND (2) prices are lower than competitors. Turns out organic products cost more, so (1) and (2) can't both be true. The claims are internally inconsistent.\"},{\"q\":\"Is this a formal logical fallacy?\",\"a\":\"Yes. It's called \\\"anyonyāśraya-doṣa\\\" in Indian logic — the fault of mutual dependence. In Western logic, it's a combination of circular reasoning (petitio principii) and self-referential inconsistency. The premises support each other but have no external foundation. It's one of the most damning logical criticisms because it shows the entire framework lacks grounding.\",\"deeper\":\"Garfield: anyonyāśraya-doṣa (mutual dependence fault) is distinct from anyonyāśraya (mutual dependence of phenomena). The FIRST is a logical fallacy; the SECOND is the reality that Nāgārjuna affirms. Mutual dependence of PREMISES is bad logic; mutual dependence of PHENOMENA is how reality works.\"},{\"q\":\"Can the opponent escape by adding a third premise?\",\"a\":\"Not easily. Any third premise that tries to independently ground either simultaneity or difference faces the same challenges: it must either assume what needs proving (another circle) or introduce a new term that itself requires grounding (infinite regress). The opponent is trapped. Within the framework of inherent existence, there's no way out.\",\"realLifeExample\":\"Adding a third witness to vouch for two lying witnesses doesn't help if the third witness only knows what the first two told them. You need INDEPENDENT evidence — and the inherent existence framework can't provide it.\"},{\"q\":\"What does this mean for the inherent existence framework overall?\",\"a\":\"This is a decisive blow. If the framework of inherent existence can't even describe the relationship between desire and the desirous one without circularity, it's fundamentally inadequate. And as v.10 will show, this isn't specific to desire — the same problem applies to ALL subject-attribute relationships. The framework of inherent existence is universally self-defeating.\",\"realLifeExample\":\"If a map can't correctly locate your own house, it's unreliable for everything. If the inherent existence framework can't describe desire/desirous without circularity, it's unreliable for ALL phenomena.\"},{\"q\":\"How does this connect to v.9's conclusion?\",\"a\":\"V.8 shows the opponent's framework is circular. V.9 delivers the final blow: since neither difference nor simultaneity can be independently established, the opponent can't even IDENTIFY the things they claim are simultaneous. It's not just that the reasoning is circular — the very entities being discussed are undefined. This sets up v.10's generalisation.\",\"realLifeExample\":\"First the detective shows the alibi is self-contradictory (v.8). Then shows the suspect can't even be identified (v.9). Then concludes the same problem applies to all suspects (v.10).\"}],\"quiz\":{\"beginner\":{\"question\":\"What is the opponent's logical error?\",\"options\":[\"A) They made an arithmetic mistake\",\"B) Their reasoning is circular: simultaneity needs difference, and difference is asserted to justify simultaneity — neither has independent support\",\"C) They used the wrong translation\",\"D) They forgot a premise\"],\"correct\":\"B\",\"explanation\":\"The opponent's claims of simultaneity and difference each depend on the other. Neither has independent grounding. This is a vicious circle (anyonyāśraya-doṣa).\"},\"intermediate\":{\"question\":\"How does Bell's theorem expose a similar kind of self-defeating framework?\",\"options\":[\"A) Bell proves hidden variables\",\"B) Bell shows that hidden variable assumptions (realism + locality) are mutually inconsistent — the framework defeats itself, just as the opponent's inherent existence assumptions are circular\",\"C) Bell supports the opponent\",\"D) Bell is about different physics\"],\"correct\":\"B\",\"explanation\":\"Bell's theorem exposes internal inconsistency in hidden variable theories. The opponent's position is similarly internally inconsistent — both frameworks defeat themselves.\"},\"advanced\":{\"question\":\"What is the distinction between anyonyāśraya-doṣa and anyonyāśraya?\",\"options\":[\"A) They're the same thing\",\"B) Anyonyāśraya-doṣa (mutual dependence FAULT) is a logical fallacy in reasoning. Anyonyāśraya (mutual dependence) is the reality of how phenomena exist. Bad logic vs. accurate description of reality.\",\"C) Neither is relevant\",\"D) Both are logical fallacies\"],\"correct\":\"B\",\"explanation\":\"Mutual dependence of PREMISES is a logical fallacy (the opponent's error). Mutual dependence of PHENOMENA is how reality actually works (Nāgārjuna's position). The opponent commits the fallacy; Nāgārjuna describes reality.\"}},\"verseText\":\"Since difference is not established, if you assert that they are simultaneous, since they are established as simultaneous, do you also assert that they are different?\",\"madhyamakaConcept\":\"Garfield: this is the formal exposure of circularity (anyonyāśraya-doṣa = fault of mutual dependence of premises). The opponent's argument depends on two claims: (A) they are simultaneous, and (B) they are different. A requires B (simultaneity requires difference, v.4). B requires A (difference is asserted to make simultaneity work). Neither A nor B has independent support — each depends on the other. This is a textbook logical fallacy. Siderits/Katsura: the \\\"api vā\\\" (or also) is sarcastic — \\\"do you ALSO claim difference, just to prop up your simultaneity claim?\\\" Candrakīrti: the opponent has been caught in a self-referential trap from which there is no escape within the framework of inherent existence.\",\"quantumPhysicsParallel\":\"The Incompleteness of Hidden Variable Arguments: Hidden variable theories try to explain quantum correlations by assuming pre-existing (inherent) properties. But Bell's theorem shows this leads to contradictions — the assumed hidden variables can't reproduce the observed correlations without violating other assumptions (locality, realism). The hidden variable framework is internally inconsistent, just as the opponent's inherent existence framework is internally inconsistent. Both frameworks defeat themselves.\"}},\"isShowcase\":false,\"chapterId\":6}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_l

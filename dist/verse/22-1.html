176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":22,\"verseId\":1,\"chapterTitle\":\"Examination of the Tathāgata\",\"totalVerses\":16,\"verseData\":{\"id\":\"v22_1\",\"number\":1,\"title\":\"The Fivefold Analysis — The Tathāgata Cannot Be Found\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Neither the aggregates, nor different from the aggregates, the aggregates are not in him, nor is he in the aggregates. The Tathāgata does not possess the aggregates. What is the Tathāgata?\"},\"philosophy\":{\"insight\":\"The FIVEFOLD ANALYSIS: (1) Not identical to aggregates. (2) Not different. (3) Aggregates not in him. (4) He not in aggregates. (5) Doesn't possess them. ALL five fail → the Tathāgata cannot be found as an inherently existing entity.\",\"madhyamaka\":\"Na skandha na skandha-anyaḥ. Skandhā na tasmin na sa teṣu. Na skandha-vān. Kaḥ Tathāgataḥ? The pañca-vidhā parīkṣā exhausts all possible inherent relations.\",\"quantum\":\"Relational QM: a quantum system has no definite intrinsic properties independent of interactions. You can't find the \\\"inherent electron\\\" by checking its relation to spin, charge, etc. Properties are relational.\",\"bridge\":\"Both RQM and v.1: searching for an inherent entity through property-relations fails. Identity is relational, not inherent.\",\"accessible\":\"Is a song its notes? No. Separate from notes? No. None of the five captures what a song IS. It's a dependent arising.\",\"twoTruths\":\"Conventionally: the Tathāgata exists as a person. Ultimately: cannot be found as inherent through any of the five relations.\",\"commonMisconception\":\"NOT saying the Buddha doesn't exist. He exists CONVENTIONALLY. Unfindability ≠ non-existence.\"},\"quantumResonance\":{\"concept\":\"Relational Quantum Mechanics — No Intrinsic Properties\",\"score\":65,\"strength\":\"Medium-High\",\"explanation\":\"RQM: no intrinsic properties independent of interactions. V.1: no inherent Tathāgata findable through fivefold analysis. Both: identity is relational.\",\"caveat\":\"RQM is physics interpretation. V.1 is personal identity. Structural parallel.\"},\"animation\":{\"visualBridge\":\"Five search beams scanning a figure — each returns \\\"Not Found.\\\" The figure shimmers: conventionally present, analytically unfindable.\",\"educationalGoal\":\"The fivefold analysis exhausts all inherent relations. The Tathāgata is conventionally present but inherently unfindable.\"},\"deeperDive\":[{\"q\":\"What is the fivefold analysis?\",\"a\":\"Five possible inherent relations between self and components: identity, difference, dependence, reverse dependence, possession. If none works, the self can't be found inherently.\",\"realLifeExample\":\"Is a car its parts? Different from parts? Contains parts? None captures an \\\"inherent car.\\\"\"},{\"q\":\"Why not identical to aggregates?\",\"a\":\"He'd be impermanent, multiple (five aggregates), and subject to suffering — contradicting tathāgathood.\",\"realLifeExample\":\"If you ARE your body, when it ages, \\\"you\\\" literally change. Identity with components doesn't capture the person.\"},{\"q\":\"Why not different from aggregates?\",\"a\":\"Completely separate → no characteristics (all come through aggregates). A characterless Buddha is inconceivable.\",\"realLifeExample\":\"A driver separate from all vehicles is just a person standing — not a \\\"driver.\\\"\"},{\"q\":\"Why do containment and possession fail?\",\"a\":\"Both presuppose a prior distinction between container/contained or owner/owned — presupposing what needs to be proved.\",\"realLifeExample\":\"\\\"The car contains the engine\\\" presupposes the car exists separately from the engine — circular.\"},{\"q\":\"How does RQM illustrate this?\",\"a\":\"A particle has no intrinsic spin/position/momentum — only relative to an observer. You can't find the \\\"inherent electron\\\" by analyzing properties.\",\"realLifeExample\":\"\\\"What IS this electron?\\\" without \\\"relative to what?\\\" is meaningless in RQM.\"},{\"q\":\"What is the significance?\",\"a\":\"V.1 establishes the method and conclusion. If even the BUDDHA is unfindable inherently, NO being can be found inherently.\",\"deeper\":\"The analysis that deconstructs personal identity also deconstructs the highest spiritual identity. All beings share the same ultimate nature — emptiness.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does the fivefold analysis show?\",\"options\":[\"A) Buddha inherently exists\",\"B) The Tathāgata cannot be found as inherently existing through any of five relations. Conventionally real, inherently unfindable.\",\"C) Buddha is the aggregates\",\"D) Buddha is separate\"],\"correct\":\"B\",\"explanation\":\"Five relations tested, all fail. Conventionally real, inherently unfindable.\"},\"intermediate\":{\"question\":\"Why does both identity AND difference fail?\",\"options\":[\"A) Only one fails\",\"B) Identity → impermanent. Difference → characterless. Both absurd when applied inherently.\",\"C) They don't fail\",\"D) Only identity fails\"],\"correct\":\"B\",\"explanation\":\"Identity = mundane. Difference = inconceivable. Neither works.\"},\"advanced\":{\"question\":\"How does RQM parallel fivefold analysis?\",\"options\":[\"A) No parallel\",\"B) RQM: no intrinsic properties independent of interactions. V.1: no inherent identity through aggregate-relations. Both: identity is relational, not intrinsic.\",\"C) RQM supports inherent properties\",\"D) Different frameworks\"],\"correct\":\"B\",\"explanation\":\"Both deny inherent findability. Properties/identity are relational.\"}},\"verseText\":\"Neither the aggregates, nor different from the aggregates, the aggregates are not in him, nor is he in the aggregates. The Tathāgata does not possess the aggregates. What is the Tathāgata?\",\"madhyamakaConcept\":\"Na skandha na skandha-anyaḥ. Skandhā na tasmin na sa teṣu. Na skandha-vān. Kaḥ Tathāgataḥ? The pañca-vidhā parīkṣā exhausts all possible inherent relations.\",\"quantumPhysicsParallel\":\"Relational QM: a quantum system has no definite intrinsic properties independent of interactions. You can't find the \\\"inherent electron\\\" by checking its relation to spin, charge, etc. Properties are relational.\"}},\"isShowcase\":false,\"chapterId\":22}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",

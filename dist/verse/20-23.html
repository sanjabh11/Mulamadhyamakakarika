88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":20,\"verseId\":23,\"chapterTitle\":\"Examination of Cause and Effect (Saṃbhava)\",\"totalVerses\":24,\"verseData\":{\"id\":\"v20_23\",\"number\":23,\"title\":\"The Combination Cannot Produce Itself — How Can It Produce Effects?\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If whatever is a combination of causes and conditions does not produce itself by itself, how could it produce fruit?\"},\"philosophy\":{\"insight\":\"Targeting the \\\"combination\\\" (sāmagrī) directly: if the combination of causes and conditions can't even produce ITSELF (its own existence isn't self-generated), how can it produce something ELSE (the effect)? The combination is itself dependently arisen — it doesn't self-generate. If it can't account for its own existence, it can't account for producing effects.\",\"madhyamaka\":\"Sāmagrī svayam svayam na utpādayati cet (if the combination doesn't produce itself by itself), katham phala utpādayet (how could it produce fruit?). The sāmagrī (combination) is itself dependently arisen — it depends on its components. It has no inherent productive power because it has no inherent existence.\",\"quantum\":\"Emergence in complex systems: new properties emerge from interactions between components, but no single component or the collection itself \\\"produces\\\" the emergent property inherently. Emergence is a relational, contextual process — not inherent self-production of the system.\",\"bridge\":\"Both emergence and v.23 show that combinations don't inherently produce. QM/complexity: emergent properties arise from interactions, not from the combination \\\"producing itself.\\\" V.23: the combination can't produce itself, so how can it produce effects? Both: production is processual, not inherent.\",\"accessible\":\"A team of musicians doesn't \\\"produce itself\\\" — each musician brings their instrument. The ensemble exists because of its members. If the team can't even explain its own existence (it depends on members), how can it claim to inherently produce music? The music arises conventionally from the collaboration.\",\"twoTruths\":\"Conventionally: combinations DO produce effects (ingredients → cake). Ultimately: the combination itself is dependently arisen and empty. It has no inherent productive power. Conventional production through empty combinations.\",\"commonMisconception\":\"NOT saying combinations don't conventionally produce effects. Flour + eggs + sugar → cake. V.23 denies INHERENT production: the combination doesn't have inherent power because it doesn't inherently exist itself.\"},\"quantumResonance\":{\"concept\":\"Emergence — Properties Arising from Interactions, Not Self-Production\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"Emergence: new properties arise from component interactions, not from the system \\\"producing itself.\\\" V.23: the combination can't produce itself → can't inherently produce effects. Both: production through process/interaction, not inherent self-generation.\",\"caveat\":\"Emergence is a complex systems concept. V.23 is about inherent self-production. The parallel is about the impossibility of inherent self-generation in collections.\"},\"animation\":{\"visualBridge\":\"A collection of components forming a \\\"combination\\\" — but the combination itself is just the components together, not a new self-producing entity. It can't \\\"produce itself\\\" — it depends on its parts. Caption: \\\"Can't self-produce → can't inherently produce effects.\\\"\",\"educationalGoal\":\"User sees: the combination is itself dependent (on its components) and can't self-generate. Without inherent self-existence, it has no inherent productive power.\"},\"deeperDive\":[{\"q\":\"Why can't the combination produce itself?\",\"a\":\"The combination depends on its components (causes and conditions coming together). It doesn't generate its own existence — it's assembled from parts. Something that can't account for its OWN existence through self-production can't claim inherent productive power for ANYTHING.\",\"realLifeExample\":\"A car assembled from parts can't claim to have \\\"built itself.\\\" The assembly depends on the factory, workers, and parts. If it can't self-produce, its productive capacity isn't inherent.\"},{\"q\":\"How does this target the sāmagrī specifically?\",\"a\":\"The opponent's strongest position: individual causes might be weak, but their COMBINATION (sāmagrī) has the power to produce. V.23 undermines this: the combination itself is just another dependent entity — it has no more inherent power than its individual components.\",\"realLifeExample\":\"A committee is just its members sitting together. The committee doesn't have power BEYOND its members. If individual members lack inherent power, adding them together doesn't create inherent power.\"},{\"q\":\"What is the \\\"self-production\\\" argument?\",\"a\":\"If X can't produce ITSELF (explain its own existence through its own power), then X has no inherent productive power. And if it has no inherent productive power, it can't inherently produce anything else. V.23 applies this to the cause-combination.\",\"realLifeExample\":\"If a company can't sustain its own operations (self-production), how can it produce goods for others? Self-sustaining capacity is a prerequisite for productive capacity. V.23: the combination fails this prerequisite.\"},{\"q\":\"How does this relate to Ch.1?\",\"a\":\"Ch.1 v.1: nothing arises from self. V.23: the combination can't produce itself. Same insight applied to the sāmagrī specifically: self-production is impossible. Ch.1's general finding applied to Ch.20's specific context.\",\"realLifeExample\":\"A general law (Ch.1: no self-production) applied to a specific case (Ch.20: the cause-combination can't self-produce). The general principle grounds the specific application.\"},{\"q\":\"How does emergence illustrate this?\",\"a\":\"In complex systems, emergent properties (like consciousness, temperature, wetness) arise from component INTERACTIONS — not from the system \\\"producing itself.\\\" The system doesn't have inherent productive power; the properties emerge from relational processes. Like v.23: conventional production through interactions, not inherent self-production.\",\"realLifeExample\":\"A flock of birds forms a murmuration pattern — but no single bird or the flock itself \\\"produces\\\" the pattern inherently. It emerges from interactions. The flock doesn't self-produce its patterns; they arise conventionally from dynamics.\"},{\"q\":\"What is the significance for Ch.20's conclusion?\",\"a\":\"V.23 closes the loop: Ch.20 began by examining the sāmagrī (combination) in vv.1-4. V.23 returns to the sāmagrī directly, showing it can't inherently produce. The chapter's opening question (can the combination produce effects?) receives its definitive answer: not inherently.\",\"deeper\":\"V.23 is architecturally important: it returns to the sāmagrī (combination) that opened the chapter. VV.1-4 asked whether the effect is in/not-in the combination. VV.5-21 analyzed various aspects of inherent production. V.23 now directly addresses the combination's own status: it can't produce itself (dependent on components), so it can't inherently produce effects. This closes the circle: the combination that was supposed to explain inherent production is itself empty and dependent.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can't the combination of causes produce effects inherently?\",\"options\":[\"A) It can\",\"B) The combination can't even produce ITSELF — it depends on its components. Without inherent self-existence, it has no inherent productive power. Something that can't account for its own existence can't inherently produce other things.\",\"C) Only some combinations can\",\"D) The combination is special\"],\"correct\":\"B\",\"explanation\":\"Can't self-produce → no inherent existence → no inherent productive power. Dependent combinations can't have inherent power.\"},\"intermediate\":{\"question\":\"How does v.23 return to Ch.20's opening?\",\"options\":[\"A) It doesn't\",\"B) VV.1-4 examined whether effects are in/not-in the combination. V.23 now shows the combination ITSELF is dependent (can't self-produce). The chapter's opening entity (the sāmagrī) is itself empty. Full circle.\",\"C) Different topic\",\"D) Only v.24 connects\"],\"correct\":\"B\",\"explanation\":\"Opens with sāmagrī (vv.1-4), concludes by showing sāmagrī itself is empty (v.23). Full circle.\"},\"advanced\":{\"question\":\"How does the \\\"can't self-produce → can't produce effects\\\" argument work?\",\"options\":[\"A) Non sequitur\",\"B) If the combination lacks inherent existence (can't produce itself — depends on components), it has no inherent productive power. Inherent production requires an inherently existing producer. An empty (dependent) combination can only conventionally produce.\",\"C) Self-production is possible\",\"D) Production doesn't require a producer\"],\"correct\":\"B\",\"explanation\":\"No inherent existence → no inherent power. The combination is dependent → its production is conventional, not inherent.\"}},\"verseText\":\"If whatever is a combination of causes and conditions does not produce itself by itself, how could it produce fruit?\",\"madhyamakaConcept\":\"Sāmagrī svayam svayam na utpādayati cet (if the combination doesn't produce itself by itself), katham phala utpādayet (how could it produce fruit?). The sāmagrī (combination) is itself dependently arisen — it depends on its components. It has no inherent productive power because it has no inherent existence.\",\"quantumPhysicsParallel\":\"Emergence in complex systems: new properties emerge from interactions between components, but no single component or the collection itself \\\"produces\\\" the emergent property inherently. Emergence is a relational, contextual process — not inherent self-production of the system.\"}},\"isShowcase\":false,\"chapterId\":20}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Study the MMK with inte

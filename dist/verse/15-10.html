88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":15,\"verseId\":10,\"chapterTitle\":\"Examination of Essence\",\"totalVerses\":11,\"verseData\":{\"id\":\"v15_10\",\"number\":10,\"title\":\"The Wise Person Avoids Both \\\"Exists\\\" and \\\"Does Not Exist\\\"\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"To say 'it is' is to grasp for permanence; to say 'it is not' is to adopt the view of nihilism. Therefore a wise person does not say 'exists' or 'does not exist.'\"},\"philosophy\":{\"insight\":\"The practical prescription: a wise person (paṇḍita) avoids BOTH assertions. \\\"It is\\\" → grasping at permanence (eternalism). \\\"It is not\\\" → nihilism. Neither captures reality. The wise person understands dependent origination and refrains from inherent assertions in either direction.\",\"madhyamaka\":\"Asserting \\\"asti\\\" (it is/exists) inherently is śāśvatadṛṣṭi (eternalism) — grasping at permanence, treating things as self-existing and unchanging. Asserting \\\"nāsti\\\" (it is not/doesn't exist) inherently is ucchedadṛṣṭi (nihilism) — denying all existence, treating everything as void. The paṇḍita avoids both by understanding conventional existence without inherent existence.\",\"quantum\":\"Complementarity principle: trying to say a quantum entity \\\"is a wave\\\" or \\\"is a particle\\\" exclusively misses the truth. It's neither exclusively — it's something that manifests wave or particle aspects depending on measurement. A wise physicist doesn't assert exclusively \\\"wave\\\" or \\\"particle\\\" but understands complementarity.\",\"bridge\":\"Both quantum complementarity and the middle way reject exclusive binary assertions. QM: \\\"is a wave\\\" or \\\"is a particle\\\" — both are wrong as exclusive claims. Middle way: \\\"exists\\\" or \\\"doesn't exist\\\" — both are wrong as inherent claims. Both require nuanced understanding beyond binary.\",\"accessible\":\"A wise person doesn't say a river \\\"exists\\\" (as a permanent thing — it changes every second) or \\\"doesn't exist\\\" (it's clearly flowing). The wise view: it exists conventionally as a dependent process, without being a permanent entity or a mere nothing.\",\"twoTruths\":\"The wise person navigates the two truths: recognizing conventional existence (things function) without asserting inherent existence (things are permanent/independent). This IS the two truths in practice — knowing what to assert and what not to.\",\"commonMisconception\":\"NOT saying the wise person is mute or refuses to make any claims. They can say \\\"the table exists\\\" conventionally. They refrain from asserting INHERENT existence (\\\"the table inherently/permanently exists\\\") or INHERENT non-existence (\\\"the table absolutely doesn't exist\\\").\"},\"quantumResonance\":{\"concept\":\"Complementarity — Beyond Binary \\\"Wave\\\" or \\\"Particle\\\"\",\"score\":70,\"strength\":\"High\",\"explanation\":\"Quantum complementarity shows that exclusively asserting \\\"is a wave\\\" or \\\"is a particle\\\" misses the truth. Like the middle way: exclusively asserting \\\"exists\\\" or \\\"doesn't exist\\\" misses reality. Both require transcending binary categories.\",\"caveat\":\"Complementarity is a specific QM principle. The parallel is about the inadequacy of exclusive binary assertions for capturing reality.\"},\"animation\":{\"visualBridge\":\"A wise figure standing between two extremes — \\\"IT EXISTS\\\" (solid permanence) and \\\"IT DOESN'T EXIST\\\" (void) — choosing neither, but illuminated by the light of dependent origination in the middle.\",\"educationalGoal\":\"User sees that wisdom involves transcending binary assertions — understanding dependent existence beyond both permanence and void.\"},\"deeperDive\":[{\"q\":\"What is \\\"grasping for permanence\\\"?\",\"a\":\"Asserting \\\"it is\\\" (exists inherently) is grasping (grāha) for permanence — treating transient, dependent things as permanent, self-existing entities. This leads to attachment: we cling to things we believe are permanent, causing suffering when they inevitably change.\",\"realLifeExample\":\"Grasping at a relationship as \\\"permanent\\\" (it IS/it will always BE) causes suffering when it changes. The grasping itself — the belief in permanence — is the source of suffering.\"},{\"q\":\"What is \\\"the view of nihilism\\\"?\",\"a\":\"Asserting \\\"it is not\\\" (doesn't exist at all) is nihilism (uccheda) — denying that things have any form of existence. This leads to moral indifference: if nothing exists, nothing matters, actions have no consequences.\",\"realLifeExample\":\"Saying \\\"nothing matters\\\" because \\\"nothing really exists\\\" is nihilism. It undermines ethical motivation: why be good if nothing exists or matters?\"},{\"q\":\"Why does the wise person avoid both?\",\"a\":\"Because both are EXTREME positions that distort reality. Eternalism overestimates (things are more permanent than they are). Nihilism underestimates (things have more reality than nihilism grants). Reality is in the middle: conventional existence without inherent existence.\",\"realLifeExample\":\"Saying a flame \\\"permanently exists\\\" or \\\"doesn't exist at all\\\" are both wrong. The flame exists as a dependent process — real but impermanent. The wise view is in the middle.\"},{\"q\":\"How does complementarity illustrate this?\",\"a\":\"Saying light \\\"IS a wave\\\" (exclusively) misses its particle aspect. Saying light \\\"IS a particle\\\" (exclusively) misses its wave aspect. A wise physicist understands complementarity: light has aspects of both, exclusively neither. Similarly, reality is neither inherently existing nor non-existing.\",\"realLifeExample\":\"Saying a person \\\"IS an introvert\\\" or \\\"IS an extrovert\\\" (exclusively) misses the truth that people have aspects of both in different contexts. A wise psychologist understands the nuance beyond labels.\"},{\"q\":\"What does \\\"wise person\\\" (paṇḍita) mean in this context?\",\"a\":\"Not just someone intelligent, but someone who has philosophical insight into emptiness and dependent origination. A paṇḍita understands the two truths: conventional reality works without inherent existence. This understanding enables avoiding both extremes naturally, not through suppression but through insight.\",\"realLifeExample\":\"A skilled navigator doesn't avoid rocks by being cautious (suppression) but by knowing the waters (insight). The paṇḍita avoids extremes through understanding, not avoidance.\"},{\"q\":\"How does v.10 function in the chapter?\",\"a\":\"V.7: the Buddha rejected both extremes. V.8: eternalism fails (essence → no change). V.9: dilemma — change is impossible with or without essence. V.10: the prescription — avoid both assertions. V.11 will give the final formulation. V.10 is the practical takeaway.\",\"deeper\":\"V.10 is the most \\\"prescriptive\\\" verse in Ch.15 — it tells us what to DO. Most of the chapter is analytical (showing what doesn't work). V.10 turns analysis into practice: the wise person avoids both extremes. This makes Ch.15 not just a theoretical exercise but a guide for how to think about reality. The analysis (vv.1-9) serves the practice (v.10-11).\"}],\"quiz\":{\"beginner\":{\"question\":\"Why does a wise person avoid saying both \\\"it exists\\\" and \\\"it doesn't exist\\\"?\",\"options\":[\"A) They're indecisive\",\"B) \\\"It exists\\\" grasps at permanence (eternalism). \\\"It doesn't exist\\\" adopts nihilism. Both distort reality. The wise view: things exist conventionally and dependently, without being permanent or void.\",\"C) Both are correct\",\"D) Only \\\"it exists\\\" is wrong\"],\"correct\":\"B\",\"explanation\":\"Both assertions are extremes that misrepresent reality. Things exist conventionally (not nihilism) but not inherently/permanently (not eternalism). The wise person understands this middle position.\"},\"intermediate\":{\"question\":\"How does quantum complementarity parallel the middle way prescription?\",\"options\":[\"A) No parallel\",\"B) Exclusively asserting \\\"wave\\\" or \\\"particle\\\" misses the truth — like exclusively asserting \\\"exists\\\" or \\\"doesn't exist.\\\" Both require understanding beyond exclusive binary categories.\",\"C) Light is definitively a wave\",\"D) Complementarity proves eternalism\"],\"correct\":\"B\",\"explanation\":\"Complementarity shows exclusive binary assertions miss quantum truth. Similarly, exclusive \\\"exists/doesn't exist\\\" misses the middle way truth. Both demand nuanced, non-binary understanding.\"},\"advanced\":{\"question\":\"How does v.10 transform Ch.15 from analysis to practice?\",\"options\":[\"A) It doesn't\",\"B) Most of Ch.15 is theoretical analysis (vv.1-9). V.10 is prescriptive: it tells us what a wise person DOES (avoids both extremes). This makes the chapter not just theory but a practical guide for how to think about reality.\",\"C) Only theory matters\",\"D) Practice is separate from analysis\"],\"correct\":\"B\",\"explanation\":\"V.10 turns the theoretical demolition (vv.1-9) into practical wisdom: the wise person avoids both extremes. Analysis serves practice; philosophy serves liberation.\"}},\"verseText\":\"To say 'it is' is to grasp for permanence; to say 'it is not' is to adopt the view of nihilism. Therefore a wise person does not say 'exists' or 'does not exist.'\",\"madhyamakaConcept\":\"Asserting \\\"asti\\\" (it is/exists) inherently is śāśvatadṛṣṭi (eternalism) — grasping at permanence, treating things as self-existing and unchanging. Asserting \\\"nāsti\\\" (it is not/doesn't exist) inherently is ucchedadṛṣṭi (nihilism) — denying all existence, treating everything as void. The paṇḍita avoids both by understanding conventional existence without inherent existence.\",\"quantumPhysicsParallel\":\"Complementarity principle: trying to say a quantum entity \\\"is a wave\\\" or \\\"is a particle\\\" exclusively misses the truth. It's neither exclusively — it's something that manifests wave or particle aspects depending on measurement. A wise physicist doesn't assert exclusively \\\"wave\\\" or \\\"particle\\\" but understands complementarity.\"}},\"isShowcase\":false,\"chapterId\":15}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\

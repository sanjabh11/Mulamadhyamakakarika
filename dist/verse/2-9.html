c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":9,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_9\",\"number\":9,\"title\":\"The Tautology of \\\"A Mover Moves\\\"\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"When without motion, It is unacceptable to call something a mover, How will it be acceptable To say that a mover moves?\"},\"philosophy\":{\"insight\":\"If \\\"mover\\\" already presupposes motion, then \\\"a mover moves\\\" is tautological — it says \\\"that which moves, moves.\\\" The statement appears informative but is secretly circular, revealing that mover and motion cannot be independently established.\",\"madhyamaka\":\"Garfield: the verse exposes a hidden tautology in the seemingly informative statement \\\"a mover moves.\\\" If \\\"mover\\\" already contains the concept of motion, the predicate \\\"moves\\\" adds nothing new. Kalupahana: this parallels the Buddhist critique of ātman — saying \\\"the self acts\\\" presupposes what it claims to explain. Candrakīrti uses this verse to show that subject-predicate grammar misleads us into thinking there are two independent things (mover + motion) when there is one dependent process.\",\"quantum\":\"Complementarity (Bohr): Wave and particle descriptions are complementary — using one framework already presupposes and excludes the other. Saying \\\"the wave interferes\\\" is informative only if \\\"wave\\\" and \\\"interference\\\" are independent concepts. But in quantum mechanics, a wave IS something that interferes. The description is tautological within the framework.\",\"bridge\":\"Both reveal hidden tautologies in seemingly informative statements. \\\"A mover moves\\\" and \\\"a wave interferes\\\" both appear to predicate something of a subject, but the subject already contains the predicate. The grammar of subject-predicate misleads us about the actual structure.\",\"accessible\":\"\\\"A bachelor is unmarried.\\\" True, but it tells you nothing new — \\\"bachelor\\\" MEANS unmarried. Similarly, \\\"a mover moves\\\" seems to say something, but \\\"mover\\\" already means \\\"one who moves.\\\" The statement is circular, not informative.\",\"twoTruths\":\"Conventionally, someone walks from A to B — perfectly functional. Ultimately, the mover does not exist prior to or independently of the motion — both arise dependently.\",\"commonMisconception\":\"The verse does NOT say nobody ever moves. It says the INHERENT mover (one who possesses motion as an intrinsic property) is unfindable.\"},\"quantumResonance\":{\"concept\":\"Complementarity / Tautological Framework Descriptions\",\"score\":86,\"strength\":\"High\",\"explanation\":\"Complementary descriptions (wave/particle) contain their predicates within the framework choice itself. Parallels the hidden tautology of \\\"a mover moves.\\\"\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Circular Definition Loop\",\"anchor\":\"Two words \\\"MOVER\\\" and \\\"MOVES\\\" connected by arrows in a circle. Clicking one highlights the other, showing they define each other. The circle spins faster and faster.\",\"texture\":\"Words: Glowing neon text. Arrows: Pulsing energy streams. Background: Dark with radial blur suggesting circular motion.\",\"mood\":\"Dizzying, circular, revelatory\",\"colors\":[\"#F59E0B\",\"#8B5CF6\",\"#06B6D4\",\"#1E293B\"],\"orchestration\":{\"start\":\"Two words orbit each other slowly with connecting arrows.\",\"click\":\"Click either word — the other lights up simultaneously. Arrows pulse. Speed increases.\",\"reveal\":\"At maximum speed, words merge into one: \\\"DEPENDENT PROCESS.\\\" Text: \\\"Not two things — one process, conventionally described.\\\"\"},\"interaction\":{\"click\":\"Click either word to see circular dependency highlighted\",\"drag\":\"Drag to adjust orbit speed\",\"hover\":\"Hover shows definition: each word defined by the other\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.5},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":40,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"drei Text3D for neon word rendering with emissive material\",\"Custom particle stream shader for connecting arrows\",\"useFrame-driven orbital speed acceleration\",\"Bloom + RadialBlur post-processing for circular motion effect\",\"useSpring for word-merge animation at reveal\"],\"camera\":{\"position\":[0,0,8],\"fov\":50,\"autoRotate\":false},\"fps\":60,\"performanceNotes\":\"\u003c200MB memory, 60 FPS. Minimal geometry — two text meshes plus particle stream. Very lightweight.\",\"tripoPrompt\":\"Two neon words \\\"MOVER\\\" and \\\"MOVES\\\" orbiting each other in dark space, connected by pulsing energy arrows, radial blur, 8K.\",\"visualBridge\":\"The circular orbit of mutually-defining words directly shows the tautology — each concept contains the other, and the loop accelerates until they merge.\",\"educationalGoal\":\"User grasps that neither mover nor motion can be established as primary — they co-arise like quantum observables that depend on measurement context.\"},\"deeperDive\":[{\"q\":\"How does this differ from verse 3?\",\"a\":\"V.3 showed \\\"mover\\\" is unacceptable when not moving (context-dependence). V.9 goes deeper: even WHEN moving, \\\"a mover moves\\\" is tautological. The statement's form (subject + predicate) disguises its circular content (moving thing moves).\",\"realLifeExample\":\"\\\"A wet towel is wet.\\\" V.3 said the towel isn't always wet. V.9 says even when it IS wet, calling it \\\"a wet towel that is wet\\\" adds nothing. The predicate is hidden in the subject.\"},{\"q\":\"Is \\\"a mover moves\\\" really tautological?\",\"a\":\"Under inherent analysis, yes. If \\\"mover\\\" inherently means \\\"that which moves,\\\" then \\\"moves\\\" is already contained in the subject. The statement reduces to \\\"that which moves, moves\\\" — true but uninformative. Conventionally, of course, the phrase works fine as ordinary language.\",\"realLifeExample\":\"\\\"My car drives.\\\" If \\\"car\\\" is defined as a vehicle that drives, the statement is circular. It's conventionally useful but philosophically empty — it doesn't explain HOW driving happens or what makes the car a car independently of driving.\"},{\"q\":\"How does Bohr's complementarity create similar tautologies?\",\"a\":\"When you choose the \\\"wave\\\" framework, saying \\\"the wave interferes\\\" is tautological — waves are DEFINED by interference behavior. Switch to the \\\"particle\\\" framework and say \\\"the particle has position\\\" — also tautological within that framework. The description is built into the framework choice, not independently discovered.\",\"realLifeExample\":\"Describing a chess piece as \\\"something that follows chess rules\\\" is tautological within the game. The description doesn't reveal anything independent of the framework you chose to use.\"},{\"q\":\"Why does grammar mislead us here?\",\"a\":\"Subject-predicate grammar (\\\"X does Y\\\") suggests two independent things: an entity (X) and its action (Y). But Nāgārjuna shows that in this case, the \\\"entity\\\" (mover) is defined by its \\\"action\\\" (moving). Grammar creates the illusion of independence where there is dependence.\",\"realLifeExample\":\"\\\"The rain rains.\\\" Grammar suggests \\\"rain\\\" (noun) and \\\"rains\\\" (verb) are different things. But \\\"rain\\\" IS the raining — there's no \\\"rain-substance\\\" separate from the falling of water drops.\"},{\"q\":\"Does this apply to all subject-predicate statements?\",\"a\":\"Not all, but many philosophically important ones. \\\"The self perceives,\\\" \\\"the cause produces,\\\" \\\"the agent acts\\\" — all have the same structure where the subject is defined by the predicate. Nāgārjuna applies this analysis across the MMK to dismantle inherent existence claims.\",\"realLifeExample\":\"\\\"The healer heals.\\\" \\\"The singer sings.\\\" \\\"The thinker thinks.\\\" In each case, the subject is defined by the action. Remove the action and the subject loses its identity. They're not independent.\"},{\"q\":\"How does this verse connect to the Buddhist critique of ātman?\",\"a\":\"The ātman (self) is often defined as \\\"that which acts/perceives/persists.\\\" But if the self IS its actions, saying \\\"the self acts\\\" is tautological. And if the self is NOT its actions, how is it connected to them? This is the same mover-motion problem applied to selfhood — Chapter 18 will address this directly.\",\"deeper\":\"Kalupahana draws the explicit parallel: the mover-motion analysis is a rehearsal for the self-action analysis in Ch. 18. Both show that the \\\"agent\\\" is not independent of the \\\"action.\\\"\"}],\"quiz\":{\"beginner\":{\"question\":\"Why is \\\"a mover moves\\\" potentially tautological?\",\"options\":[\"A) Because movers don't exist\",\"B) Because \\\"mover\\\" already means \\\"one who moves,\\\" so the predicate is hidden in the subject\",\"C) Because grammar is always wrong\",\"D) Because motion is impossible\"],\"correct\":\"B\",\"explanation\":\"\\\"Mover\\\" already means \\\"that which moves.\\\" Adding \\\"moves\\\" as a predicate just repeats what's already in the subject — like saying \\\"an unmarried bachelor.\\\"\"},\"intermediate\":{\"question\":\"What does Bohr's complementarity principle say about wave and particle descriptions?\",\"options\":[\"A) They can be used simultaneously\",\"B) They are complementary frameworks — using one already presupposes and excludes the other\",\"C) Only the wave description is correct\",\"D) They are identical\"],\"correct\":\"B\",\"explanation\":\"Complementarity means wave and particle descriptions are mutually exclusive frameworks. Choosing \\\"wave\\\" already determines what you'll observe (interference), making \\\"the wave interferes\\\" tautological within the framework.\"},\"advanced\":{\"question\":\"How does this verse prefigure Nāgārjuna's critique of the self (ātman) in Chapter 18?\",\"options\":[\"A) It doesn't relate to the self\",\"B) The mover-motion tautology parallels the self-action tautology: if the self IS its actions, \\\"the self acts\\\" is circular; if it ISN'T, the connection is unexplained\",\"C) It proves the self exists\",\"D) It proves the self doesn't exist\"],\"correct\":\"B\",\"explanation\":\"Just as \\\"a mover moves\\\" is circular (mover defined by moving), \\\"the self acts\\\" is circular (self defined by acting). Both analyses show the \\\"agent\\\" is not independent of the \\\"action.\\\"\"}},\"verseText\":\"When without motion, It is unacceptable to call something a mover, How will it be acceptable To say that a mover moves?\",\"madhyamakaConcept\":\"Garfield: the verse exposes a hidden tautology in the seemingly informative statement \\\"a mover moves.\\\" If \\\"mover\\\" already contains the concept of motion, the predicate \\\"moves\\\" adds nothing new. Kalupahana: this parallels the Buddhist critique of ātman — saying \\\"the self acts\\\" presupposes what it claims to explain. Candrakīrti uses this verse to show that subject-predicate grammar misleads us into thinking there are two independent things (mover + motion) when there is one dependent process.\",\"quantumPhysicsParallel\":\"Complementarity (Bohr): Wave and particle descriptions are complementary — using one framework already presupposes and excludes the other. Saying \\\"the wave interferes\\\" is informative only if \\\"wave\\\" and \\\"interference\\\" are independent concepts. But in quantum mechanics, a wave IS something that interferes. The description is tautological within the framework.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Study the MMK with interactive verse exploration, research-mode transparency, and carefully caveated quantum analogies.\"}]],\"error\"

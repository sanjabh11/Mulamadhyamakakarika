ty is physics. V.9 is conceptual fixation.\"},\"animation\":{\"visualBridge\":\"Labels flying toward a figure — \\\"Permanent,\\\" \\\"Impermanent,\\\" \\\"Existent,\\\" \\\"Non-existent\\\" — each dissolving on contact. Caption: \\\"All fixations have ceased.\\\"\",\"educationalGoal\":\"Concepts can't \\\"fix\\\" the Tathāgata. All conceptual determination dissolves.\"},\"deeperDive\":[{\"q\":\"What are \\\"fixations\\\"?\",\"a\":\"Conceptual constructions that try to categorize and establish things as inherently existent. V.9: all such attempts regarding the Tathāgata have ceased.\",\"realLifeExample\":\"Labeling \\\"This IS a chair\\\" (fixing it inherently). V.9: all such labels dissolve.\"},{\"q\":\"Why have fixations ceased?\",\"a\":\"Because the Tathāgata is empty (vv.1-8). No inherent entity to conceptualize → concepts have no object → they naturally cease.\",\"realLifeExample\":\"Trying to label a mirage as a \\\"lake\\\" — the label doesn't stick.\"},{\"q\":\"Relation to meditation?\",\"a\":\"Cessation of conceptual fixation is the goal of analytical meditation. V.9 describes the RESULT of successful analysis.\",\"realLifeExample\":\"Untangling a knot: when done, hands relax. Analysis resolves fixation.\"},{\"q\":\"Is this anti-intellectual?\",\"a\":\"No. Rejects concepts that ESTABLISH inherent existence. Conventional concepts (descriptions) continue.\",\"realLifeExample\":\"Stop thinking your reflection is a separate person. You still use mirrors.\"},{\"q\":\"Complementarity illustration?\",\"a\":\"Can't simultaneously determine position and momentum precisely. Each concept captures only part. The entity exceeds frameworks.\",\"realLifeExample\":\"Describing something both wave and particle — each partial.\"},{\"q\":\"Significance for Ch.22?\",\"a\":\"Transitions from analysis (vv.1-8) to consequence (vv.9-16). First consequence: conceptual fixation is impossible.\",\"deeper\":\"Not only is the Tathāgata unfindable, but the very CAPACITY to fix him conceptually has ceased. Prapañcopaśama — cessation of conceptual proliferation.\"}],\"quiz\":{\"beginner\":{\"question\":\"What happens to conceptual fixations about the Tathāgata?\",\"options\":[\"A) They succeed\",\"B) They all cease — there's no inherent entity for concepts to grasp.\",\"C) Some work\",\"D) They're not tried\"],\"correct\":\"B\",\"explanation\":\"Empty entity → nothing to conceptualize → fixations cease.\"},\"intermediate\":{\"question\":\"Is v.9 anti-intellectual?\",\"options\":[\"A) Yes\",\"B) No — conventional descriptions work. What ceases is concepts establishing INHERENT existence. Communication continues.\",\"C) Partially\",\"D) Only for Buddhists\"],\"correct\":\"B\",\"explanation\":\"Conventional use of concepts continues. Only reifying fixations cease.\"},\"advanced\":{\"question\":\"How does complementarity parallel v.9?\",\"options\":[\"A) No parallel\",\"B) QM: can't simultaneously fix all properties. V.9: can't conceptually fix the Tathāgata from any angle. Both resist complete determination.\",\"C) Same thing\",\"D) Opposite\"],\"correct\":\"B\",\"explanation\":\"Both: entity resists being \\\"fixed\\\" completely by any framework.\"}},\"verseText\":\"The fixations through which one might fix the Tathāgata have completely stopped. All fixations are completely stopped. How can they then fix?\",\"madhyamakaConcept\":\"Kalpanā yaiḥ Tathāgatam kalpayeyuḥ, te niruddhāḥ. Sarva kalpanā niruddhāḥ. The Tathāgata is beyond all conceptual determination — prapañcopaśama.\",\"quantumPhysicsParallel\":\"Complementarity: you can't simultaneously fix position and momentum. Any attempt to \\\"fix\\\" one destabilizes another. The Tathāgata similarly resists complete conceptual determination.\"}},\"isShowcase\":false,\"chapterId\":22}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"nam

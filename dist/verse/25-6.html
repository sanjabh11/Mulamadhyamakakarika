176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":25,\"verseId\":6,\"chapterTitle\":\"Examination of Nirvana\",\"totalVerses\":24,\"verseData\":{\"id\":\"v25_6\",\"number\":6,\"title\":\"Nirvāṇa Is Not Both Existent and Nonexistent\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If nirvāṇa were both existent and nonexistent, liberation would be both existent and nonexistent. That is not tenable.\"},\"philosophy\":{\"insight\":\"THIRD LIMB: nirvāṇa is NOT both existent AND nonexistent. This is a logical contradiction — nothing can be both a thing and not a thing simultaneously. If nirvāṇa were both, liberation itself would be contradictory.\",\"madhyamaka\":\"Bhāvābhāvobhayaṃ yadi nirvāṇam, mokṣo bhāvābhāvobhayaṃ syāt. Tac ca na upapadyate. Both = contradiction → incoherent liberation.\",\"quantum\":\"Superposition isn't \\\"both A and not-A\\\" simultaneously — it's a distinct state. The classical \\\"both\\\" interpretation of superposition is a misconception.\",\"bridge\":\"Both: the \\\"both\\\" position is a logical error. QM: superposition ≠ \\\"both wave and particle at once.\\\" V.6: nirvāṇa ≠ \\\"both existent and nonexistent.\\\" The \\\"both\\\" misunderstands the nature of the alternatives.\",\"accessible\":\"Can something be both a circle and a square? No — the properties are contradictory. Same for \\\"both existent and nonexistent.\\\"\",\"twoTruths\":\"Ultimately: logical contradiction. Conventionally: \\\"both\\\" would make liberation incoherent — you'd be both free and not free.\",\"commonMisconception\":\"Some think \\\"transcending categories\\\" means \\\"being both.\\\" V.6 rejects this. Transcendence ≠ simultaneous affirmation of contradictories.\"},\"quantumResonance\":{\"concept\":\"Superposition ≠ Both Simultaneously\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"QM superposition is a DISTINCT state, not \\\"both A and not-A.\\\" Similarly, nirvāṇa is a distinct \\\"state\\\" beyond categories, not \\\"both existent and nonexistent.\\\" The \\\"both\\\" misunderstands.\",\"caveat\":\"Quantum superposition vs. logical contradiction.\"},\"animation\":{\"visualBridge\":\"A circle-square: impossible shape. \\\"Both existent and nonexistent\\\" = impossible nirvāṇa. Caption: \\\"Both = contradiction. Nirvāṇa transcends, not combines.\\\"\",\"educationalGoal\":\"Nirvāṇa can't be both existent and nonexistent — that's a logical contradiction.\"},\"deeperDive\":[{\"q\":\"Why is \\\"both\\\" a contradiction?\",\"a\":\"Existent and nonexistent are mutually exclusive. If something exists, it doesn't not-exist. Asserting both = asserting a contradiction. Contradictions can't describe anything real.\",\"realLifeExample\":\"You can't be both in the room and not in the room at the same time in the same sense.\"},{\"q\":\"What about quantum superposition?\",\"a\":\"Superposition is NOT \\\"both A and not-A.\\\" It's a distinct state described by the wave function. Measuring it yields A or not-A, but BEFORE measurement it's neither — it's in superposition. Not \\\"both.\\\"\",\"realLifeExample\":\"A coin spinning in the air isn't \\\"both heads and tails.\\\" It's spinning — a distinct state that yields one or the other when it lands.\"},{\"q\":\"Why would someone hold the \\\"both\\\" view?\",\"a\":\"Trying to capture the sense that nirvāṇa \\\"is real\\\" (existent) but also \\\"beyond our categories\\\" (nonexistent). But combining contradictories doesn't capture transcendence — it creates incoherence.\",\"realLifeExample\":\"Saying \\\"this music is both silent and loud\\\" doesn't capture its beauty. It's just nonsensical.\"},{\"q\":\"What does this mean for liberation?\",\"a\":\"If nirvāṇa were \\\"both,\\\" liberation would be \\\"both free and not free.\\\" But liberation means FREEDOM, not a contradictory state.\",\"realLifeExample\":\"Being both healed and sick isn't health. Health means the disease is resolved, not present alongside health.\"},{\"q\":\"Connection to the tetralemma?\",\"a\":\"Third limb eliminated. Three of four positions gone: existent (v.4), nonexistent (v.5), both (v.6). One remains: neither.\",\"realLifeExample\":\"Three wrong answers eliminated. One more to test.\"},{\"q\":\"Significance?\",\"a\":\"V.6 eliminates the \\\"mystical\\\" interpretation of nirvāṇa as paradoxically both real and unreal. Transcendence ≠ contradiction.\",\"deeper\":\"V.6 is important because many mystical traditions claim their ultimate reality is \\\"paradoxically both X and not-X.\\\" Nāgārjuna rejects this: paradox is not profundity. Genuine transcendence doesn't combine contradictories — it moves beyond the categories entirely.\"}],\"quiz\":{\"beginner\":{\"question\":\"Can nirvāṇa be both existent and nonexistent?\",\"options\":[\"A) Yes\",\"B) NO — that's a logical contradiction. Existence and nonexistence are mutually exclusive. \\\"Both\\\" = incoherent. Liberation can't be contradictory.\",\"C) Sometimes\",\"D) In a special sense\"],\"correct\":\"B\",\"explanation\":\"Contradiction. Both = incoherent. Nirvāṇa transcends, not combines.\"},\"intermediate\":{\"question\":\"How does this differ from quantum superposition?\",\"options\":[\"A) Same thing\",\"B) Superposition is a DISTINCT state, not \\\"both A and not-A.\\\" The \\\"both\\\" interpretation is a classical misconception of QM. Transcendence ≠ contradiction.\",\"C) No difference\",\"D) QM supports \\\"both\\\"\"],\"correct\":\"B\",\"explanation\":\"Superposition ≠ \\\"both.\\\" It's a distinct, coherent state. Not contradictory.\"},\"advanced\":{\"question\":\"Why does v.6 reject the \\\"mystical paradox\\\" interpretation?\",\"options\":[\"A) Doesn't\",\"B) Paradox (combining contradictories) is incoherence, not profundity. Genuine transcendence moves BEYOND categories, not INTO their contradiction. Nāgārjuna demands logical rigor even for the ultimate.\",\"C) Accepts it\",\"D) Irrelevant\"],\"correct\":\"B\",\"explanation\":\"Paradox ≠ profundity. Transcendence ≠ contradiction. Rigor is maintained.\"}},\"verseText\":\"If nirvāṇa were both existent and nonexistent, liberation would be both existent and nonexistent. That is not tenable.\",\"madhyamakaConcept\":\"Bhāvābhāvobhayaṃ yadi nirvāṇam, mokṣo bhāvābhāvobhayaṃ syāt. Tac ca na upapadyate. Both = contradiction → incoherent liberation.\",\"quantumPhysicsParallel\":\"Superposition isn't \\\"both A and not-A\\\" simultaneously — it's a distinct state. The classical \\\"both\\\" interpretation of superposition is a misconception.\"}},\"isShowcase\":false,\"chapterId\":25}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interacti

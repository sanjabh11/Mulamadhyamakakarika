176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":1,\"verseId\":11,\"chapterTitle\":\"Examination of Conditions\",\"totalVerses\":14,\"verseData\":{\"id\":\"v1_11\",\"number\":11,\"title\":\"The Effect Is Not Found in Conditions\",\"sanskrit\":{\"text\":\"pratyayebhyaś ca yo 'rtho 'sau pratyayebhyo 'pi nāsti saḥ\",\"transliteration\":\"pratyayebhyaś ca yo 'rtho 'sau pratyayebhyo 'pi nāsti saḥ\",\"translation\":\"In the several or united conditions the effect cannot be found. How could something not in the conditions come from the conditions?\"},\"philosophy\":{\"insight\":\"Nāgārjuna examines whether the effect pre-exists within its conditions. It cannot be found in any single condition, nor in all conditions taken together. If the effect isn't already there, it cannot be \\\"extracted\\\" from them through inherent production.\",\"madhyamaka\":\"This verse addresses the satkāryavāda (pre-existence of effect in cause) position associated with Sāṃkhya philosophy. Garfield: \\\"The effect is not to be found in the conditions either individually or collectively.\\\" If conditions had inherent productive power, the effect should be discoverable within them prior to arising. Kalupahana: this targets the Abhidharma notion that conditions contain the potential for effects as an inherent property. Siderits/Katsura: neither distributive nor collective analysis reveals the effect within conditions.\",\"quantum\":\"Quantum Superposition and Measurement: Before measurement, a quantum system exists as a superposition of possible outcomes. No single outcome is \\\"contained within\\\" the preparation conditions. The definite result emerges only upon measurement — it is not extracted from the conditions but arises through their interaction.\",\"bridge\":\"Both frameworks show that outcomes/effects are not pre-stored in conditions/preparations. They emerge through interaction. The \\\"potential\\\" is not a hidden version of the actual result waiting inside.\",\"accessible\":\"Imagine flour, eggs, sugar, and heat (the \\\"conditions\\\"). Where is the cake? You can't find it in any single ingredient or in all of them piled together. The cake only emerges when conditions interact in a specific way. Nāgārjuna makes the same point about all effects: they arise from conditions but aren't hiding inside them.\",\"twoTruths\":\"Conventionally, effects follow from conditions in regular patterns. Ultimately, the effect is not pre-stored inside the conditions — it emerges through interaction.\",\"commonMisconception\":\"NOT saying effects are random. Regular patterns exist! But the effect is not a hidden copy waiting inside the cause — emergence is real.\"},\"quantumResonance\":{\"concept\":\"Superposition / Born Rule\",\"score\":89,\"strength\":\"High\",\"explanation\":\"Before measurement, no definite outcome exists within the preparation. The result emerges through measurement interaction, not extraction from conditions.\",\"caveat\":\"Quantum state preparation and Buddhist conditions both show outcomes emerging through interaction, not pre-existing. Structural parallel.\"},\"animation\":{\"geometry\":\"Search-and-Not-Find Chamber\",\"anchor\":\"A transparent chamber containing 4 glowing condition-spheres. A magnifying glass / scanner beam searches inside each sphere and between them for the \\\"effect.\\\"\",\"texture\":\"Condition-spheres: Translucent with internal particle swirls, each a different color. Scanner: Bright white beam with lens flare. Chamber: Glass with subtle refraction.\",\"mood\":\"Investigative, revelatory, the thrill of NOT finding\",\"colors\":[\"#8B5CF6\",\"#10B981\",\"#3B82F6\",\"#F59E0B\",\"#FFFFFF\"],\"orchestration\":{\"start\":\"Four condition-spheres float in a glass chamber. A scanner beam is available.\",\"click\":\"User clicks a sphere — scanner beam enters it, illuminating its interior. No effect found inside (particles scatter but reveal nothing solid). User can click \\\"Search All\\\" to scan all simultaneously — still nothing.\",\"reveal\":\"After all searches fail, the spheres suddenly interact (beams cross between them) and a NEW shape (the effect) crystallizes at the intersection point — NOT from inside any sphere, but from their relationship.\"},\"interaction\":{\"click\":\"Click individual condition-spheres to search inside them for the effect\",\"drag\":\"Rotate the chamber to examine from all angles\",\"hover\":\"Spheres show internal particle activity but no hidden effect\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.4},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":70,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"MeshTransmissionMaterial for glass chamber refraction\",\"InstancedMesh for internal particle swirls (1000 per sphere)\",\"Custom raymarching shader for scanner beam volumetric light\",\"Bloom + DepthOfField post-processing for cinematic search effect\",\"Morph targets for effect crystallization animation\"],\"camera\":{\"position\":[0,2,8],\"fov\":50,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c450MB memory, 60 FPS. Glass refraction uses simplified transmission model. Particle count adaptive.\",\"tripoPrompt\":\"Four translucent glowing spheres in a glass chamber, a white scanner beam searching through them, a crystalline shape forming at their intersection point, laboratory aesthetic, volumetric lighting, 8K.\",\"visualBridge\":\"You search each condition and find no hidden effect. The effect only appears when conditions interact — it was never \\\"inside\\\" any of them.\",\"educationalGoal\":\"User sees that effects are not hidden inside conditions — they emerge through interaction, genuinely new yet dependently arisen.\"},\"deeperDive\":[{\"q\":\"What does \\\"several or united conditions\\\" mean?\",\"a\":\"\\\"Several\\\" means examining each condition individually — looking inside each one for the effect. \\\"United\\\" means examining all conditions taken together as a collection. Nāgārjuna argues the effect cannot be found either way. It's not hidden in any single ingredient or in the pile.\",\"realLifeExample\":\"Looking for \\\"wetness\\\" in hydrogen alone, or in oxygen alone, or even in a tank of unmixed hydrogen and oxygen — you won't find wetness. Wetness emerges only when they combine as water. It wasn't hiding inside either gas.\"},{\"q\":\"If the effect isn't in the conditions, where does it come from?\",\"a\":\"The effect arises dependently from the interaction of conditions, but is not pre-contained in them. Its existence is relational and emergent. This is the key insight: arising doesn't require pre-existence. Effects emerge without being extracted.\",\"realLifeExample\":\"Music isn't \\\"inside\\\" any single instrument. It emerges from the coordinated interaction of musicians, instruments, and acoustic space. You can't find a symphony hiding inside a violin.\"},{\"q\":\"How does this challenge the Sāṃkhya view?\",\"a\":\"The Sāṃkhya school (satkāryavāda) held that effects pre-exist in their causes — like a statue already present within the marble block. Nāgārjuna argues this doesn't hold: you can't actually find the effect within the conditions before it arises. The \\\"hidden statue\\\" metaphor is misleading.\",\"realLifeExample\":\"Michelangelo said he just \\\"removed what wasn't David\\\" from the marble. But David wasn't literally in the marble — any number of statues could have been carved. The marble doesn't \\\"contain\\\" David independently of Michelangelo's choices.\"},{\"q\":\"How does quantum superposition illustrate this?\",\"a\":\"Before measurement, a quantum particle doesn't have a definite position, spin, or momentum \\\"stored inside\\\" it. The measurement outcome emerges through the interaction of the preparation and the measuring device. You cannot find the outcome by examining the quantum state alone — it's genuinely undetermined until measurement.\",\"realLifeExample\":\"Before rolling dice, the number \\\"4\\\" isn't hiding inside the dice. The outcome emerges from the throw — the force, angle, surface, and physics. The \\\"4\\\" was never contained within the dice as a fixed, pre-existing fact.\"},{\"q\":\"But don't seeds contain the potential for plants?\",\"a\":\"Conventionally, yes — seeds reliably produce plants. But Nāgārjuna distinguishes conventional potential from inherent containment. The seed doesn't inherently \\\"contain\\\" the plant as a hidden miniature. The plant depends on soil, water, light, temperature, and time — conditions the seed alone doesn't provide. Potential is relational, not stored.\",\"realLifeExample\":\"A seed in a sealed box on the moon won't become a plant. The \\\"potential\\\" isn't a thing inside the seed — it's a description of what happens when the right conditions come together.\"},{\"q\":\"What is the philosophical significance of \\\"not found\\\"?\",\"a\":\"The method of \\\"searching and not finding\\\" is central to Madhyamaka analysis. When you analytically search for the essence of something — its inherent, independent nature — you don't find it. This unfindability IS emptiness. The effect's unfindability in conditions demonstrates the emptiness of production.\",\"realLifeExample\":\"Try to find \\\"you\\\" — your essential self. Is it in your body? Your brain? Your memories? Your personality? When you search carefully, no single thing IS \\\"you,\\\" yet \\\"you\\\" conventionally function perfectly. Unfindability + conventional functioning = emptiness.\"}],\"quiz\":{\"beginner\":{\"question\":\"Can you find the \\\"cake\\\" by examining flour, eggs, sugar, and heat individually?\",\"options\":[\"A) Yes — the cake is hidden inside the flour\",\"B) No — the cake emerges from their interaction but isn't hidden inside any single ingredient\",\"C) The cake doesn't exist\",\"D) Yes — the cake is in all ingredients equally\"],\"correct\":\"B\",\"explanation\":\"Just as Nāgārjuna argues, the effect (cake) cannot be found in any single condition (ingredient) or in all conditions taken together. It emerges through their interaction.\"},\"intermediate\":{\"question\":\"What philosophical view does this verse specifically challenge?\",\"options\":[\"A) Nihilism — the view that nothing exists\",\"B) Satkāryavāda — the view that effects pre-exist within their causes\",\"C) Idealism — the view that only mind exists\",\"D) Materialism — the view that only matter exists\"],\"correct\":\"B\",\"explanation\":\"This verse targets satkāryavāda (Sāṃkhya-style pre-existence of effect in cause) by showing that analytical search within conditions, individually or collectively, fails to find the effect.\"},\"advanced\":{\"question\":\"How does the quantum Born Rule parallel Nāgārjuna's argument about effects and conditions?\",\"options\":[\"A) The Born Rule shows outcomes are pre-stored in quantum states\",\"B) The Born Rule shows probabilities describe tendencies of emergence, not hidden contents — paralleling effects as emergent rather than pre-existing in conditions\",\"C) The Born Rule proves effects pre-exist in causes\",\"D) The Born Rule is irrelevant to Madhyamaka\"],\"correct\":\"B\",\"explanation\":\"The Born Rule gives probabilities for outcomes that emerge upon measurement — they aren't hidden \\\"inside\\\" the quantum state. Similarly, effects emerge from conditions without being pre-contained within them.\"}},\"verseText\":\"In the several or united conditions the effect cannot be found. How could something not in the conditions come from the conditions?\",\"madhyamakaConcept\":\"This verse addresses the satkāryavāda (pre-existence of effect in cause) position associated with Sāṃkhya philosophy. Garfield: \\\"The effect is not to be found in the conditions either individually or collectively.\\\" If conditions had inherent productive power, the effect should be discoverable within them prior to arising. Kalupahana: this targets the Abhidharma notion that conditions contain the potential for effects as an inherent property. Siderits/Katsura: neither distributive nor collective analysis reveals the effect within conditions.\",\"quantumPhysicsParallel\":\"Quantum Superposition and Measurement: Before measurement, a quantum system exists as a superposition of possible outcomes. No single outcome is \\\"contained within\\\" the preparation conditions. The definite result emerges only upon measurement — it is not extracted from the conditions but arises through their interaction.\"}},\"isShowcase\":false,\"chapterId\":1}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities plat

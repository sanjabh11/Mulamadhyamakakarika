176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":23,\"verseId\":6,\"chapterTitle\":\"Examination of Error\",\"totalVerses\":25,\"verseData\":{\"id\":\"v23_6\",\"number\":6,\"title\":\"Pleasant, Unpleasant, and Errors Have No Self-Nature\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"The pleasant, the unpleasant, and errors do not arise by their own nature. Dependent on which pleasant, unpleasant, and errors do the afflictions arise?\"},\"philosophy\":{\"insight\":\"Attacking the ROOT: pleasant/unpleasant/error evaluations (the basis from v.1) themselves lack self-nature (svabhāva). They're dependently arisen. Since afflictions depend on what's empty, the afflictions are doubly empty. Which specific pleasant/unpleasant? They can't be pinpointed.\",\"madhyamaka\":\"Śubha aśubha viparyāsa svabhāvena na utpadyante (pleasant, unpleasant, errors don't arise by own nature). Katamam śubham āśritya kleśāḥ (dependent on WHICH pleasant do afflictions arise?). The specificity question undermines inherent dependence.\",\"quantum\":\"Which specific measurement caused the collapse? In QM, the \\\"measurement problem\\\" resists precise answer. V.6: which specific \\\"pleasant\\\" caused the desire? Equally imprecise when analyzed carefully.\",\"bridge\":\"Both: the specific \\\"trigger\\\" can't be precisely identified. QM: measurement problem. V.6: which pleasant/unpleasant? Both: the supposed cause resists inherent pinpointing.\",\"accessible\":\"What EXACTLY made the cake \\\"delicious\\\"? The flour? Sugar? Butter? Temperature? Everything together? You can't point to ONE inherent cause of \\\"pleasantness.\\\" It's a dependent evaluation, not an inherent property.\",\"twoTruths\":\"Conventionally: we evaluate things as pleasant/unpleasant. Ultimately: these evaluations lack self-nature — they're constructed, not discovered.\",\"commonMisconception\":\"NOT saying evaluations are arbitrary. There are conventional patterns (most people find severe pain unpleasant). But these are conditioned patterns, not inherent properties.\"},\"quantumResonance\":{\"concept\":\"Measurement Problem — Which Trigger?\",\"score\":52,\"strength\":\"Medium\",\"explanation\":\"QM: which measurement caused collapse? Can't be precisely identified. V.6: which pleasant caused desire? Can't be precisely identified. Both: the supposed trigger resists inherent specification.\",\"caveat\":\"The measurement problem is physics. V.6 is about evaluative specificity.\"},\"animation\":{\"visualBridge\":\"Multiple objects labeled \\\"pleasant?\\\" — each one's label shifts and changes depending on the observer. Caption: \\\"No inherent pleasant. No inherent unpleasant. No inherent trigger.\\\"\",\"educationalGoal\":\"The evaluative basis of afflictions is itself empty. No inherent pleasant/unpleasant → no inherent afflictions.\"},\"deeperDive\":[{\"q\":\"Why can't the \\\"pleasant\\\" be pinpointed?\",\"a\":\"What makes something pleasant is always MULTIPLE factors: context, mood, expectations, biology, culture. There's no single, inherent \\\"pleasant-making\\\" property. Pleasantness is a complex dependent evaluation.\",\"realLifeExample\":\"Why is this coffee \\\"pleasant\\\"? The roast? Temperature? My caffeine need? The cozy café? All of these → no single inherent cause.\"},{\"q\":\"How does this deepen the emptiness of afflictions?\",\"a\":\"V.2: afflictions depend on empty evaluations. V.6: the evaluations THEMSELVES are empty (lacking self-nature). The emptiness goes all the way down — no inherent foundation anywhere.\",\"realLifeExample\":\"A building on sand, and the sand is on water, and the water is on air. No solid foundation anywhere. Emptiness all the way down.\"},{\"q\":\"What are the \\\"errors\\\" (viparyāsa)?\",\"a\":\"The four cognitive errors: perceiving impermanent as permanent, suffering as pleasant, not-self as self, impure as pure. These are the deepest \\\"misperceptions\\\" that generate all afflictions.\",\"realLifeExample\":\"Thinking a new phone will make you permanently happy: impermanent → permanent, suffering → pleasant. Classic viparyāsa.\"},{\"q\":\"How does the measurement problem illustrate this?\",\"a\":\"In QM, asking \\\"which measurement caused the collapse?\\\" resists a definitive answer — it depends on how you define \\\"measurement,\\\" where you draw the boundary, etc. Similarly, asking \\\"which pleasant caused the desire?\\\" resists definitive answer.\",\"realLifeExample\":\"Which straw broke the camel's back? You can't point to a single inherent cause. The last straw depended on all the others.\"},{\"q\":\"Does this mean evaluations are random?\",\"a\":\"No — they're CONDITIONED but not inherent. There are patterns (e.g., biological preferences) but these are dependent on biology, not inherent in objects. Conditioned ≠ random; conditioned = dependent.\",\"realLifeExample\":\"Most people find honey sweet — but that's biology (conditioned), not an inherent property of honey. To an alien with different taste buds, honey might be \\\"sour.\\\"\"},{\"q\":\"Significance?\",\"a\":\"V.6 eliminates the last possible foundation for inherent afflictions: the evaluative basis. V.1: arise from thought. V.2: thought-basis is empty. V.6: the evaluation is ITSELF empty. Emptiness at every level.\",\"deeper\":\"V.6 performs a regress: V.1 showed afflictions depend on evaluations. V.6 shows evaluations themselves are empty. This eliminates any attempt to ground afflictions in a solid evaluative foundation. The chain of dependence never bottoms out in something inherent — it's dependent arising all the way down.\"}],\"quiz\":{\"beginner\":{\"question\":\"Do pleasant/unpleasant evaluations have self-nature?\",\"options\":[\"A) Yes\",\"B) No — they're dependent on context, mood, culture, biology. No inherent pleasantness in objects. Evaluations are constructed.\",\"C) Only some\",\"D) Only pleasant\"],\"correct\":\"B\",\"explanation\":\"Evaluations are dependent on multiple factors. No inherent self-nature.\"},\"intermediate\":{\"question\":\"How does v.6 deepen the analysis?\",\"options\":[\"A) It doesn't\",\"B) V.2: afflictions depend on evaluations (empty). V.6: evaluations THEMSELVES are empty. Emptiness at every level — no foundation anywhere.\",\"C) Same as v.2\",\"D) Contradicts v.2\"],\"correct\":\"B\",\"explanation\":\"Deeper: not just afflictions are empty, but their evaluative basis is too. Empty all the way down.\"},\"advanced\":{\"question\":\"What is the philosophical significance of \\\"emptiness all the way down\\\"?\",\"options\":[\"A) Problematic\",\"B) The chain of dependence never bottoms out in something inherent. Every level is dependent on another empty level. This demonstrates that dependent arising (not inherent existence) is the fundamental nature of all phenomena.\",\"C) Must have a foundation\",\"D) Only applies here\"],\"correct\":\"B\",\"explanation\":\"No foundational inherent existence. Dependent arising is fundamental. Emptiness at every level.\"}},\"verseText\":\"The pleasant, the unpleasant, and errors do not arise by their own nature. Dependent on which pleasant, unpleasant, and errors do the afflictions arise?\",\"madhyamakaConcept\":\"Śubha aśubha viparyāsa svabhāvena na utpadyante (pleasant, unpleasant, errors don't arise by own nature). Katamam śubham āśritya kleśāḥ (dependent on WHICH pleasant do afflictions arise?). The specificity question undermines inherent dependence.\",\"quantumPhysicsParallel\":\"Which specific measurement caused the collapse? In QM, the \\\"measurement problem\\\" resists precise answer. V.6: which specific \\\"pleasant\\\" caused the desire? Equally imprecise when analyzed carefully.\"}},\"isShowcase\":false,\"chapterId\":23}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{

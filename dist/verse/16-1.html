176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":16,\"verseId\":1,\"chapterTitle\":\"Examination of Bondage and Liberation\",\"totalVerses\":10,\"verseData\":{\"id\":\"v16_1\",\"number\":1,\"title\":\"Neither Permanent nor Impermanent Things Can Transmigrate\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If compounded phenomena transmigrate, They do not transmigrate as permanent. If they are impermanent they do not transmigrate. The same approach applies to sentient beings.\"},\"philosophy\":{\"insight\":\"A dilemma targeting transmigration (saṃsāra): IF phenomena are permanent, they can't transmigrate (change requires non-permanence). IF they're impermanent (momentary), they can't transmigrate either (no continuity — each moment is a new, disconnected thing). Transmigration requires BOTH continuity AND change — which inherent existence (either permanent or impermanent) can't provide.\",\"madhyamaka\":\"Inherently permanent saṃskāra (compounded phenomena) can't transmigrate because transmigration implies movement/change across lives, and permanent things can't change. Inherently impermanent (momentary) saṃskāra can't transmigrate because each moment is a distinct entity — there's no continuous \\\"thing\\\" moving from one life to the next. The same analysis applies to sattva (sentient beings).\",\"quantum\":\"Quantum decoherence: a quantum system transitions between states without being either permanently fixed or instantaneously discontinuous. The system evolves continuously through interaction with its environment — neither permanently in one state nor disconnected from its past. This avoids both extremes that Nāgārjuna critiques.\",\"bridge\":\"Both quantum decoherence and Buddhist transmigration show process without inherent permanence or total discontinuity. QM: quantum states evolve continuously without fixed identity. Buddhism: beings transmigrate conventionally without permanent or momentary existence. Both: process requires continuity-within-change, which inherent existence can't provide.\",\"accessible\":\"If you're permanently the same person forever, you can't grow, change, or move from one life to the next. But if you're completely different each instant, there's no \\\"you\\\" to make the journey. Transmigration needs both continuity and change — which only works if you're NOT inherently fixed or inherently momentary.\",\"twoTruths\":\"Conventionally, beings transmigrate through saṃsāra. Ultimately, neither permanent nor impermanent transmigration can be inherently established. The conventional process works; the inherent process doesn't.\",\"commonMisconception\":\"NOT denying transmigration/rebirth. Transmigration works CONVENTIONALLY through dependent arising. What doesn't work: INHERENT transmigration of an inherently permanent or inherently momentary entity.\"},\"quantumResonance\":{\"concept\":\"Quantum Decoherence — State Transitions Without Fixed Identity\",\"score\":70,\"strength\":\"High\",\"explanation\":\"Decoherence shows quantum systems transitioning between states without being permanently fixed or instantaneously discontinuous. Like transmigration: the process requires continuity-within-change, not inherent permanence or inherent momentariness.\",\"caveat\":\"Decoherence is a specific QM process involving environmental interaction. The parallel is about process requiring neither permanence nor total discontinuity.\"},\"animation\":{\"visualBridge\":\"A quantum state smoothly transitioning through decoherence — neither frozen solid (permanent) nor blinking in/out (momentary). Continuous evolution without fixed identity.\",\"educationalGoal\":\"User sees that processes like transmigration require continuity-within-change — not available through inherent permanence or momentariness.\"},\"deeperDive\":[{\"q\":\"Why can't permanent things transmigrate?\",\"a\":\"Transmigration means moving from one life/state to another — a form of change. Permanent things, by definition, can't change. If phenomena were inherently permanent, they'd be frozen forever — no birth, death, or rebirth.\",\"realLifeExample\":\"A photograph can't walk across a room — it's permanently fixed. Only something that can change (a person) can move. Permanent = no movement = no transmigration.\"},{\"q\":\"Why can't impermanent (momentary) things transmigrate?\",\"a\":\"If phenomena are inherently momentary (lasting only one instant), each instant is a completely new entity. There's no continuous \\\"thing\\\" that persists across instants to make the journey. Transmigration requires a \\\"traveler\\\" — momentariness provides none.\",\"realLifeExample\":\"A series of completely different people (each lasting one second) isn't \\\"one person traveling.\\\" Transmigration needs continuity — someone who persists across the journey. Momentary entities can't provide this.\"},{\"q\":\"How does decoherence avoid both extremes?\",\"a\":\"Quantum decoherence is a continuous process: a quantum system gradually transitions from a coherent superposition to a classical-like state through environmental interaction. It's not permanently fixed (it changes) nor instantaneously discontinuous (it evolves smoothly). This middle-ground process mirrors conventional transmigration.\",\"realLifeExample\":\"A river changes continuously — not permanently fixed (water flows) nor instantaneously discontinuous (the river doesn't blink in and out). It's a continuous process of change — like conventional transmigration.\"},{\"q\":\"Why does this apply to sentient beings too?\",\"a\":\"Sentient beings are compounded phenomena — composed of aggregates (skandhas). Whatever applies to compounded phenomena applies to beings: neither permanent beings nor momentary beings can inherently transmigrate. Conventional beings transmigrate conventionally.\",\"realLifeExample\":\"A company is compounded of employees, assets, culture. If the company is inherently permanent, it can't change industries. If it's momentary, there's no company to transform. Conventional companies evolve — neither permanent nor momentary.\"},{\"q\":\"How does this connect to Ch.15?\",\"a\":\"Ch.15 showed essence is impossible. Ch.16 applies this result to saṃsāra/nirvāṇa. Without inherent essence, neither permanent nor impermanent transmigration works. But dependent arising (without essence) allows conventional transmigration.\",\"realLifeExample\":\"Ch.15 proved \\\"there's no fixed foundation.\\\" Ch.16 asks: \\\"What happens to the building (saṃsāra/nirvāṇa) without the foundation?\\\" Answer: inherent buildings collapse, but conventional ones stand on dependent arising.\"},{\"q\":\"What is the chapter's strategy?\",\"a\":\"VV.1-3: inherent transmigration is impossible (permanent/impermanent/grasping analyses). VV.4-5: inherent nirvāṇa is impossible. VV.6-8: inherent bondage/release is impossible. V.9: grasping at non-grasping is the greatest grasping. V.10: reframing the question through emptiness.\",\"deeper\":\"Ch.16 is structurally important because it directly addresses saṃsāra and nirvāṇa — the two central concepts of Buddhist soteriology. By showing both can't be inherently established, Nāgārjuna prepares for Ch.25's revolutionary claim: saṃsāra and nirvāṇa are not inherently different. Ch.16 is the necessary groundwork.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can neither permanent nor impermanent things transmigrate?\",\"options\":[\"A) Both can transmigrate\",\"B) Permanent things can't change (so can't travel). Momentary things have no continuity (no \\\"traveler\\\"). Transmigration requires both continuity AND change.\",\"C) Only permanent things can transmigrate\",\"D) Only impermanent things can transmigrate\"],\"correct\":\"B\",\"explanation\":\"Transmigration needs continuity-within-change. Permanence → no change. Momentariness → no continuity. Neither works for inherent transmigration.\"},\"intermediate\":{\"question\":\"How does quantum decoherence avoid the permanence/momentariness extremes?\",\"options\":[\"A) It doesn't\",\"B) Decoherence is a continuous process: a quantum system gradually transitions without being permanently fixed or instantaneously discontinuous. It evolves smoothly — continuity-within-change.\",\"C) Decoherence is permanent\",\"D) Decoherence is instantaneous\"],\"correct\":\"B\",\"explanation\":\"Decoherence evolves continuously — not frozen (permanent) nor blinking (momentary). This middle-ground process mirrors conventional transmigration.\"},\"advanced\":{\"question\":\"How does Ch.16 prepare for Ch.25's identity of saṃsāra and nirvāṇa?\",\"options\":[\"A) It doesn't\",\"B) By showing both saṃsāra and nirvāṇa can't be inherently established. If neither has inherent existence, they can't be inherently DIFFERENT — preparing for Ch.25's claim that saṃsāra IS nirvāṇa (when emptiness is understood).\",\"C) Only saṃsāra is examined\",\"D) Ch.25 is unrelated\"],\"correct\":\"B\",\"explanation\":\"Ch.16 shows neither saṃsāra nor nirvāṇa can be inherently established. Without inherent existence, inherent difference is impossible — the groundwork for Ch.25's revolutionary identity claim.\"}},\"verseText\":\"If compounded phenomena transmigrate, They do not transmigrate as permanent. If they are impermanent they do not transmigrate. The same approach applies to sentient beings.\",\"madhyamakaConcept\":\"Inherently permanent saṃskāra (compounded phenomena) can't transmigrate because transmigration implies movement/change across lives, and permanent things can't change. Inherently impermanent (momentary) saṃskāra can't transmigrate because each moment is a distinct entity — there's no continuous \\\"thing\\\" moving from one life to the next. The same analysis applies to sattva (sentient beings).\",\"quantumPhysicsParallel\":\"Quantum decoherence: a quantum system transitions between states without being either permanently fixed or instantaneously discontinuous. The system evolves continuously through interaction with its environment — neither permanently in one state nor disconnected from its past. This avoids both extremes that Nāgārjuna critiques.\"}},\"isShowcase\":false,\"chapterId\":16}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter

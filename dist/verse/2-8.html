c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":8,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_8\",\"number\":8,\"title\":\"The Exhaustion of Categories\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Inasmuch as a real mover does not move, And a non-mover does not move, Apart from a mover and a non-mover, What third thing could move?\"},\"philosophy\":{\"insight\":\"Neither an inherently real mover (who is already defined as moving, making further motion redundant) nor an inherent non-mover (who by definition cannot move) can account for motion. No third option exists. The essentialist framework fails entirely.\",\"madhyamaka\":\"Garfield: this verse applies the excluded-middle exhaustion — mover, non-mover, or \\\"third thing\\\" covers all logical possibilities within essentialism, and all fail. Kalupahana: the verse parallels the tetralemma structure (catuṣkoṭi) applied to motion categories. The failure of ALL options shows the framework (inherent existence) is the problem, not any particular option.\",\"quantum\":\"Superposition / Tertium Non Datur Violation: In classical logic, something is either A or not-A (excluded middle). Quantum superposition violates this: a qubit is neither definitively |0⟩ nor definitively |1⟩, yet there's no \\\"third classical state.\\\" The system transcends the binary — just as motion transcends mover/non-mover categories.\",\"bridge\":\"Both reveal the failure of exhaustive binary classification when applied to inherent natures. Classical logic demands mover OR non-mover. Quantum mechanics shows systems that are neither state definitively. Nāgārjuna shows motion fits neither category, pointing beyond essentialism to dependent arising.\",\"accessible\":\"Is a glass \\\"full\\\" or \\\"empty\\\"? What if it's half-full? That's not a \\\"third type of glass\\\" — it shows the full/empty categorisation was too rigid. Similarly, real things move without being inherently \\\"movers\\\" or \\\"non-movers.\\\" The rigid categories fail.\",\"twoTruths\":\"Conventionally, we say 'the person walks' without confusion. Ultimately, the mover cannot be identified apart from the act of moving — the designation is purely relational.\",\"commonMisconception\":\"This does NOT deny that people walk. It denies that there is a 'walker-essence' that exists prior to and independent of the act of walking.\"},\"quantumResonance\":{\"concept\":\"Superposition / Excluded Middle Violation\",\"score\":88,\"strength\":\"High\",\"explanation\":\"Quantum superposition transcends the classical binary — neither definitively one state nor the other, yet no classical third option. Parallels the exhaustion of mover/non-mover categories.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Three Empty Pedestals\",\"anchor\":\"Three illuminated pedestals labelled \\\"Mover,\\\" \\\"Non-Mover,\\\" \\\"???\\\". Objects placed on each dissolve — none can hold a moving entity. The third pedestal flickers with static.\",\"texture\":\"Pedestals: Marble with glowing labels. Objects: Translucent spheres that dissolve into particles. Third pedestal: Glitching with noise.\",\"mood\":\"Exhaustive, final, illuminating\",\"colors\":[\"#06B6D4\",\"#EF4444\",\"#94A3B8\",\"#1E293B\"],\"orchestration\":{\"start\":\"Three pedestals with labels visible. A sphere hovers above, seeking a home.\",\"click\":\"Click a pedestal to place the sphere — it dissolves each time with explanation text.\",\"reveal\":\"After all three fail, sphere becomes a probability cloud. Text: \\\"Motion belongs to entities without fixed natures.\\\"\"},\"interaction\":{\"click\":\"Click pedestals to try placing the moving entity — watch each attempt fail\",\"drag\":\"Drag sphere to pedestals directly\",\"hover\":\"Hover shows why each category fails\"},\"controls\":{\"rotation\":{\"default\":false,\"speed\":0},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"drei RoundedBox for marble pedestals with emissive label strips\",\"Custom dissolution shader for sphere-to-particles transition\",\"InstancedMesh for probability cloud particles (1000 pooled)\",\"Glitch post-processing for third pedestal instability\",\"useSpring for sphere hover and placement animations\"],\"camera\":{\"position\":[0,3,10],\"fov\":50,\"autoRotate\":false},\"fps\":60,\"performanceNotes\":\"\u003c300MB memory, 60 FPS. Three simple box meshes. Sphere dissolution uses particle shader.\",\"tripoPrompt\":\"Three illuminated marble pedestals in dark space, a translucent sphere dissolving above each, the third pedestal glitching with noise, 8K.\",\"visualBridge\":\"The failure of all three pedestals to hold the sphere directly shows the exhaustion of inherent categories — motion transcends rigid classification.\",\"educationalGoal\":\"User sees that the 'mover' cannot be identified apart from 'moving' — identity emerges from process, not the reverse.\"},\"deeperDive\":[{\"q\":\"What does \\\"real mover\\\" mean here?\",\"a\":\"An entity with an inherent, unchanging essence of being a mover. Such a thing couldn't actually undergo motion (change from not-moving to moving), because its nature is already fixed as \\\"mover.\\\" Motion implies change, but inherent natures don't change.\",\"realLifeExample\":\"If a \\\"runner\\\" were inherently defined as running, they couldn't start running (they're already running) or stop (that would change their nature). The rigid category paralyses the very thing it describes.\"},{\"q\":\"Why can't a \\\"non-mover\\\" move?\",\"a\":\"By definition, something whose inherent essence is not-to-move cannot engage in motion without changing its nature. But inherent natures (svabhāva) don't change — that's what \\\"inherent\\\" means. So an inherent non-mover is permanently immobile.\",\"realLifeExample\":\"If someone were inherently \\\"unemployed\\\" (not just currently without a job, but essentially unemployable), they could never get a job. The rigid category prevents the very change it would need to allow.\"},{\"q\":\"How does superposition transcend the classical binary?\",\"a\":\"A qubit in state α|0⟩ + β|1⟩ is neither definitively |0⟩ nor |1⟩, but it's not a \\\"third classical value\\\" either. It exists in a mode that the classical binary cannot describe. Similarly, moving things are neither inherently \\\"movers\\\" nor \\\"non-movers\\\" — they exist in a mode (dependent arising) that essentialism cannot capture.\",\"realLifeExample\":\"Is someone \\\"asleep\\\" or \\\"awake\\\"? What about when they're drowsy, falling asleep, or in REM? The binary misses the rich spectrum of consciousness states.\"},{\"q\":\"Is the \\\"third thing\\\" question rhetorical?\",\"a\":\"Yes. It's a rhetorical question expecting the answer \\\"nothing.\\\" There IS no third inherent category. The point is that the framework of inherent categories is exhausted and has failed. The solution isn't finding a third category but abandoning the framework of inherent natures entirely.\",\"realLifeExample\":\"If neither a hammer nor a screwdriver can open a bottle, you don't look for a \\\"third tool\\\" in the same category — you realise you need a bottle opener. Different framework, different approach.\"},{\"q\":\"How does this relate to the tetralemma (catuṣkoṭi)?\",\"a\":\"The tetralemma examines: X, not-X, both, neither. This verse covers X (mover) and not-X (non-mover) and asks about a third option. V.18-21 will cover \\\"both\\\" (identity) and \\\"neither\\\" (complete difference). Together they exhaust all logical possibilities, showing inherent motion fails in every case.\",\"realLifeExample\":\"Is this sentence true, false, both, or neither? (\\\"This sentence is false.\\\") The liar paradox shows some things can't be pinned down by any of the four options — the categories themselves are the problem.\"},{\"q\":\"What does the failure of all categories imply positively?\",\"a\":\"That motion belongs to entities that lack fixed, inherent natures — entities that are dependently arisen and empty of svabhāva. Emptiness isn't the absence of motion; it's the CONDITION for motion. Only things without rigid essences can change.\",\"deeper\":\"This connects to Ch. 24:14: \\\"Those for whom emptiness is possible, for them everything is possible.\\\" The failure of essentialist categories points to the success of dependent arising.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can't an inherently real \\\"mover\\\" account for motion?\",\"options\":[\"A) Because movers are too fast\",\"B) Because an inherent nature is fixed and unchanging, so it can't undergo the change that motion requires\",\"C) Because movers don't exist\",\"D) Because motion is an illusion\"],\"correct\":\"B\",\"explanation\":\"An inherent \\\"mover\\\" nature would be fixed and unchanging. Motion requires change (from rest to movement). A fixed nature can't undergo change, so it paradoxically can't account for motion.\"},\"intermediate\":{\"question\":\"How does quantum superposition relate to the \\\"third thing\\\" question?\",\"options\":[\"A) It provides a third classical state\",\"B) It shows systems can exist in modes that transcend classical binary categories, just as motion transcends mover/non-mover\",\"C) It proves the third thing exists\",\"D) It has no relation\"],\"correct\":\"B\",\"explanation\":\"Superposition shows quantum systems existing beyond classical either/or. Similarly, motion exists beyond the inherent categories of mover/non-mover — both frameworks point to the inadequacy of rigid binary classification.\"},\"advanced\":{\"question\":\"What is the positive implication of all categories failing?\",\"options\":[\"A) Nothing exists\",\"B) We need more categories\",\"C) Motion belongs to entities without fixed natures — the framework of inherent existence is the problem, and dependent arising is the solution\",\"D) Logic is useless\"],\"correct\":\"C\",\"explanation\":\"The failure of ALL essentialist categories shows the problem is essentialism itself. Motion works because entities lack fixed natures and are dependently arisen. Emptiness enables motion.\"}},\"verseText\":\"Inasmuch as a real mover does not move, And a non-mover does not move, Apart from a mover and a non-mover, What third thing could move?\",\"madhyamakaConcept\":\"Garfield: this verse applies the excluded-middle exhaustion — mover, non-mover, or \\\"third thing\\\" covers all logical possibilities within essentialism, and all fail. Kalupahana: the verse parallels the tetralemma structure (catuṣkoṭi) applied to motion categories. The failure of ALL options shows the framework (inherent existence) is the problem, not any particular option.\",\"quantumPhysicsParallel\":\"Superposition / Tertium Non Datur Violation: In classical logic, something is either A or not-A (excluded middle). Quantum superposition violates this: a qubit is neither definitively |0⟩ nor definitively |1⟩, yet there's no \\\"third classical state.\\\" The system transcends the binary — just as motion transcends mover/non-mover categories.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"desc

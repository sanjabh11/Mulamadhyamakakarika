88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":17,\"verseId\":23,\"chapterTitle\":\"Examination of Action and Fruit\",\"totalVerses\":33,\"verseData\":{\"id\":\"v17_23\",\"number\":23,\"title\":\"Uncreated Action Destroys Ethics: Encountering What You Never Did\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If an action were uncreated, Fear would arise of encountering something not done. And the error of not preserving One's vows would arise.\"},\"philosophy\":{\"insight\":\"Ethical consequences of v.22's reductio: if action were uncreated (eternal, essentialist), two devastating absurdities follow: (1) you could encounter results of actions you never performed (akṛtaphala — fruit of the undone). (2) Ethical vows would be impossible to maintain (saṃvara-doṣa — error of discipline).\",\"madhyamaka\":\"Akṛtakarmaphala-prāpti: encountering the fruit of undone karma. If actions aren't tied to agents (uncreated), consequences could fall on anyone regardless of their deeds. Saṃvara-doṣa: ethical discipline (śīla) requires intentional agency — choosing to follow vows. Uncreated action eliminates agency, making vows impossible.\",\"quantum\":\"Violation of conservation laws: if quantum states weren't conserved through unitary evolution, outcomes could be random — you could \\\"measure\\\" a state you never prepared. Like encountering karma you never created. Conservation ensures that what you put in is what you get out.\",\"bridge\":\"Both karmic law and quantum conservation ensure that outcomes are linked to inputs. Karma: you encounter results of YOUR actions (not random ones). QM: you measure states YOU prepared (not random outcomes). Both: lawfulness requires connection between input and output.\",\"accessible\":\"Imagine being punished for crimes you never committed — that's \\\"encountering something not done.\\\" Now imagine trying to keep a diet when what you eat has no connection to your weight — that's the \\\"vows\\\" problem. If actions aren't created by agents, the whole system of responsibility collapses.\",\"twoTruths\":\"Conventionally: actions are created by agents, and results follow from those specific actions. This requires emptiness (dependent arising). Ultimately: agent, action, and result are all empty. But the EMPTY process of karma ensures that results follow from YOUR actions — emptiness grounds, not destroys, responsibility.\",\"commonMisconception\":\"NOT arguing that karma is deterministic or that you can ONLY experience results of your OWN past actions (some Buddhist schools allow for environmental/shared karma). V.23 argues against the COMPLETE DISCONNECTION of agent from result that would follow from uncreated action.\"},\"quantumResonance\":{\"concept\":\"Conservation Laws — Outcomes Linked to Inputs\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"Quantum conservation ensures outcomes are linked to prepared states. Like karma: results follow from YOUR actions, not random events. Both require lawful connection between cause and effect.\",\"caveat\":\"Quantum conservation is a physical principle. Karmic connection is a metaphysical/ethical one. The parallel is about lawful linkage of input to output.\"},\"animation\":{\"visualBridge\":\"A figure receives dark karmic consequences falling randomly from the sky — things they never did. Another figure tries to maintain vows but their actions randomly disconnect from outcomes. Chaos and injustice reign in the \\\"uncreated action\\\" world.\",\"educationalGoal\":\"User sees the ethical horror of uncreated action: random consequences, impossible discipline, total moral chaos.\"},\"deeperDive\":[{\"q\":\"What is \\\"encountering something not done\\\" (akṛtaphala)?\",\"a\":\"Experiencing the karmic fruit of an action you never performed. If actions aren't linked to agents (uncreated), karmic consequences could fall on ANYONE — like being convicted of a crime committed by a stranger. This is one of the most feared consequences in Buddhist ethics.\",\"realLifeExample\":\"Being charged with someone else's credit card debt. In a system without agent-action linkage, you could \\\"inherit\\\" anyone's karmic debt randomly. The entire concept of personal responsibility dissolves.\"},{\"q\":\"Why can't vows be preserved?\",\"a\":\"Vows (saṃvara) require three things: (1) an AGENT who makes the vow, (2) INTENTIONAL restraint from specific actions, (3) CONNECTION between the agent's discipline and its karmic results. Uncreated action eliminates all three — no agent, no intention, no connection. Vows become meaningless sounds.\",\"realLifeExample\":\"A diet requires: (1) YOU deciding to diet, (2) intentionally choosing foods, (3) your food choices affecting your health. If eating were \\\"uncreated\\\" (no agent), you couldn't diet — food would appear regardless of your choices.\"},{\"q\":\"How does this follow from v.22?\",\"a\":\"V.22: essence → eternal → uncreated. V.23: uncreated → (1) random consequences, (2) impossible discipline. The chain: essence → eternal → uncreated → ethical collapse. This is the PRACTICAL consequence of the philosophical error identified in v.22.\",\"realLifeExample\":\"V.22: \\\"If bridges were eternal, they couldn't be built.\\\" V.23: \\\"And if bridges weren't built, you'd randomly find yourself on one you didn't create — or unable to maintain the bridge you need.\\\" Theory (v.22) → practical disaster (v.23).\"},{\"q\":\"Is this a prasaṅga (reductio) argument?\",\"a\":\"Yes — classic Mādhyamika prasaṅga: assume the opponent's position (action has essence), derive absurd consequences (uncreated → random results, impossible vows), conclude the position is untenable. The absurdity of the consequences proves the falsity of the premise.\",\"realLifeExample\":\"Proof by contradiction in math: assume √2 is rational → derive contradiction → conclude √2 is irrational. Nāgārjuna: assume action has essence → derive ethical absurdity → conclude action lacks essence.\"},{\"q\":\"Why is this verse important for Buddhist monasticism?\",\"a\":\"Monastic life centers on VOWS (prātimokṣa) — intentional disciplinary rules. If vows can't be preserved (as v.23 warns under essentialism), the entire monastic institution collapses. V.23 shows that monasticism REQUIRES emptiness: only empty action allows intentional discipline.\",\"realLifeExample\":\"A legal system requires that laws can be intentionally followed. If actions were random (uncreated), laws would be unenforceable. V.23: essentialism makes the \\\"rule of karmic law\\\" unenforceable.\"},{\"q\":\"How does emptiness solve these problems?\",\"a\":\"Empty action is CREATED by agents (through intention and conditions) and LINKED to specific agents (through dependent arising). This ensures: (1) you encounter results of YOUR actions (not random ones), (2) vows CAN be maintained (intentional discipline works). Emptiness GROUNDS ethics.\",\"deeper\":\"V.23 is devastating for the essentialist because it shows that their position — meant to PROTECT karma and ethics by giving them \\\"solid\\\" foundation — actually DESTROYS karma and ethics. This is Nāgārjuna's most characteristic argumentative move: showing that the opponent's position produces the exact opposite of what they intended. The essentialist wants reliable karma? Essence destroys it. The essentialist wants ethical discipline? Essence makes it impossible. Only emptiness gives them what they actually want.\"}],\"quiz\":{\"beginner\":{\"question\":\"What happens if actions are \\\"uncreated\\\"?\",\"options\":[\"A) Nothing bad\",\"B) You could face consequences of actions you never performed, and keeping ethical vows would be impossible. The whole system of moral responsibility collapses.\",\"C) Better ethics\",\"D) Stronger karma\"],\"correct\":\"B\",\"explanation\":\"Uncreated action → random consequences + impossible discipline = ethical collapse.\"},\"intermediate\":{\"question\":\"How does v.23 continue the reductio from v.22?\",\"options\":[\"A) It doesn't\",\"B) V.22: essence → eternal → uncreated. V.23: uncreated → random consequences + impossible vows. The chain shows that inherent essence leads to complete ethical collapse.\",\"C) V.23 contradicts v.22\",\"D) They're separate arguments\"],\"correct\":\"B\",\"explanation\":\"V.22 establishes the theoretical absurdity (uncreated). V.23 derives the practical ethical consequences (random results, impossible discipline).\"},\"advanced\":{\"question\":\"Why does Nāgārjuna's argument show the essentialist's position is self-defeating?\",\"options\":[\"A) It doesn't\",\"B) The essentialist asserts inherent existence to PROTECT karma and ethics — but essence actually DESTROYS both (uncreated action → random consequences, no vows). Only emptiness provides the ethics the essentialist wants.\",\"C) Essentialism protects ethics\",\"D) Emptiness destroys ethics\"],\"correct\":\"B\",\"explanation\":\"The essentialist's cure is the disease. Essence destroys what it's meant to protect. Only emptiness grounds reliable karma and ethics.\"}},\"verseText\":\"If an action were uncreated, Fear would arise of encountering something not done. And the error of not preserving One's vows would arise.\",\"madhyamakaConcept\":\"Akṛtakarmaphala-prāpti: encountering the fruit of undone karma. If actions aren't tied to agents (uncreated), consequences could fall on anyone regardless of their deeds. Saṃvara-doṣa: ethical discipline (śīla) requires intentional agency — choosing to follow vows. Uncreated action eliminates agency, making vows impossible.\",\"quantumPhysicsParallel\":\"Violation of conservation laws: if quantum states weren't conserved through unitary evolution, outcomes could be random — you could \\\"measure\\\" a state you never prepared. Like encountering karma you never created. Conservation ensures that what you put in is what you get out.\"}},\"isShowcase\":false,\"chapterId\":17}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Study the MMK with interactive verse exploration, research-mode transparency, and carefully caveated quantum analogies

c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":1,\"verseId\":4,\"chapterTitle\":\"Examination of Conditions\",\"totalVerses\":14,\"verseData\":{\"id\":\"v1_4\",\"title\":\"Power to Act\",\"sanskrit\":{\"text\":\"kriyā na pratyayavatī nāpratyayavatī kriyā\",\"transliteration\":\"kriyā na pratyayavatī nāpratyayavatī kriyā\",\"translation\":\"Action does not possess conditions, nor is action without conditions\"},\"philosophy\":{\"insight\":\"Conditions don't \\\"possess\\\" the power to produce results; power is not an item.\",\"madhyamaka\":\"Nagarjuna deconstructs the notion that conditions contain some \\\"power\\\" that gets transferred to the effect. Power is not a thing that can be possessed.\",\"quantum\":\"The wave function isn't a physical wave carrying force; it's a mathematical abstraction of potential.\",\"bridge\":\"Both frameworks show that \\\"power\\\" or \\\"potential\\\" is not a transferable substance but a relational description.\",\"accessible\":\"When you push a ball, does your \\\"push-power\\\" physically transfer into the ball? Or does the ball move because of the relational interaction? Nagarjuna argues conditions don't \\\"possess\\\" a transferable power — they function relationally.\",\"twoTruths\":\"Conventionally, conditions enable results through interaction. Ultimately, no inherent \\\"power\\\" exists as a transferable substance within conditions.\",\"commonMisconception\":\"NOT saying conditions are powerless. Saying power is not a THING inside conditions — it's a relational description of how conditions interact.\"},\"quantumResonance\":{\"concept\":\"Probability Amplitude\",\"score\":82,\"strength\":\"High\",\"explanation\":\"The wave function isn't a physical wave carrying force; it's a mathematical abstraction of potential.\",\"caveat\":\"Quantum field interactions and Buddhist conditions both involve relational processes without substance transfer. Structural parallel.\"},\"animation\":{\"geometry\":\"Fluid in Glass Container\",\"anchor\":\"A Fluid Simulation inside a glass container. The fluid is dormant.\",\"texture\":\"Fluid: Viscous, pearlescent purple liquid (#8B5CF6). Container: Invisible/Refractive glass.\",\"mood\":\"Ethereal, dreamlike, soft focus\",\"colors\":[\"#8B5CF6\",\"#E0E7FF\",\"#06B6D4\"],\"orchestration\":{\"start\":\"Purple fluid floats dormant in zero gravity.\",\"click\":\"User clicks a \\\"Trigger\\\" button. The fluid attempts to surge but passes through the glass walls as ghost-like mist.\",\"logic\":\"Shows that the \\\"power\\\" to act isn't contained within the object; it's a relational event, not a stored force.\"},\"interaction\":{\"click\":\"Trigger the fluid to attempt action - watch it phase through\",\"drag\":\"Rotate container to view the non-substantial nature of power\",\"hover\":\"See fluid shimmer, hinting at potential that cannot actualize alone\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.2},\"speed\":{\"default\":30,\"min\":0,\"max\":100},\"complexity\":{\"default\":80,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Custom fluid simulation shader (Navier-Stokes approximation in fragment shader)\",\"MeshPhysicalMaterial with transmission for invisible glass container\",\"InstancedMesh for ghost-mist particles when fluid phases through walls\",\"Bloom + DepthOfField post-processing for dreamlike atmosphere\",\"useFrame-driven fluid viscosity animation with configurable speed\"],\"camera\":{\"position\":[0,0,5],\"fov\":55,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c350MB memory, 60 FPS. Fluid sim uses 2D texture-based approximation (not full 3D SPH). Ghost particles pooled via InstancedMesh.\",\"tripoPrompt\":\"Pearlescent purple fluid floating in zero gravity, contained in an invisible sphere, soft bioluminescent glow, 8K, macro photography style.\",\"visualBridge\":\"Demonstrates that \\\"Power\\\" (the fluid) is not a solid thing possessed by the \\\"Condition\\\" (the container).\",\"educationalGoal\":\"User grasps that causal \\\"power\\\" is relational, not a substance hidden inside conditions waiting to transfer.\"},\"deeperDive\":[{\"q\":\"What does Nagarjuna mean by \\\"action does not possess conditions\\\"?\",\"a\":\"He's deconstructing the idea that conditions contain some transferable \\\"power\\\" or \\\"force\\\" that gets passed to the action. Power isn't a possessable item.\",\"realLifeExample\":\"We say a battery \\\"has\\\" power, but the battery doesn't contain little packets of force. \\\"Power\\\" describes a relationship between battery, circuit, and device - not a substance.\"},{\"q\":\"How does the wave function relate to this?\",\"a\":\"The quantum wave function describes probabilities, not a physical wave carrying force. It's a mathematical tool, not a substance that transfers \\\"power\\\" to particles.\",\"realLifeExample\":\"A weather forecast shows probability percentages - these numbers don't \\\"cause\\\" rain. They describe relationships between conditions. The probability isn't a force.\"},{\"q\":\"Why does the fluid pass through the glass as mist?\",\"a\":\"It visualizes that the \\\"power\\\" supposedly contained in conditions cannot actually be grasped or transferred. When you look for power as a thing, it dissolves.\",\"realLifeExample\":\"Try to grab your \\\"motivation\\\" as a thing. You can describe it, but you can't hold it. It's a relational process, not an object.\"},{\"q\":\"If power isn't a thing, how do causes produce effects?\",\"a\":\"Effects arise through the relational configuration of conditions, not through power-transfer. \\\"Causation\\\" describes relationships, not a mechanism of force delivery.\",\"realLifeExample\":\"How does a key open a lock? Not by transferring \\\"opening power.\\\" The lock opens because of the relational fit between key shape and lock mechanism.\"},{\"q\":\"What's the practical implication of this teaching?\",\"a\":\"Stop looking for power, potential, or capability as things you possess or lack. They describe relationships and processes, not possessions.\",\"realLifeExample\":\"You don't \\\"have\\\" creativity as an object. Creativity emerges in the relationship between you, materials, context, and purpose. It's not stored in you.\"},{\"q\":\"Why is the wave function's |ψ|² a probability, not a force?\",\"a\":\"The Born rule gives |ψ|² as the probability density for finding a particle at a location. Crucially, ψ itself is not a physical wave carrying energy or force through space — it is a mathematical encoding of relational information about what WOULD happen given a measurement context. No \\\"power\\\" travels from ψ to the particle. This mirrors Nāgārjuna's point exactly: conditions don't possess transferable power. The wave function describes relational potential, not a substance that acts.\",\"realLifeExample\":\"A bus timetable describes when buses will arrive, but the timetable doesn't \\\"power\\\" the buses. It encodes relational information. Confusing the description for the mechanism is the error both Nāgārjuna and quantum mechanics correct.\"}],\"quiz\":{\"beginner\":{\"question\":\"According to Nagarjuna, where is \\\"power to act\\\" located?\",\"options\":[\"A) In the cause\",\"B) In the effect\",\"C) Nowhere as a possessable item - it's relational\",\"D) In the conditions\"],\"correct\":\"C\",\"explanation\":\"Nagarjuna shows that power is not a thing that can be located or possessed. It's a relational description, not an item to be found somewhere.\"},\"intermediate\":{\"question\":\"How does the wave function parallel Nagarjuna's point about power?\",\"options\":[\"A) The wave function is a physical force that moves particles\",\"B) The wave function describes probabilities relationally, not as transferable substance\",\"C) Wave functions prove power exists inherently\",\"D) There is no parallel\"],\"correct\":\"B\",\"explanation\":\"Like power in Nagarjuna's analysis, the wave function is a relational/mathematical description, not a physical substance carrying force from cause to effect.\"},\"advanced\":{\"question\":\"What error does reifying \\\"power\\\" commit according to Madhyamaka?\",\"options\":[\"A) It correctly identifies the mechanism of causation\",\"B) It treats a relational process as if it were an inherently existing thing\",\"C) It denies causation\",\"D) It follows the middle way\"],\"correct\":\"B\",\"explanation\":\"Reifying power means treating a relational description as if it were an inherently existing substance - the fundamental error Madhyamaka deconstructs throughout.\"}},\"number\":4,\"verseText\":\"Action does not possess conditions, nor is action without conditions\",\"madhyamakaConcept\":\"Nagarjuna deconstructs the notion that conditions contain some \\\"power\\\" that gets transferred to the effect. Power is not a thing that can be possessed.\",\"quantumPhysicsParallel\":\"The wave function isn't a physical wave carrying force; it's a mathematical abstraction of potential.\"}},\"isShowcase\":false,\"chapterId\":1}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\

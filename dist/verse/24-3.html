176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":24,\"verseId\":3,\"chapterTitle\":\"Examination of the Noble Truths\",\"totalVerses\":40,\"verseData\":{\"id\":\"v24_3\",\"number\":3,\"title\":\"Without These, the Four Fruits Do Not Exist\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Without these, the four fruits do not exist. Without fruits there are no attainers of fruits. There are no practitioners either.\"},\"philosophy\":{\"insight\":\"Further cascade: without the four activities (v.2), the four fruits of practice (stream-enterer, once-returner, non-returner, arhat) don't exist. Without fruits, no attainers. Without attainers, no practitioners. The entire sangha collapses.\",\"madhyamaka\":\"Tāni cet na santi catvāri phalāni na santi (without these, no four fruits). Phala vinā phala-sthā na santi (without fruits, no fruit-attainers). Pratipannakā api na santi (no practitioners either). The sangha — the community of practitioners and realized beings — is destroyed.\",\"quantum\":\"If QM applications are impossible (v.2), then quantum computing, cryptography, and sensing are impossible. Without applications, no quantum engineers. Without engineers, no quantum industry. Cascading collapse of technology.\",\"bridge\":\"Both: cascading collapse from theory through practice to community. QM: no applications → no practitioners → no industry. V.3: no fruits → no attainers → no practitioners.\",\"accessible\":\"If medical treatments don't work (v.2), there are no cures, no doctors, no patients, no hospitals. The entire medical system collapses.\",\"twoTruths\":\"The sangha exists CONVENTIONALLY — real practitioners, real attainments. The opponent demands INHERENT existence, which is unnecessary.\",\"commonMisconception\":\"The opponent assumes that without inherent existence, the sangha literally cannot exist. But the sangha exists conventionally through dependent designation.\"},\"quantumResonance\":{\"concept\":\"Cascading Collapse of Applied Framework\",\"score\":48,\"strength\":\"Medium\",\"explanation\":\"If theory collapses → applications collapse → practitioners collapse → community collapses. Same cascade in both QM-denial and emptiness-misunderstanding.\",\"caveat\":\"QM industry is physics. Sangha is Buddhist community.\"},\"animation\":{\"visualBridge\":\"A tower of blocks: \\\"Noble Truths\\\" → \\\"Practices\\\" → \\\"Fruits\\\" → \\\"Attainers\\\" → \\\"Sangha.\\\" Each block removed from the bottom, the tower collapses. Caption: \\\"The opponent's cascade.\\\"\",\"educationalGoal\":\"The objection cascades: no truths → no practices → no fruits → no sangha. Total collapse.\"},\"deeperDive\":[{\"q\":\"What are the four fruits?\",\"a\":\"Stream-enterer (sotāpanna), once-returner (sakadāgāmī), non-returner (anāgāmī), and arhat (fully liberated). These are the four stages of spiritual attainment in Buddhism.\",\"realLifeExample\":\"Four levels of medical training: intern, resident, fellow, attending. Each a progressively higher \\\"fruit\\\" of practice.\"},{\"q\":\"Why does this matter?\",\"a\":\"The sangha (community) is one of the Three Jewels (Buddha, Dharma, Sangha). If the sangha collapses, one-third of Buddhism's foundation is destroyed. The opponent is attacking Buddhism's social and institutional basis.\",\"realLifeExample\":\"If there are no qualified doctors, the medical profession collapses. No sangha = no organized Buddhism.\"},{\"q\":\"Is the opponent right?\",\"a\":\"Only IF emptiness = non-existence. If empty = non-existent, then fruits, attainers, and practitioners all cease to exist. But empty ≠ non-existent → the conclusion doesn't follow.\",\"realLifeExample\":\"If \\\"money is just paper\\\" meant \\\"money doesn't exist,\\\" then banks, economies, and jobs wouldn't exist either. But they do. The premise is wrong.\"},{\"q\":\"How does Nāgārjuna respond?\",\"a\":\"By showing that fruits, attainers, and practitioners exist CONVENTIONALLY through dependent designation. Their emptiness ENABLES spiritual progress — inherent fixity would prevent it.\",\"realLifeExample\":\"Medical degrees exist conventionally (not inherently). A doctor is a doctor through training, certification, and practice — not through inherent \\\"doctor-nature.\\\"\"},{\"q\":\"Connection to vv.1-2?\",\"a\":\"V.1: no arising/ceasing. V.2: no Noble Truths/practices. V.3: no fruits/attainers/practitioners. The cascade continues: ontology → soteriology → sangha.\",\"realLifeExample\":\"No ingredients → no cooking → no meals → no restaurants → no food industry. Each level cascades.\"},{\"q\":\"Significance?\",\"a\":\"V.3 attacks the COMMUNAL dimension of Buddhism. Even if you have theory and practice, without a community of practitioners, Buddhism can't survive. The opponent targets everything.\",\"deeper\":\"V.3 completes the cascade from individual practice (v.2) to communal structure (v.3). The opponent isn't just attacking philosophy but the social reality of Buddhism. This makes the refutation existential, not just theoretical.\"}],\"quiz\":{\"beginner\":{\"question\":\"What collapses without the four fruits?\",\"options\":[\"A) Nothing\",\"B) Attainers of fruits AND practitioners. The entire sangha (community). One of the Three Jewels destroyed.\",\"C) Only some\",\"D) Only attainers\"],\"correct\":\"B\",\"explanation\":\"No fruits → no attainers → no practitioners → no sangha. Cascade.\"},\"intermediate\":{\"question\":\"Why is the sangha's collapse significant?\",\"options\":[\"A) Not significant\",\"B) The sangha is one of the Three Jewels. Without it, Buddhism's communal and institutional foundation collapses. The attack targets Buddhism's social reality.\",\"C) Only theoretical\",\"D) Unrelated\"],\"correct\":\"B\",\"explanation\":\"One of Three Jewels. Social reality of Buddhism at stake.\"},\"advanced\":{\"question\":\"How does the cascade work across vv.1-3?\",\"options\":[\"A) No cascade\",\"B) V.1: ontological collapse (no arising). V.2: soteriological collapse (no Noble Truths). V.3: communal collapse (no sangha). From metaphysics through salvation to community.\",\"C) Same level\",\"D) Separate issues\"],\"correct\":\"B\",\"explanation\":\"Three levels of cascade: ontology → soteriology → community. Comprehensive attack.\"}},\"verseText\":\"Without these, the four fruits do not exist. Without fruits there are no attainers of fruits. There are no practitioners either.\",\"madhyamakaConcept\":\"Tāni cet na santi catvāri phalāni na santi (without these, no four fruits). Phala vinā phala-sthā na santi (without fruits, no fruit-attainers). Pratipannakā api na santi (no practitioners either). The sangha — the community of practitioners and realized beings — is destroyed.\",\"quantumPhysicsParallel\":\"If QM applications are impossible (v.2), then quantum computing, cryptography, and sensing are impossible. Without applications, no quantum engineers. Without engineers, no quantum industry. Cascading collapse of technology.\"}},\"isShowcase\":false,\"chapterId\":24}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"con

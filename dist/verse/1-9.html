c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":1,\"verseId\":9,\"chapterTitle\":\"Examination of Conditions\",\"totalVerses\":14,\"verseData\":{\"id\":\"v1_9\",\"number\":9,\"title\":\"Emptiness of the Immediate Condition\",\"sanskrit\":{\"text\":\"anutpannāś ca ye bhāvā na teṣāṃ vidyate sthitiḥ\",\"transliteration\":\"anutpannāś ca ye bhāvā na teṣāṃ vidyate sthitiḥ\",\"translation\":\"If phenomena are not arisen, cessation is not tenable. Therefore, an immediate condition is unreasonable. For what has ceased, how can it be a condition?\"},\"philosophy\":{\"insight\":\"Nāgārjuna dismantles the third condition — the immediately preceding condition (samanantarapratyaya). If things don't inherently arise, they can't inherently cease. A ceased thing, having no existence, cannot serve as an inherently existing condition for the next moment.\",\"madhyamaka\":\"This verse targets the samanantarapratyaya (immediately preceding condition), which in Abhidharma ensures continuity of consciousness from moment to moment. Garfield: \\\"If there is no arising, there is no duration, and hence no cessation. So nothing can serve as an immediately preceding condition.\\\" Kalupahana: the verse exposes the absurdity of a ceased entity possessing causal power — what has ceased cannot inherently condition what follows.\",\"quantum\":\"Quantum Decoherence and the Arrow of Time: When a quantum system interacts with its environment, coherent superposition \\\"decoheres\\\" into classical-seeming states. The prior coherent state doesn't inherently \\\"cease\\\" — it becomes entangled with the environment, making the concept of clear cessation problematic.\",\"bridge\":\"Both frameworks challenge the idea of clean, inherent cessation. In decoherence, quantum information isn't destroyed but dispersed. In Madhyamaka, \\\"cessation\\\" isn't an inherent event but a conventional description of transformation.\",\"accessible\":\"Imagine a wave in the ocean. Does it \\\"cease\\\" when it breaks on shore? The water is still there — it just changed form. Nāgārjuna argues that if things don't truly arise with inherent existence, they can't truly cease either. And if they can't truly cease, how can the \\\"ceased\\\" previous moment serve as a real condition for the next?\",\"twoTruths\":\"Conventionally, moments of consciousness follow each other in sequence. Ultimately, the \\\"immediate prior condition\\\" cannot transfer inherent existence from one moment to the next.\",\"commonMisconception\":\"NOT saying consciousness has no continuity. Saying the MECHANISM of continuity is not inherent substance-transfer but dependent arising.\"},\"quantumResonance\":{\"concept\":\"Decoherence / Arrow of Time\",\"score\":87,\"strength\":\"High\",\"explanation\":\"Decoherence shows quantum states don't cleanly \\\"cease\\\" — they disperse into environmental entanglement. Parallels the impossibility of inherent cessation.\",\"caveat\":\"Quantum decoherence and Buddhist cessation-as-condition both show transformation without inherent annihilation. Structural parallel.\"},\"animation\":{\"geometry\":\"Temporal Chain Dissolution\",\"anchor\":\"A chain of glowing orbs (representing moments of consciousness), each linked to the next. The chain stretches from left (past) to right (future).\",\"texture\":\"Orbs: Gradient from bright violet (#8B5CF6) to transparent. Links: Pulsing energy threads that fade when examined.\",\"mood\":\"Temporal, flowing, dissolving certainty\",\"colors\":[\"#8B5CF6\",\"#06B6D4\",\"#94A3B8\",\"#E0E7FF\"],\"orchestration\":{\"start\":\"Chain of 7 orbs linked in sequence, pulsing in rhythm.\",\"click\":\"User clicks any orb — it fades to show \\\"cessation.\\\" The link to the next orb dissolves. But then particles from the faded orb drift and reform as part of the NEXT orb, showing transformation rather than clean cessation.\",\"loop\":\"Chain reforms, each click reveals the same pattern — nothing cleanly ceases, nothing cleanly passes its \\\"power\\\" forward.\"},\"interaction\":{\"click\":\"Click an orb to trigger its \\\"cessation\\\" — watch the link dissolve and particles redistribute\",\"drag\":\"Scrub along the temporal chain to see the flow of conditions\",\"hover\":\"Orbs expand to show their \\\"content\\\" is empty — just swirling particles without solid core\"},\"controls\":{\"rotation\":{\"default\":false,\"speed\":0.2},\"speed\":{\"default\":60,\"min\":0,\"max\":100},\"complexity\":{\"default\":70,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"InstancedMesh for chain orbs with shared geometry\",\"Custom dissolve shader (noise-based alpha erosion) for cessation effect\",\"drei Trail for particle redistribution between orbs\",\"Bloom post-processing on energy links\",\"useSpring (drei) for smooth orb reformation\"],\"camera\":{\"position\":[0,2,10],\"fov\":50,\"autoRotate\":false},\"fps\":60,\"performanceNotes\":\"\u003c350MB memory, 60 FPS. Chain of 7 orbs with ~2000 particles each during dissolution. Dissolve shader uses GPU noise.\",\"tripoPrompt\":\"A chain of seven glowing violet orbs connected by pulsing energy threads, one orb dissolving into particles that flow toward the next orb, dark space background, cinematic depth of field, 8K.\",\"visualBridge\":\"The chain represents temporal succession. When an orb \\\"ceases,\\\" its particles redistribute rather than disappear — showing cessation is transformation, not inherent annihilation.\",\"educationalGoal\":\"User understands that cessation is transformation, not inherent annihilation — information disperses rather than vanishes.\"},\"deeperDive\":[{\"q\":\"What is the \\\"immediately preceding condition\\\" that this verse examines?\",\"a\":\"The samanantarapratyaya is the third of the four conditions. In Abhidharma Buddhism, each moment of consciousness is conditioned by the immediately preceding moment — like links in a chain. This is supposed to explain continuity of experience.\",\"realLifeExample\":\"Think of a relay race: each runner passes the baton to the next. The immediately preceding condition is like the previous runner — they must exist and act to pass the baton forward.\"},{\"q\":\"Why does Nāgārjuna say things are \\\"not arisen\\\"?\",\"a\":\"He has already argued (v.1-7) that inherent arising is impossible. Here he draws a consequence: if things don't inherently arise, they cannot inherently exist as stable entities that then undergo cessation. No inherent arising means no inherent cessation.\",\"realLifeExample\":\"If a building was never truly built (just an arrangement of materials), it can't truly be \\\"demolished.\\\" The materials just rearrange again.\"},{\"q\":\"Why can't a \\\"ceased\\\" thing serve as a condition?\",\"a\":\"If we require conditions to have inherent existence and causal power, then something that has ceased — that no longer exists — cannot possess or exert such power. A non-existent thing cannot inherently condition anything. The \\\"baton\\\" has been dropped.\",\"realLifeExample\":\"Can yesterday's extinguished candle light today's room? The flame is gone. If conditions need to inherently exist to work, a ceased condition is powerless.\"},{\"q\":\"How does quantum decoherence illustrate this?\",\"a\":\"In decoherence, a quantum superposition doesn't simply \\\"cease\\\" — it becomes entangled with the environment. The information isn't destroyed but dispersed. There's no clean moment of cessation, just continuous transformation. This parallels Nāgārjuna's point that inherent cessation is unfindable.\",\"realLifeExample\":\"When a drop of dye spreads through water, the drop doesn't \\\"cease to exist.\\\" The dye molecules are still there — just dispersed. Nothing was inherently annihilated.\"},{\"q\":\"Does this mean there's no continuity of consciousness?\",\"a\":\"Not at all. Conventional continuity is preserved — each moment of experience does condition the next. What Nāgārjuna denies is that this continuity operates through inherently existing moments that are inherently \\\"passed forward.\\\" Continuity is a conventional pattern, not an inherent mechanism.\",\"realLifeExample\":\"A river has continuity — water flows downstream. But there's no single \\\"chunk\\\" of river that is passed along. Continuity emerges from the flow of conditions, not from inherent river-chunks.\"},{\"q\":\"How does this verse connect to the problem of personal identity over time?\",\"a\":\"If each moment of consciousness inherently ceases, what connects you now to you five minutes ago? Nāgārjuna shows the mechanism can't be inherent cessation-and-replacement. Instead, personal continuity is a conventional designation over a stream of interdependent, empty moments.\",\"realLifeExample\":\"You at age 5 and you now share few atoms or memories. Yet you're conventionally \\\"the same person.\\\" This works because identity is a conventional designation, not an inherent entity passed forward moment to moment.\"}],\"quiz\":{\"beginner\":{\"question\":\"What is the \\\"immediately preceding condition\\\" in Buddhist philosophy?\",\"options\":[\"A) The first cause of the universe\",\"B) The immediately prior moment of consciousness that conditions the next moment\",\"C) The physical environment\",\"D) The dominant condition\"],\"correct\":\"B\",\"explanation\":\"The samanantarapratyaya is the immediately preceding moment of consciousness — like the previous link in a chain — that conditions the arising of the next moment.\"},\"intermediate\":{\"question\":\"Why can't something that has \\\"ceased\\\" serve as an inherently existing condition?\",\"options\":[\"A) Because Buddhist philosophy denies all causation\",\"B) Because a non-existent entity cannot possess or exert inherent causal power\",\"C) Because only future things can be conditions\",\"D) Because cessation is permanent\"],\"correct\":\"B\",\"explanation\":\"If conditions must have inherent existence to function, then something that has ceased — and thus no longer exists — cannot possess inherent causal power to condition the next moment.\"},\"advanced\":{\"question\":\"How does quantum decoherence parallel Nāgārjuna's critique of inherent cessation?\",\"options\":[\"A) Both show things cleanly cease to exist\",\"B) Both reveal that \\\"cessation\\\" is not a clean, inherent event — quantum information disperses rather than being annihilated, just as Nāgārjuna finds no inherent cessation\",\"C) Decoherence proves inherent cessation exists\",\"D) There is no parallel\"],\"correct\":\"B\",\"explanation\":\"In decoherence, quantum information isn't destroyed but entangled with the environment. There's no clean \\\"cessation\\\" moment. Similarly, Nāgārjuna shows inherent cessation is unfindable — things transform rather than being inherently annihilated.\"}},\"verseText\":\"If phenomena are not arisen, cessation is not tenable. Therefore, an immediate condition is unreasonable. For what has ceased, how can it be a condition?\",\"madhyamakaConcept\":\"This verse targets the samanantarapratyaya (immediately preceding condition), which in Abhidharma ensures continuity of consciousness from moment to moment. Garfield: \\\"If there is no arising, there is no duration, and hence no cessation. So nothing can serve as an immediately preceding condition.\\\" Kalupahana: the verse exposes the absurdity of a ceased entity possessing causal power — what has ceased cannot inherently condition what follows.\",\"quantumPhysicsParallel\":\"Quantum Decoherence and the Arrow of Time: When a quantum system interacts with its environment, coherent superposition \\\"decoheres\\\" into classical-seeming states. The prior coherent state doesn't inherently \\\"cease\\\" — it becomes entangled with the environment, making the concept of clear cessation problematic.\"}},\"isShowcase\":false,\"chapterId\":1}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"Study the MMK with interactive verse exploration, research-mode transparency, and carefully caveated quantum analogies.\"}]],\"error\":null,\"digest\":\"

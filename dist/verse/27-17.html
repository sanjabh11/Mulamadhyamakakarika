88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":27,\"verseId\":17,\"chapterTitle\":\"Examination of Views\",\"totalVerses\":30,\"verseData\":{\"id\":\"v27_17\",\"number\":17,\"title\":\"If the Self Were Finite\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If the self had a definite nature in some respects and no definite nature in others, one would have to say it is both finite and infinite. But this is untenable.\"},\"philosophy\":{\"insight\":\"FINITE/INFINITE views: if the self were partly definite and partly indefinite, it would be both finite and infinite — a contradiction. No coherent account of the self's \\\"extent\\\" can be given.\",\"madhyamaka\":\"Antavān anantavān ca — ubhaya-doṣa. If partly finite, partly infinite, the contradictions of both apply. Neither alone works either.\",\"quantum\":\"A quantum system is neither classically finite nor infinite in extent. The wave function extends infinitely but with decreasing probability — defying the binary.\",\"bridge\":\"Both: the finite/infinite binary doesn't apply. QM: wave functions defy it. V.17: the self defies it.\",\"accessible\":\"Is \\\"you\\\" limited or unlimited? In some ways limited (body), in some ways unlimited (imagination). But saying \\\"both\\\" is contradictory. The question doesn't apply.\",\"twoTruths\":\"Conventionally: we have finite bodies and seemingly infinite minds. Ultimately: these categories can't be inherently applied to an empty self.\",\"commonMisconception\":\"NOT saying the self has no extent. Saying inherent finitude/infinitude can't be established for an empty self.\"},\"quantumResonance\":{\"concept\":\"Beyond Finite/Infinite Binary\",\"score\":48,\"strength\":\"Medium\",\"explanation\":\"Quantum wave functions defy the finite/infinite binary. The self defies it too. Both: the classical binary is inadequate.\",\"caveat\":\"Physical extent vs. personal extent.\"},\"animation\":{\"visualBridge\":\"A figure that seems to have boundaries but also extends beyond them. Neither finite nor infinite — the categories don't apply.\",\"educationalGoal\":\"Finite and infinite are inapplicable to the empty self. The binary fails.\"},\"deeperDive\":[{\"q\":\"Why does the finite/infinite binary fail?\",\"a\":\"Both are inherent categories. \\\"Finite\\\" = has inherent limits. \\\"Infinite\\\" = inherently limitless. An empty self has no inherent properties to be limited or unlimited.\",\"realLifeExample\":\"\\\"How many sides does a circle have?\\\" The question assumes polygonal categories that don't apply.\"},{\"q\":\"Connection to Ch.25 vv.19-20?\",\"a\":\"Ch.25: all things are empty → what is finite/infinite? V.17 applies this to the self specifically.\",\"realLifeExample\":\"Ch.25: universal principle. V.17: personal application.\"},{\"q\":\"Connection to the unanswered questions?\",\"a\":\"Four of the Buddha's unanswered questions concern whether the world is finite or infinite. V.17 explains why: the binary doesn't apply.\",\"realLifeExample\":\"The Buddha's silence = the answer: the question is malformed.\"},{\"q\":\"Does this apply to consciousness?\",\"a\":\"Yes — \\\"is consciousness finite or infinite?\\\" presupposes inherent properties consciousness doesn't have. The question is malformed.\",\"realLifeExample\":\"\\\"How much does blue weigh?\\\" Wrong category of question.\"},{\"q\":\"Practical significance?\",\"a\":\"Release clinging to BOTH \\\"I am limited\\\" (self-diminishment) and \\\"I am unlimited\\\" (self-inflation). The self defies these categories.\",\"realLifeExample\":\"Neither \\\"I can do anything\\\" (inflation) nor \\\"I can do nothing\\\" (diminishment). Dependent capability.\"},{\"q\":\"Significance?\",\"a\":\"V.17 extends the analysis to spatial/extent categories. Having dissolved temporal and permanence views, now spatial views dissolve.\",\"deeper\":\"V.17 continues the systematic dissolution of all inherent categories applied to the self: temporal (vv.1-13), permanence (vv.14-16), extent (vv.17-18). The net tightens.\"}],\"quiz\":{\"beginner\":{\"question\":\"Is the self finite or infinite?\",\"options\":[\"A) Finite\",\"B) NEITHER inherently. Both are inherent categories that don't apply to an empty self.\",\"C) Infinite\",\"D) Both\"],\"correct\":\"B\",\"explanation\":\"Neither applies to an empty self.\"},\"intermediate\":{\"question\":\"Why does the binary fail?\",\"options\":[\"A) Too simple\",\"B) Both presuppose inherent properties. An empty self has no inherent properties to be limited or unlimited.\",\"C) Only for self\",\"D) Only philosophical\"],\"correct\":\"B\",\"explanation\":\"Inherent categories can't apply to empty phenomena.\"},\"advanced\":{\"question\":\"Connection to the unanswered questions?\",\"options\":[\"A) None\",\"B) Four questions concern the world's finitude. V.17 explains why unanswered: the binary doesn't apply to empty phenomena.\",\"C) Different topic\",\"D) Only historical\"],\"correct\":\"B\",\"explanation\":\"Unanswered because the question is malformed.\"}},\"verseText\":\"If the self had a definite nature in some respects and no definite nature in others, one would have to say it is both finite and infinite. But this is untenable.\",\"madhyamakaConcept\":\"Antavān anantavān ca — ubhaya-doṣa. If partly finite, partly infinite, the contradictions of both apply. Neither alone works either.\",\"quantumPhysicsParallel\":\"A quantum system is neither classically finite nor infinite in extent. The wave function extends infinitely but with decreasing probability — defying the binary.\"}},\"isShowcase\":false,\"chapterId\":27}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"cont

176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":21,\"verseId\":4,\"chapterTitle\":\"Examination of Becoming and Destruction\",\"totalVerses\":21,\"verseData\":{\"id\":\"v21_4\",\"number\":4,\"title\":\"Impermanence Ensures Destruction Follows Becoming\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"There is no becoming without destruction, for impermanence exists always. There is no destruction without becoming.\"},\"philosophy\":{\"insight\":\"Grounding the mutual dependence in IMPERMANENCE (anitya): everything conditioned is impermanent, so becoming ALWAYS implies eventual destruction. And destruction always presupposes becoming. The bridge between vv.1-3 and what follows: impermanence is the mechanism connecting becoming and destruction.\",\"madhyamaka\":\"Saṃbhava vibhava-vinā na asti, anitya nityam asti (there is no becoming without destruction, for impermanence exists always). Impermanence (anitya) is the universal characteristic that ensures the inseparability of becoming and destruction. Whatever becomes must eventually be destroyed.\",\"quantum\":\"No stable excited states: in quantum systems, excited states ALWAYS eventually decay back to the ground state. There are no permanently excited states (no permanent \\\"becoming\\\" without eventual \\\"destruction\\\"). Like v.4: impermanence ensures all becoming leads to destruction.\",\"bridge\":\"Both quantum decay and v.4 show that all arising states eventually cease. QM: excited states decay (no permanent excitation). V.4: impermanence ensures destruction follows becoming. Both: arising states are inherently unstable — cessation is inevitable.\",\"accessible\":\"Everything that begins eventually ends. Every candle lit eventually burns out. Every person born eventually dies. Impermanence is universal — and it's the reason becoming and destruction are inseparable. You can't have one without the other.\",\"twoTruths\":\"Conventionally: impermanence is the observed nature of all conditioned phenomena. Ultimately: impermanence itself is dependently arisen and empty — it's the CONVENTIONAL mode of empty phenomena, not an inherent property.\",\"commonMisconception\":\"NOT saying impermanence is an inherent property. It's the conventional characteristic of empty phenomena. Empty things conventionally change — not because they have the \\\"inherent property of impermanence\\\" but because they lack inherent existence.\"},\"quantumResonance\":{\"concept\":\"No Permanently Excited States — Universal Decay\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"QM: excited states always decay — no permanently excited states exist. V.4: impermanence ensures all becoming leads to destruction. Both: arising/excited states are inherently unstable. Cessation/decay is universal.\",\"caveat\":\"Quantum decay is a physics process. V.4 is about the Buddhist principle of impermanence. The parallel is about the universality of cessation.\"},\"animation\":{\"visualBridge\":\"A series of particles being excited (becoming) — each one eventually decaying back (destruction). No particle stays excited forever. Caption: \\\"Impermanence: every becoming leads to destruction.\\\"\",\"educationalGoal\":\"User sees: impermanence connects becoming and destruction. Every arising state eventually ceases. The connection is universal and inescapable.\"},\"deeperDive\":[{\"q\":\"What is impermanence (anitya)?\",\"a\":\"One of the three marks of existence in Buddhism: all conditioned phenomena are impermanent — they arise, change, and cease. Nothing conditioned lasts forever. This is the foundational observation that connects becoming and destruction: whatever becomes must eventually be destroyed.\",\"realLifeExample\":\"Seasons change, bodies age, civilizations rise and fall. Nothing conditioned remains the same. Impermanence is the most observable fact of existence.\"},{\"q\":\"Is impermanence itself an inherent property?\",\"a\":\"No. For Madhyamaka, impermanence is the CONVENTIONAL characteristic of empty phenomena. It's not an inherent \\\"property\\\" that things \\\"possess\\\" — it's a description of HOW empty things behave conventionally. Empty things change; that's what impermanence describes.\",\"realLifeExample\":\"\\\"Fragility\\\" isn't an inherent property of glass — it's a description of how glass behaves under stress. Similarly, impermanence isn't an inherent property — it's how empty things behave in time.\"},{\"q\":\"How does v.4 complement vv.2-3?\",\"a\":\"VV.2-3: becoming and destruction can't be SIMULTANEOUS. V.4: but they MUST be connected (through impermanence). Resolution: they're SEQUENTIAL — becoming first, then destruction — connected by impermanence. This is the conventional pattern.\",\"realLifeExample\":\"Can't inhale and exhale simultaneously (vv.2-3), but must do both to breathe (v.4). Solution: inhale first, then exhale. Sequential, connected through the need to breathe (impermanence).\"},{\"q\":\"How does this relate to the Second Noble Truth?\",\"a\":\"The Second Noble Truth: suffering arises from craving/attachment. Attachment is possible only because of impermanence — we cling to what's changing. V.4 grounds the causal chain: becoming (arising) → impermanence (change) → destruction (cessation) → suffering (when we attach to what changes).\",\"realLifeExample\":\"You love a beautiful sunset (becoming). It fades (impermanence). It's gone (destruction). You're sad (suffering). The chain is powered by impermanence.\"},{\"q\":\"What about quantum excited states?\",\"a\":\"No quantum excited state is permanently stable — all eventually decay through spontaneous emission or other processes. Even \\\"metastable\\\" states eventually transition. This parallels v.4's impermanence: no \\\"becoming\\\" lasts forever. All excited/arisen states eventually return to ground/ceased states.\",\"realLifeExample\":\"A ball thrown in the air eventually comes down. No amount of force keeps it up forever. Similarly, no quantum excitation lasts forever — gravity (impermanence) always wins.\"},{\"q\":\"What is the philosophical significance?\",\"a\":\"V.4 provides the MECHANISM connecting becoming and destruction: impermanence. VV.1-3 established the relationship (dependent, exclusive). V.4 explains WHY they're inseparable: because impermanence is universal. Everything that arises must cease. This is the Buddhist principle at the heart of the chapter.\",\"deeper\":\"V.4 introduces impermanence as the link between becoming and destruction. This is philosophically significant because impermanence is one of the three marks of existence (trilakṣaṇa) in Buddhism, alongside suffering (duḥkha) and non-self (anātman). By grounding the becoming/destruction relationship in impermanence, Nāgārjuna connects Ch.21 to the broader Buddhist framework. The chapter's analysis of becoming/destruction is not an abstract philosophical exercise — it's an exploration of impermanence, which is central to the path of liberation.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why does becoming always lead to destruction?\",\"options\":[\"A) It doesn't\",\"B) Because of impermanence: everything conditioned eventually changes and ceases. Whatever arises must eventually be destroyed. Impermanence is universal.\",\"C) Only some things are impermanent\",\"D) Destruction is optional\"],\"correct\":\"B\",\"explanation\":\"Impermanence = universal. All conditioned things arise and cease. No exceptions for inherent existence.\"},\"intermediate\":{\"question\":\"How does v.4 resolve the tension of vv.1-3?\",\"options\":[\"A) It doesn't\",\"B) VV.2-3: can't be simultaneous. V.4: must be connected (impermanence). Resolution: SEQUENTIAL — becoming first, then destruction, linked by impermanence. Not simultaneous but necessarily connected.\",\"C) They're simultaneous after all\",\"D) No connection\"],\"correct\":\"B\",\"explanation\":\"Can't be simultaneous + must be connected = sequential connection through impermanence.\"},\"advanced\":{\"question\":\"Is impermanence an inherent property?\",\"options\":[\"A) Yes\",\"B) No — it's the CONVENTIONAL characteristic of empty phenomena. Not an inherent \\\"property\\\" things \\\"possess\\\" but a description of how empty things behave. Empty things change — that's what impermanence describes, not an inherent essence.\",\"C) Sometimes\",\"D) It's ultimate truth\"],\"correct\":\"B\",\"explanation\":\"Impermanence is conventional, not inherent. It describes how empty things behave, not an essence they possess.\"}},\"verseText\":\"There is no becoming without destruction, for impermanence exists always. There is no destruction without becoming.\",\"madhyamakaConcept\":\"Saṃbhava vibhava-vinā na asti, anitya nityam asti (there is no becoming without destruction, for impermanence exists always). Impermanence (anitya) is the universal characteristic that ensures the inseparability of becoming and destruction. Whatever becomes must eventually be destroyed.\",\"quantumPhysicsParallel\":\"No stable excited states: in quantum systems, excited states ALWAYS eventually decay back to the ground state. There are no permanently excited states (no permanent \\\"becoming\\\" without eventual \\\"destruction\\\"). Like v.4: impermanence ensures all becoming leads to destruction.\"}},\"isShowcase\":false,\"chapterId\":21}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research pl

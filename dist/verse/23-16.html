88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":23,\"verseId\":16,\"chapterTitle\":\"Examination of Error\",\"totalVerses\":25,\"verseData\":{\"id\":\"v23_16\",\"number\":16,\"title\":\"What Exists Through Self-Nature Cannot Arise Through Error\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"What exists by its own nature does not arise through error. What exists by its own nature does not exist and thus the self also does not exist.\"},\"philosophy\":{\"insight\":\"If something existed by self-nature (svabhāva), it couldn't arise through error — it would exist independently of any cognitive process. But things DON'T exist by self-nature (they're empty). Therefore the self (a product of cognitive error) also doesn't inherently exist.\",\"madhyamaka\":\"Svabhāvena sat viparyāsena na utpadyate (what exists by self-nature doesn't arise through error). Svabhāvena na asti (doesn't exist by self-nature). Ātmā api na asti (self also doesn't exist). Key inference: no svabhāva → no inherent self.\",\"quantum\":\"A truly inherent property wouldn't depend on measurement for its existence. But quantum properties DO depend on measurement. Therefore they're not inherent. Similarly, if self-nature existed, it wouldn't need error to arise.\",\"bridge\":\"Both: truly inherent properties wouldn't be process-dependent. QM: inherent properties ≠ measurement-dependent. V.16: self-nature ≠ error-dependent. Both: dependence on process → not inherent.\",\"accessible\":\"If gold were truly gold by nature, it wouldn't need someone to mine it. If the self existed by nature, it wouldn't need cognitive error to \\\"create\\\" it. But the self DOES depend on error → not inherent.\",\"twoTruths\":\"Conventionally: the self appears through cognitive processes. Ultimately: since it depends on error (which is empty), it's empty too.\",\"commonMisconception\":\"NOT saying the self is \\\"caused\\\" by error in a simple way. The self is a PRODUCT of cognitive error (viparyāsa) — specifically, perceiving not-self as self.\"},\"quantumResonance\":{\"concept\":\"Inherent Properties ≠ Process-Dependent\",\"score\":52,\"strength\":\"Medium\",\"explanation\":\"Inherent properties wouldn't need measurement. Self-nature wouldn't need error. But the self depends on error → not inherent. Both: process-dependence ≠ inherent existence.\",\"caveat\":\"Measurement-dependence is physics. Error-dependence is about self-construction.\"},\"animation\":{\"visualBridge\":\"A glowing \\\"Self-Nature\\\" box — rigid, unchanging. Next to it, a shimmering \\\"Self\\\" arising from error — dependent, empty. Caption: \\\"What's inherent doesn't need error. The self needs error → not inherent.\\\"\",\"educationalGoal\":\"Self-nature is process-independent. The self depends on cognitive error → not self-natured.\"},\"deeperDive\":[{\"q\":\"What is the logical structure?\",\"a\":\"Premise 1: Inherent things don't arise through error (they're independent). Premise 2: The self arises through error (perceiving not-self as self). Conclusion: The self isn't inherent.\",\"realLifeExample\":\"Premise 1: Natural gold doesn't need manufacturing. Premise 2: This \\\"gold\\\" was manufactured (fake). Conclusion: It's not natural gold.\"},{\"q\":\"How does the self arise through error?\",\"a\":\"The fourth viparyāsa: perceiving not-self (anātman) as self (ātman). We CONSTRUCT the sense of a permanent, unitary self through cognitive error. The self is a product of this construction.\",\"realLifeExample\":\"Seeing a rope as a snake (error). The \\\"snake\\\" arises through misperception. Similarly, the \\\"self\\\" arises through misperceiving not-self as self.\"},{\"q\":\"Does this make the self entirely illusory?\",\"a\":\"Conventionally functional, ultimately empty. The self isn't a COMPLETE illusion (it functions — you make decisions, etc.) but it lacks inherent existence. It's a useful fiction, not a discovered reality.\",\"realLifeExample\":\"A corporation: legally functional (it can sue, be sued) but not a \\\"real person.\\\" A useful convention, not a discovered entity.\"},{\"q\":\"How does QM illustrate this?\",\"a\":\"A truly inherent property (like charge in classical physics) wouldn't depend on measurement. But quantum properties DO depend on measurement context. They're not inherent. Similarly, the self depends on cognitive context.\",\"realLifeExample\":\"If your worth were inherent, it wouldn't depend on context. But \\\"worth\\\" depends on market, culture, situation. Context-dependent = not inherent.\"},{\"q\":\"Connection to Ch.18?\",\"a\":\"Ch.18 showed the self is unfindable through fivefold analysis. V.16 adds: the self is a PRODUCT of cognitive error, not a discovered reality. Two independent proofs of self-emptiness.\",\"realLifeExample\":\"The treasure wasn't found (Ch.18 analysis) AND it was \\\"placed there\\\" by a storyteller (v.16 error). Two reasons it's not inherently there.\"},{\"q\":\"Significance?\",\"a\":\"V.16 connects the emptiness of error (vv.13-15) to the emptiness of self (Ch.18, v.3). The self is empty BECAUSE it arises from empty error. Error → self → afflictions: the entire chain is empty.\",\"deeper\":\"V.16 performs a crucial synthesis: the self (key to Ch.18) arises from error (key to Ch.23). Since error is empty (vv.13-15), the self it produces is empty. And since afflictions belong to the self (v.4), afflictions are empty. The chain error → self → afflictions is entirely empty — each link depending on the previous, all the way down to nothing inherent.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why doesn't the self exist by self-nature?\",\"options\":[\"A) It does\",\"B) The self arises through cognitive error (perceiving not-self as self). What arises through error isn't inherent. The self is constructed, not discovered.\",\"C) Only some selves\",\"D) Self-nature is hidden\"],\"correct\":\"B\",\"explanation\":\"Error-dependent = not inherent. The self is a product of cognitive construction.\"},\"intermediate\":{\"question\":\"What is the logical structure of v.16?\",\"options\":[\"A) No structure\",\"B) Inherent → error-independent. Self = error-dependent. → Self ≠ inherent. Classic syllogism.\",\"C) Only one premise\",\"D) Conclusion unclear\"],\"correct\":\"B\",\"explanation\":\"Two premises, clear conclusion: error-dependent self isn't inherent.\"},\"advanced\":{\"question\":\"How does v.16 connect Ch.18 and Ch.23?\",\"options\":[\"A) No connection\",\"B) Ch.18: self unfindable. Ch.23/v.16: self arises from empty error. Two independent proofs of self-emptiness, connecting the chapters systematically.\",\"C) Same chapter\",\"D) Different topics\"],\"correct\":\"B\",\"explanation\":\"Two routes to self-emptiness: unfindability (Ch.18) and error-dependence (v.16).\"}},\"verseText\":\"What exists by its own nature does not arise through error. What exists by its own nature does not exist and thus the self also does not exist.\",\"madhyamakaConcept\":\"Svabhāvena sat viparyāsena na utpadyate (what exists by self-nature doesn't arise through error). Svabhāvena na asti (doesn't exist by self-nature). Ātmā api na asti (self also doesn't exist). Key inference: no svabhāva → no inherent self.\",\"quantumPhysicsParallel\":\"A truly inherent property wouldn't depend on measurement for its existence. But quantum properties DO depend on measurement. Therefore they're not inherent. Similarly, if self-nature existed, it wouldn't need error to arise.\"}},\"isShowcase\":false,\"chapterId\":23}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[

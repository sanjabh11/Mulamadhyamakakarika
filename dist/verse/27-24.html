88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":27,\"verseId\":24,\"chapterTitle\":\"Examination of Views\",\"totalVerses\":30,\"verseData\":{\"id\":\"v27_24\",\"number\":24,\"title\":\"Freedom Through Cessation of Delusion\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Through the cessation of karma and mental afflictions, there is liberation. Karma and mental afflictions arise from conceptual elaboration. These arise from mental fabrication. Fabrication ceases in emptiness.\"},\"philosophy\":{\"insight\":\"THE LIBERATION FORMULA: karma + afflictions → from conceptual elaboration → from mental fabrication → fabrication ceases in EMPTINESS. The entire chain from suffering to liberation runs through emptiness. Emptiness is the medicine.\",\"madhyamaka\":\"Karma-kleśa-kṣayāt mokṣaḥ. Karma-kleśāḥ vikalpataḥ. Te prapañcāt. Prapañcas tu śūnyatāyāṃ nirudhyate. The complete liberation formula.\",\"quantum\":\"The chain of errors (karma/afflictions) arises from flawed interpretation (conceptual elaboration) which arises from imposing classical categories (fabrication). Categories dissolve when the quantum nature (emptiness) is seen.\",\"bridge\":\"Both: errors arise from imposed categories, which dissolve when the true nature is seen. QM: classical categories → quantum nature. V.24: fabrication → emptiness.\",\"accessible\":\"Suffering comes from actions driven by afflictions, which come from wrong thinking, which comes from mental fabrication. Fabrication stops when you see emptiness. Emptiness is the off-switch for the whole chain.\",\"twoTruths\":\"Conventionally: the chain operates. Ultimately: emptiness dissolves fabrication at the root.\",\"commonMisconception\":\"\\\"Emptiness\\\" here isn't nothingness — it's the SEEING of dependent arising. Seeing things as they are (empty/dependent) stops the fabrication that generates suffering.\"},\"quantumResonance\":{\"concept\":\"True Nature Dissolves Imposed Categories\",\"score\":58,\"strength\":\"Medium\",\"explanation\":\"Seeing quantum nature dissolves classical impositions. Seeing emptiness dissolves mental fabrication. Both: true nature → dissolution of error.\",\"caveat\":\"Physical nature vs. ultimate nature.\"},\"animation\":{\"visualBridge\":\"A chain: karma → afflictions → concepts → fabrication. Each link dissolving as emptiness (light) reaches it. Caption: \\\"Fabrication ceases in emptiness.\\\"\",\"educationalGoal\":\"The complete liberation formula: emptiness dissolves fabrication, which dissolved concepts, afflictions, and karma.\"},\"deeperDive\":[{\"q\":\"What is the liberation formula?\",\"a\":\"Liberation = cessation of karma and afflictions. These arise from conceptual elaboration (vikalpa). That arises from mental fabrication (prapañca). Fabrication ceases through emptiness. So: emptiness → cessation of fabrication → cessation of everything downstream → liberation.\",\"realLifeExample\":\"Disease → symptoms → from bacteria → from unsanitary conditions. Fix the conditions (emptiness) and everything downstream is cured.\"},{\"q\":\"What is prapañca (fabrication)?\",\"a\":\"Mental fabrication — the mind's tendency to create inherent categories, labels, and distinctions where there are only dependently arising processes. The root of conceptual error.\",\"realLifeExample\":\"Seeing \\\"separate things\\\" where there's only a flow of processes. Drawing lines on water and insisting the lines are real.\"},{\"q\":\"How does emptiness stop fabrication?\",\"a\":\"When you see that phenomena are empty (dependently arising, not inherently existent), the mind stops imposing inherent categories. Fabrication naturally ceases. The light dispels the darkness.\",\"realLifeExample\":\"When you realize the rope isn't a snake, fear-based fabrication stops automatically. No effort needed — just clear seeing.\"},{\"q\":\"Connection to Ch.25 v.24?\",\"a\":\"Ch.25 v.24: prapañcopaśama = cessation of fabrication = nirvāṇa. V.24 here: fabrication ceases in emptiness. Same conclusion: emptiness → cessation → peace.\",\"realLifeExample\":\"Ch.25 and Ch.27 reach the same destination: cessation of fabrication IS liberation.\"},{\"q\":\"Is v.24 the most important verse in Ch.27?\",\"a\":\"Arguably — it contains the COMPLETE liberation formula in one verse. Everything the MMK teaches is compressed here.\",\"realLifeExample\":\"E=mc² for Buddhist philosophy: the fundamental equation in one line.\"},{\"q\":\"Significance?\",\"a\":\"V.24 is the MASTER VERSE of Ch.27 — the complete chain from suffering to liberation via emptiness.\",\"deeper\":\"V.24 is one of the most cited verses in all of Madhyamaka philosophy. It provides the complete soteriological formula: emptiness → cessation of fabrication → cessation of afflictions → liberation. Every element of the MMK's 27-chapter analysis is present in this single verse.\"}],\"quiz\":{\"beginner\":{\"question\":\"What causes fabrication to cease?\",\"options\":[\"A) Force\",\"B) EMPTINESS — seeing things as dependently arising stops the mind from imposing inherent categories. Fabrication naturally ceases.\",\"C) Time\",\"D) Nothing can\"],\"correct\":\"B\",\"explanation\":\"Emptiness = the off-switch for fabrication.\"},\"intermediate\":{\"question\":\"What is the complete liberation formula?\",\"options\":[\"A) Just meditation\",\"B) Emptiness → cessation of fabrication → cessation of concepts → cessation of afflictions/karma → liberation. A complete chain.\",\"C) Only understanding\",\"D) Only practice\"],\"correct\":\"B\",\"explanation\":\"Complete chain from emptiness to liberation.\"},\"advanced\":{\"question\":\"Why is v.24 the master verse?\",\"options\":[\"A) Not important\",\"B) It contains the COMPLETE liberation formula: emptiness → cessation of fabrication → cessation of afflictions → liberation. Everything the MMK teaches compressed into one verse.\",\"C) Only summary\",\"D) One of many\"],\"correct\":\"B\",\"explanation\":\"Complete formula. 27 chapters compressed into one verse.\"}},\"verseText\":\"Through the cessation of karma and mental afflictions, there is liberation. Karma and mental afflictions arise from conceptual elaboration. These arise from mental fabrication. Fabrication ceases in emptiness.\",\"madhyamakaConcept\":\"Karma-kleśa-kṣayāt mokṣaḥ. Karma-kleśāḥ vikalpataḥ. Te prapañcāt. Prapañcas tu śūnyatāyāṃ nirudhyate. The complete liberation formula.\",\"quantumPhysicsParallel\":\"The chain of errors (karma/afflictions) arises from flawed interpretation (conceptual elaboration) which arises from imposing classical categories (fabrication). Categories dissolve when the quantum nature (emptiness) is seen.\"}},\"isShowcase\":false,\"chapterId\":27}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"

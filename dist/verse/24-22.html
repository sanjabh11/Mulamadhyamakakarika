88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":24,\"verseId\":22,\"chapterTitle\":\"Examination of the Noble Truths\",\"totalVerses\":40,\"verseData\":{\"id\":\"v24_22\",\"number\":22,\"title\":\"If Suffering Had Inherent Nature, It Could Not Be Known\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If suffering existed inherently, its arising would not be from conditions. If it existed by its own nature, how could conditions give rise to it?\"},\"philosophy\":{\"insight\":\"DEEPENING v.21: inherent suffering couldn't arise FROM CONDITIONS. But the Second Truth says suffering arises from SPECIFIC conditions (craving, ignorance). Inherent existence eliminates the Second Truth (origin of suffering) as well.\",\"madhyamaka\":\"Svabhāvataḥ duḥkham sat cet pratyayataḥ na utpadyeta (if suffering inherently existed, it wouldn't arise from conditions). Svabhāvena sat cet pratyaya katham utpādayanti (if it exists by nature, how would conditions produce it?). Inherent existence → no conditional arising → Second Truth destroyed.\",\"quantum\":\"If an electron's energy were inherent (fixed), it couldn't be changed by external fields. But external fields DO change electron energies → not inherent. Same: if suffering were inherent, conditions couldn't produce it.\",\"bridge\":\"Both: inherent properties can't be influenced by conditions. QM: inherent energy → not affected by fields. V.22: inherent suffering → not affected by conditions. But both ARE affected → not inherent.\",\"accessible\":\"If your mood were \\\"inherent,\\\" no event could change it. But events DO change your mood → your mood isn't inherent. Same for suffering: conditions change it → it's not inherent.\",\"twoTruths\":\"Conventionally: suffering arises from specific conditions (the Second Truth). Inherent existence denies this by making suffering independent of conditions.\",\"commonMisconception\":\"NOT denying that suffering has causes. It DOES have causes (Second Truth). But those causes work BECAUSE suffering is empty (dependently arisen, not inherent).\"},\"quantumResonance\":{\"concept\":\"Inherent Properties → Not Affected by Conditions\",\"score\":52,\"strength\":\"Medium\",\"explanation\":\"Inherent energy → not changed by fields. Inherent suffering → not changed by conditions. Both: inherent properties are independent of external influence. But influence IS observed → not inherent.\",\"caveat\":\"Quantum energy levels vs. suffering. Both show sensitivity to conditions.\"},\"animation\":{\"visualBridge\":\"Arrows labeled \\\"Craving,\\\" \\\"Ignorance,\\\" \\\"Attachment\\\" trying to reach \\\"INHERENT SUFFERING\\\" but bouncing off. Inherent = impervious to conditions. Caption: \\\"Inherent suffering can't arise from conditions.\\\"\",\"educationalGoal\":\"The Second Truth (suffering has an origin) requires emptiness. Inherent suffering can't have a conditional origin.\"},\"deeperDive\":[{\"q\":\"Why can't conditions produce inherent suffering?\",\"a\":\"Inherent = independent of conditions. Something independent of conditions can't be PRODUCED BY conditions. But suffering IS produced by conditions (craving, ignorance) → not inherent.\",\"realLifeExample\":\"If a river were \\\"inherently full,\\\" rain couldn't fill it (it's already full). But rain DOES fill rivers → rivers aren't inherently full.\"},{\"q\":\"What does this mean for the Second Truth?\",\"a\":\"The Second Truth identifies the ORIGIN of suffering: craving, attachment, ignorance. This is a CAUSAL claim. Inherent suffering has no causes → no origin → Second Truth destroyed.\",\"realLifeExample\":\"A doctor identifies the cause of disease. If the disease were \\\"inherent\\\" (permanent, causeless), there'd be no cause to identify. The diagnosis fails.\"},{\"q\":\"How does emptiness help?\",\"a\":\"Empty suffering CAN arise from conditions — it's dependent on them. This is exactly what the Second Truth describes. Emptiness ENABLES the Second Truth.\",\"realLifeExample\":\"A fire CAN be started by a match — because fire isn't \\\"inherently burning.\\\" It needs causes. Emptiness of fire enables fire-starting.\"},{\"q\":\"Connection to v.21?\",\"a\":\"V.21: inherent suffering can't arise (at all). V.22: inherent suffering can't arise FROM CONDITIONS (specifically). Both: inherent existence blocks the mechanism of the First and Second Truths.\",\"realLifeExample\":\"V.21: the disease can't start. V.22: the disease can't start from specific causes. Both block medical understanding.\"},{\"q\":\"What about the Third and Fourth Truths?\",\"a\":\"Coming next: if suffering is inherent, it can't CEASE (Third Truth fails) and can't be TREATED (Fourth Truth fails). Each truth requires emptiness.\",\"realLifeExample\":\"Inherent disease: can't be cured (Third) and can't be treated (Fourth). Everything fails.\"},{\"q\":\"Significance?\",\"a\":\"V.22 extends the reversal to the Second Noble Truth. Inherent existence now destroys BOTH the First and Second Truths.\",\"deeper\":\"V.22 is crucial for the Second Truth: the identification of suffering's ORIGIN. If suffering were inherent, it would be originless (without cause). This directly contradicts the Second Truth, which is all about identifying the cause. The opponent who claims to defend the Noble Truths actually destroys them by insisting on inherent existence.\"}],\"quiz\":{\"beginner\":{\"question\":\"Can conditions produce inherent suffering?\",\"options\":[\"A) Yes\",\"B) No — inherent = independent of conditions. Something independent can't be produced by conditions. But the Second Truth says suffering HAS an origin → not inherent.\",\"C) Sometimes\",\"D) Only some\"],\"correct\":\"B\",\"explanation\":\"Inherent = independent of conditions → no conditional origin. Second Truth contradicted.\"},\"intermediate\":{\"question\":\"How does v.22 attack the Second Noble Truth?\",\"options\":[\"A) Doesn't\",\"B) The Second Truth identifies suffering's ORIGIN (causes). Inherent suffering has no causes (independent). Therefore inherent existence destroys the Second Truth.\",\"C) Supports it\",\"D) Different truth\"],\"correct\":\"B\",\"explanation\":\"Inherent = causeless. Second Truth = suffering has causes. Inherent existence contradicts the Second Truth.\"},\"advanced\":{\"question\":\"How do vv.21-22 work together?\",\"options\":[\"A) Separately\",\"B) V.21: inherent suffering can't arise. V.22: can't arise FROM CONDITIONS. Together: inherent existence destroys BOTH the fact of suffering (First Truth) AND its causal explanation (Second Truth).\",\"C) Same point\",\"D) Contradictory\"],\"correct\":\"B\",\"explanation\":\"Double destruction: arising blocked (First Truth) and causal explanation blocked (Second Truth).\"}},\"verseText\":\"If suffering existed inherently, its arising would not be from conditions. If it existed by its own nature, how could conditions give rise to it?\",\"madhyamakaConcept\":\"Svabhāvataḥ duḥkham sat cet pratyayataḥ na utpadyeta (if suffering inherently existed, it wouldn't arise from conditions). Svabhāvena sat cet pratyaya katham utpādayanti (if it exists by nature, how would conditions produce it?). Inherent existence → no conditional arising → Second Truth destroyed.\",\"quantumPhysicsParallel\":\"If an electron's energy were inherent (fixed), it couldn't be changed by external fields. But external fields DO change electron energies → not inherent. Same: if suffering were inherent, conditions couldn't produce it.\"}},\"isShowcase\":false,\"chapterId\":24}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\"

176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":25,\"verseId\":5,\"chapterTitle\":\"Examination of Nirvana\",\"totalVerses\":24,\"verseData\":{\"id\":\"v25_5\",\"number\":5,\"title\":\"Nirvāṇa Is Not a Nonexistent Thing\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If nirvāṇa were a nonexistent thing, how could nirvāṇa be nondependent? A nonexistent thing that is nondependent does not exist.\"},\"philosophy\":{\"insight\":\"SECOND LIMB: nirvāṇa is NOT a nonexistent thing (abhāva). Nonexistent things are defined RELATIVE to existent things (as their negation). They're dependent on what they negate. But nirvāṇa is supposed to be independent/unconditioned. A \\\"dependent nonexistence\\\" can't be nirvāṇa.\",\"madhyamaka\":\"Abhāvaś cet nirvāṇam, nirvāṇam katham bhavet nirupādānam. Na hy abhāvo nirupādāno vidyate. Nonexistence depends on existence for its definition. Nirvāṇa is nirupādāna (without clinging/dependence).\",\"quantum\":\"The absence of a particle is defined relative to the particle. It's not an independent state. Similarly, \\\"nonexistence\\\" is parasitic on \\\"existence.\\\"\",\"bridge\":\"Both: negations depend on what they negate. QM: \\\"no particle\\\" depends on the concept of \\\"particle.\\\" V.5: \\\"nonexistent nirvāṇa\\\" depends on \\\"existent nirvāṇa.\\\" But nirvāṇa is independent.\",\"accessible\":\"If nirvāṇa were \\\"nothing,\\\" it would be defined as \\\"not something\\\" — dependent on \\\"something.\\\" But nirvāṇa is supposed to be independent. \\\"Nothing\\\" is always relative to \\\"something.\\\"\",\"twoTruths\":\"Conventionally: nonexistence is defined relative to existence. Nirvāṇa transcends both — it's not the mere negation of saṃsāra.\",\"commonMisconception\":\"NOT saying nonexistence is impossible. Saying nirvāṇa specifically can't be a \\\"nonexistent thing\\\" because nonexistence is dependent (parasitic on existence). Nirvāṇa is beyond dependence.\"},\"quantumResonance\":{\"concept\":\"Absence Is Relative\",\"score\":52,\"strength\":\"Medium\",\"explanation\":\"\\\"No particle\\\" is defined relative to \\\"particle.\\\" Similarly, \\\"nonexistent nirvāṇa\\\" is defined relative to \\\"existent nirvāṇa.\\\" Both: negations are dependent on what they negate.\",\"caveat\":\"Physical absence vs. metaphysical nonexistence.\"},\"animation\":{\"visualBridge\":\"A shadow defined by an object. Remove the object → no shadow. Nonexistence depends on existence. But nirvāṇa is independent — not a shadow of anything.\",\"educationalGoal\":\"Nonexistence depends on existence. Nirvāṇa transcends both — not the mere negation of saṃsāra.\"},\"deeperDive\":[{\"q\":\"Why is nonexistence dependent?\",\"a\":\"\\\"The absence of X\\\" requires the concept of X. It's parasitic — defined ONLY in relation to what it negates. An absence is always an absence OF something.\",\"realLifeExample\":\"\\\"Darkness\\\" is defined as \\\"absence of light.\\\" Without the concept of light, \\\"darkness\\\" is meaningless.\"},{\"q\":\"Why can't nirvāṇa be dependent?\",\"a\":\"Nirvāṇa is nirupādāna — without clinging/dependence. If it depended on saṃsāra for its definition (as its negation), it would be conditioned by saṃsāra. But nirvāṇa is supposed to be unconditioned.\",\"realLifeExample\":\"True freedom isn't just \\\"not imprisonment.\\\" It's a positive state that transcends the prison/free duality.\"},{\"q\":\"Is nirvāṇa nihilism?\",\"a\":\"V.5 explicitly rejects this. Nihilism = nonexistence. But nonexistence is dependent. Nirvāṇa is independent. Therefore nirvāṇa ≠ nihilism.\",\"realLifeExample\":\"Peace isn't just \\\"no war.\\\" It's a positive condition that goes beyond the war/peace opposition.\"},{\"q\":\"Connection to the tetralemma?\",\"a\":\"Second limb eliminated: nirvāṇa ≠ nonexistent. Combined with v.4 (≠ existent), two of four positions are eliminated.\",\"realLifeExample\":\"Two more wrong answers crossed out. Halfway through elimination.\"},{\"q\":\"How does this relate to v.3?\",\"a\":\"V.3: \\\"no annihilation.\\\" V.5 explains why: annihilation = nonexistence = dependent. Nirvāṇa transcends dependence. V.5 philosophically grounds v.3's negation.\",\"realLifeExample\":\"V.3 states the fact. V.5 explains the reason.\"},{\"q\":\"Significance?\",\"a\":\"V.5 eliminates the nihilistic interpretation of nirvāṇa. This is crucial because many interpret emptiness as nihilism. Nirvāṇa is NOT nothingness.\",\"deeper\":\"V.5 is philosophically subtle: it shows that even \\\"nonexistence\\\" is a dependent concept. This challenges the common assumption that emptiness or nirvāṇa means \\\"nothingness.\\\" Nothingness is just as conceptually constrained as somethingness. Nirvāṇa transcends the entire existence/nonexistence framework.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can't nirvāṇa be a nonexistent thing?\",\"options\":[\"A) It can\",\"B) Nonexistence is DEPENDENT on existence (defined as \\\"not X\\\"). Nirvāṇa is independent/unconditioned. A dependent nonexistence can't be independent nirvāṇa.\",\"C) Nonexistence is fine\",\"D) Different reason\"],\"correct\":\"B\",\"explanation\":\"Nonexistence = dependent. Nirvāṇa = independent. Incompatible.\"},\"intermediate\":{\"question\":\"How does v.5 counter nihilism?\",\"options\":[\"A) Doesn't\",\"B) Nihilism = nonexistence. Nonexistence is dependent. Nirvāṇa is independent. Therefore nirvāṇa ≠ nihilism. Emptiness ≠ nothingness.\",\"C) Supports nihilism\",\"D) Irrelevant\"],\"correct\":\"B\",\"explanation\":\"Nirvāṇa transcends nonexistence. Not nihilism.\"},\"advanced\":{\"question\":\"What is philosophically novel about v.5?\",\"options\":[\"A) Nothing\",\"B) Shows that even \\\"nonexistence\\\" is a dependent concept — parasitic on existence. This challenges the assumption that emptiness = nothingness. The entire existence/nonexistence framework is transcended.\",\"C) Standard point\",\"D) Only repetition\"],\"correct\":\"B\",\"explanation\":\"Nonexistence itself is dependent/conceptual. Nirvāṇa transcends the whole framework.\"}},\"verseText\":\"If nirvāṇa were a nonexistent thing, how could nirvāṇa be nondependent? A nonexistent thing that is nondependent does not exist.\",\"madhyamakaConcept\":\"Abhāvaś cet nirvāṇam, nirvāṇam katham bhavet nirupādānam. Na hy abhāvo nirupādāno vidyate. Nonexistence depends on existence for its definition. Nirvāṇa is nirupādāna (without clinging/dependence).\",\"quantumPhysicsParallel\":\"The absence of a particle is defined relative to the particle. It's not an independent state. Similarly, \\\"nonexistence\\\" is parasitic on \\\"existence.\\\"\"}},\"isShowcase\":false,\"chapterId\":25}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"o

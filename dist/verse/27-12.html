88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":27,\"verseId\":12,\"chapterTitle\":\"Examination of Views\",\"totalVerses\":30,\"verseData\":{\"id\":\"v27_12\",\"number\":12,\"title\":\"The Self Neither Arises Nor Ceases\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"The self does not arise from the self, does not arise from another self, does not arise from both, and does not arise without cause.\"},\"philosophy\":{\"insight\":\"THE FOURFOLD NEGATION of arising applied to the self: the self doesn't arise from itself (self-causation), from another self (other-causation), from both (contradictory), or causelessly (random). No form of arising establishes an inherent self.\",\"madhyamaka\":\"Na ātmataḥ jāyate, na parataḥ, na ubhayataḥ, na ahetutaḥ. The catuskoti applied to the self's arising — the same structure as Ch.1 v.1.\",\"quantum\":\"A quantum state doesn't arise from itself (no bootstrapping), from nothing (no violation of conservation), from another state alone (entanglement), or causelessly. Arising is always conditional.\",\"bridge\":\"Both: all four modes of inherent arising fail. QM: no unconditional arising. V.12: no inherent self-arising.\",\"accessible\":\"How did \\\"you\\\" come to be? From yourself? (Circular.) From someone else? (Then it's not you.) From both? (Contradictory.) From nothing? (Impossible.) No inherent origin found.\",\"twoTruths\":\"Conventionally: you arose from conditions (parents, karma, etc.). Ultimately: no INHERENT arising of an inherent self.\",\"commonMisconception\":\"NOT denying that you were born. Denying that an INHERENT self had an inherent origin. Conventional birth is real.\"},\"quantumResonance\":{\"concept\":\"No Unconditional Arising\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"No unconditional self-arising in QM or in Buddhist analysis. All arising is conditional/dependent. Both: the fourfold negation of inherent arising.\",\"caveat\":\"Physical origination vs. self-origination.\"},\"animation\":{\"visualBridge\":\"Four arrows pointing to \\\"SELF\\\" — from self, other, both, neither. Each crossed out. No inherent origin.\",\"educationalGoal\":\"The self doesn't arise from itself, another, both, or causelessly. No inherent arising.\"},\"deeperDive\":[{\"q\":\"Why is this the same as Ch.1 v.1?\",\"a\":\"Ch.1 v.1 applied the fourfold negation to all phenomena. V.12 applies it specifically to the self. The MMK is circular — it returns to its beginning.\",\"realLifeExample\":\"The story ends where it began. The general principle (Ch.1) is applied to the most personal case (Ch.27).\"},{\"q\":\"Does the self arise at all?\",\"a\":\"Dependently, yes. Inherently, no. The self arises from conditions (dependent origination) but not from any inherent source.\",\"realLifeExample\":\"A flame arises from conditions (fuel, heat, oxygen) but not from any inherent \\\"fire-source.\\\"\"},{\"q\":\"Why is self-arising impossible?\",\"a\":\"To arise from itself, it would need to exist BEFORE it arises — contradiction. If it already exists, it doesn't need to arise.\",\"realLifeExample\":\"You can't lift yourself by your own bootstraps. You'd need to exist before you exist.\"},{\"q\":\"Why is causeless arising impossible?\",\"a\":\"Ch.1: nothing arises without conditions. A causeless self would be random, unconnected to anything. This violates all experience.\",\"realLifeExample\":\"Things don't pop into existence from nothing. There are always conditions.\"},{\"q\":\"Connection to dependent origination?\",\"a\":\"The fourfold negation of inherent arising IS the flip side of dependent origination. Denying inherent arising affirms dependent arising.\",\"realLifeExample\":\"Showing \\\"it doesn't arise inherently\\\" = showing \\\"it arises dependently.\\\" Same coin, two sides.\"},{\"q\":\"Significance?\",\"a\":\"V.12 applies the foundational argument of the MMK (Ch.1) to its most personal subject (the self). The circle closes.\",\"deeper\":\"V.12 is the MMK returning to its foundations: the fourfold negation of arising (Ch.1) now applied to the self (Ch.27). The most universal principle applied to the most personal case. Full circle.\"}],\"quiz\":{\"beginner\":{\"question\":\"Can the self arise from itself?\",\"options\":[\"A) Yes\",\"B) NO — it would need to exist before it arises, which is contradictory. No form of inherent self-arising works.\",\"C) Sometimes\",\"D) In meditation\"],\"correct\":\"B\",\"explanation\":\"Self-arising is circular/contradictory.\"},\"intermediate\":{\"question\":\"How does v.12 connect to Ch.1?\",\"options\":[\"A) Unrelated\",\"B) Ch.1 v.1: fourfold negation for all phenomena. V.12: same fourfold negation for the self. The MMK returns to its beginning.\",\"C) Different argument\",\"D) Only similar\"],\"correct\":\"B\",\"explanation\":\"Same foundational argument applied to the self. Full circle.\"},\"advanced\":{\"question\":\"What does the fourfold negation of arising affirm?\",\"options\":[\"A) Nothing\",\"B) DEPENDENT arising. Denying inherent arising = affirming dependent arising. Same coin, two sides.\",\"C) Nihilism\",\"D) Self-existence\"],\"correct\":\"B\",\"explanation\":\"Negation of inherent arising = affirmation of dependent arising.\"}},\"verseText\":\"The self does not arise from the self, does not arise from another self, does not arise from both, and does not arise without cause.\",\"madhyamakaConcept\":\"Na ātmataḥ jāyate, na parataḥ, na ubhayataḥ, na ahetutaḥ. The catuskoti applied to the self's arising — the same structure as Ch.1 v.1.\",\"quantumPhysicsParallel\":\"A quantum state doesn't arise from itself (no bootstrapping), from nothing (no violation of conservation), from another state alone (entanglement), or causelessly. Arising is always conditional.\"}},\"isShowcase\":false,\"chapterId\":27}]\n"])</script><script>self.__n

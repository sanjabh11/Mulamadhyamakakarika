176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":24,\"verseId\":6,\"chapterTitle\":\"Examination of the Noble Truths\",\"totalVerses\":40,\"verseData\":{\"id\":\"v24_6\",\"number\":6,\"title\":\"Emptiness Contradicts All Worldly Conventions\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"You also contradict the existence of all worldly conventions, the reality of fruits and their causes, and all that is wrong and right.\"},\"philosophy\":{\"insight\":\"FINAL expansion: emptiness doesn't just destroy Buddhism — it destroys ALL worldly conventions. Causation, moral responsibility (right/wrong), and everyday reality all collapse. The opponent's objection is now TOTAL: emptiness is universal nihilism.\",\"madhyamaka\":\"Sarva saṃvṛti sadbhāva bādhase (you contradict all worldly conventions). Phala-hetu sadbhāvam (reality of fruits and causes). Sarva sādhu-asādhu (all right and wrong). Universal accusation of nihilism.\",\"quantum\":\"QM accused of destroying not just physics but common sense, causation, and reality itself. \\\"If nothing has definite properties, how can everyday life work?\\\"\",\"bridge\":\"Both: the new framework accused of destroying everyday reality, not just the specialized field. QM: destroys common sense. Emptiness: destroys all conventions.\",\"accessible\":\"\\\"If nothing is inherently real, then right and wrong don't exist, cause and effect don't work, and everyday life is impossible!\\\" The most extreme form of the nihilism accusation.\",\"twoTruths\":\"Worldly conventions operate at the conventional level. They don't need inherent existence — they need CONVENTIONAL existence, which emptiness provides.\",\"commonMisconception\":\"The opponent sees only two options: inherent existence or total non-existence. The Middle Way (conventional existence without inherent existence) is the third option they're missing.\"},\"quantumResonance\":{\"concept\":\"Universal Nihilism Accusation\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"QM accused of destroying common sense. Emptiness accused of destroying all conventions. Both: the new understanding is seen as universal nihilism.\",\"caveat\":\"QM common-sense challenges are physics. V.6 is about all conventions.\"},\"animation\":{\"visualBridge\":\"Everything collapsing: Three Jewels, causation, morality, everyday objects. Total void. Caption: \\\"The opponent's conclusion: emptiness = universal nihilism.\\\"\",\"educationalGoal\":\"The objection at maximum scope: emptiness destroys EVERYTHING, not just Buddhism.\"},\"deeperDive\":[{\"q\":\"Why extend to worldly conventions?\",\"a\":\"To make the objection maximally comprehensive. Not just Buddhism but ALL of reality is at stake. This forces Nāgārjuna to defend emptiness universally, not just for Buddhist doctrines.\",\"realLifeExample\":\"Not just \\\"your theory is wrong\\\" but \\\"your theory destroys everything.\\\" Maximum challenge requires maximum response.\"},{\"q\":\"What are \\\"fruits and their causes\\\"?\",\"a\":\"Causation in general: actions have results, causes produce effects. If emptiness destroys causation, nothing works — not science, not cooking, not anything.\",\"realLifeExample\":\"If causes don't produce effects, pressing a light switch doesn't turn on the light. Everything stops.\"},{\"q\":\"What is \\\"right and wrong\\\"?\",\"a\":\"Moral responsibility: good actions lead to good results, bad to bad. If emptiness destroys this, ethics collapses. No basis for praise, blame, or moral guidance.\",\"realLifeExample\":\"If nothing is right or wrong, why be good? Why avoid harm? Moral nihilism.\"},{\"q\":\"Is this objection reasonable?\",\"a\":\"Yes, IF emptiness = non-existence. The opponent correctly derives the consequences of nihilism. But the premise (empty = non-existent) is wrong. Nāgārjuna will correct the premise, not dispute the logic.\",\"realLifeExample\":\"\\\"If 2+2=5, then mathematics collapses.\\\" True — but 2+2≠5. The premise, not the logic, is the problem.\"},{\"q\":\"What will Nāgārjuna respond?\",\"a\":\"Vv.7-40: emptiness ENABLES causation, conventions, and morality. Without emptiness (if things were inherent), NOTHING could work. The opponent's position is the real nihilism.\",\"realLifeExample\":\"If things were permanently fixed (inherent), nothing could change. No cooking (ingredients can't transform), no growth (can't change), no morality (can't improve). Inherent existence is the real nihilism.\"},{\"q\":\"Significance?\",\"a\":\"V.6 concludes the objection section. Vv.1-6 = maximum attack. Vv.7-40 = Nāgārjuna's response. V.6 ensures the response must address not just Buddhism but ALL of reality.\",\"deeper\":\"V.6 completes the objection by extending it to universal scope. The opponent has accused emptiness of: destroying arising/ceasing (v.1), the Noble Truths (v.2), the sangha (v.3), the Three Jewels (vv.4-5), and now ALL conventions (v.6). This is the total nihilism accusation. Nāgārjuna's response must be equally total — and it is.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does the opponent accuse emptiness of destroying?\",\"options\":[\"A) Only Buddhism\",\"B) EVERYTHING: Buddhism, causation, morality, and all worldly conventions. Total nihilism accusation.\",\"C) Only some things\",\"D) Only theory\"],\"correct\":\"B\",\"explanation\":\"Maximum scope: emptiness accused of destroying all of reality.\"},\"intermediate\":{\"question\":\"What is the opponent's fundamental error?\",\"options\":[\"A) No error\",\"B) Equating emptiness with non-existence. Empty ≠ non-existent. The Middle Way: conventional existence without inherent existence.\",\"C) Logic is wrong\",\"D) Only partially wrong\"],\"correct\":\"B\",\"explanation\":\"Empty ≠ non-existent. The third option (conventional existence) is what they're missing.\"},\"advanced\":{\"question\":\"How does v.6 set up vv.7-40?\",\"options\":[\"A) Doesn't\",\"B) By making the accusation maximally comprehensive (universal nihilism), v.6 forces Nāgārjuna's response to be equally comprehensive. The total attack requires a total defense.\",\"C) Partial setup\",\"D) Different topic\"],\"correct\":\"B\",\"explanation\":\"Total attack → total defense. V.6 ensures the response covers everything.\"}},\"verseText\":\"You also contradict the existence of all worldly conventions, the reality of fruits and their causes, and all that is wrong and right.\",\"madhyamakaConcept\":\"Sarva saṃvṛti sadbhāva bādhase (you contradict all worldly conventions). Phala-hetu sadbhāvam (reality of fruits and causes). Sarva sādhu-asādhu (all right and wrong). Universal accusation of nihilism.\",\"quantumPhysicsParallel\":\"QM accused of destroying not just physics but common sense, causation, and reality itself. \\\"If nothing has definite properties, how can everyday life work?\\\"\"}},\"isShowcase\":false,\"chapterId\":24}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedago

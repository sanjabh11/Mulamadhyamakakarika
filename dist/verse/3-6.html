c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":3,\"verseId\":6,\"chapterTitle\":\"Examination of Perception\",\"totalVerses\":9,\"verseData\":{\"id\":\"v3_6\",\"number\":6,\"title\":\"Seer and Seeing Are Inseparable\",\"sanskrit\":{\"text\":\"darśanād ṛte nāsti kaścid draṣṭā ca vidyate | darśanaṃ dṛśyam evāhuḥ katham evaṃ bhaviṣyati ||\",\"transliteration\":\"darśanād ṛte nāsti kaścid draṣṭā ca vidyate | darśanaṃ dṛśyam evāhuḥ katham evaṃ bhaviṣyati\",\"translation\":\"Without detachment from vision there is no seer. Nor is there a seer detached from it. If there is no seer, how can there be seeing or the seen?\"},\"philosophy\":{\"insight\":\"The seer cannot exist within seeing (they'd be identical) or apart from seeing (it would be a \\\"nonseeing seer\\\"). Neither option works. Without an established seer, the entire seer-seeing-seen triad collapses — all three are mutually dependent.\",\"madhyamaka\":\"Garfield: this verse parallels Ch. 2's neither-identical-nor-different analysis applied to mover/motion. The seer is neither identical to seeing (then agent = act, absurd) nor different from it (then \\\"nonseeing seer,\\\" absurd per v.4). Kalupahana: the verse establishes the complete mutual dependence of the perceptual triad — seer, seeing, and seen. None can be established independently. Candrakīrti draws the devastating conclusion: if even one element fails to be established inherently, the whole structure collapses.\",\"quantum\":\"EPR Non-Separability / Quantum Holism: In entangled systems, the observer, measurement apparatus, and measured system form an inseparable whole. You cannot describe any component independently without reference to the others. Bell's theorem (1964) proves this inseparability experimentally — no local hidden variables can restore independence.\",\"bridge\":\"Both establish that the components of observation form an inseparable whole. The quantum observer-apparatus-system triad is non-separable (Bell's theorem). The Buddhist seer-seeing-seen triad is non-separable (neither identical nor different). In both, forced separation generates contradictions.\",\"accessible\":\"A triangle has three sides — but can one side exist without the other two? Remove any side and it's no longer a triangle. Seer, seeing, and seen are like three sides of a triangle: remove any one and the other two collapse. They exist only as a complete, interdependent structure.\",\"twoTruths\":\"Conventionally, we distinguish seer, seeing, and seen — \\\"I see the mountain.\\\" Ultimately, none of the three can be established independently — they form an inseparable triad.\",\"commonMisconception\":\"NOT saying we can't distinguish seer from seen in everyday life. Saying these distinctions are CONVENTIONAL, not tracking inherent, independent entities. The triad is useful but empty.\"},\"quantumResonance\":{\"concept\":\"EPR Non-Separability / Bell's Theorem\",\"score\":89,\"strength\":\"High\",\"explanation\":\"Entangled systems are non-separable — no component has independent states. Parallels the seer-seeing-seen triad's inseparability.\",\"caveat\":\"Structural parallel: both show forced decomposition of an integrated whole into independent parts fails. Not claiming perception IS quantum entanglement.\"},\"animation\":{\"geometry\":\"Interdependent Triangle\",\"anchor\":\"A glowing triangle with three vertices: \\\"Seer\\\" (amethyst), \\\"Seeing\\\" (cyan), \\\"Seen\\\" (emerald). Edges pulse with energy flowing between them. Removing any vertex causes the entire triangle to collapse.\",\"texture\":\"Vertices: Glowing orbs with internal light. Edges: Pulsing energy lines with flowing particles. Collapse: Vertices dissolve into shared particle cloud.\",\"mood\":\"Unified, inseparable, structurally dependent\",\"colors\":[\"#8B5CF6\",\"#06B6D4\",\"#10B981\",\"#1E293B\"],\"orchestration\":{\"start\":\"Triangle rotates with energy flowing between all three vertices.\",\"click\":\"Click any vertex to \\\"remove\\\" it — the entire triangle collapses, all three vertices dissolve. Text: \\\"Remove any one — all three fall.\\\"\",\"reveal\":\"Triangle reforms from shared particle cloud. Text: \\\"Seer, seeing, and seen exist only together — an inseparable triad.\\\"\"},\"interaction\":{\"click\":\"Click any vertex to see the whole triangle collapse — demonstrating inseparability\",\"drag\":\"Rotate to examine the triangle's structure from all angles\",\"hover\":\"Hover highlights the energy flow along each edge with relationship labels\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.4},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":60,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true,\"autoRevealToggle\":true},\"r3fTechniques\":[\"drei Line for animated triangle edges with flowing particle dash offset\",\"MeshPhysicalMaterial with emissive for vertex orbs\",\"InstancedMesh for collapse/reform particle cloud (800 particles)\",\"Bloom post-processing for vertex glow and edge luminance\",\"useSpring for smooth collapse and reformation transitions\"],\"camera\":{\"position\":[0,3,8],\"fov\":50,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c250MB memory, 60 FPS. Three sphere vertices with line edges. Collapse particles use shared instanced geometry.\",\"tripoPrompt\":\"A glowing triangle in dark space with amethyst, cyan, and emerald vertices connected by pulsing energy lines, one vertex dissolving causing collapse, 8K.\",\"visualBridge\":\"The triangle that collapses entirely when any vertex is removed directly encodes the inseparable triad — seer, seeing, and seen cannot exist independently.\",\"educationalGoal\":\"User sees that seer, seeing, and seen form an inseparable triad — removing any one collapses the entire structure of perception.\"},\"deeperDive\":[{\"q\":\"Why can't the seer exist \\\"within\\\" seeing?\",\"a\":\"If the seer is identical to seeing, then the agent IS the act. But agents and acts are conceptually distinct — the cook isn't the cooking. Identifying them collapses the agent-action distinction and makes \\\"the seer sees\\\" a meaningless tautology (\\\"seeing sees\\\"), which v.2 already rejected.\",\"realLifeExample\":\"Is the driver the same thing as driving? If yes, the driver disappears when they park — which is absurd. Driver and driving are related but not identical. Same for seer and seeing.\"},{\"q\":\"Why can't the seer exist \\\"apart from\\\" seeing?\",\"a\":\"A seer apart from seeing would be a \\\"nonseeing seer\\\" — contradictory (v.4). Without the function of seeing, nothing qualifies as a \\\"seer.\\\" The designation requires the function. Separating them destroys the designation.\",\"realLifeExample\":\"Can someone be a \\\"swimmer\\\" while never swimming? Only metaphorically. The designation \\\"swimmer\\\" requires the activity of swimming. Remove the activity, remove the designation.\"},{\"q\":\"What happens when the seer is not established?\",\"a\":\"The domino effect: without a seer, there's no one to perform seeing, so seeing is ungrounded. Without seeing, there's nothing to designate something as \\\"seen.\\\" The entire perceptual triad — seer, seeing, seen — collapses simultaneously. None can be the foundation for the others.\",\"realLifeExample\":\"In a triangle, remove one side and you no longer have a triangle — the other two sides are just disconnected lines. The structure requires all three. The perceptual triad is the same.\"},{\"q\":\"How does Bell's theorem prove quantum non-separability?\",\"a\":\"Bell (1964) derived an inequality that any theory of independent local properties must satisfy. Quantum mechanics predicts violations of this inequality, confirmed by Aspect (1982) and Hensen (2015). Therefore, entangled particles cannot be described as independently existing entities with separate states — they form an inseparable whole.\",\"realLifeExample\":\"If two students independently took the same test, their answers should correlate only by chance. If they correlate MORE than chance allows, they must be connected (not independent). Bell's test shows quantum particles are \\\"connected\\\" — not independent.\"},{\"q\":\"How does this verse connect to Ch. 2's identity/difference analysis?\",\"a\":\"Ch. 2 v.18-21: mover and motion are neither identical nor different. Ch. 3 v.6: seer and seeing are neither identical nor different. The logical structure is exactly parallel — applied to a new domain. This builds Nāgārjuna's case that the analysis is universal, not domain-specific.\",\"realLifeExample\":\"If the same proof technique works for algebra AND geometry AND number theory, the technique is universal. Nāgārjuna's neither-identical-nor-different analysis works for motion AND perception — it's universal.\"},{\"q\":\"What is the significance for the chapter's argument?\",\"a\":\"V.6 is the structural peak of Ch. 3. It establishes that the entire apparatus of perception — seer, seeing, seen — is an inseparable, mutually dependent triad. None has independent existence. V.7-9 will generalise this to all senses and to consciousness itself.\",\"deeper\":\"Garfield: v.6 achieves for perception what v.21 achieved for motion in Ch. 2 — the complete demonstration of mutual dependence. The remaining verses (v.7-9) are universalisation and conclusion.\"}],\"quiz\":{\"beginner\":{\"question\":\"What happens when you try to remove the seer from the perceptual triad?\",\"options\":[\"A) Seeing and seen continue normally\",\"B) The entire triad collapses — without a seer, seeing and seen are also ungrounded\",\"C) Only seeing is affected\",\"D) Nothing changes\"],\"correct\":\"B\",\"explanation\":\"Seer, seeing, and seen are mutually dependent. Remove any one and the other two lose their ground — the structure is like a triangle where all three sides are needed.\"},\"intermediate\":{\"question\":\"What does Bell's theorem prove about quantum systems?\",\"options\":[\"A) Particles move faster than light\",\"B) Entangled particles cannot be described as independently existing entities with separate states — they are non-separable\",\"C) Quantum mechanics is wrong\",\"D) Particles have hidden properties\"],\"correct\":\"B\",\"explanation\":\"Bell's theorem and subsequent experiments prove entangled particles form an inseparable whole — no local hidden variables can restore their independence. This parallels the seer-seeing-seen triad's inseparability.\"},\"advanced\":{\"question\":\"How does the seer-seeing-seen analysis parallel Ch. 2's mover-motion analysis?\",\"options\":[\"A) They are unrelated\",\"B) Both apply the neither-identical-nor-different analysis: the agent is neither the same as nor different from its action, proving mutual dependence\",\"C) Motion is about seeing\",\"D) Ch. 2 is about perception\"],\"correct\":\"B\",\"explanation\":\"Both chapters apply the same logical template: mover ≠ motion AND mover is not separate from motion (Ch. 2). Seer ≠ seeing AND seer is not separate from seeing (Ch. 3). The universal structure proves the analysis applies across all domains.\"}},\"verseText\":\"Without detachment from vision there is no seer. Nor is there a seer detached from it. If there is no seer, how can there be seeing or the seen?\",\"madhyamakaConcept\":\"Garfield: this verse parallels Ch. 2's neither-identical-nor-different analysis applied to mover/motion. The seer is neither identical to seeing (then agent = act, absurd) nor different from it (then \\\"nonseeing seer,\\\" absurd per v.4). Kalupahana: the verse establishes the complete mutual dependence of the perceptual triad — seer, seeing, and seen. None can be established independently. Candrakīrti draws the devastating conclusion: if even one element fails to be established inherently, the whole structure collapses.\",\"quantumPhysicsParallel\":\"EPR Non-Separability / Quantum Holism: In entangled systems, the observer, measurement apparatus, and measured system form an inseparable whole. You cannot describe any component independently without reference to the others. Bell's theorem (1964) proves this inseparability experimentally — no local hidden variables can restore independence.\"}},\"isShowcase\":false,\"chapterId\":3}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitt

88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":17,\"verseId\":14,\"chapterTitle\":\"Examination of Action and Fruit\",\"totalVerses\":33,\"verseData\":{\"id\":\"v17_14\",\"number\":14,\"title\":\"Karma as Promissory Note: The Debt Analogy\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Action is like an uncancelled promissory note And like a debt. Of the realms it is fourfold. Moreover, its nature is neutral.\"},\"philosophy\":{\"insight\":\"Nāgārjuna's OWN model of karma begins: action is like an unpaid debt or promissory note. The action ceases but its obligation persists — not as an inherent entity but as a conventional relation. Fourfold across realms, neutral in nature. This is the emptiness-compatible model of karmic persistence.\",\"madhyamaka\":\"Avipraṇāśa (nonexpiring/uncancelled): karma functions like an ṛṇa (debt) or likhita (promissory note). The action ceases but the karmic \\\"debt\\\" persists conventionally. Catur-vidha (fourfold): across desire, form, formless, and undefiled realms. Avyākṛta (neutral): action in itself is ethically neutral — its ethical quality depends on intention.\",\"quantum\":\"Quantum entanglement as \\\"debt\\\": when particles interact and separate, a correlation (entanglement) persists even after the interaction ceases. The interaction is gone but its \\\"obligation\\\" (correlation) remains. Like the promissory note: the original event is over but its consequence persists.\",\"bridge\":\"Both the promissory note and quantum entanglement show effects persisting after their causes cease — not as inherent entities but as RELATIONS. Buddhism: the \\\"debt\\\" is a conventional relation, not a substance. QM: entanglement is a correlation, not a substance. Both: persistence through relations, not entities.\",\"accessible\":\"You borrow money. The act of borrowing is over (it ceased). But the debt remains — you owe something until you repay. The debt isn't a \\\"thing\\\" floating around; it's a RELATIONSHIP between you and the lender. Karma works the same way: the action ceases but the \\\"debt\\\" (karmic obligation) persists as a conventional relationship.\",\"twoTruths\":\"Conventionally, the \\\"debt\\\" is real and functions (you must repay). Ultimately, the debt is empty — it's a conventional designation on a relational process, not an inherent entity. This is the emptiness-compatible model: real conventionally, empty ultimately.\",\"commonMisconception\":\"NOT saying karma is literally a financial debt. It's an ANALOGY: actions create obligations (like debts) that persist conventionally without the action itself being permanent. The analogy highlights persistence through RELATION, not through inherent substance.\"},\"quantumResonance\":{\"concept\":\"Entanglement as Persistent Correlation\",\"score\":63,\"strength\":\"Medium\",\"explanation\":\"Quantum entanglement creates correlations that persist after the interaction ceases. Like the promissory note: the interaction (action) is over, but the correlation (debt) persists as a relation, not a substance.\",\"caveat\":\"Entanglement is a physical correlation between quantum systems. The promissory note is a metaphor for karmic obligation. The parallel is about persistence through relations rather than substances.\"},\"animation\":{\"visualBridge\":\"A handshake (action/interaction) → the hands separate (action ceases) → but a glowing thread connects them (debt/entanglement persists). The thread isn't a substance — it's a RELATION. Four realms shown as four layers, each with their own threads.\",\"educationalGoal\":\"User sees karma as debt/relation: actions cease but obligations persist conventionally, like a promissory note. Persistence through relation, not substance.\"},\"deeperDive\":[{\"q\":\"How is the promissory note different from the seed model?\",\"a\":\"The seed model (vv.7-8) requires an intermediary ENTITY (the sprout/continuum). The promissory note model requires only a RELATION (the debt). Relations are easier to reconcile with emptiness than entities. Nāgārjuna's model is more elegant because it doesn't need intermediate substances.\",\"realLifeExample\":\"Sending a package (seed model: needs a physical carrier like FedEx) vs. wiring money (promissory note model: just a relationship change in ledgers). The wire transfer doesn't need a physical intermediary — the relationship itself changes.\"},{\"q\":\"What makes the debt \\\"uncancelled\\\"?\",\"a\":\"The karmic potential hasn't been \\\"repaid\\\" — the fruit hasn't yet ripened, and the root causes (ignorance, craving) haven't been eliminated through wisdom. Until either fruition or liberation, the debt remains conventionally \\\"active.\\\"\",\"realLifeExample\":\"A credit card balance: it remains active until you either pay it off (fruition) or the account is closed (liberation/nirvana). The balance isn't a \\\"thing\\\" — it's a recorded obligation.\"},{\"q\":\"What does \\\"fourfold\\\" mean?\",\"a\":\"Karma operates across four realms: (1) kāma-dhātu (desire realm — where most beings live), (2) rūpa-dhātu (form realm — meditative states with subtle form), (3) arūpa-dhātu (formless realm — pure meditative states), (4) anāsrava (undefiled — actions leading toward liberation). Karma is universal across all domains of existence.\",\"realLifeExample\":\"A law that applies in all jurisdictions: federal, state, local, and international. Karma applies across all realms of existence, not just the human realm.\"},{\"q\":\"Why is action \\\"neutral in nature\\\"?\",\"a\":\"Because action in itself — apart from intention — has no inherent ethical quality. Killing, for example, could be motivated by malice (non-virtuous), self-defense (neutral), or compassion (complex). The ethical quality comes from the cetanā (intention), not the physical act.\",\"realLifeExample\":\"A knife is neutral — it can be used to prepare food (positive) or to harm (negative). The tool is neutral; the intention determines the ethical quality. Actions are like tools — neutral in themselves.\"},{\"q\":\"How does the debt analogy handle persistence without permanence?\",\"a\":\"A debt isn't permanent (it can be repaid or cancelled). But it isn't annihilated when the borrowing act ends. It persists as a conventional RELATION until resolved. Like karma: the action isn't permanent (it ceases), but its consequence isn't annihilated (the \\\"debt\\\" persists until resolved through fruition or liberation).\",\"realLifeExample\":\"A marriage certificate: the wedding ceremony (action) is over, but the marriage (relation) persists. The marriage isn't the ceremony persisting permanently — it's a new relation that continues until dissolved. Karma-as-debt is similar.\"},{\"q\":\"Why is this model compatible with emptiness?\",\"a\":\"Because it posits persistence through RELATION, not through SUBSTANCE. Relations are inherently empty — they depend on relata (the things they relate). A debt depends on debtor and creditor. Karma depends on agent and situation. Empty relations can persist conventionally without any inherent entity needing to persist.\",\"deeper\":\"V.14 introduces what may be Nāgārjuna's most original contribution to Buddhist karma theory: the avipraṇāśa (nonexpiring) model. Unlike the Sautrāntika seed model (which requires intermediate entities) or the Sarvāstivāda dharma-existence model (which requires past dharmas to exist), Nāgārjuna's model requires only empty, conventional RELATIONS. This is more parsimonious (fewer entities), more compatible with emptiness (relations, not substances), and more elegant (persistence through a single mechanism). The promissory note analogy is often cited as one of the most brilliant metaphors in the MMK.\"}],\"quiz\":{\"beginner\":{\"question\":\"How is karma like a promissory note?\",\"options\":[\"A) It's written on paper\",\"B) The action (borrowing) ceases but the obligation (debt) persists conventionally until resolved. Karma persists as a relation, not as an inherent substance.\",\"C) It's permanent\",\"D) It's annihilated\"],\"correct\":\"B\",\"explanation\":\"The promissory note: action ceases, obligation persists. Like karma: the act is over but the karmic \\\"debt\\\" continues conventionally until fruition or liberation.\"},\"intermediate\":{\"question\":\"How does the debt model improve on the seed model?\",\"options\":[\"A) It doesn't\",\"B) The seed model requires intermediate ENTITIES (sprouts). The debt model requires only RELATIONS (obligations). Relations are easier to reconcile with emptiness because they depend on relata rather than persisting as substances.\",\"C) Seeds are better\",\"D) Debts are permanent\"],\"correct\":\"B\",\"explanation\":\"Relations vs. entities: the debt model is more parsimonious and more compatible with emptiness. No intermediate substances needed — just conventional relations.\"},\"advanced\":{\"question\":\"Why is v.14 considered one of Nāgārjuna's most original contributions?\",\"options\":[\"A) It's not original\",\"B) The avipraṇāśa (nonexpiring) model resolves the karma continuity problem through empty RELATIONS rather than intermediate ENTITIES. It's more parsimonious, more compatible with emptiness, and avoids the permanence/annihilation dilemma.\",\"C) Others said it first\",\"D) Only the analogy is original\"],\"correct\":\"B\",\"explanation\":\"The nonexpiring model is original: persistence through relations (not entities), compatible with emptiness, avoids both extremes, and is more parsimonious than competing models.\"}},\"verseText\":\"Action is like an uncancelled promissory note And like a debt. Of the realms it is fourfold. Moreover, its nature is neutral.\",\"madhyamakaConcept\":\"Avipraṇāśa (nonexpiring/uncancelled): karma functions like an ṛṇa (debt) or likhita (promissory note). The action ceases but the karmic \\\"debt\\\" persists conventionally. Catur-vidha (fourfold): across desire, form, formless, and undefiled realms. Avyākṛta (neutral): action in itself is ethically neutral — its ethical quality depends on intention.\",\"quantumPhysicsParallel\":\"Quantum entanglement as \\\"debt\\\": when particles interact and separate, a correlation (entanglement) persists even after the interaction ceases. The interaction is gone but its \\\"obligation\\\" (correlation) remains. Like the promissory note: the original event is over but its consequence persists.\"}},\"isShowcase\":false,\"chapterId\":17}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"p

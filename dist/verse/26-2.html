and-form). Conditioned unfolding of a quantum system.\",\"caveat\":\"Quantum evolution vs. Buddhist transmigration.\"},\"animation\":{\"visualBridge\":\"A stream of light (consciousness) shaped by patterns (dispositions) entering a new form (name-and-form).\",\"educationalGoal\":\"Dispositions condition consciousness, which enters rebirth and conditions the new being's mind-body.\"},\"deeperDive\":[{\"q\":\"Is consciousness a permanent soul?\",\"a\":\"No — a dependently arising stream, not an unchanging entity. Like a flame passed from candle to candle — continuity without identity.\",\"realLifeExample\":\"A relay baton passes between runners but picks up each grip's marks. Continuity without permanence.\"},{\"q\":\"What are \\\"name and form\\\"?\",\"a\":\"\\\"Name\\\" = mental aggregates (feeling, perception, formations, consciousness). \\\"Form\\\" = physical aggregate (body). Together: the complete organism.\",\"realLifeExample\":\"Your personality (name) and your body (form). Together: the total \\\"you.\\\"\"},{\"q\":\"How does consciousness \\\"enter transmigration\\\"?\",\"a\":\"Conditioned by karmic dispositions, the stream connects to new conditions (conception). Not a soul traveling but causal process — one domino toppling the next.\",\"realLifeExample\":\"A ball rolling down a slope enters a new valley. No \\\"thing\\\" transfers — just causal influence.\"},{\"q\":\"Connection to Ch.2?\",\"a\":\"Ch.2 showed motion can't be inherently established. V.2 describes transmigration that is itself empty — conventionally functional, lacking inherent existence.\",\"realLifeExample\":\"Ch.2: travel is empty. V.2: the ultimate \\\"travel\\\" (transmigration) is also empty.\"},{\"q\":\"Intervention point?\",\"a\":\"Understanding the conditioned nature of consciousness shows WHERE to intervene. Each link is a potential intervention point.\",\"realLifeExample\":\"Understanding disease spread shows where to apply treatment.\"},{\"q\":\"Significance?\",\"a\":\"Even consciousness — our most intimate experience — is dependently arising, shaped by past actions.\",\"deeper\":\"V.2 challenges the deep intuition that consciousness is \\\"unconditioned.\\\" By showing consciousness is conditioned, Nāgārjuna extends emptiness to the most seemingly real aspect of experience.\"}],\"quiz\":{\"beginner\":{\"question\":\"Is consciousness a permanent soul?\",\"options\":[\"A) Yes\",\"B) NO — it's a dependently arising stream. Continuity without permanent identity, like a flame between candles.\",\"C) Sometimes\",\"D) Depends\"],\"correct\":\"B\",\"explanation\":\"Stream, not soul. Conditioned, not permanent.\"},\"intermediate\":{\"question\":\"What are \\\"name and form\\\"?\",\"options\":[\"A) Just words\",\"B) The complete organism: \\\"name\\\" = mental aggregates; \\\"form\\\" = physical body. Together: the total functioning being.\",\"C) Only body\",\"D) Only mind\"],\"correct\":\"B\",\"explanation\":\"Mind (name) + body (form) = complete being.\"},\"advanced\":{\"question\":\"How does v.2 extend emptiness?\",\"options\":[\"A) Doesn't\",\"B) Even consciousness is CONDITIONED and dependently arising. Nothing escapes emptiness, not even awareness.\",\"C) Only partially\",\"D) Different topic\"],\"correct\":\"B\",\"explanation\":\"Consciousness is conditioned. Emptiness extends to awareness itself.\"}},\"verseText\":\"Having dispositions as its conditions, consciousness enters transmigration. Once consciousness has entered transmigration, name and form come to be.\",\"madhyamakaConcept\":\"Saṃskāra-pratyayaṃ vijñānam saṃsāreṣu avatiṣṭhate. Vijñāne nāmarūpam avasiñcati. Dispositions → consciousness → name-and-form.\",\"quantumPhysicsParallel\":\"Wave function evolution: initial state (dispositions) determines how the wave function (consciousness) evolves, determining what observables (name-and-form) manifest.\"}},\"isShowcase\":false,\"chapterId\":26}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}]

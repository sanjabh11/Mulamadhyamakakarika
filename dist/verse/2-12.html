176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":12,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_12\",\"number\":12,\"title\":\"The Unfindable Beginning of Motion\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Motion does not begin in what has moved, Nor does it begin in what has not moved, Nor does it begin in what is moving. In what, then, does motion begin?\"},\"philosophy\":{\"insight\":\"The v.1 trilemma returns, now applied to the BEGINNING of motion. Motion's start cannot be located in the already-moved (too late), the not-yet-moved (too early), or the currently-moving (presupposes motion already begun). No inherent starting point exists.\",\"madhyamaka\":\"Garfield: this verse opens the second major section (v.12-14), applying the trilemma to origination. The beginning of motion is as unfindable as motion itself. Kalupahana: the verse targets the Sarvāstivādin claim that dharmas \\\"arise\\\" — if arising cannot be located, the entire Abhidharma framework of momentary dharma-events is undermined. Siderits/Katsura: this is the temporal version of the spatial trilemma in v.1.\",\"quantum\":\"Heisenberg Uncertainty Principle: ΔxΔp ≥ ħ/2. To define a precise \\\"beginning\\\" of motion, you need exact position (where it starts) AND zero-to-nonzero momentum (when it begins moving). But the uncertainty principle makes these simultaneously precise values impossible. The \\\"start\\\" of motion is fundamentally indeterminate.\",\"bridge\":\"Both show that the \\\"beginning\\\" of a process cannot be pinpointed with arbitrary precision. The uncertainty principle prevents simultaneous knowledge of position and momentum at the start. Nāgārjuna's trilemma prevents locating the beginning in any temporal category. Both reveal that \\\"beginning\\\" is a conventional designation, not an inherently locatable event.\",\"accessible\":\"When exactly does a day \\\"begin\\\"? At midnight? But it's dark — nothing changes at 12:00:00.000. At sunrise? But dawn is gradual. There's no precise instant where \\\"not-day\\\" becomes \\\"day.\\\" Similarly, there's no precise instant where \\\"not-moving\\\" becomes \\\"moving\\\" — the beginning is unfindable.\",\"twoTruths\":\"Conventionally, motion begins at some point in time. Ultimately, the 'beginning' cannot be located in the moved, unmoved, or moving — the trilemma of v.1 applies to initiation too.\",\"commonMisconception\":\"The verse doesn't deny temporal beginnings in conventional experience. It shows that an INHERENT beginning cannot be analytically located in any temporal state.\"},\"quantumResonance\":{\"concept\":\"Heisenberg Uncertainty Principle\",\"score\":93,\"strength\":\"High\",\"explanation\":\"The uncertainty principle prevents simultaneously pinpointing position and momentum — making the precise \\\"start\\\" of motion fundamentally indeterminate. Direct parallel.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Blurred Starting Line\",\"anchor\":\"A running track with a starting line that blurs when you zoom in. The closer you look, the fuzzier the boundary between \\\"not started\\\" and \\\"started\\\" becomes.\",\"texture\":\"Track: Dark with lane markers. Starting line: Sharp from far, blurry up close. Blur: Gaussian with uncertainty haze.\",\"mood\":\"Elusive, paradoxical, zen-like calm\",\"colors\":[\"#06B6D4\",\"#F59E0B\",\"#94A3B8\",\"#1E293B\"],\"orchestration\":{\"start\":\"Track visible from above with sharp starting line.\",\"click\":\"Click to zoom in on the starting line — it blurs. Each click zooms closer and blurs more.\",\"reveal\":\"At maximum zoom, the line dissolves into a probability cloud. Text: \\\"The beginning of motion is not a point — it's a process.\\\"\"},\"interaction\":{\"click\":\"Click to zoom in — watch the \\\"precise\\\" start blur into indeterminacy\",\"drag\":\"Drag along track to see the three zones: moved, moving, not-moved\",\"hover\":\"Hover shows uncertainty values increasing with zoom level\"},\"controls\":{\"rotation\":{\"default\":false,\"speed\":0},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":60,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":300},\"colorPicker\":true},\"r3fTechniques\":[\"Custom blur shader on starting line mesh (Gaussian blur increasing with zoom)\",\"InstancedMesh for uncertainty cloud particles at maximum zoom\",\"drei OrthographicCamera for clean top-down track view\",\"Bloom post-processing for line glow\",\"useSpring for smooth zoom transitions\"],\"camera\":{\"position\":[0,10,0],\"fov\":50,\"autoRotate\":false},\"fps\":60,\"performanceNotes\":\"\u003c250MB memory, 60 FPS. Simple plane geometry with blur shader. Particle cloud only at max zoom.\",\"tripoPrompt\":\"A running track seen from above, starting line that blurs when zoomed in, uncertainty haze, dark background, 8K.\",\"visualBridge\":\"The starting line that dissolves upon inspection directly shows the unfindable beginning — the closer you look, the less precise it becomes.\",\"educationalGoal\":\"User sees the v.1 trilemma applied to initiation — the beginning of motion is as unfindable as motion itself.\"},\"deeperDive\":[{\"q\":\"Why can't motion begin in the \\\"moved\\\"?\",\"a\":\"The \\\"moved\\\" (gata) is the past — motion is already complete there. You can't begin something that's already finished. It's like saying a race \\\"begins\\\" at the finish line.\",\"realLifeExample\":\"You can't \\\"start eating\\\" after you've already finished the meal. The beginning must precede the completion, not coincide with it.\"},{\"q\":\"Why can't motion begin in the \\\"not-moved\\\"?\",\"a\":\"The \\\"not-moved\\\" (agata) is what hasn't begun moving yet. But if nothing has begun, there's nothing to \\\"begin.\\\" It's like saying a book \\\"begins\\\" before the first word is written — the beginning IS the transition, not something in the pre-transition state.\",\"realLifeExample\":\"A race doesn't \\\"begin\\\" while everyone is still standing still. The beginning requires some motion — but the motion hasn't started yet. Catch-22.\"},{\"q\":\"Why can't motion begin in the \\\"moving\\\"?\",\"a\":\"If something is already \\\"moving\\\" (gamyamāna), motion has already begun — so you can't locate the BEGINNING there. The beginning must precede the process. But if it precedes the moving, it's in the not-moved (already rejected).\",\"realLifeExample\":\"If you're already running, the \\\"beginning of running\\\" is in the past. You can't start what you're already doing. The beginning must be at the transition — but no static category captures transitions.\"},{\"q\":\"How does the Heisenberg uncertainty principle make this precise?\",\"a\":\"To define the \\\"start\\\" of motion, you need simultaneously: (1) exact position (Δx → 0) and (2) the moment momentum changes from zero to nonzero (Δp → precise value). But ΔxΔp ≥ ħ/2 makes this impossible. The more precisely you fix the position, the less you know about when momentum changed. The \\\"beginning\\\" is fundamentally indeterminate.\",\"realLifeExample\":\"Try to identify the exact millisecond you \\\"fell asleep\\\" last night. You can't — the transition from awake to asleep is gradual and indeterminate. There's no precise boundary moment.\"},{\"q\":\"Does this mean nothing ever begins?\",\"a\":\"Conventionally, things begin all the time. But no inherent, precisely locatable \\\"beginning point\\\" exists. Beginnings are conventional designations applied to gradual, dependent transitions — not sharp ontological events.\",\"realLifeExample\":\"Seasons \\\"begin\\\" but there's no exact moment winter becomes spring. March 20th is a convention, not a sharp boundary in nature. The transition is real but inherently imprecise.\"},{\"q\":\"How does this verse connect to the Buddhist analysis of arising (utpāda)?\",\"a\":\"This verse directly undermines the Sarvāstivādin doctrine that dharmas have real \\\"arising\\\" (utpāda). If the beginning of motion cannot be located, neither can the \\\"arising\\\" of any dharma. Chapter 7 will extend this analysis to arising itself.\",\"deeper\":\"Kalupahana notes this verse is a preview of Ch. 7 (Examination of Arising, Abiding, and Ceasing), where the same trilemma is applied to origination in general, not just motion.\"}],\"quiz\":{\"beginner\":{\"question\":\"In which temporal state can the beginning of motion be found?\",\"options\":[\"A) In what has already moved\",\"B) In what has not yet moved\",\"C) In what is currently moving\",\"D) In none of these — the beginning is unfindable as an inherent event\"],\"correct\":\"D\",\"explanation\":\"The moved is too late, the not-moved is too early, and the moving presupposes motion already begun. No temporal state inherently contains the \\\"beginning.\\\"\"},\"intermediate\":{\"question\":\"What does the Heisenberg Uncertainty Principle say about simultaneously knowing position and momentum?\",\"options\":[\"A) Both can be known exactly\",\"B) The product of their uncertainties has a minimum: ΔxΔp ≥ ħ/2\",\"C) Only position can be known\",\"D) Neither can ever be known\"],\"correct\":\"B\",\"explanation\":\"You cannot simultaneously know position and momentum with arbitrary precision. This makes the exact \\\"start\\\" of motion (requiring precise position AND momentum change) fundamentally indeterminate.\"},\"advanced\":{\"question\":\"How does verse 12 prefigure the argument of Chapter 7?\",\"options\":[\"A) It doesn't relate to Chapter 7\",\"B) The trilemma applied to the beginning of motion previews Ch. 7's analysis of arising (utpāda) in general\",\"C) It proves Chapter 7 wrong\",\"D) Chapter 7 contradicts Chapter 2\"],\"correct\":\"B\",\"explanation\":\"V.12's trilemma (beginning not in moved/not-moved/moving) previews Ch. 7's more general analysis showing that arising itself cannot be inherently located — the same structure applied to a broader concept.\"}},\"verseText\":\"Motion does not begin in what has moved, Nor does it begin in what has not moved, Nor does it begin in what is moving. In what, then, does motion begin?\",\"madhyamakaConcept\":\"Garfield: this verse opens the second major section (v.12-14), applying the trilemma to origination. The beginning of motion is as unfindable as motion itself. Kalupahana: the verse targets the Sarvāstivādin claim that dharmas \\\"arise\\\" — if arising cannot be located, the entire Abhidharma framework of momentary dharma-events is undermined. Siderits/Katsura: this is the temporal version of the spatial trilemma in v.1.\",\"quantumPhysicsParallel\":\"Heisenberg Uncertainty Principle: ΔxΔp ≥ ħ/2. To define a precise \\\"beginning\\\" of motion, you need exact position (where it starts) AND zero-to-nonzero momentum (when it begins moving). But the uncertainty principle makes these simultaneously precise values impossible. The \\\"start\\\" of motion is fundamentally indeterminate.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"

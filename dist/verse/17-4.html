176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":17,\"verseId\":4,\"chapterTitle\":\"Examination of Action and Fruit\",\"totalVerses\":33,\"verseData\":{\"id\":\"v17_4\",\"number\":4,\"title\":\"Abhidharma Classifications of Action\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Speech and action and all Kinds of unabandoned and abandoned actions, And resolve As well as . . .\"},\"philosophy\":{\"insight\":\"The opponent (Abhidharma) elaborates: actions include speech, physical deeds, abandoned actions (vows to refrain), unabandoned actions (continuing dispositions), and avijñapti (subtle resolve/non-manifest action). These classifications try to explain how karma persists and functions.\",\"madhyamaka\":\"Abhidharma schools developed elaborate taxonomies of action types to explain karmic continuity. Avijñapti-rūpa (non-manifest form) was proposed by Sarvāstivāda as a subtle physical entity carrying karmic potential — a material basis for vows and ethical states that persists when not actively expressed.\",\"quantum\":\"Hidden variables / latent states: QM debates about whether \\\"hidden variables\\\" underlie quantum statistics parallel the Abhidharma debate about whether avijñapti (hidden karmic dispositions) underlie ethical behavior.\",\"bridge\":\"Both Abhidharma avijñapti and QM hidden variables attempt to explain observed regularities through underlying, non-manifest entities. Both face the same challenge: positing invisible entities to explain visible patterns, without clear evidence of their inherent existence.\",\"accessible\":\"Buddhist scholars tried to explain how karma works by positing various invisible \\\"karmic substances\\\" — subtle dispositions that persist even when you're not actively doing anything. It's like physicists positing invisible particles to explain observed forces.\",\"twoTruths\":\"Conventionally, the Abhidharma classifications are useful pedagogical tools. Ultimately, the entities they posit (avijñapti, etc.) are empty — conventional designations, not inherently existing substances.\",\"commonMisconception\":\"NOT saying Abhidharma classifications are useless. They serve important pedagogical and practical purposes. The critique targets their INHERENT existence, not their conventional utility.\"},\"quantumResonance\":{\"concept\":\"Hidden Variables Debate\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"Abhidharma's avijñapti (non-manifest karmic form) parallels hidden variable theories — positing invisible entities to explain observable patterns. Both face challenges regarding inherent existence.\",\"caveat\":\"Hidden variables are a specific QM debate. Avijñapti is a Buddhist metaphysical concept. The parallel is about positing non-manifest entities to explain manifest patterns.\"},\"animation\":{\"visualBridge\":\"Multiple layers of action: visible (speech, physical) and invisible (subtle dispositions, vows, resolve) — showing the Abhidharma attempt to map the full landscape of karmic activity.\",\"educationalGoal\":\"User sees the complexity of Buddhist action-theory and the attempt to explain karmic continuity through subtle non-manifest entities.\"},\"deeperDive\":[{\"q\":\"What is avijñapti (non-manifest action)?\",\"a\":\"A concept from the Sarvāstivāda school: a subtle, non-informative physical form that carries karmic potential when you're not actively performing the related action. When you take a vow, the avijñapti persists as a subtle physical entity carrying the vow's karmic force.\",\"realLifeExample\":\"Like a signed contract that continues to bind you even when you're not looking at it. The avijñapti is the \\\"karmic contract\\\" that persists between active expressions of the vow.\"},{\"q\":\"Why did Abhidharma need avijñapti?\",\"a\":\"To solve the continuity problem: how does a momentary action produce a result hours, years, or lifetimes later? Avijñapti bridges the gap — it's a persistent karmic entity that carries the action's potential forward in time.\",\"realLifeExample\":\"How does a promise made years ago still bind you? Something must persist — the promise's \\\"force.\\\" Avijñapti is the proposed mechanism for this persistence in karmic theory.\"},{\"q\":\"What are \\\"abandoned\\\" and \\\"unabandoned\\\" actions?\",\"a\":\"\\\"Abandoned\\\" (prahīṇa): actions or dispositions you've given up through vows or practice. \\\"Unabandoned\\\" (aprahīṇa): dispositions still active. Taking a precept \\\"abandons\\\" the related non-virtue; the avijñapti of non-killing persists as an \\\"abandoned\\\" disposition.\",\"realLifeExample\":\"A former smoker has \\\"abandoned\\\" smoking but might still have the disposition (unabandoned craving). The ethical status and the underlying disposition are tracked separately.\"},{\"q\":\"Is this verse complete (it seems to trail off)?\",\"a\":\"The verse appears to be the first half of a sentence continued in v.5. Ancient verse structure sometimes splits lists across verses. VV.4-5 together present the opponent's seven-fold classification of action.\",\"realLifeExample\":\"Like a sentence split across two lines in a poem — the thought continues into the next verse.\"},{\"q\":\"How does Nāgārjuna view these classifications?\",\"a\":\"He acknowledges them as conventional tools but denies that the entities they posit (avijñapti, abandoned/unabandoned dispositions) have inherent existence. They're useful conventional descriptions, not ontologically fundamental entities.\",\"realLifeExample\":\"A map is useful for navigation but doesn't inherently contain the territory it represents. Similarly, Abhidharma classifications are useful for understanding karma but don't contain inherent karmic substances.\"},{\"q\":\"How does this connect to the chapter's argument?\",\"a\":\"VV.4-5 present the MOST DETAILED conventional analysis of karma (the opponent's best case). Nāgārjuna will then show (v.6) that even this detailed analysis faces a fundamental problem: how do ceased actions produce later results? The detail makes the failure more striking.\",\"deeper\":\"By presenting the opponent's most sophisticated analysis (Abhidharma classifications including avijñapti), Nāgārjuna ensures his critique targets the STRONGEST version of the opposing view. This is the principle of charity: attack the best version of your opponent's argument, not a strawman. If the best Abhidharma analysis fails, simpler analyses fail a fortiori.\"}],\"quiz\":{\"beginner\":{\"question\":\"What is avijñapti (non-manifest action)?\",\"options\":[\"A) Visible action\",\"B) A subtle, non-manifest entity proposed by Abhidharma to explain how karmic potential persists between active expressions — like a contract that binds even when not being read.\",\"C) Speech\",\"D) Physical movement\"],\"correct\":\"B\",\"explanation\":\"Avijñapti = subtle karmic entity carrying potential forward in time. Proposed to solve the problem of how momentary actions produce later results.\"},\"intermediate\":{\"question\":\"Why did Abhidharma schools need the concept of avijñapti?\",\"options\":[\"A) For decoration\",\"B) To solve the continuity problem: how do momentary actions produce results hours, years, or lifetimes later? Avijñapti bridges the temporal gap by carrying karmic potential forward.\",\"C) To deny karma\",\"D) To prove inherent existence\"],\"correct\":\"B\",\"explanation\":\"Avijñapti was proposed to explain karmic continuity — how the potential of a past action persists until it ripens as a result. It bridges the temporal gap between action and fruit.\"},\"advanced\":{\"question\":\"Why does Nāgārjuna present the opponent's strongest case (vv.4-5) before critiquing?\",\"options\":[\"A) He agrees\",\"B) Principle of charity: by attacking the BEST version of the opposing view, he ensures his critique is maximally effective. If the strongest analysis fails, weaker ones fail a fortiori.\",\"C) He's confused\",\"D) The verses are filler\"],\"correct\":\"B\",\"explanation\":\"Attacking the strongest version proves the critique is robust. If even Abhidharma's most sophisticated analysis of karma faces the continuity problem, simpler analyses certainly do too.\"}},\"verseText\":\"Speech and action and all Kinds of unabandoned and abandoned actions, And resolve As well as . . .\",\"madhyamakaConcept\":\"Abhidharma schools developed elaborate taxonomies of action types to explain karmic continuity. Avijñapti-rūpa (non-manifest form) was proposed by Sarvāstivāda as a subtle physical entity carrying karmic potential — a material basis for vows and ethical states that persists when not actively expressed.\",\"quantumPhysicsParallel\":\"Hidden variables / latent states: QM debates about whether \\\"hidden variables\\\" underlie quantum statistics parallel the Abhidharma debate about whether avijñapti (hidden karmic dispositions) underlie ethical behavior.\"}},\"isShowcase\":false,\"chapterId\":17}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosop

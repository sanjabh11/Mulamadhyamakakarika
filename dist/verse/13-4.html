176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":13,\"verseId\":4,\"chapterTitle\":\"Examination of Compounded Phenomena\",\"totalVerses\":8,\"verseData\":{\"id\":\"v13_4\",\"number\":4,\"title\":\"The Dilemma of Change\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If there is no entitihood, What changes? If there were entity, How could it be correct that something changes?\"},\"philosophy\":{\"insight\":\"A powerful dilemma: WITHOUT inherent essence, what is there to undergo change? WITH inherent essence, change is impossible (essences don't change). Both horns fail for inherent existence — but change works fine for conventionally designated, empty phenomena.\",\"madhyamaka\":\"The opponent objects: if things lack essence (v.3), what changes? But if things HAVE essence, change is impossible (essence is unchanging by definition). Both horns assume inherent existence. The resolution: change occurs for CONVENTIONALLY designated entities that lack inherent essence. No inherent subject of change is needed.\",\"quantum\":\"Wave-particle duality: light is neither inherently wave nor inherently particle, yet exhibits both behaviors contextually. The \\\"what is it really?\\\" question (demanding an inherent identity) has no answer — light is contextually defined. Similarly, the \\\"what changes?\\\" question demands an inherent entity that isn't there.\",\"bridge\":\"Both WPD and the change dilemma expose the failure of demanding inherent identity. \\\"What IS light?\\\" (wave or particle?) parallels \\\"what changes?\\\" (entity or non-entity?). Both questions presuppose inherent identity; both are resolved by contextual/conventional designation.\",\"accessible\":\"A paradox: if there's no solid \\\"thing,\\\" what changes? But if there IS a solid thing, how can it change (solid things don't transform)? The answer: change happens to CONVENTIONAL things — things that are real enough to change but not so \\\"solid\\\" that they can't.\",\"twoTruths\":\"Conventionally, things change — water becomes ice, children become adults. Ultimately, neither the changing \\\"thing\\\" nor the \\\"change\\\" has inherent existence. The conventional description of change works without inherent entities.\",\"commonMisconception\":\"NOT saying change is impossible or paradoxical. The DILEMMA only arises if you demand inherent entities. For conventionally designated, empty phenomena, change is perfectly natural — it's what empty things DO.\"},\"quantumResonance\":{\"concept\":\"Wave-Particle Duality\",\"score\":71,\"strength\":\"High\",\"explanation\":\"WPD: light has no inherent identity (wave or particle) — it's contextually defined. The change dilemma: things have no inherent entity to undergo change. Both expose the failure of demanding inherent identity and are resolved by contextual/conventional description.\",\"caveat\":\"WPD is about complementary quantum behaviors. The change dilemma is about inherent essence. The parallel is about the failure of demanding fixed inherent identity.\"},\"animation\":{\"visualBridge\":\"Light switching between wave patterns and particle dots depending on the experiment — showing it has no inherent identity, just contextual behavior.\",\"educationalGoal\":\"User sees that demanding \\\"what IS it really?\\\" (for light or for changing things) presupposes an inherent identity that doesn't exist. Contextual description is sufficient.\"},\"deeperDive\":[{\"q\":\"Who asks \\\"What changes?\\\"\",\"a\":\"This represents the essentialist objection: change requires a SUBJECT — something that endures through the change. Without an inherent entity, there's nothing to be the subject of change. Nāgārjuna shows this demand is misguided.\",\"realLifeExample\":\"Asking \\\"who is dreaming?\\\" during a dream assumes there must be an inherent dreamer. But the dreamer and the dream co-arise — neither needs to be inherently established for the dream to unfold.\"},{\"q\":\"Why is change impossible WITH inherent essence?\",\"a\":\"An inherent essence is unchanging by definition — it's what makes something what it IS. If the essence doesn't change, the entity doesn't fundamentally change. It might gain or lose accidental properties, but its core nature remains fixed. Genuine transformation is precluded.\",\"realLifeExample\":\"If gold had an inherent \\\"gold-essence\\\" that could never change, gold could never tarnish, alloy, or be transmuted. Its inherent nature would prevent any fundamental change.\"},{\"q\":\"How does WPD illustrate the dilemma?\",\"a\":\"Light exhibits wave behavior in some experiments and particle behavior in others. \\\"What IS light really?\\\" demands an inherent identity. But light has no inherent identity — it's contextually defined by the experimental setup. Similarly, \\\"what changes?\\\" demands an inherent entity, which isn't there.\",\"realLifeExample\":\"Asking \\\"is a tomato really a fruit or a vegetable?\\\" demands an inherent category. But the answer depends on context — botanically it's a fruit, culinarily it's a vegetable. No inherent identity.\"},{\"q\":\"How does Mādhyamika resolve the dilemma?\",\"a\":\"By rejecting the PREMISE: the demand for an inherent entity. Change occurs for conventionally designated, empty phenomena. The \\\"water\\\" that becomes \\\"ice\\\" is a conventional designation upon dependently arisen aggregates. No inherent \\\"water-entity\\\" is needed for the change to occur.\",\"realLifeExample\":\"A team changes its strategy without needing an inherent \\\"team-essence.\\\" The team is a conventional designation upon players and organization — it changes because it's empty, not despite it.\"},{\"q\":\"Is this the same dilemma as the Ship of Theseus?\",\"a\":\"Very similar! The Ship of Theseus asks: if you replace every plank, is it the same ship? The Buddhist answer: there's no inherent \\\"ship-essence\\\" — the ship is conventionally designated. Change occurs without needing identity of essence. The puzzle only arises if you assume inherent identity.\",\"realLifeExample\":\"Your body replaces most of its cells every 7-10 years. Are you the \\\"same person\\\"? Conventionally yes (same name, memories, relationships). Inherently — there's no fixed essence that persists. Change is real; inherent identity isn't.\"},{\"q\":\"How does v.4 set up vv.5-6?\",\"a\":\"V.4 raises the dilemma abstractly. VV.5-6 make it concrete: v.5 examines whether the SAME thing or a DIFFERENT thing changes (neither works). V.6 applies this to milk and curds. The abstract dilemma becomes a concrete demonstration.\",\"deeper\":\"This abstract-to-concrete movement is pedagogically effective. V.4 presents the logical structure; vv.5-6 provide the intuitive examples (youth/age, milk/curds). Together they make the argument both logically rigorous and intuitively accessible — a hallmark of Nāgārjuna's teaching method.\"}],\"quiz\":{\"beginner\":{\"question\":\"What is the dilemma of change?\",\"options\":[\"A) Change is easy to explain\",\"B) WITHOUT inherent essence, there's nothing to change. WITH inherent essence, change is impossible (essences don't change). Both horns fail.\",\"C) Only entities change\",\"D) Only non-entities change\"],\"correct\":\"B\",\"explanation\":\"The dilemma: no inherent entity → no subject of change. Inherent entity → change impossible. Both presuppose inherent existence. The resolution: conventional entities (empty of inherent essence) change naturally.\"},\"intermediate\":{\"question\":\"How does wave-particle duality parallel the change dilemma?\",\"options\":[\"A) No parallel\",\"B) Both expose the failure of demanding inherent identity — \\\"what IS light?\\\" and \\\"what changes?\\\" both presuppose a fixed identity that doesn't exist. Both are resolved contextually.\",\"C) Light always has a fixed identity\",\"D) WPD proves inherent essence\"],\"correct\":\"B\",\"explanation\":\"WPD and the change dilemma both show that demanding inherent identity leads to paradox. Light isn't inherently wave or particle; changing things aren't inherently entities or non-entities. Context resolves both.\"},\"advanced\":{\"question\":\"How does the Mādhyamika resolution differ from the essentialist and nihilist positions?\",\"options\":[\"A) It agrees with essentialism\",\"B) Change occurs for conventionally designated, empty phenomena — no inherent entity needed (anti-essentialist) but things still exist and change (anti-nihilist). The middle way.\",\"C) It agrees with nihilism\",\"D) It has no resolution\"],\"correct\":\"B\",\"explanation\":\"Mādhyamika rejects both: inherent entities (essentialism) AND non-existence (nihilism). Change occurs for conventional, empty things. This is the middle way between the two extremes.\"}},\"verseText\":\"If there is no entitihood, What changes? If there were entity, How could it be correct that something changes?\",\"madhyamakaConcept\":\"The opponent objects: if things lack essence (v.3), what changes? But if things HAVE essence, change is impossible (essence is unchanging by definition). Both horns assume inherent existence. The resolution: change occurs for CONVENTIONALLY designated entities that lack inherent essence. No inherent subject of change is needed.\",\"quantumPhysicsParallel\":\"Wave-particle duality: light is neither inherently wave nor inherently particle, yet exhibits both behaviors contextually. The \\\"what is it really?\\\" question (demanding an inherent identity) has no answer — light is contextually defined. Similarly, the \\\"what changes?\\\" question demands an inherent entity that isn't there.\"}},\"isShowcase\":false,\"chapterId\":13}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"

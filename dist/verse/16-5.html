176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":16,\"verseId\":5,\"chapterTitle\":\"Examination of Bondage and Liberation\",\"totalVerses\":10,\"verseData\":{\"id\":\"v16_5\",\"number\":5,\"title\":\"Arising-Ceasing Things Are Neither Bound nor Released\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"All compounded phenomena, as arising and ceasing things, Are not bound and not released.\"},\"philosophy\":{\"insight\":\"Compounded phenomena constantly arise and cease — they're in flux. Such constantly changing things can't be INHERENTLY bound (permanently trapped) or INHERENTLY released (permanently free). Bondage and release don't apply inherently to things that are always arising and ceasing.\",\"madhyamaka\":\"Saṃskāra (compounded phenomena) are characterized by utpāda (arising) and nirodha (ceasing). They're inherently neither bound (bandha) nor released (mokṣa). Bondage implies fixedness (being stuck); release implies achievement (being free). But things that constantly arise and cease are neither permanently stuck nor permanently free — they're in continual flux.\",\"quantum\":\"Quantum superposition and indeterminacy: a quantum system isn't inherently in any fixed state until measurement. It's not \\\"bound\\\" to one state or \\\"free\\\" from all states — it's in superposition, transcending the bound/free binary. Like arising-ceasing phenomena: neither inherently bound nor inherently released.\",\"bridge\":\"Both quantum indeterminacy and arising-ceasing phenomena transcend the bound/free binary. QM: system isn't fixed in one state (bound) or free from all states (released) — it's in superposition. Buddhism: phenomena aren't permanently bound or permanently free — they constantly arise and cease.\",\"accessible\":\"A river is constantly flowing — water arising and ceasing. Is the river \\\"trapped\\\" (bound)? Not really — it's always moving. Is it \\\"free\\\"? Not really — it follows its channel. It's neither inherently bound nor inherently free — it just flows. Like all compounded phenomena.\",\"twoTruths\":\"Conventionally, beings are bound (in saṃsāra) and can be released (nirvāṇa). Ultimately, compounded phenomena are neither inherently bound nor inherently released — they're constantly arising and ceasing, beyond the bound/free binary.\",\"commonMisconception\":\"NOT saying liberation is impossible. Liberation works CONVENTIONALLY. The point: INHERENT bondage and INHERENT liberation don't apply to things that constantly arise and cease. If there's no inherent bondage, there's nothing inherent to be liberated FROM.\"},\"quantumResonance\":{\"concept\":\"Quantum Superposition — Neither Fixed nor Free\",\"score\":68,\"strength\":\"Medium\",\"explanation\":\"A quantum system in superposition isn't \\\"bound\\\" to one state or \\\"free\\\" from all states — it transcends the binary. Like arising-ceasing phenomena: neither inherently bound nor inherently released.\",\"caveat\":\"Superposition is a specific quantum formalism. The parallel is about transcending the bound/free binary, not about being in quantum superposition.\"},\"animation\":{\"visualBridge\":\"Particles constantly appearing and disappearing — neither trapped in one place (bound) nor freely moving everywhere (released). In constant flux, beyond the bound/free distinction.\",\"educationalGoal\":\"User sees that constantly arising-ceasing things can't be inherently bound or released — the concepts don't apply to things in flux.\"},\"deeperDive\":[{\"q\":\"Why can't arising-ceasing things be inherently bound?\",\"a\":\"Bondage implies fixedness — being stuck in one state/position. But things that constantly arise and cease aren't fixed — they're in flux. How can something constantly changing be \\\"stuck\\\"? Inherent bondage requires inherent permanence, which arising-ceasing things don't have.\",\"realLifeExample\":\"Can you chain a flame? It's constantly arising (new fuel burning) and ceasing (old fuel consumed). The flame isn't \\\"stuck\\\" — it's a process. Chaining a process doesn't make sense.\"},{\"q\":\"Why can't they be inherently released?\",\"a\":\"Release implies being freed FROM something. But if things were never inherently bound, there's nothing to be freed from. Release presupposes bondage. Without inherent bondage, inherent release is meaningless — you can't free what was never trapped.\",\"realLifeExample\":\"If you were never actually imprisoned (you just thought you were), \\\"release\\\" doesn't apply — you were already free. The \\\"release\\\" was just realizing you were never bound.\"},{\"q\":\"How does this connect to the Buddha's insight?\",\"a\":\"The Buddha's liberating insight: suffering arises from grasping at things as permanent (bondage). But things are impermanent (arising-ceasing). Seeing impermanence directly, one realizes there was never anything permanent to grasp — no inherent bondage to escape. Liberation is seeing the truth, not changing the situation.\",\"realLifeExample\":\"Waking from a nightmare: you don't escape the dream monster — you realize it was never real. Liberation is like waking up: realizing inherent bondage was never there.\"},{\"q\":\"Does this mean practice is unnecessary?\",\"a\":\"No — conventional practice is necessary for conventional realization. But the realization isn't creating something new (freedom); it's recognizing what was always the case (no inherent bondage). Practice removes the CONFUSION that creates the APPEARANCE of bondage.\",\"realLifeExample\":\"Cleaning a window doesn't create sunlight — it removes what blocks it. Practice doesn't create liberation — it removes the confusion that blocks recognition of the natural, unbound state.\"},{\"q\":\"How does v.5 serve as a transition?\",\"a\":\"VV.1-3: inherent transmigration impossible. V.4: inherent nirvāṇa impossible. V.5: neither inherent bondage nor release applies. Now the ground is prepared for vv.6-8: a detailed analysis of why inherent bondage/release is impossible.\",\"realLifeExample\":\"First prove the accusation is baseless (vv.1-4), then show the concepts themselves are incoherent (v.5), then analyze the specific mechanisms (vv.6-8). V.5 is the conceptual pivot.\"},{\"q\":\"What's the emotional impact of this verse?\",\"a\":\"For practitioners: deeply reassuring. If there's no inherent bondage, you're not inherently trapped. The suffering feels real (conventionally it is), but it's not an inherent, permanent condition. The prison has no inherent walls — the walls are conventional, and so is the exit.\",\"deeper\":\"V.5 is the emotional heart of Ch.16. While other verses analyze logically, v.5 directly addresses the practitioner's deepest fear: \\\"Am I really trapped?\\\" The answer: no — not inherently. Things arise and cease; bondage arises and ceases; even the sense of being bound arises and ceases. Nothing is permanently stuck. This is deeply liberating.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why are arising-ceasing things neither inherently bound nor released?\",\"options\":[\"A) They're always bound\",\"B) Things in constant flux can't be permanently stuck (bound) or permanently freed (released). The concepts don't apply inherently to things that constantly arise and cease.\",\"C) They're always free\",\"D) Arising and ceasing are irrelevant\"],\"correct\":\"B\",\"explanation\":\"Arising-ceasing = flux. Bondage = fixedness. Release = freedom from fixedness. Flux is neither fixed nor permanently free — it transcends the binary.\"},\"intermediate\":{\"question\":\"Why does the absence of inherent bondage NOT make practice unnecessary?\",\"options\":[\"A) Practice is unnecessary\",\"B) Conventional practice removes the confusion that creates the APPEARANCE of bondage. Practice doesn't create freedom — it recognizes the absence of inherent bondage.\",\"C) Only inherent practice works\",\"D) Practice creates bondage\"],\"correct\":\"B\",\"explanation\":\"Practice removes confusion, not inherent bondage (which never existed). It's like cleaning a window — removing what blocks the already-present light.\"},\"advanced\":{\"question\":\"How is v.5 the emotional heart of Ch.16?\",\"options\":[\"A) It's not emotional\",\"B) It directly addresses the practitioner's deepest fear (\\\"Am I really trapped?\\\") with the answer: no, not inherently. Bondage arises and ceases like everything else. Nothing is permanently stuck.\",\"C) Only logic matters\",\"D) Emotions are irrelevant\"],\"correct\":\"B\",\"explanation\":\"V.5 transforms the analytical argument into existential reassurance: you're not inherently trapped. Bondage is conventional, arising-ceasing, not permanent. This is deeply liberating.\"}},\"verseText\":\"All compounded phenomena, as arising and ceasing things, Are not bound and not released.\",\"madhyamakaConcept\":\"Saṃskāra (compounded phenomena) are characterized by utpāda (arising) and nirodha (ceasing). They're inherently neither bound (bandha) nor released (mokṣa). Bondage implies fixedness (being stuck); release implies achievement (being free). But things that constantly arise and cease are neither permanently stuck nor permanently free — they're in continual flux.\",\"quantumPhysicsParallel\":\"Quantum superposition and indeterminacy: a quantum system isn't inherently in any fixed state until measurement. It's not \\\"bound\\\" to one state or \\\"free\\\" from all states — it's in superposition, transcending the bound/free binary. Like arising-ceasing phenomena: neither inherently bound nor inherently released.\"}},\"isShowcase\":false,\"chapterId\":16}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na

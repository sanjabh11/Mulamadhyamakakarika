176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":20,\"verseId\":2,\"chapterTitle\":\"Examination of Cause and Effect (Saṃbhava)\",\"totalVerses\":24,\"verseData\":{\"id\":\"v20_2\",\"number\":2,\"title\":\"If the Effect Is Not in the Cause, How Can It Arise From It?\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If, arising from the combination of Causes and conditions, The effect is not in the combination, How could it arise from the combination?\"},\"philosophy\":{\"insight\":\"Horn 2 — asatkāryavāda (non-pre-existence): if the effect does NOT exist in the combination of causes, how can it arise FROM that specific combination? What connects an inherently non-existent effect to these particular causes? If the effect is completely absent from the causes, the causal link between THESE causes and THIS effect is unintelligible.\",\"madhyamaka\":\"Phala sāmagrī-agata (effect not existing in the combination): if the effect is inherently absent (a-sat-kārya-vāda), what inherent connection links this combination to this effect? Why do THESE causes produce THIS effect rather than any other? Without inherent pre-existence, the specificity of causation is lost.\",\"quantum\":\"Quantum field theory: particles don't pre-exist in the field, yet they arise from specific field configurations. The particle was \\\"not in\\\" the field (as a particle), yet arises from it. How? Not through inherent connection but through the field's dynamics. Like v.2: the effect doesn't pre-exist in the cause, yet arises conventionally.\",\"bridge\":\"Both QFT and v.2 address arising without pre-existence. QFT: particles arise from fields without pre-existing as particles. V.2: if the effect doesn't pre-exist, what connects it to THESE causes? Both resolution: conventional/dynamic arising, not inherent pre-existence or inherent connection.\",\"accessible\":\"If the cake is COMPLETELY absent from the flour, eggs, and sugar — nothing cake-like exists in them at all — then why does THIS combination produce a cake? Why not a car? There must be SOME connection, but if the effect is inherently absent, no inherent connection exists.\",\"twoTruths\":\"Conventionally: there IS a connection — these ingredients conventionally produce cake (not cars). Ultimately: this connection isn't inherent — it's a conventional regularity between empty causes and empty effects.\",\"commonMisconception\":\"NOT saying effects are unrelated to causes. Conventional causal specificity is preserved. The verse challenges INHERENT connection: if the effect is inherently absent from the cause, what inherently links them? Answer: nothing inherent — the link is conventional.\"},\"quantumResonance\":{\"concept\":\"Quantum Field Theory — Particles Arising from Fields\",\"score\":68,\"strength\":\"Medium-High\",\"explanation\":\"QFT: particles arise from field configurations without pre-existing as particles in the field. Like v.2: the effect doesn't pre-exist in the cause. Both: arising without pre-existence through dynamic/conventional processes, not inherent connection.\",\"caveat\":\"QFT particle creation is a physics process. V.2 is a philosophical argument. The parallel is about arising from a basis that doesn't contain the effect as such.\"},\"animation\":{\"visualBridge\":\"A causal combination (ingredients) with the effect (cake) completely absent — no trace. A question mark: \\\"How does THIS become THAT?\\\" Without any connection, the specific causal relationship is mysterious. Then: \\\"Convention connects them — not inherent essence.\\\"\",\"educationalGoal\":\"User sees: non-pre-existence creates a connection problem. Why THESE causes for THIS effect? The answer: conventional connection, not inherent.\"},\"deeperDive\":[{\"q\":\"What is asatkāryavāda?\",\"a\":\"The doctrine that the effect does NOT pre-exist in the cause — held by the Nyāya-Vaiśeṣika school. The effect is \\\"a-sat\\\" (non-existent) before arising. Nāgārjuna targets this in v.2: if the effect is totally absent, what specifically connects THESE causes to THIS effect?\",\"realLifeExample\":\"If the statue didn't exist AT ALL in the marble, why can Michelangelo find a David in it? Why not a random blob? The marble must have SOME (conventional) suitability — but not inherent pre-existence.\"},{\"q\":\"Why is the connection problem significant?\",\"a\":\"Causal SPECIFICITY is at stake: flour + eggs → cake (not car). If the effect is inherently absent from the causes, there's no inherent reason why THIS combination produces THIS effect. Causes would be as good as non-causes (v.4 develops this point).\",\"realLifeExample\":\"If a recipe has NO connection to its result, any recipe should produce any dish. But it doesn't: recipes are specific. The specificity needs explanation — but not through inherent existence.\"},{\"q\":\"How does QFT resolve this tension?\",\"a\":\"In QFT, particles don't pre-exist in the quantum field (they're not \\\"hiding\\\" in the field). But the field has specific dynamics that determine WHICH particles arise under WHICH conditions. The connection is through field dynamics, not pre-existence. Like v.2: conventional dynamics, not inherent connection.\",\"realLifeExample\":\"An author's mind (field) produces a novel (particle). The novel didn't pre-exist in the mind, but the mind's dynamics (creativity, skill, intention) specifically produce THIS novel. Connection through dynamics, not pre-existence.\"},{\"q\":\"How do vv.1-2 form a complete dilemma?\",\"a\":\"V.1: effect IN cause → no genuine arising (pre-existence eliminates arising). V.2: effect NOT in cause → no specific connection (absence eliminates specificity). The dilemma is exhaustive: the effect either pre-exists or doesn't. Both options fail for inherent causation. Therefore: inherent causation is impossible.\",\"realLifeExample\":\"Either the answer is already \\\"in\\\" the question (v.1 — then why ask?) or it's completely absent from the question (v.2 — then how does the question lead to it?). Real Q\u0026A is neither: the answer is conventionally connected to the question without being pre-existing or disconnected.\"},{\"q\":\"What is the Madhyamaka resolution?\",\"a\":\"Dependent origination: empty causes conventionally produce empty effects through CONVENTIONAL regularity and CONVENTIONAL connection. Neither pre-existence nor absence — but dependent arising. The effect is neither \\\"in\\\" the cause (no hiding) nor \\\"not in\\\" the cause (no disconnection) — it arises DEPENDENTLY.\",\"realLifeExample\":\"A child is neither \\\"in\\\" the parents (not a pre-existing miniature person) nor completely disconnected from them (they share DNA, nurture, etc.). The child arises dependently — conventionally connected without being pre-existent.\"},{\"q\":\"How does this relate to Ch.1 v.1?\",\"a\":\"Ch.1 v.1: nothing arises from self, other, both, or neither. Ch.20 vv.1-2: the effect neither pre-exists in the combination nor arises from a combination it's absent from. Same conclusion from different angles: inherent arising is impossible from every direction.\",\"deeper\":\"VV.1-2 present the classic satkārya/asatkārya dilemma that dominated Indian philosophical debate for centuries. The Sāṃkhya school held satkāryavāda (effect pre-exists in cause); the Nyāya-Vaiśeṣika held asatkāryavāda (effect doesn't pre-exist). Nāgārjuna rejects BOTH by showing that each position, taken as describing inherent reality, leads to absurdity. His resolution: dependent arising avoids both extremes. The effect neither inherently pre-exists nor is inherently absent — it arises conventionally from empty conditions. This is the Middle Way applied to causation.\"}],\"quiz\":{\"beginner\":{\"question\":\"If the effect is NOT in the cause, what's the problem?\",\"options\":[\"A) No problem\",\"B) The specific connection between THESE causes and THIS effect is lost. Why does flour make cake, not cars? Without any connection, causation becomes arbitrary.\",\"C) Effects can't arise\",\"D) Only pre-existence works\"],\"correct\":\"B\",\"explanation\":\"Absence eliminates specific connection. Conventional connection (not inherent) explains causal specificity.\"},\"intermediate\":{\"question\":\"How do vv.1-2 form an exhaustive dilemma?\",\"options\":[\"A) They don't\",\"B) Effect either pre-exists in cause (v.1 — no genuine arising) or doesn't (v.2 — no specific connection). These are the only two options. Both fail → inherent causation is impossible.\",\"C) More options exist\",\"D) Only v.1 matters\"],\"correct\":\"B\",\"explanation\":\"Exhaustive: pre-exists (no arising) or doesn't (no connection). Both fail. No other option. Inherent causation is impossible.\"},\"advanced\":{\"question\":\"How does the Madhyamaka resolution avoid both horns?\",\"options\":[\"A) It doesn't\",\"B) Dependent arising: the effect neither pre-exists (not satkāryavāda) nor is completely absent (not asatkāryavāda). It arises CONVENTIONALLY from empty causes through conventional connection. Neither hiding nor disconnected — dependently arisen.\",\"C) It picks one horn\",\"D) It ignores both\"],\"correct\":\"B\",\"explanation\":\"Middle Way: dependent arising avoids pre-existence (hiding) AND absence (disconnection). Conventional arising from empty conditions.\"}},\"verseText\":\"If, arising from the combination of Causes and conditions, The effect is not in the combination, How could it arise from the combination?\",\"madhyamakaConcept\":\"Phala sāmagrī-agata (effect not existing in the combination): if the effect is inherently absent (a-sat-kārya-vāda), what inherent connection links this combination to this effect? Why do THESE causes produce THIS effect rather than any other? Without inherent pre-existence, the specificity of causation is lost.\",\"quantumPhysicsParallel\":\"Quantum field theory: particles don't pre-exist in the field, yet they arise from specific field configurations. The particle was \\\"not in\\\" the field (as a particle), yet arises from it. How? Not through inherent connection but through the field's dynamics. Like v.2: the effect doesn't pre-exist in the cause, yet arises conventionally.\"}},\"isShowcase\":false,\"chapterId\":20}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\

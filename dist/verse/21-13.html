88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":21,\"verseId\":13,\"chapterTitle\":\"Examination of Becoming and Destruction\",\"totalVerses\":21,\"verseData\":{\"id\":\"v21_13\",\"number\":13,\"title\":\"Not from Self, Other, Both, or Neither — How Can Anything Arise?\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"An entity does not arise from itself. It is not arisen from another. It is not arisen from itself and another. How can it be arisen?\"},\"philosophy\":{\"insight\":\"The classic tetralemma of Ch.1 restated for Ch.21: (1) Not from SELF — self-production is contradictory (what already exists doesn't need to arise). (2) Not from OTHER — other-production eliminates causal specificity. (3) Not from BOTH — combining two failures doesn't succeed. (4) So HOW can it arise? Only through dependent origination, which transcends all four.\",\"madhyamaka\":\"Bhāva svataḥ na utpadyate (not from self). Na parataḥ (not from other). Na ubhayataḥ (not from both). Katham utpannaḥ (how can it be arisen?). This is Ch.1 v.1 applied to becoming — the foundational Madhyamaka argument against inherent arising.\",\"quantum\":\"Quantum indeterminacy: particles don't arise from pre-determined causes (not from \\\"self\\\"), not from purely external causes (not from \\\"other\\\"), not from both, and not from neither. They arise through probabilistic, contextual processes — quantum \\\"dependent arising.\\\"\",\"bridge\":\"Both quantum indeterminacy and v.13 show that arising transcends classical causal categories. QM: no deterministic self-cause or other-cause. V.13: no inherent self/other/both/neither arising. Both: the actual process of arising exceeds simple causal models.\",\"accessible\":\"Where does a thought come from? Not from yourself (you didn't deliberately create it). Not from outside (it's YOUR thought). Not from both (that just combines two failures). Not from neither (it DID arise). It arose dependently — from conditions, not from any single inherent source.\",\"twoTruths\":\"Conventionally: things arise from causes and conditions. Ultimately: this arising doesn't fit self/other/both/neither categorization. Convention works; inherent categories don't.\",\"commonMisconception\":\"NOT saying nothing arises. Things CONVENTIONALLY arise. The tetralemma denies INHERENT arising from any of the four modes. Dependent arising is the positive Madhyamaka alternative.\"},\"quantumResonance\":{\"concept\":\"Quantum Indeterminacy — Beyond Classical Causation\",\"score\":60,\"strength\":\"Medium\",\"explanation\":\"QM: arising is probabilistic and contextual — not from deterministic self/other causes. V.13: arising is not from self/other/both/neither. Both: the actual process of arising exceeds classical causal categorization.\",\"caveat\":\"Quantum indeterminacy is physics. V.13 is the Madhyamaka tetralemma. The parallel is about arising transcending simple causal categories.\"},\"animation\":{\"visualBridge\":\"Four arrows showing potential sources of arising — SELF (loop back), OTHER (external arrow), BOTH (two arrows), NEITHER (no arrow) — each with an X. Center: a particle arising from field conditions — dependent arising transcending all four.\",\"educationalGoal\":\"User sees: all four classical modes of arising fail. Dependent arising — like quantum field excitation — transcends the categories.\"},\"deeperDive\":[{\"q\":\"Why not from self?\",\"a\":\"Self-production means the entity produces itself. But to produce itself, it must already exist (to be the producer). If it already exists, it doesn't need to arise. Self-production either presupposes what it's supposed to explain or is redundant.\",\"realLifeExample\":\"You can't give birth to yourself. You must already exist to be the \\\"producer,\\\" but then the \\\"production\\\" is unnecessary.\"},{\"q\":\"Why not from other?\",\"a\":\"If the cause is COMPLETELY other (inherently separate), there's no inherent connection to the effect. Why does THIS cause produce THIS effect? Any cause could produce any effect — or none. Complete otherness eliminates causal specificity.\",\"realLifeExample\":\"If a seed were COMPLETELY other than the sprout (no connection), any seed could produce any sprout — or a rock could produce a flower. Otherness destroys specificity.\"},{\"q\":\"Why not from both?\",\"a\":\"Combining self-production and other-production doesn't help — each is independently impossible. Adding two failures together doesn't yield success. If self-production fails and other-production fails, their combination fails doubly.\",\"realLifeExample\":\"If a broken left shoe and a broken right shoe can't function individually, putting them together doesn't create a working pair. Two failures ≠ one success.\"},{\"q\":\"How can anything arise then?\",\"a\":\"Through DEPENDENT ORIGINATION (pratītyasamutpāda): arising from causes and conditions that are CONVENTIONALLY related — not inherently from self, other, both, or neither. The arising is conventional, the conditions are empty, and the process transcends inherent categories.\",\"realLifeExample\":\"A cake arises from flour, eggs, sugar, and baking — not from \\\"itself\\\" or purely from \\\"other.\\\" It's a PROCESS of conditions coming together conventionally.\"},{\"q\":\"How does this restate Ch.1?\",\"a\":\"Ch.1 v.1 is the OPENING of the MMK — the foundational tetralemma. V.13 restates it within Ch.21's specific context (becoming/destruction). This shows the argument's universality and connects Ch.21 to the MMK's opening principle.\",\"realLifeExample\":\"The opening theme of a symphony restated in a later movement — same melody, new context. The fundamental argument (Ch.1) echoed in a specific application (Ch.21).\"},{\"q\":\"What is quantum indeterminacy's relevance?\",\"a\":\"Quantum events don't arise from deterministic pre-existing causes. A radioactive atom decays without a specific \\\"trigger\\\" — the timing is inherently probabilistic. This doesn't mean causeless (conditions matter), but it transcends classical self/other causation. Like v.13: actual arising exceeds the four-fold inherent framework.\",\"deeper\":\"V.13 is architecturally significant: it imports the MMK's foundational argument (Ch.1 v.1's tetralemma) into Ch.21. This creates a structural link between the MMK's opening and its later applications. The tetralemma is not just repeated but recontextualized: Ch.1 applied it to arising in general; Ch.21 applies it to the specific process of becoming. This recontextualization demonstrates that the argument is universal — applicable to any instance of inherent arising, not just to a specific philosophical context.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why does the tetralemma reject all four modes of arising?\",\"options\":[\"A) Only one fails\",\"B) Self: already exists (redundant). Other: no connection (arbitrary). Both: two failures combined. Neither: then it wouldn't arise at all. All four fail → inherent arising is impossible. Dependent arising works.\",\"C) None fail\",\"D) Only self fails\"],\"correct\":\"B\",\"explanation\":\"All four modes fail for inherent arising. Dependent arising transcends the four-fold framework.\"},\"intermediate\":{\"question\":\"How does v.13 connect to Ch.1 v.1?\",\"options\":[\"A) No connection\",\"B) Same tetralemma: Ch.1 in general terms (self/other/both/neither), Ch.21 in specific terms (entity/nonentity framing). The foundational argument restated in a specific context. Universal principle applied to becoming/destruction.\",\"C) Different argument\",\"D) Ch.1 is separate\"],\"correct\":\"B\",\"explanation\":\"Same argument, new context. The MMK's foundational principle applied specifically to becoming/destruction.\"},\"advanced\":{\"question\":\"How does quantum indeterminacy parallel the tetralemma?\",\"options\":[\"A) No parallel\",\"B) QM: arising is probabilistic, not from deterministic self/other causes. V.13: arising is not from inherent self/other/both/neither. Both: actual arising transcends simple causal categorization. Quantum \\\"dependent arising\\\" echoes Buddhist dependent origination.\",\"C) QM supports self-production\",\"D) QM is deterministic\"],\"correct\":\"B\",\"explanation\":\"Both: arising exceeds classical categories. QM is probabilistic/contextual; Buddhist arising is dependent/conventional. Both transcend inherent causation.\"}},\"verseText\":\"An entity does not arise from itself. It is not arisen from another. It is not arisen from itself and another. How can it be arisen?\",\"madhyamakaConcept\":\"Bhāva svataḥ na utpadyate (not from self). Na parataḥ (not from other). Na ubhayataḥ (not from both). Katham utpannaḥ (how can it be arisen?). This is Ch.1 v.1 applied to becoming — the foundational Madhyamaka argument against inherent arising.\",\"quantumPhysicsParallel\":\"Quantum indeterminacy: particles don't arise from pre-determined causes (not from \\\"self\\\"), not from purely external causes (not from \\\"other\\\"), not from both, and not from neither. They arise through probabilistic, contextual processes — quantum \\\"dependent arising.\\\"\"}},\"isShowcase\":false,\"chapterId\":21}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\

88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":10,\"verseId\":15,\"chapterTitle\":\"Examination of Fire and Fuel\",\"totalVerses\":16,\"verseData\":{\"id\":\"v10_15\",\"number\":15,\"title\":\"Universal Generalization\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Through discussion of fire and fuel, The self and the aggregates, the pot and cloth All together, Without remainder have been explained.\"},\"philosophy\":{\"insight\":\"The chapter's grand generalization: the fire-fuel analysis applies to EVERYTHING. Self and aggregates, pot and clay, cloth and thread — ALL relational pairs, \\\"without remainder.\\\" Fire-fuel is the paradigm case for universal emptiness.\",\"madhyamaka\":\"Nāgārjuna explicitly names the key application: self/aggregates. Just as fire is neither identical to nor different from fuel, the self is neither identical to nor different from the aggregates. The fivefold analysis (v.14) applies to self-aggregates, pots-clay, cloth-thread — every substance/property, part/whole, subject/object pair.\",\"quantum\":\"Physics seeks universal laws: the same equations govern electrons in labs and in stars. Nāgārjuna's emptiness is similarly universal: the same logical structure (identity fails, difference fails, dependence fails) applies to every phenomenon without exception.\",\"bridge\":\"Both physics and Mādhyamika pursue universality. Physics: one equation for all particles. Mādhyamika: one analysis for all phenomena. The fire-fuel template is the \\\"equation\\\" of emptiness.\",\"accessible\":\"Imagine discovering that what you learned about fire and fuel also explains your relationship with your body, your coffee cup's relationship with its clay, your shirt's relationship with its thread. One analysis explains EVERYTHING.\",\"twoTruths\":\"Conventionally, all these things exist and function: selves, pots, cloth. Ultimately, all share the same empty nature demonstrated by fire-fuel. Universal emptiness, universal conventional functionality.\",\"commonMisconception\":\"NOT saying everything is fire and fuel. Saying the LOGICAL STRUCTURE of the fire-fuel analysis applies universally. The specific content differs; the emptiness is the same.\"},\"quantumResonance\":{\"concept\":\"Universality of Physical Laws\",\"score\":69,\"strength\":\"Medium\",\"explanation\":\"Physics seeks universal laws that apply everywhere: gravitation, electromagnetism, quantum mechanics. Nāgārjuna's emptiness analysis is similarly universal: the same logical structure applies to fire-fuel, self-aggregates, and all phenomena without exception.\",\"caveat\":\"Universality in physics means the same equations work everywhere. Universality in Mādhyamika means the same emptiness analysis works for all phenomena. The parallel is about the scope of the principle.\"},\"animation\":{\"visualBridge\":\"Fire-fuel dissolving into self-aggregates, then into pot-clay, then into cloth-thread — the same analysis radiating outward to encompass everything.\",\"educationalGoal\":\"User sees that the fire-fuel analysis is a universal template — it applies to ALL phenomena without remainder.\"},\"deeperDive\":[{\"q\":\"How does fire-fuel apply to self-aggregates?\",\"a\":\"Self = fire, aggregates = fuel. The self is neither identical to body/mind (identity collapses agent/patient) nor different from body/mind (difference prevents experience). The fivefold analysis: not identical, not different, not possessing, not contained in, not containing.\",\"realLifeExample\":\"Am I my brain? If identical, what's experiencing the brain? If different, how do brain injuries affect \\\"me\\\"? The fire-fuel dilemma applies perfectly.\"},{\"q\":\"How does it apply to pot-clay?\",\"a\":\"Pot = fire (the formed thing), clay = fuel (the material). The pot is neither identical to the clay (shape matters too) nor different from it (remove the clay, no pot). The same analysis: neither identity nor difference, neither dependence nor independence.\",\"realLifeExample\":\"Is the statue the marble? Not exactly (you could use different marble). Is it separate from the marble? Not exactly (destroy the marble, destroy the statue). Same dilemma.\"},{\"q\":\"What does \\\"without remainder\\\" mean?\",\"a\":\"EVERY phenomenon — not just the examples listed. \\\"Without remainder\\\" (aśeṣataḥ) means exhaustive, complete. No phenomenon is exempt from the fire-fuel analysis. Universal emptiness.\",\"realLifeExample\":\"Like discovering the periodic table explains ALL chemical elements, not just a few. Nāgārjuna's analysis explains ALL phenomena.\"},{\"q\":\"Why is universality important?\",\"a\":\"Because if emptiness applied only to some things, you could still cling to the non-empty things. Universal emptiness means there's NOTHING to cling to inherently — which is the complete basis for liberation.\",\"realLifeExample\":\"If fire escapes are locked on only some floors, you're not fully safe. All exits must work. Similarly, emptiness must be universal for complete liberation.\"},{\"q\":\"How does this connect to the Heart Sūtra?\",\"a\":\"The Heart Sūtra: \\\"form is emptiness, emptiness is form.\\\" V.15 says exactly this: form (fire, pot, self) is emptiness (empty of inherent existence), and emptiness is form (conventional function is preserved). The MMK's analysis and the Heart Sūtra converge.\",\"realLifeExample\":\"Different languages saying the same thing: English \\\"water,\\\" Spanish \\\"agua,\\\" Hindi \\\"pani.\\\" The Heart Sūtra and the MMK express the same insight in different frameworks.\"},{\"q\":\"Why does Nāgārjuna choose these specific examples?\",\"a\":\"Self-aggregates: the most soteriologically important case (liberation depends on understanding no-self). Pot-cloth: everyday objects, showing emptiness isn't just abstract philosophy but applies to ordinary life. Together: the sacred and the mundane are equally empty.\",\"deeper\":\"This verse is the philosophical climax of Ch.10 — where a specific analysis (fire-fuel) becomes a universal principle (all phenomena). It bridges the particular and the universal, the philosophical and the practical, the analytical and the liberating.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does v.15 claim about the fire-fuel analysis?\",\"options\":[\"A) It only applies to fire\",\"B) It applies universally — to self/aggregates, pots, cloth, and ALL phenomena without remainder\",\"C) It applies to some things\",\"D) Only to natural elements\"],\"correct\":\"B\",\"explanation\":\"Nāgārjuna explicitly generalizes: the fire-fuel analysis applies to self-aggregates, everyday objects, and everything else. Universal emptiness.\"},\"intermediate\":{\"question\":\"How does the fire-fuel analysis apply to the self?\",\"options\":[\"A) It doesn't\",\"B) Self = fire, aggregates = fuel: the self is neither identical to nor different from body/mind, just as fire is neither identical to nor different from fuel\",\"C) The self is fire\",\"D) The self is fuel\"],\"correct\":\"B\",\"explanation\":\"The self-aggregates relationship has the same structure as fire-fuel: identity collapses distinctions, difference prevents interaction, and all five relational categories fail.\"},\"advanced\":{\"question\":\"Why is universal emptiness necessary for liberation?\",\"options\":[\"A) It's not necessary\",\"B) Because if any phenomenon were non-empty, there would still be an inherent basis for clinging — only universal emptiness removes ALL bases for attachment\",\"C) Partial emptiness suffices\",\"D) Liberation doesn't require understanding emptiness\"],\"correct\":\"B\",\"explanation\":\"Liberation requires the complete absence of inherent objects of clinging. If anything were non-empty (inherently existent), clinging to it would remain possible. Universal emptiness = complete freedom.\"}},\"verseText\":\"Through discussion of fire and fuel, The self and the aggregates, the pot and cloth All together, Without remainder have been explained.\",\"madhyamakaConcept\":\"Nāgārjuna explicitly names the key application: self/aggregates. Just as fire is neither identical to nor different from fuel, the self is neither identical to nor different from the aggregates. The fivefold analysis (v.14) applies to self-aggregates, pots-clay, cloth-thread — every substance/property, part/whole, subject/object pair.\",\"quantumPhysicsParallel\":\"Physics seeks universal laws: the same equations govern electrons in labs and in stars. Nāgārjuna's emptiness is similarly universal: the same logical structure (identity fails, difference fails, dependence fails) applies to every phenomenon without exception.\"}},\"isShowcase\":false,\"chapterId\":10}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\"

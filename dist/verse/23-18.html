88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":23,\"verseId\":18,\"chapterTitle\":\"Examination of Error\",\"totalVerses\":25,\"verseData\":{\"id\":\"v23_18\",\"number\":18,\"title\":\"The Four Errors Applied to Non-Arising\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Whether or not there is arising through the self, through something other, through both, or without a cause — there is no error in any way.\"},\"philosophy\":{\"insight\":\"The TETRALEMMA of causation (from Ch.1): arising through self, other, both, or causelessly. NONE of these inherently works (Ch.1 proved this). Therefore error through any of these modes is impossible. The four causal modes fail → error through any mode fails.\",\"madhyamaka\":\"Svataḥ parataḥ ubhayataḥ ahetutaḥ utpāda — Ch.1's tetralemma applied to error. If no mode of arising works inherently, error (which requires arising) doesn't work inherently either.\",\"quantum\":\"The four possible causal modes (self-caused, other-caused, both, uncaused) parallel the failure of hidden variable theories, purely random theories, etc. No simple causal model works for quantum phenomena.\",\"bridge\":\"Both: exhaustive causal analysis fails. QM: no simple causal model. V.18: no mode of arising → no inherent error. Both: the causal framework itself is inadequate.\",\"accessible\":\"Can error arise from itself? From something else? From both? From nothing? None of these makes sense inherently. Error's arising is as empty as everything else's.\",\"twoTruths\":\"Conventionally: errors arise dependently. Ultimately: no mode of inherent arising works for error.\",\"commonMisconception\":\"NOT saying errors don't arise. They arise CONVENTIONALLY through dependent origination. V.18 targets inherent arising through the four modes.\"},\"quantumResonance\":{\"concept\":\"Failure of Simple Causal Models\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"No simple causal model (deterministic, random, mixed, uncaused) works for QM. V.18: no mode of arising (self, other, both, uncaused) works for error. Both: causal frameworks inadequate.\",\"caveat\":\"Causal models are physics. V.18 is Ch.1's tetralemma applied to error.\"},\"animation\":{\"visualBridge\":\"Four arrows — \\\"Self,\\\" \\\"Other,\\\" \\\"Both,\\\" \\\"None\\\" — all pointing to \\\"Error\\\" but all blocked. Caption: \\\"No mode of inherent arising works for error.\\\"\",\"educationalGoal\":\"Error can't arise inherently through any of the four causal modes.\"},\"deeperDive\":[{\"q\":\"What is the tetralemma of causation?\",\"a\":\"Four possible modes: (1) Self-caused (from itself). (2) Other-caused (from something else). (3) Both. (4) Causeless. Ch.1 showed all four fail for inherent arising. V.18 applies this to error.\",\"realLifeExample\":\"Did the fire start itself? From something else? Both? From nothing? None captures inherent fire-causation.\"},{\"q\":\"How does Ch.1 support v.18?\",\"a\":\"Ch.1 proved that no mode of inherent arising works universally. V.18 applies this to error specifically. If arising itself is empty, error-arising is empty.\",\"realLifeExample\":\"If travel is impossible (Ch.1), then traveling north, south, east, or west is impossible (v.18). The general implies the specific.\"},{\"q\":\"Why address all four modes?\",\"a\":\"Exhaustiveness: by covering all four possible causal modes, v.18 ensures no escape route remains. Error can't arise inherently through ANY mode.\",\"realLifeExample\":\"Checking all exits: if all four doors are locked, there's no way out. No inherent escape for error-arising.\"},{\"q\":\"What about dependent arising?\",\"a\":\"Dependent arising isn't any of the four modes (it's not self-caused, other-caused, both, or causeless). It's a FIFTH option — conventional arising without inherent causation. V.18 leaves this option open.\",\"realLifeExample\":\"A team winning isn't caused by any single player (self), the opponents (other), both equally, or luck (causeless). It's a dependent, collaborative process.\"},{\"q\":\"Significance?\",\"a\":\"V.18 applies Ch.1's most powerful argument to error. If the foundation of the entire MMK (Ch.1's analysis of causation) is applied here, Ch.23's conclusion is maximally supported.\",\"realLifeExample\":\"Using your strongest evidence for the most important point.\"},{\"q\":\"How does this advance Ch.23?\",\"a\":\"V.18 applies the heaviest philosophical artillery (Ch.1's tetralemma) to error. This ensures the emptiness of error is not just argued locally (vv.13-17) but connected to the MMK's foundational analysis.\",\"deeper\":\"V.18 integrates Ch.23 with Ch.1 — the foundational chapter of the entire MMK. By showing that error's arising fails under Ch.1's tetralemma, Ch.23's local arguments are reinforced by the global framework. This cross-referencing is characteristic of Nāgārjuna's systematic approach: each chapter supports every other.\"}],\"quiz\":{\"beginner\":{\"question\":\"Can error arise inherently through any of the four modes?\",\"options\":[\"A) Yes, one works\",\"B) No — self-caused, other-caused, both, and causeless all fail. No mode of inherent arising works for error.\",\"C) Two work\",\"D) Causeless works\"],\"correct\":\"B\",\"explanation\":\"All four modes fail. Error can't arise inherently through any route.\"},\"intermediate\":{\"question\":\"How does v.18 connect to Ch.1?\",\"options\":[\"A) No connection\",\"B) Ch.1 proved no mode of inherent arising works. V.18 applies this to error. The foundational analysis directly supports Ch.23.\",\"C) Different analysis\",\"D) Ch.1 is separate\"],\"correct\":\"B\",\"explanation\":\"Ch.1's global analysis applied to Ch.23's specific case. Systematic integration.\"},\"advanced\":{\"question\":\"What is the significance of cross-referencing Ch.1?\",\"options\":[\"A) None\",\"B) It connects local arguments (Ch.23) to the global framework (Ch.1). Each chapter supports every other, demonstrating the systematic nature of Madhyamaka.\",\"C) Only local matters\",\"D) Different framework\"],\"correct\":\"B\",\"explanation\":\"Systematic integration: each chapter reinforces every other. Universal emptiness.\"}},\"verseText\":\"Whether or not there is arising through the self, through something other, through both, or without a cause — there is no error in any way.\",\"madhyamakaConcept\":\"Svataḥ parataḥ ubhayataḥ ahetutaḥ utpāda — Ch.1's tetralemma applied to error. If no mode of arising works inherently, error (which requires arising) doesn't work inherently either.\",\"quantumPhysicsParallel\":\"The four possible causal modes (self-caused, other-caused, both, uncaused) parallel the failure of hidden variable theories, purely random theories, etc. No simple causal model works for quantum phenomena.\"}},\"isShowcase\":false,\"chapterId\":23}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content

88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":27,\"verseId\":21,\"chapterTitle\":\"Examination of Views\",\"totalVerses\":30,\"verseData\":{\"id\":\"v27_21\",\"number\":21,\"title\":\"All Views About the Self Are Empty\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Views such as \\\"I existed,\\\" \\\"I did not exist,\\\" \\\"I will exist,\\\" \\\"I will not exist\\\" — all are untenable.\"},\"philosophy\":{\"insight\":\"GRAND SUMMARY: ALL views about the self across time are untenable. Past, future, permanent, impermanent, finite, infinite — every inherent description fails. The tetralemma dissolves ALL self-views.\",\"madhyamaka\":\"Abhūd, na abhūd, bhaviṣyāmi, na bhaviṣyāmi — sarvāḥ na upapadyante. The complete dissolution of all temporal self-views.\",\"quantum\":\"All classical descriptions of a quantum system fail: definite past, definite future, permanent, impermanent. The system transcends classical categories.\",\"bridge\":\"Both: all classical/inherent descriptions fail. QM: quantum systems transcend classical categories. V.21: the self transcends inherent categories.\",\"accessible\":\"Every way you try to pin down \\\"who you are\\\" fails: past you, future you, permanent you, changing you. None of these captures the truth. The self transcends all inherent descriptions.\",\"twoTruths\":\"Conventionally: we use these descriptions functionally. Ultimately: none captures an inherent truth about the self.\",\"commonMisconception\":\"NOT saying the self is mysterious or unknowable. Saying it's EMPTY — dependently arising, not captured by inherent categories.\"},\"quantumResonance\":{\"concept\":\"Transcendence of Classical Categories\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"Quantum systems transcend all classical descriptions. The self transcends all inherent descriptions. Both: the reality is richer than any single category.\",\"caveat\":\"Physical transcendence vs. existential transcendence.\"},\"animation\":{\"visualBridge\":\"All self-views dissolving simultaneously: past, future, permanent, impermanent, finite, infinite. What remains: luminous emptiness.\",\"educationalGoal\":\"ALL inherent self-views are untenable. The self transcends every inherent category.\"},\"deeperDive\":[{\"q\":\"Why list all views together?\",\"a\":\"To show the UNIVERSALITY of the dissolution. It's not that one view fails — ALL views fail. The self can't be captured by ANY inherent description.\",\"realLifeExample\":\"Not just \\\"this key doesn't fit\\\" but \\\"NO key fits — because there's no lock.\\\" The dissolution is universal.\"},{\"q\":\"What remains?\",\"a\":\"The conventional self — dependently designated, functionally real, but beyond all inherent descriptions. You exist, but not the way you think.\",\"realLifeExample\":\"After dissolving all labels, the reality remains. The rose without a name still smells sweet.\"},{\"q\":\"Connection to Ch.25 v.21?\",\"a\":\"Ch.25 v.21: prapañcopaśama — cessation of all conceptual elaboration. V.21 here: all self-views cease. Same conclusion, applied to the self.\",\"realLifeExample\":\"Ch.25: universal cessation. Ch.27: personal cessation. Same peace.\"},{\"q\":\"Is this the climax of Ch.27?\",\"a\":\"The dissolution climax, yes. Vv.22-30 will draw final conclusions and close the entire MMK.\",\"realLifeExample\":\"The demolition is complete. Now: what to build on the cleared ground.\"},{\"q\":\"Practical significance?\",\"a\":\"Release ALL fixed self-images: \\\"I was...\\\", \\\"I will be...\\\", \\\"I am always...\\\", \\\"I'm nothing...\\\" None is inherently true. Freedom from ALL self-definitions.\",\"realLifeExample\":\"Dropping every mask simultaneously. Not wearing a new mask but being free of masks.\"},{\"q\":\"Significance?\",\"a\":\"V.21 is the comprehensive dissolution — ALL self-views fail. This prepares the final conclusions of the MMK.\",\"deeper\":\"V.21 is the philosophical climax of Ch.27: the total dissolution of inherent self-views. Every category the human mind can apply to the self — past, future, permanent, impermanent — is shown to be empty. What remains is the self as it truly is: dependently arising, beyond categories.\"}],\"quiz\":{\"beginner\":{\"question\":\"Do ANY inherent self-views succeed?\",\"options\":[\"A) Some do\",\"B) NO — all are untenable. Past, future, permanent, impermanent — every inherent description fails.\",\"C) Only \\\"I exist\\\"\",\"D) Only \\\"I don't exist\\\"\"],\"correct\":\"B\",\"explanation\":\"ALL fail. Universal dissolution of inherent self-views.\"},\"intermediate\":{\"question\":\"What remains after all views dissolve?\",\"options\":[\"A) Nothing\",\"B) The CONVENTIONAL self — dependently designated, functionally real, beyond all inherent descriptions.\",\"C) Confusion\",\"D) A new view\"],\"correct\":\"B\",\"explanation\":\"Conventional self intact. Inherent descriptions dissolved.\"},\"advanced\":{\"question\":\"How does this connect to prapañcopaśama?\",\"options\":[\"A) Unrelated\",\"B) Ch.25: cessation of all conceptual elaboration. Ch.27 v.21: cessation of all self-views. Same conclusion applied personally.\",\"C) Different concept\",\"D) Only Ch.25\"],\"correct\":\"B\",\"explanation\":\"Universal cessation (Ch.25) → personal cessation (Ch.27). Same peace.\"}},\"verseText\":\"Views such as \\\"I existed,\\\" \\\"I did not exist,\\\" \\\"I will exist,\\\" \\\"I will not exist\\\" — all are untenable.\",\"madhyamakaConcept\":\"Abhūd, na abhūd, bhaviṣyāmi, na bhaviṣyāmi — sarvāḥ na upapadyante. The complete dissolution of all temporal self-views.\",\"quantumPhysicsParallel\":\"All classical descriptions of a quantum system fail: definite past, definite future, permanent, impermanent. The system transcends classical categories.\"}},\"isShowcase\":false,\"chapterId\":27}]\n"])</script><script>self.__next_

c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":3,\"verseId\":3,\"chapterTitle\":\"Examination of Perception\",\"totalVerses\":9,\"verseData\":{\"id\":\"v3_3\",\"number\":3,\"title\":\"The Fire Analogy Rejected\",\"sanskrit\":{\"text\":\"dṛṣṭāntena na cāgneḥ sa siddho darśanasya saḥ | sa gatāgataganmānaiḥ saha vyākhyāta eva saḥ ||\",\"transliteration\":\"dṛṣṭāntena na cāgneḥ sa siddho darśanasya saḥ | sa gatāgataganmānaiḥ saha vyākhyāta eva saḥ\",\"translation\":\"The example of fire cannot elucidate seeing. Along with the moved and not-moved and motion, that has been answered.\"},\"philosophy\":{\"insight\":\"The opponent compares seeing to fire: \\\"Fire illuminates itself and others, so seeing can see itself and others.\\\" Nāgārjuna rejects this: fire doesn't illuminate itself (darkness is merely absent), and the motion analogy from Ch. 2 already disproves this kind of self-referential inherent action.\",\"madhyamaka\":\"Garfield: Nāgārjuna rejects the fire analogy on two grounds. First, fire doesn't truly \\\"illuminate itself\\\" — darkness was never present in fire to be dispelled. Second, the entire logic of self-referential inherent action was already dismantled in Ch. 2's analysis of motion. Kalupahana notes the cross-reference to Ch. 2 is significant: Nāgārjuna shows his arguments build cumulatively. Candrakīrti elaborates: \\\"If fire illuminated itself, darkness would have to first cover fire — but fire and darkness are contradictory.\\\"\",\"quantum\":\"Spontaneous Emission / No Self-Excitation: In quantum electrodynamics, a photon cannot excite itself — it requires interaction with a charged particle. A photon doesn't \\\"illuminate itself\\\" by its own nature; illumination requires interaction between the electromagnetic field and matter. No quantum system is self-activating without external interaction.\",\"bridge\":\"Both reject self-activation: fire doesn't illuminate itself (it merely exists where darkness doesn't), and photons don't self-excite. In both frameworks, processes require external interaction partners — they are never purely self-referential or self-sufficient.\",\"accessible\":\"Does a lamp \\\"illuminate itself\\\"? No — it was never dark inside the lamp. Darkness and fire are contradictory. So \\\"fire illuminating itself\\\" is a misleading metaphor. Similarly, a quantum photon doesn't excite itself — it needs interaction with matter. Seeing needs conditions just like light needs matter to interact with.\",\"twoTruths\":\"Conventionally, fire provides light and seeing provides vision — both work. Ultimately, neither fire nor seeing is self-activating — both depend on conditions and interaction partners.\",\"commonMisconception\":\"The fire analogy seems intuitive but is flawed. Fire doesn't \\\"illuminate itself\\\" any more than seeing \\\"sees itself.\\\" Both are relational processes, not self-powered inherent activities.\"},\"quantumResonance\":{\"concept\":\"Spontaneous Emission / No Self-Excitation in QED\",\"score\":84,\"strength\":\"Medium\",\"explanation\":\"Photons don't self-excite — illumination requires matter-field interaction. Parallels the rejection of fire's supposed self-illumination.\",\"caveat\":\"The parallel is structural: both deny self-activation. The physics of photon-matter interaction differs mechanistically from the philosophy of perception.\"},\"animation\":{\"geometry\":\"Flame Attempting Self-Illumination\",\"anchor\":\"A central flame trying to cast light ON ITSELF. Light rays radiate outward but when directed back at the flame, they pass through without effect. A dark sphere approaches — the flame illuminates it, but cannot illuminate its own interior.\",\"texture\":\"Flame: Warm amber/orange with flickering volumetric effect. Light rays: Golden beams. Dark sphere: Deep indigo, absorbing light. Interior of flame: Already bright — no darkness to dispel.\",\"mood\":\"Warm, paradoxical, gently illuminating the flaw\",\"colors\":[\"#F59E0B\",\"#EF4444\",\"#312E81\",\"#1E293B\"],\"orchestration\":{\"start\":\"Flame burns steadily, light rays radiating outward.\",\"click\":\"Click the flame — light rays try to turn inward. They pass right through. Text: \\\"Nothing to illuminate — fire was never dark.\\\" Then a dark sphere drifts in; the flame illuminates it easily.\",\"reveal\":\"Text: \\\"Fire illuminates others, not itself. Seeing perceives others, not itself. Neither is self-sufficient.\\\"\"},\"interaction\":{\"click\":\"Click flame to see light rays attempt self-illumination and fail — then succeed on external object\",\"drag\":\"Move the dark sphere closer to or farther from the flame\",\"hover\":\"Hover over flame interior shows \\\"No darkness here to dispel\\\"\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.3},\"speed\":{\"default\":60,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true,\"autoRevealToggle\":true},\"r3fTechniques\":[\"Custom volumetric flame shader with noise-based flickering\",\"drei GodRays for directional light beams from flame\",\"MeshPhysicalMaterial with absorption for dark sphere\",\"Bloom post-processing for warm flame glow\",\"useSpring for smooth ray-bending and sphere approach animations\"],\"camera\":{\"position\":[0,2,7],\"fov\":50,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c300MB memory, 60 FPS. Simple flame mesh with vertex-animated noise. GodRays are fragment-shader-only. Dark sphere is basic geometry.\",\"tripoPrompt\":\"A warm amber flame floating in dark space, golden light rays curving back toward it but passing through, a dark indigo sphere nearby being illuminated, cinematic lighting, 8K.\",\"visualBridge\":\"Light rays passing through the flame without effect directly show that fire cannot illuminate itself — there's no darkness inside to dispel. The analogy for self-seeing collapses.\",\"educationalGoal\":\"User sees why the fire analogy fails — fire doesn't illuminate itself because it was never dark. Self-referential inherent activity is incoherent.\"},\"deeperDive\":[{\"q\":\"Why did opponents compare seeing to fire?\",\"a\":\"The Naiyāyikas and some Sarvāstivādins argued: \\\"Just as fire illuminates both itself and other things, seeing perceives both itself (self-awareness) and external objects.\\\" This was meant to rescue the idea that seeing has inherent, self-sufficient power.\",\"realLifeExample\":\"It's like arguing: \\\"A flashlight lights up the room AND itself — so it's self-sufficient!\\\" But actually, the flashlight was never dark. Its \\\"self-illumination\\\" is a linguistic confusion, not a real event.\"},{\"q\":\"How does Nāgārjuna refute the fire analogy?\",\"a\":\"On two grounds: (1) Fire doesn't truly illuminate itself — darkness was never present in fire, so there's nothing for fire to dispel within itself. (2) The entire logic of self-referential inherent action was already refuted in Ch. 2. If motion can't move itself (Ch. 2), fire can't illuminate itself, and seeing can't see itself.\",\"realLifeExample\":\"Can water wet itself? Water is already \\\"wet\\\" by nature — it can't perform the act of wetting on itself. Similarly, fire is already \\\"light\\\" — it can't perform illumination on itself. The question is malformed.\"},{\"q\":\"How does Candrakīrti elaborate on this?\",\"a\":\"In the Prasannapadā, Candrakīrti argues: \\\"If fire were to illuminate itself, darkness would first have to cover it. But fire and darkness are mutually exclusive — wherever fire is, darkness isn't. So fire never encounters its own darkness. Therefore, 'self-illumination' is meaningless for fire.\\\"\",\"realLifeExample\":\"Can a heater heat itself? The heater is already hot. It never encounters its own coldness. \\\"Self-heating\\\" is a category error — the heater only heats things that are cold, i.e., external things.\"},{\"q\":\"What does the cross-reference to Ch. 2 add?\",\"a\":\"By saying \\\"that has been answered\\\" (with moved/not-moved/motion), Nāgārjuna shows his arguments build cumulatively. The impossibility of self-referential inherent action was proven for motion in Ch. 2. The same logical structure applies here — seeing can't self-see for the same structural reasons motion can't self-move.\",\"realLifeExample\":\"A mathematician who proves \\\"no even prime greater than 2 exists\\\" doesn't need to prove it again for each number. The proof is structural and applies universally. Nāgārjuna's Ch. 2 proof of no self-referential inherent action is like this.\"},{\"q\":\"How does quantum physics show no self-excitation?\",\"a\":\"In QED, a photon cannot excite itself — it must interact with a charged particle (electron, quark) to produce any effect. The electromagnetic field is not self-activating; it requires matter to interact with. Similarly, fire is not self-illuminating and seeing is not self-perceiving. All three require interaction partners.\",\"realLifeExample\":\"A radio transmitter broadcasts signals but can't receive its own signal without a separate receiver. The transmission process requires two ends — it's never complete within the transmitter alone.\"},{\"q\":\"What philosophical principle does this verse establish?\",\"a\":\"The principle that NO process can be its own object — action requires distinct agent, instrument, and object. Self-referential activity is structurally impossible for anything with inherent existence. This is a version of what modern logic calls \\\"no self-membership\\\" (related to Russell's paradox).\",\"deeper\":\"Garfield connects this to the broader Madhyamaka principle: inherent existence implies independence, independence implies self-sufficiency, self-sufficiency implies self-reference capability. Since self-reference fails (v.2-3), inherent existence fails. The logic is modus tollens.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why does Nāgārjuna reject the comparison of seeing to fire?\",\"options\":[\"A) Because fire is too hot\",\"B) Because fire doesn't truly illuminate itself — darkness was never present in fire\",\"C) Because fire isn't real\",\"D) Because seeing is more powerful than fire\"],\"correct\":\"B\",\"explanation\":\"Fire and darkness are mutually exclusive — wherever fire is, darkness isn't. So fire never encounters its own darkness and cannot \\\"illuminate itself.\\\" The analogy for self-seeing collapses.\"},\"intermediate\":{\"question\":\"What does Nāgārjuna mean by \\\"that has been answered\\\" regarding motion?\",\"options\":[\"A) He forgot the argument\",\"B) He already disproved self-referential inherent action in Ch. 2's analysis of motion — the same logic applies here\",\"C) Motion and seeing are the same thing\",\"D) Chapter 2 was about fire\"],\"correct\":\"B\",\"explanation\":\"Ch. 2 proved motion can't move itself (self-referential inherent action fails). Nāgārjuna cites this as already established — the structural impossibility applies equally to seeing, fire, or any supposedly self-referential process.\"},\"advanced\":{\"question\":\"What general principle emerges from the failure of the fire analogy?\",\"options\":[\"A) Fire is an illusion\",\"B) No process can be its own object — inherent existence implies self-sufficiency, which implies self-reference capability, which fails\",\"C) Only seeing fails at self-reference\",\"D) Fire and seeing are unrelated\"],\"correct\":\"B\",\"explanation\":\"The argument is: inherent existence → independence → self-sufficiency → self-reference. But self-reference fails (seeing can't self-see, fire can't self-illuminate). Therefore, by modus tollens, inherent existence fails.\"}},\"verseText\":\"The example of fire cannot elucidate seeing. Along with the moved and not-moved and motion, that has been answered.\",\"madhyamakaConcept\":\"Garfield: Nāgārjuna rejects the fire analogy on two grounds. First, fire doesn't truly \\\"illuminate itself\\\" — darkness was never present in fire to be dispelled. Second, the entire logic of self-referential inherent action was already dismantled in Ch. 2's analysis of motion. Kalupahana notes the cross-reference to Ch. 2 is significant: Nāgārjuna shows his arguments build cumulatively. Candrakīrti elaborates: \\\"If fire illuminated itself, darkness would have to first cover fire — but fire and darkness are contradictory.\\\"\",\"quantumPhysicsParallel\":\"Spontaneous Emission / No Self-Excitation: In quantum electrodynamics, a photon cannot excite itself — it requires interaction with a charged particle. A photon doesn't \\\"illuminate itself\\\" by its own nature; illumination requires interaction between the electromagnetic field and matter. No quantum system is self-activating without external interaction.\"}},\"isShowcase\":false,\"chapterId\":3}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, fol

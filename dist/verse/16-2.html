176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":16,\"verseId\":2,\"chapterTitle\":\"Examination of Bondage and Liberation\",\"totalVerses\":10,\"verseData\":{\"id\":\"v16_2\",\"number\":2,\"title\":\"The Transmigrating Self Cannot Be Found\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If someone transmigrates, Then if, when sought in the fivefold way In the aggregates and in the sense spheres and in the elements, He is not there, what transmigrates?\"},\"philosophy\":{\"insight\":\"The fivefold search: looking for the transmigrating self WITHIN the aggregates (skandhas), sense spheres (āyatanas), and elements (dhātus) — via identity, difference, possession, dependence, and basis — finds NOTHING. If no inherent self can be located, what exactly transmigrates? No inherent transmigrator exists.\",\"madhyamaka\":\"The pañcavidhā parīkṣā (fivefold analysis) asks: Is the self (1) identical with the aggregates? (2) Different from them? (3) The possessor of them? (4) Dependent on them? (5) Their basis? None works — the self can't be found via any of these five relations. This is the standard anātman (no-self) analysis applied to transmigration.\",\"quantum\":\"Quantum non-locality of identity: you can't localize a quantum system's identity to any single component. An entangled system's properties aren't \\\"in\\\" any one particle — they're distributed across the whole system. Similarly, the \\\"self\\\" can't be localized in any aggregate.\",\"bridge\":\"Both quantum non-locality and Buddhist no-self show that identity can't be localized to components. QM: entangled properties aren't in any one particle. Buddhism: the self isn't in any aggregate. Both: identity emerges from the whole, not from a localizable part.\",\"accessible\":\"Take apart a car: engine, wheels, seats, body. Where is the \\\"car\\\" itself? Not in any part. Similarly, analyze a person: body, feelings, perceptions, mental formations, consciousness. Where is the \\\"person\\\"? Not in any part. The \\\"transmigrator\\\" can't be found in the components.\",\"twoTruths\":\"Conventionally, persons transmigrate. Ultimately, no inherent self can be found in the aggregates. Conventional transmigration works without an inherent transmigrator.\",\"commonMisconception\":\"NOT saying people don't exist or transmigration doesn't occur. Both work conventionally. The point: no inherent, findable SELF performs the transmigration. The process is selfless — dependent arising without an inherent agent.\"},\"quantumResonance\":{\"concept\":\"Quantum Non-Locality of System Identity\",\"score\":66,\"strength\":\"Medium\",\"explanation\":\"In entangled quantum systems, properties can't be localized to individual particles — they're distributed across the whole system. Like the self: it can't be found in any single aggregate but emerges from the whole.\",\"caveat\":\"Quantum non-locality is about entanglement correlations. The parallel is about non-localizable identity, not about Buddhist souls being quantum entangled.\"},\"animation\":{\"visualBridge\":\"Searching through five \\\"boxes\\\" (the five aggregates) for a \\\"self\\\" — each box is opened and found empty of an inherent self. The self is nowhere and everywhere — a conventional designation.\",\"educationalGoal\":\"User sees that the transmigrating self can't be found in any component — it's a conventional designation, not an inherent entity.\"},\"deeperDive\":[{\"q\":\"What is the fivefold analysis?\",\"a\":\"Five ways to relate self to aggregates: (1) Identity — is the self the aggregates? (2) Difference — is it separate from them? (3) Possession — does it own them? (4) Dependence — does it depend on them? (5) Basis — is it the basis for them? All five fail upon analysis.\",\"realLifeExample\":\"Is the driver the car? (No — identity fails.) Is the driver separate from the car? (Then what's driving?) Does the driver own the car? (Ownership is a relation, not an identity.) The driver depends on the car for driving, but isn't the car. None of these locates an inherent \\\"driver-car\\\" entity.\"},{\"q\":\"Why does the self fail identity with aggregates?\",\"a\":\"If self = aggregates, then there are five selves (one per aggregate), which contradicts the singular self. Also, aggregates are impermanent (they change), but the self is supposed to be the continuous \\\"I\\\" — impermanent things can't be a continuous self.\",\"realLifeExample\":\"If you = your body, then when your body changes (aging, injury), \\\"you\\\" change completely. But you feel continuous. If you = your thoughts, you'd be a new person every thought. Identity with components doesn't work.\"},{\"q\":\"Why does it fail difference from aggregates?\",\"a\":\"If self ≠ aggregates (completely separate), then the self has no body, no feelings, no mind — it's a bare, property-less entity. Such an entity can't be perceived, known, or experienced. A self with no properties is nothing.\",\"realLifeExample\":\"If you were completely separate from your body and mind, you'd have no way to think, feel, or act. A \\\"you\\\" with no properties is meaningless — it can't interact with anything.\"},{\"q\":\"How does quantum non-locality parallel this?\",\"a\":\"In an entangled two-particle system, measuring one particle instantly correlates with the other. The system's properties (like total spin) aren't localized in either particle — they're properties of the WHOLE system. Similarly, the \\\"self\\\" isn't localized in any aggregate — it's a property of the whole.\",\"realLifeExample\":\"A team's \\\"chemistry\\\" isn't in any individual player — it's a property of the whole team. You can't find \\\"team chemistry\\\" by examining one player at a time. Similarly, the self isn't found by examining aggregates one at a time.\"},{\"q\":\"If no self transmigrates, how does rebirth work?\",\"a\":\"Conventionally: a dependent process continues — like a flame passing from one candle to another. No \\\"flame-entity\\\" travels; the heat, fuel, and conditions continue the process. Rebirth is a causal continuity without an inherent transmigrator.\",\"realLifeExample\":\"A song played on one instrument and then another. No \\\"song-entity\\\" physically moves — the pattern continues. The \\\"song\\\" transmigrates as a pattern, not a thing.\"},{\"q\":\"How does v.2 advance from v.1?\",\"a\":\"V.1 showed phenomena can't inherently transmigrate (permanent/impermanent dilemma). V.2 adds: even if we look for a transmigrating SELF, we can't find one. Both the process (transmigration) and the agent (transmigrator) lack inherent existence.\",\"deeper\":\"V.2 applies the anātman (no-self) doctrine specifically to transmigration — one of the most challenging applications. If there's no self, what gets reborn? This is the central tension of Buddhist soteriology. The Mādhyamika answer: conventional continuity without inherent self. The flame analogy (a causal process, not a traveling entity) is the standard resolution.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does the fivefold analysis reveal about the transmigrating self?\",\"options\":[\"A) It finds the self\",\"B) The self can't be found as identical to, different from, possessing, depending on, or being the basis of the aggregates. No inherent self exists in the components.\",\"C) The self is in the body\",\"D) The self is separate from aggregates\"],\"correct\":\"B\",\"explanation\":\"All five ways of relating self to aggregates fail upon analysis. No inherent, findable self exists — the self is a conventional designation, not a localizable entity.\"},\"intermediate\":{\"question\":\"How does quantum non-locality parallel the non-localizability of self?\",\"options\":[\"A) No parallel\",\"B) In entangled systems, properties can't be localized to individual particles — they're properties of the whole. Like the self: not found in any single aggregate but emerging from the whole.\",\"C) Quantum systems have inherent identity\",\"D) Each particle has all properties\"],\"correct\":\"B\",\"explanation\":\"Non-locality shows system properties aren't in individual components. The self similarly isn't in any single aggregate — both are properties of the whole system.\"},\"advanced\":{\"question\":\"How does conventional rebirth work without an inherent self?\",\"options\":[\"A) It doesn't work\",\"B) Through causal continuity — like a flame passing from candle to candle. No \\\"flame-entity\\\" travels; the conditions continue the process. Rebirth is pattern-continuity without entity-transfer.\",\"C) An inherent self is needed\",\"D) Rebirth requires a soul\"],\"correct\":\"B\",\"explanation\":\"Conventional rebirth is causal continuity without inherent transmigrator. The process continues (like a flame) without any entity transferring — pattern, not substance, continues.\"}},\"verseText\":\"If someone transmigrates, Then if, when sought in the fivefold way In the aggregates and in the sense spheres and in the elements, He is not there, what transmigrates?\",\"madhyamakaConcept\":\"The pañcavidhā parīkṣā (fivefold analysis) asks: Is the self (1) identical with the aggregates? (2) Different from them? (3) The possessor of them? (4) Dependent on them? (5) Their basis? None works — the self can't be found via any of these five relations. This is the standard anātman (no-self) analysis applied to transmigration.\",\"quantumPhysicsParallel\":\"Quantum non-locality of identity: you can't localize a quantum system's identity to any single component. An entangled system's properties aren't \\\"in\\\" any one particle — they're distributed across the whole system. Similarly, the \\\"self\\\" can't be localized in any aggregate.\"}},\"isShowcase\":false,\"chapterId\":16}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\

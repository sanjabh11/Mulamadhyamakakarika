88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":21,\"verseId\":17,\"chapterTitle\":\"Examination of Becoming and Destruction\",\"totalVerses\":21,\"verseData\":{\"id\":\"v21_17\",\"number\":17,\"title\":\"If Things Inherently Existed, They Could Not Become Non-Existent\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If things existed inherently, they could not become non-existent. For an inherent nature could never change into something else.\"},\"philosophy\":{\"insight\":\"The consequence of inherent existence for destruction: if things existed INHERENTLY, they could NEVER become non-existent (cease). Why? Because inherent nature (svabhāva) is by definition unchangeable. If existence is a thing's inherent nature, it can't lose that nature — it would exist forever. Inherent existence eliminates destruction.\",\"madhyamaka\":\"Bhāva svabhāvataḥ santi cet (if things inherently existed), na abhāva bhavet (they could not become non-existent). Svabhāva anyathā na bhavati (inherent nature never changes into something else). This is the core argument: svabhāva → nitya (inherent nature → permanence).\",\"quantum\":\"Conservation laws vs. transformation: in physics, conserved quantities (like total energy) never change. But specific forms DO transform — kinetic becomes potential, etc. If a specific FORM were \\\"inherently conserved\\\" (svabhāva), it could never transform. Like v.17: inherent existence blocks change.\",\"bridge\":\"Both conservation and v.17 show the difference between inherent unchangeability and conventional transformation. Physics: conserved quantities don't change (like inherent nature); specific forms DO change (like conventional phenomena). V.17: if things had inherent nature, they'd be \\\"conserved\\\" (permanent). Since they change, they lack inherent nature.\",\"accessible\":\"If a candle's \\\"being lit\\\" were its inherent, unchangeable nature, it could never go out. But candles DO go out. Therefore: \\\"being lit\\\" is not the candle's inherent nature. If ANYTHING were inherently existent, it could never change — but everything changes. So nothing is inherently existent.\",\"twoTruths\":\"Conventionally: things exist and then cease — change is universal. Ultimately: this change is possible ONLY because things lack inherent existence. Inherent existence would block change.\",\"commonMisconception\":\"NOT saying inherent existence would be \\\"good\\\" (permanent, stable). V.17 shows it would be CATASTROPHIC: no change, no growth, no death, no process — a frozen universe. Inherent existence is incompatible with the dynamic world we experience.\"},\"quantumResonance\":{\"concept\":\"Conservation vs. Transformation — Inherent Nature Would Block Change\",\"score\":52,\"strength\":\"Medium\",\"explanation\":\"Physics: conserved quantities don't change; specific forms transform. V.17: if existence were inherent nature, things couldn't change. Both: unchangeable nature ≠ dynamic reality. Change requires the absence of inherent nature.\",\"caveat\":\"Conservation is physics. V.17 is about svabhāva. The parallel is about unchangeability blocking dynamism.\"},\"animation\":{\"visualBridge\":\"An \\\"inherently existent\\\" object frozen in time — unable to change, age, or cease. Everything around it changes while it remains static. Caption: \\\"Inherent existence = permanence = no change.\\\"\",\"educationalGoal\":\"User sees: inherent existence means permanence. If things inherently existed, they could never change or cease. Since change happens, inherent existence is impossible.\"},\"deeperDive\":[{\"q\":\"Why does inherent existence imply permanence?\",\"a\":\"Inherent nature (svabhāva) is by definition: independent, self-sufficient, unchangeable. If existence is X's inherent nature, X ALWAYS exists — because inherent nature can't change. Inherent existence → permanent existence → no destruction.\",\"realLifeExample\":\"If \\\"being round\\\" is a ball's inherent nature, it can never become flat. But balls DO flatten (deflate). So \\\"roundness\\\" isn't the ball's inherent nature.\"},{\"q\":\"Why can't inherent nature change?\",\"a\":\"If inherent nature could change, it wasn't really \\\"inherent\\\" — it was conditioned and dependent. True inherent nature (svabhāva) is unconditional and independent. Change implies dependence on conditions. Inherent = unconditional = unchangeable.\",\"realLifeExample\":\"If your \\\"inherent\\\" hair color keeps changing, it's not really inherent — it's conditioned (by aging, dye, etc.). True inherent properties can't change.\"},{\"q\":\"What does this imply for the universe?\",\"a\":\"If anything were inherently existent, the universe would have elements that could never change. But physics shows everything is in flux: particles decay, stars die, atoms transform. Nothing is permanently fixed. Universal change → universal emptiness.\",\"realLifeExample\":\"Even mountains erode. Even stars explode. If inherent existence existed, SOMETHING would be permanent. But nothing is. Universal impermanence = universal emptiness.\"},{\"q\":\"How does this relate to v.4 (impermanence)?\",\"a\":\"V.4: impermanence connects becoming and destruction. V.17: inherent existence would block destruction (permanence). Together: impermanence (v.4) contradicts inherent existence (v.17). Since impermanence is observed, inherent existence is impossible.\",\"realLifeExample\":\"V.4: everything that starts eventually ends. V.17: inherent things could never end. Since things DO end (v.4), they're not inherent (v.17). Impermanence disproves inherent existence.\"},{\"q\":\"What is the significance for the conclusion?\",\"a\":\"V.17 provides a key argument for the concluding section: inherent existence is incompatible with the observed world of change. This is a POSITIVE argument for emptiness: the world changes, therefore things are empty. Change proves emptiness.\",\"realLifeExample\":\"The fact that you're aging right now proves you don't inherently exist (as a fixed entity). Change is the evidence; emptiness is the conclusion.\"},{\"q\":\"How does this connect to the broader MMK?\",\"a\":\"The argument \\\"svabhāva → nitya\\\" (inherent nature → permanence) is used throughout the MMK as a fundamental tool. It appears in Ch.13 (emptiness), Ch.15 (existence/non-existence), Ch.20 (causation), and now Ch.21. It's one of Madhyamaka's most powerful arguments.\",\"deeper\":\"V.17 states the core Madhyamaka principle: svabhāva → nitya (inherent nature → permanence). This is the MASTER ARGUMENT of the MMK: if anything had inherent nature, it would be permanent (because inherent nature can't change). Since nothing is permanent (impermanence is universal), nothing has inherent nature (everything is empty). V.17 applies this to becoming/destruction: inherent existence → permanent existence → no destruction. Since destruction occurs, existence isn't inherent. This argument is used across multiple chapters and is arguably the single most important logical tool in Madhyamaka philosophy.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why does inherent existence block destruction?\",\"options\":[\"A) It doesn't\",\"B) Inherent nature = unchangeable. If existence is inherent, it can't change to non-existence. Inherent things are permanent — they can never be destroyed.\",\"C) Inherent things sometimes change\",\"D) Destruction is inherent\"],\"correct\":\"B\",\"explanation\":\"Inherent nature is unchangeable by definition. Inherent existence → permanent existence → no destruction possible.\"},\"intermediate\":{\"question\":\"How does change prove emptiness?\",\"options\":[\"A) It doesn't\",\"B) Inherent existence → permanence (no change). Change is observed → inherent existence is false → things are empty. Universal change → universal emptiness. Change is the evidence; emptiness is the conclusion.\",\"C) Change proves existence\",\"D) Emptiness prevents change\"],\"correct\":\"B\",\"explanation\":\"Inherent → permanent. Change observed → not inherent → empty. Impermanence is the empirical evidence for emptiness.\"},\"advanced\":{\"question\":\"How is \\\"svabhāva → nitya\\\" the master argument?\",\"options\":[\"A) It isn't\",\"B) It appears across the MMK (Chs.13, 15, 20, 21): inherent nature → permanence. Since impermanence is universal, inherent nature is universally absent → everything is empty. One argument, universally applied, proving emptiness of all phenomena.\",\"C) Only works once\",\"D) Permanence is possible\"],\"correct\":\"B\",\"explanation\":\"Master argument: inherent nature → permanence. Universal impermanence → universal emptiness. One principle, universal application.\"}},\"verseText\":\"If things existed inherently, they could not become non-existent. For an inherent nature could never change into something else.\",\"madhyamakaConcept\":\"Bhāva svabhāvataḥ santi cet (if things inherently existed), na abhāva bhavet (they could not become non-existent). Svabhāva anyathā na bhavati (inherent nature never changes into something else). This is the core argument: svabhāva → nitya (inherent nature → permanence).\",\"quantumPhysicsParallel\":\"Conservation laws vs. transformation: in physics, conserved quantities (like total energy) never change. But specific forms DO transform — kinetic becomes potential, etc. If a specific FORM were \\\"inherently conserved\\\" (svabhāva), it could never transform. Like v.17: inherent existence blocks change.\"}},\"isShowcase\":false,\"chapterId\":21}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"t

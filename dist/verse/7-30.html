176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":7,\"verseId\":30,\"chapterTitle\":\"Examination of Arising, Abiding, and Ceasing\",\"totalVerses\":34,\"verseData\":{\"id\":\"v7_30\",\"number\":30,\"title\":\"Existence and Cessation Incompatible\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"For an existent thing Cessation is not tenable. A single thing being an entity and A nonentity is not tenable.\"},\"philosophy\":{\"insight\":\"An inherently existent thing cannot cease — because cessation would require it to be BOTH existent (its inherent nature) AND non-existent (having ceased) simultaneously. This is a flat contradiction. Inherent existence and change are incompatible.\",\"madhyamaka\":\"If a thing exists inherently (with unchanging essence), it cannot undergo cessation without being simultaneously existent and non-existent — violating the principle of non-contradiction. Inherent existence is incompatible with ANY change.\",\"quantum\":\"The principle of non-contradiction is foundational in physics and logic. A quantum state can be in superposition, but upon measurement, it's definitively one outcome or another. Inherent existence (like a definite measurement outcome) cannot be both present and absent.\",\"bridge\":\"Both Nāgārjuna and classical logic insist that contradictory properties (existence and non-existence) cannot simultaneously apply to the same thing in the same respect. If something truly IS (inherently), it cannot also NOT BE.\",\"accessible\":\"Can something be truly permanent and also cease to exist? No — that's a flat contradiction. It's like saying a circle is simultaneously a square. Inherent existence and cessation are logically incompatible.\",\"twoTruths\":\"Conventionally, things exist AND eventually cease — no contradiction because conventional existence isn't inherent/permanent. The contradiction arises only when we insist on INHERENT existence, which is by definition unchanging.\",\"commonMisconception\":\"NOT saying things can't both exist and later cease. Saying inherently existent things (with unchanging essence) can't cease. Since things DO cease, they aren't inherently existent.\"},\"quantumResonance\":{\"concept\":\"Principle of Non-Contradiction\",\"score\":65,\"strength\":\"Medium\",\"explanation\":\"An entity cannot simultaneously possess contradictory properties (existing and not-existing). Nāgārjuna uses this to show inherent existence is incompatible with cessation.\",\"caveat\":\"The principle of non-contradiction is a logical principle, not specifically quantum. Quantum superposition doesn't violate it — it's the measurement outcome that's definite.\"},\"animation\":{\"visualBridge\":\"A solid object labeled \\\"Inherently Existent\\\" that cannot be erased or removed — cessation arrows bounce off it. Inherent existence is a barrier to change.\",\"educationalGoal\":\"User sees that inherent existence, taken seriously, means eternal unchangeability — proving it's incompatible with the observed world.\"},\"deeperDive\":[{\"q\":\"Why can't an inherently existent thing cease?\",\"a\":\"Inherent existence means having an unchanging, essential nature. Cessation is a change from existence to non-existence. For an inherently existent thing to cease, it would have to simultaneously BE (its inherent nature) and NOT BE (having ceased) — a contradiction.\",\"realLifeExample\":\"A \\\"permanently open\\\" store can't be closed. If its being-open is inherent, closing it contradicts its nature.\"},{\"q\":\"What does \\\"entity and nonentity\\\" mean?\",\"a\":\"\\\"Entity\\\" (bhāva) means having inherent existence. \\\"Nonentity\\\" (abhāva) means having inherent non-existence. The verse says a single thing cannot be both — it can't inherently exist AND inherently not-exist simultaneously.\",\"realLifeExample\":\"A light switch can't be simultaneously ON and OFF. It's one or the other at any given moment.\"},{\"q\":\"How does this apply to conventional cessation?\",\"a\":\"Conventional cessation works perfectly because conventional existence isn't inherent. A candle flame \\\"exists\\\" dependently (on wax, wick, oxygen) and \\\"ceases\\\" when conditions change. No contradiction because conventional existence is already conditional.\",\"realLifeExample\":\"An employee \\\"exists\\\" (in the company) through the employment contract. When the contract ends, the employee \\\"ceases\\\" (leaves). No contradiction — the existence was always conditional.\"},{\"q\":\"Does quantum superposition violate non-contradiction?\",\"a\":\"No. In superposition, a system is in a state that isn't yet definitively one value or another — it's not \\\"simultaneously cat alive AND cat dead\\\" but rather in a state that hasn't resolved yet. Upon measurement, the outcome is definite. The principle of non-contradiction applies to definite properties.\",\"realLifeExample\":\"A coin spinning in the air isn't \\\"simultaneously heads and tails\\\" — it's spinning, not yet resolved. When it lands, it's definitively one or the other.\"},{\"q\":\"How does this verse connect to Chapter 15 (Examination of Essence)?\",\"a\":\"Chapter 15 will argue extensively that svabhāva (inherent existence/essence) is incompatible with change, origination, and cessation. This verse anticipates that argument: if something has inherent existence, it can never change.\",\"realLifeExample\":\"A character whose defining trait is \\\"immortal\\\" can't die in the story without a plot contradiction. The inherent property prevents the change.\"},{\"q\":\"What is Nāgārjuna's implicit argument for emptiness here?\",\"a\":\"Since things DO change and cease (undeniable empirical fact), and inherent existence is incompatible with change (logical argument), things must NOT have inherent existence. They must be empty (śūnya). Emptiness is the condition that PERMITS change.\",\"deeper\":\"This is modus tollens: IF inherent existence THEN no cessation. Cessation occurs. THEREFORE no inherent existence. The logical structure is rigorous and devastating.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can't an inherently existent thing cease?\",\"options\":[\"A) It's too powerful\",\"B) Cessation would require it to be both existent and non-existent simultaneously — a contradiction\",\"C) Only small things can cease\",\"D) Cessation is an illusion\"],\"correct\":\"B\",\"explanation\":\"Inherent existence means unchanging essence. Cessation requires changing from existent to non-existent. Both at once is a logical contradiction.\"},\"intermediate\":{\"question\":\"How does conventional cessation avoid this contradiction?\",\"options\":[\"A) It doesn't — conventional cessation is also contradictory\",\"B) Conventional existence is condition-dependent, not inherent, so cessation just means conditions changed\",\"C) Conventional things don't really exist\",\"D) The contradiction is acceptable conventionally\"],\"correct\":\"B\",\"explanation\":\"Conventional existence is already conditional. When conditions change, the thing ceases. No contradiction because the existence was never inherent or permanent.\"},\"advanced\":{\"question\":\"What logical form does Nāgārjuna's argument take?\",\"options\":[\"A) Simple assertion\",\"B) Modus tollens: IF inherent existence THEN no cessation; cessation occurs; THEREFORE no inherent existence\",\"C) Circular reasoning\",\"D) Argument from authority\"],\"correct\":\"B\",\"explanation\":\"Nāgārjuna proves: (1) inherent existence is incompatible with cessation, (2) cessation occurs, (3) therefore inherent existence is false. This is rigorous modus tollens.\"}},\"verseText\":\"For an existent thing Cessation is not tenable. A single thing being an entity and A nonentity is not tenable.\",\"madhyamakaConcept\":\"If a thing exists inherently (with unchanging essence), it cannot undergo cessation without being simultaneously existent and non-existent — violating the principle of non-contradiction. Inherent existence is incompatible with ANY change.\",\"quantumPhysicsParallel\":\"The principle of non-contradiction is foundational in physics and logic. A quantum state can be in superposition, but upon measurement, it's definitively one outcome or another. Inherent existence (like a definite measurement outcome) cannot be both present and absent.\"}},\"isShowcase\":false,\"chapterId\":7}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\

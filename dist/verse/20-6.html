176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":20,\"verseId\":6,\"chapterTitle\":\"Examination of Cause and Effect (Saṃbhava)\",\"totalVerses\":24,\"verseData\":{\"id\":\"v20_6\",\"number\":6,\"title\":\"If the Cause Ceases Before Producing, the Effect Is Uncaused\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If the cause, not yet having Produced its effect, ceased, Then having arisen from a ceased cause, The effect would be without a cause.\"},\"philosophy\":{\"insight\":\"Second temporal problem: if the cause INHERENTLY CEASES before producing the effect, the effect arises from something that no longer exists — which is no different from arising from nothing. The effect would be causeless (ahetuka), contradicting dependent origination and the opponent's own position.\",\"madhyamaka\":\"Hetu phale akṛte niruddha cet (if the cause ceased without producing the effect), niruddha-hetu-utpanna phala ahetuka (the effect, arising from a ceased cause, would be without a cause). Inherent cessation = complete annihilation (uccheda). From complete annihilation, nothing can arise.\",\"quantum\":\"Temporal causality principle: in physics, effects follow causes — a cause that has completely ceased (been annihilated) before the effect can't produce it. Like v.6: inherent cessation before production means no causal link remains.\",\"bridge\":\"Both v.6 and physics maintain that causes must exist in some relation to their effects. Physics: cause temporally precedes but overlaps with effect. V.6: if the cause COMPLETELY ceases (inherently) before the effect, no link remains. Both: complete prior cessation eliminates causation.\",\"accessible\":\"If the seed completely rots away before the sprout appears, the seed can't be the cause — it's gone! The sprout would arise from nothing. For the seed to cause the sprout, there must be some continuity between them.\",\"twoTruths\":\"Conventionally: causes DO conventionally cease before effects fully manifest (the striking ceases before the flame is established). Ultimately: this conventional cessation isn't INHERENT annihilation — it's a conventional transition within dependent arising.\",\"commonMisconception\":\"NOT saying causes must persist alongside their effects forever. Conventional cessation is fine. What's denied is INHERENT cessation (complete annihilation) before the effect — which would sever the causal link entirely.\"},\"quantumResonance\":{\"concept\":\"Temporal Causality — Effects Follow Existing Causes\",\"score\":48,\"strength\":\"Medium\",\"explanation\":\"Physics requires causal continuity — causes that are completely annihilated can't produce effects. V.6: inherent cessation before production = causeless effect. Both: some form of continuity is required for causation.\",\"caveat\":\"Temporal causality is a physics principle. V.6 is about inherent cessation. The parallel is about the need for causal continuity.\"},\"animation\":{\"visualBridge\":\"A cause (seed) disintegrating completely — then an effect (sprout) appearing from empty ground. Caption: \\\"No cause remains → no causal connection → effect is causeless.\\\" The gap between complete cessation and arising highlights the problem.\",\"educationalGoal\":\"User sees: inherent cessation before production severs the causal link. Causeless effects are absurd.\"},\"deeperDive\":[{\"q\":\"Why is inherent cessation = annihilation?\",\"a\":\"Inherent cessation means the cause COMPLETELY ceases to exist in every way — not just transforming but utterly vanishing. If something inherently ceases, it's absolutely gone — no trace, no continuity. From absolute nothing, nothing can arise.\",\"realLifeExample\":\"If a bridge is COMPLETELY destroyed (every atom scattered), nothing can cross it. Inherent cessation = complete destruction of the bridge between cause and effect.\"},{\"q\":\"Don't causes normally cease before effects?\",\"a\":\"Conventionally, yes — the striking of the match ceases before the fire is fully established. But this conventional cessation involves CONTINUITY: the striking transfers energy to the match head, which ignites. There's no moment of complete annihilation followed by causeless arising. V.6 targets the INHERENT version.\",\"realLifeExample\":\"A relay runner hands the baton to the next runner. The first runner \\\"ceases\\\" running, but the baton provides continuity. Inherent cessation would be: the first runner AND baton vanish, then the second runner starts with a new baton from nowhere.\"},{\"q\":\"How does this differ from v.5?\",\"a\":\"V.5: cause ceases AFTER producing (double nature problem). V.6: cause ceases BEFORE producing (causeless effect problem). Together: inherent cessation fails whether before or after production. The cause can't inherently cease at any point without contradiction.\",\"realLifeExample\":\"Two problems with a delivery driver: (1) Arriving after delivery is already done (v.5 — redundant). (2) Disappearing before delivery is made (v.6 — undelivered). Neither works for inherent delivery.\"},{\"q\":\"What is the relationship to annihilationism?\",\"a\":\"Annihilationism (ucchedavāda): things completely cease with no continuity. V.6 shows that if CAUSES are subject to annihilationism (complete cessation), effects can't arise — undermining dependent origination itself. The Middle Way avoids both eternalism (v.5's permanent cause) and annihilationism (v.6's ceased cause).\",\"realLifeExample\":\"If people completely ceased at death (annihilationism), karma couldn't produce results in future lives. V.6 applies this problem to causation generally: complete cessation severs the causal link.\"},{\"q\":\"How does emptiness resolve this?\",\"a\":\"Emptiness: causes don't inherently exist, so they don't inherently cease. They conventionally cease — not as complete annihilation but as a transformation within the continuous process of dependent arising. Conventional continuity without inherent persistence or inherent annihilation.\",\"realLifeExample\":\"A wave \\\"ceases\\\" when it reaches the shore — but the water continues. The wave didn't inherently exist, so it doesn't inherently cease. The ocean (dependent arising) continues. Same for causes.\"},{\"q\":\"How do vv.5-6 establish a dilemma?\",\"a\":\"V.5: cause ceases after production → double nature (contradiction). V.6: cause ceases before production → causeless effect (absurd). Either way: inherent cessation of causes is problematic. V.7 will examine simultaneous cause-effect, and v.8 will examine effect-before-cause.\",\"deeper\":\"VV.5-6 form a neat dilemma about the temporal relationship between inherent cause-cessation and effect-production. After (v.5): the cause has two natures. Before (v.6): the effect is causeless. Neither works. This parallels Ch.7's analysis of arising and ceasing: inherent cessation is always problematic because it implies either permanence (the thing can't really cease) or annihilation (it ceases completely). The Middle Way: conventional cessation without inherent cessation.\"}],\"quiz\":{\"beginner\":{\"question\":\"What happens if the cause completely ceases before producing the effect?\",\"options\":[\"A) The effect still arises\",\"B) The effect arises from nothing — causeless. If the cause is completely gone, no causal link remains. Causeless arising is absurd.\",\"C) Another cause takes over\",\"D) The effect was already there\"],\"correct\":\"B\",\"explanation\":\"Complete cessation = no causal link. Effect from nothing = causeless = absurd.\"},\"intermediate\":{\"question\":\"How do vv.5-6 form a dilemma?\",\"options\":[\"A) They don't\",\"B) V.5: cease AFTER production → double nature (contradiction). V.6: cease BEFORE production → causeless effect (absurd). Either way: inherent cessation of causes fails.\",\"C) Only v.5 matters\",\"D) Only v.6 matters\"],\"correct\":\"B\",\"explanation\":\"After = double nature. Before = causeless. Both fail. Inherent cessation is impossible at any point.\"},\"advanced\":{\"question\":\"How does emptiness resolve the cessation problem?\",\"options\":[\"A) It doesn't\",\"B) Causes don't INHERENTLY exist, so they don't INHERENTLY cease. They conventionally cease — as transformations within dependent arising, not as complete annihilation. Conventional continuity without inherent persistence or inherent annihilation. The Middle Way.\",\"C) Causes never cease\",\"D) Cessation is just appearance\"],\"correct\":\"B\",\"explanation\":\"Empty causes conventionally cease without inherent annihilation. Continuity through dependent arising. Neither eternal nor annihilated.\"}},\"verseText\":\"If the cause, not yet having Produced its effect, ceased, Then having arisen from a ceased cause, The effect would be without a cause.\",\"madhyamakaConcept\":\"Hetu phale akṛte niruddha cet (if the cause ceased without producing the effect), niruddha-hetu-utpanna phala ahetuka (the effect, arising from a ceased cause, would be without a cause). Inherent cessation = complete annihilation (uccheda). From complete annihilation, nothing can arise.\",\"quantumPhysicsParallel\":\"Temporal causality principle: in physics, effects follow causes — a cause that has completely ceased (been annihilated) before the effect can't produce it. Like v.6: inherent cessation before production means no causal link remains.\"}},\"isShowcase\":false,\"chapterId\":20}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"conten

c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":1,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_1\",\"number\":1,\"title\":\"The Trilemma of Motion\",\"sanskrit\":{\"text\":\"gataṃ na gamyate tāvad agataṃ naiva gamyate | gatagatād ṛte gamyamānaṃ naiva gamyate ||\",\"transliteration\":\"gataṃ na gamyate tāvad agataṃ naiva gamyate | gatagatād ṛte gamyamānaṃ naiva gamyate\",\"translation\":\"What has been moved is not moving. What has not been moved is not moving. Apart from what has been moved and what has not been moved, Movement cannot be conceived.\"},\"philosophy\":{\"insight\":\"Motion cannot be inherently located in any of three temporal states — the already-moved, the not-yet-moved, or a \\\"currently moving\\\" apart from these. This trilemma opens the chapter's systematic deconstruction of inherent motion.\",\"madhyamaka\":\"Nāgārjuna opens with a trilemma that echoes Zeno's Arrow paradox. Garfield notes this verse establishes the framework for the entire chapter: if we try to locate motion in any static temporal slice, we fail. Kalupahana emphasises that the verse targets the Sarvāstivādin assumption that dharmas in past, present, and future have real existence — if motion existed inherently in any of these, it should be findable there. Siderits/Katsura point out this is a prasaṅga (consequentialist) argument: accepting inherent motion leads to absurdity in all three cases.\",\"quantum\":\"Quantum Zeno Effect: Frequent measurements of a quantum system can freeze its evolution — the system never transitions between states if observed at every instant. This demonstrates that motion cannot be found in static snapshots, precisely paralleling Nāgārjuna's argument.\",\"bridge\":\"Both frameworks reveal that analysing a process into static moments destroys the process. The Quantum Zeno Effect shows that continuous observation (taking \\\"snapshots\\\") prevents quantum evolution. Nāgārjuna shows that analysing motion into past/future/present snapshots makes motion unfindable.\",\"accessible\":\"Try to catch the exact moment a moving arrow is \\\"moving.\\\" At any single instant, the arrow is at one fixed position — indistinguishable from a stationary arrow. So when does it move? Nāgārjuna shows motion slips through the cracks of any static analysis, just as quantum systems freeze when you try to observe them at every moment.\",\"twoTruths\":\"Conventionally, motion is real — people walk, cars drive. Ultimately, motion cannot be located in any static temporal state. The verse reveals ultimate unfindability while conventional motion continues unimpaired.\",\"commonMisconception\":\"This is NOT saying motion doesn't happen. It says motion lacks INHERENT existence — it's a dependently arising process, not a thing findable in temporal snapshots.\"},\"quantumResonance\":{\"concept\":\"Quantum Zeno Effect\",\"score\":91,\"strength\":\"High\",\"explanation\":\"Frequent measurement freezes quantum evolution — motion cannot be found in static snapshots. Direct structural parallel to the trilemma.\",\"caveat\":\"Structural analogy: both show static analysis destroys dynamic processes. Not claiming QM proves Buddhist emptiness.\"},\"animation\":{\"geometry\":\"Arrow on Timeline\",\"anchor\":\"A glowing arrow hovering above a timeline divided into three zones: \\\"Moved\\\" (grey, past), \\\"Moving\\\" (pulsing, present), \\\"Not-Moved\\\" (translucent, future).\",\"texture\":\"Arrow: Luminous cyan with motion blur trail. Timeline: Dark slate with glowing zone boundaries. Past zone: Faded grey. Future zone: Semi-transparent.\",\"mood\":\"Paradoxical, cerebral, suspenseful\",\"colors\":[\"#06B6D4\",\"#94A3B8\",\"#8B5CF6\",\"#1E293B\"],\"orchestration\":{\"start\":\"Arrow hovers motionless above the timeline, positioned between zones.\",\"click\":\"User clicks a zone — arrow snaps there but immediately becomes stationary (no longer \\\"moving\\\"). Text: \\\"Motion not found here.\\\"\",\"reveal\":\"After clicking all three zones, arrow dissolves into a probability cloud spanning the entire timeline. Text: \\\"Motion is the process, not the snapshot.\\\"\"},\"interaction\":{\"click\":\"Click any zone to try to locate motion there — it disappears each time\",\"drag\":\"Drag the arrow along the timeline — it leaves afterimages but never \\\"is\\\" in one place\",\"hover\":\"Hover over zones to see their labels and why motion isn't inherently there\"},\"controls\":{\"rotation\":{\"default\":false,\"speed\":0},\"speed\":{\"default\":60,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Custom trail shader for arrow motion blur (vertex displacement + alpha fade)\",\"InstancedMesh for probability cloud particles when arrow dissolves (1500 pooled)\",\"drei Text for zone labels with animated opacity\",\"Bloom + ChromaticAberration post-processing for zone boundary glow\",\"useSpring for smooth arrow snap-to-zone transitions\"],\"camera\":{\"position\":[0,3,8],\"fov\":50,\"autoRotate\":false},\"fps\":60,\"performanceNotes\":\"\u003c300MB memory, 60 FPS. Timeline is a single plane with UV-mapped zone colours. Arrow uses simple geometry with trail shader.\",\"tripoPrompt\":\"A luminous cyan arrow hovering above a dark timeline divided into three glowing zones, motion blur trails, deep space background, cinematic lighting, 8K.\",\"visualBridge\":\"The arrow's inability to \\\"be moving\\\" in any single zone directly visualises the trilemma — motion is unfindable in static snapshots.\",\"educationalGoal\":\"User realizes motion can't be pinned to any single moment — it's a process, not a snapshot-locatable thing.\"},\"deeperDive\":[{\"q\":\"If motion isn't in the \\\"moved\\\" or \\\"not-moved\\\", does it exist at all?\",\"a\":\"Nāgārjuna isn't denying conventional motion. He's denying that motion can be found as an inherently existing thing within static snapshots of past or future states, or as something separate from the process.\",\"realLifeExample\":\"A movie is made of still frames, but the \\\"motion\\\" in the movie isn't in any single frame. Play them in sequence and motion appears — but pause on any frame and it's gone. Motion is the process, not the snapshot.\"},{\"q\":\"Why can't movement be conceived apart from these states?\",\"a\":\"Because motion is the transition between states. To conceive of motion independent of \\\"moved\\\" and \\\"not-moved\\\" is like conceiving of a journey independent of departure and arrival — it becomes incoherent without reference points.\",\"realLifeExample\":\"Can you describe a \\\"walk\\\" without mentioning where you were and where you went? The walk is the transition, not a separate thing floating independently of starting and ending points.\"},{\"q\":\"How does the Quantum Zeno Effect precisely parallel this verse?\",\"a\":\"The Quantum Zeno Effect (Misra \u0026 Sudarshan, 1977) shows that if you measure a quantum system's state at every instant, it never transitions — it's \\\"frozen\\\" in its initial state. Each measurement finds the system in a definite state (like Nāgārjuna's \\\"moved\\\" or \\\"not-moved\\\"), never in the act of transitioning. Motion only occurs when you stop trying to pin it down to discrete snapshots.\",\"realLifeExample\":\"Checking your phone every 5 seconds to see if someone has started typing a message — your constant checking doesn't help you \\\"catch\\\" the typing. The process happens between observations, not during them.\"},{\"q\":\"Does this relate to Zeno's Arrow paradox?\",\"a\":\"Yes, directly. Zeno argued: at every instant, a flying arrow occupies a single position (like a stationary arrow). If it's stationary at every instant, when does it move? Nāgārjuna makes the same structural argument but for different philosophical purposes — Zeno wanted to deny motion; Nāgārjuna denies inherent existence of motion while accepting conventional motion.\",\"realLifeExample\":\"Take a photo of a runner — in the photo they're frozen. Take another photo — frozen again. The photos never capture \\\"running.\\\" But the runner is clearly running. The running is real conventionally but unfindable as a static thing.\"},{\"q\":\"If motion is empty, how do things actually move?\",\"a\":\"Things move dependently — through the interdependent arising of conditions (force, position, time, observer). Motion is a conventional designation for a pattern of dependent changes, not a self-existing entity that can be isolated from the process.\",\"realLifeExample\":\"A wave in the ocean \\\"moves\\\" across the surface, but no water actually travels from shore to shore. The wave is a pattern of relationships between water particles — it exists dependently, not inherently.\"},{\"q\":\"How does this verse set up the rest of Chapter 2?\",\"a\":\"It establishes the trilemma (moved/not-moved/moving) that structures the entire chapter. Verses 2-11 examine the \\\"currently moving\\\" option. Verses 12-14 examine beginnings. Verses 15-17 examine stationarity. Verses 18-25 examine the mover-motion relationship. All fail to locate inherent motion.\",\"deeper\":\"The chapter mirrors Zeno's paradoxes but with Madhyamaka goals: not to deny motion but to deny svabhāva of motion, mover, and path — establishing their emptiness and thus their dependent reality.\"}],\"quiz\":{\"beginner\":{\"question\":\"According to Nāgārjuna, where can inherent motion be found?\",\"options\":[\"A) In what has already moved\",\"B) In what has not yet moved\",\"C) In none of the three states — it's unfindable as an inherent thing\",\"D) In a separate dimension\"],\"correct\":\"C\",\"explanation\":\"Nāgārjuna shows motion cannot be found inherently in the already-moved (past), not-yet-moved (future), or as something apart from both. Motion is a dependent process, not an inherent entity.\"},\"intermediate\":{\"question\":\"What happens in the Quantum Zeno Effect when a system is measured continuously?\",\"options\":[\"A) It moves faster\",\"B) It freezes — never transitions between states\",\"C) It doubles its energy\",\"D) It becomes entangled\"],\"correct\":\"B\",\"explanation\":\"Continuous measurement \\\"freezes\\\" quantum evolution — the system never transitions. This parallels Nāgārjuna's point: trying to find motion in static snapshots destroys the motion.\"},\"advanced\":{\"question\":\"How does Nāgārjuna's trilemma differ from Zeno's Arrow paradox in purpose?\",\"options\":[\"A) They are identical arguments with identical goals\",\"B) Zeno denied motion entirely; Nāgārjuna denies inherent existence of motion while accepting conventional motion\",\"C) Nāgārjuna agreed with Zeno that nothing moves\",\"D) Zeno was a Buddhist philosopher\"],\"correct\":\"B\",\"explanation\":\"Zeno aimed to prove motion is impossible. Nāgārjuna accepts conventional motion but denies it has svabhāva (inherent existence). The trilemma shows motion is dependently arisen, not inherently real.\"}},\"verseText\":\"What has been moved is not moving. What has not been moved is not moving. Apart from what has been moved and what has not been moved, Movement cannot be conceived.\",\"madhyamakaConcept\":\"Nāgārjuna opens with a trilemma that echoes Zeno's Arrow paradox. Garfield notes this verse establishes the framework for the entire chapter: if we try to locate motion in any static temporal slice, we fail. Kalupahana emphasises that the verse targets the Sarvāstivādin assumption that dharmas in past, present, and future have real existence — if motion existed inherently in any of these, it should be findable there. Siderits/Katsura point out this is a prasaṅga (consequentialist) argument: accepting inherent motion leads to absurdity in all three cases.\",\"quantumPhysicsParallel\":\"Quantum Zeno Effect: Frequent measurements of a quantum system can freeze its evolution — the system never transitions between states if observed at every instant. This demonstrates that motion cannot be found in static snapshots, precisely paralleling Nāgārjuna's argument.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitt

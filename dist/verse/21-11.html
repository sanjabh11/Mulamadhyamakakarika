88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":21,\"verseId\":11,\"chapterTitle\":\"Examination of Becoming and Destruction\",\"totalVerses\":21,\"verseData\":{\"id\":\"v21_11\",\"number\":11,\"title\":\"One Perceives Becoming and Destruction Together Only Through Impaired Vision\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If one thinks one perceives becoming and destruction together, one perceives them only through the confusion of impaired vision.\"},\"philosophy\":{\"insight\":\"The epistemological conclusion: perceiving inherent becoming and destruction as simultaneously existing is a COGNITIVE ERROR — like seeing double with impaired vision. It's not that they coexist; it's that our confused mind PROJECTS coexistence onto what's actually sequential, conventional, and empty.\",\"madhyamaka\":\"Saṃbhava vibhava sahita dṛśyate cet, timira-dṛṣṭi-doṣeṇa (if one sees becoming/destruction together, it's through the defect of impaired vision). Timira = cataract/blurred vision. The \\\"impaired vision\\\" is ignorance (avidyā) — the fundamental misapprehension that projects inherent existence onto conventional phenomena.\",\"quantum\":\"Observer effect: the act of measurement changes what's observed. Our cognitive framework (measurement apparatus) shapes what we \\\"see.\\\" If we observe with inherent-existence assumptions (impaired vision), we see inherent becoming/destruction. If we observe with wisdom (clear vision), we see dependent arising.\",\"bridge\":\"Both the observer effect and v.11 show that observation is framework-dependent. QM: what you see depends on how you measure. V.11: what you \\\"see\\\" (inherent becoming/destruction coexisting) depends on your cognitive framework (impaired or clear). Both: reality is observer-framework-dependent.\",\"accessible\":\"If you have blurry vision, one candle looks like two. The \\\"two candles\\\" don't really coexist — it's your eyes playing tricks. Similarly: inherent becoming and destruction don't really coexist. It's our ignorance \\\"seeing double\\\" — projecting inherent existence onto conventional processes.\",\"twoTruths\":\"The \\\"impaired vision\\\" = ignorance (avidyā), which projects inherent existence. The \\\"clear vision\\\" = wisdom (prajñā), which sees dependent arising. Conventional reality is what's seen by wisdom. Inherent existence is what's projected by ignorance.\",\"commonMisconception\":\"NOT saying becoming/destruction are illusions (in the sense of non-existent). They're conventionally real. The \\\"impairment\\\" is seeing them as INHERENTLY real and simultaneously existent. Clear vision sees them as conventionally real, sequentially related, and empty.\"},\"quantumResonance\":{\"concept\":\"Observer Framework Shapes Observation\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"QM: observation is framework-dependent (measurement shapes outcome). V.11: perceiving inherent becoming/destruction is framework-dependent (ignorance shapes perception). Both: what we \\\"see\\\" depends on our cognitive/observational framework.\",\"caveat\":\"The observer effect is physics. V.11 is about cognitive error. The parallel is about the role of the observational framework in shaping what's perceived.\"},\"animation\":{\"visualBridge\":\"Two scenes: (1) \\\"Impaired vision\\\" — becoming and destruction appear as simultaneous, inherent, overlapping. (2) \\\"Clear vision\\\" — becoming and destruction appear as sequential, conventional, empty. Caption: \\\"Clear the lens, see the truth.\\\"\",\"educationalGoal\":\"User sees: the appearance of coexistence is a cognitive error. Clear vision reveals sequential, conventional, empty processes.\"},\"deeperDive\":[{\"q\":\"What is \\\"impaired vision\\\" (timira)?\",\"a\":\"Timira literally means \\\"cataract\\\" or \\\"eye disease\\\" that causes blurred/double vision. Metaphorically: ignorance (avidyā) — the fundamental cognitive error that projects inherent existence onto empty phenomena. Just as a cataract makes one candle look like two, ignorance makes conventional processes look inherently real.\",\"realLifeExample\":\"Looking through dirty glasses: the world looks smudged. Clean the glasses (remove ignorance), and the world looks clear. The smudges were never in the world — they were on the glasses.\"},{\"q\":\"How does wisdom (prajñā) correct the vision?\",\"a\":\"Wisdom sees things as they actually are: empty, dependently arisen, conventional. Through wisdom, becoming and destruction are seen as SEQUENTIAL conventional processes — not simultaneously existing inherent events. The \\\"double vision\\\" of inherent existence dissolves.\",\"realLifeExample\":\"Learning that the \\\"bent stick in water\\\" is an optical illusion. The stick isn't actually bent — that was your eyes being tricked by refraction. Similarly: becoming/destruction aren't really simultaneous or inherent — that was ignorance playing tricks.\"},{\"q\":\"How does this relate to Buddhist soteriology?\",\"a\":\"This is the PATH in a nutshell: (1) Ignorance → sees inherent existence (impaired vision). (2) Practice → develops wisdom (corrective lens). (3) Wisdom → sees emptiness and dependent arising (clear vision). V.11 connects the philosophical analysis to the practical path of liberation.\",\"realLifeExample\":\"Going to the eye doctor: (1) You have blurry vision (ignorance). (2) You get a prescription (practice). (3) You see clearly (wisdom). The problem was in the seeing, not in the seen.\"},{\"q\":\"How does the observer effect illustrate this?\",\"a\":\"In QM, what you observe depends on your measurement setup. Measure position → you see position. Measure momentum → you see momentum. Similarly: observe with ignorance → you see inherent existence. Observe with wisdom → you see emptiness. The framework shapes the observation.\",\"realLifeExample\":\"Looking at a painting up close (see brushstrokes) vs. from far away (see the image). Same painting, different \\\"visions.\\\" Ignorance is the close-up view; wisdom is the full picture.\"},{\"q\":\"What is the significance of this epistemological turn?\",\"a\":\"VV.1-10 analyzed becoming/destruction ONTOLOGICALLY (what they are). V.11 analyzes EPISTEMOLOGICALLY (how we perceive them). This shows that the problem isn't just in reality but in our COGNITION. We don't just need to understand that becoming/destruction are empty — we need to transform how we perceive.\",\"realLifeExample\":\"Not just knowing the stick isn't bent (intellectual understanding) but SEEING it as straight (perceptual transformation). V.11 calls for transformation of perception, not just intellect.\"},{\"q\":\"How does v.11 conclude the identity section?\",\"a\":\"VV.9-10: identity/difference analysis (ontological). V.11: the epistemological consequence — seeing coexistence is cognitive error. The section moves from analyzing what's real to analyzing what's perceived, connecting the philosophical conclusion to the practical path.\",\"deeper\":\"V.11 is remarkable in the context of Ch.21 because it shifts from ontological analysis to epistemological diagnosis. The shift is philosophically important: Madhyamaka isn't just about what reality IS but about how we PERCEIVE it. Ignorance (avidyā) is the root cause of suffering precisely because it's a perceptual error, not just an intellectual mistake. V.11 connects Ch.21's analysis of becoming/destruction to the Buddhist soteriological project: the goal isn't just to understand emptiness intellectually but to PERCEIVE reality clearly — to replace \\\"impaired vision\\\" with wisdom.\"}],\"quiz\":{\"beginner\":{\"question\":\"What is \\\"impaired vision\\\" in v.11?\",\"options\":[\"A) Physical blindness\",\"B) Ignorance (avidyā) — the cognitive error that projects inherent existence onto conventional phenomena. Seeing becoming/destruction as simultaneously existing and inherently real is like seeing double with a cataract.\",\"C) Wise seeing\",\"D) Normal perception\"],\"correct\":\"B\",\"explanation\":\"Impaired vision = ignorance. Projecting inherent existence onto empty phenomena is a cognitive error, like seeing double.\"},\"intermediate\":{\"question\":\"How does v.11 shift the analysis?\",\"options\":[\"A) It doesn't\",\"B) From ontology (what reality IS) to epistemology (how we PERCEIVE it). The problem isn't just that becoming/destruction are empty — it's that we PERCEIVE them as inherent. Correcting the perception (wisdom) is the practical goal.\",\"C) Only ontology matters\",\"D) Perception is irrelevant\"],\"correct\":\"B\",\"explanation\":\"Ontological analysis → epistemological diagnosis. Not just understanding emptiness but perceiving it. The shift connects analysis to practice.\"},\"advanced\":{\"question\":\"How does v.11 connect to Buddhist soteriology?\",\"options\":[\"A) No connection\",\"B) Ignorance → impaired vision → perceives inherent existence → suffering. Practice → wisdom → clear vision → perceives emptiness → liberation. V.11 connects the philosophical analysis of becoming/destruction to the practical path of liberation through perceptual transformation.\",\"C) Only philosophy matters\",\"D) Liberation is separate\"],\"correct\":\"B\",\"explanation\":\"The perceptual error (ignorance) causes suffering. Correcting it (wisdom) leads to liberation. V.11 bridges philosophy and practice.\"}},\"verseText\":\"If one thinks one perceives becoming and destruction together, one perceives them only through the confusion of impaired vision.\",\"madhyamakaConcept\":\"Saṃbhava vibhava sahita dṛśyate cet, timira-dṛṣṭi-doṣeṇa (if one sees becoming/destruction together, it's through the defect of impaired vision). Timira = cataract/blurred vision. The \\\"impaired vision\\\" is ignorance (avidyā) — the fundamental misapprehension that projects inherent existence onto conventional phenomena.\",\"quantumPhysicsParallel\":\"Observer effect: the act of measurement changes what's observed. Our cognitive framework (measurement apparatus) shapes what we \\\"see.\\\" If we observe with inherent-existence assumptions (impaired vision), we see inherent becoming/destruction. If we observe with wisdom (clear vision), we see dependent arising.\"}},\"isShowcase\":false,\"chapterId\":21}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\

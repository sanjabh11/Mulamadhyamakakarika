88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":23,\"verseId\":12,\"chapterTitle\":\"Examination of Error\",\"totalVerses\":25,\"verseData\":{\"id\":\"v23_12\",\"number\":12,\"title\":\"If the Pleasant Is Not Established, How Can Desire Arise?\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If the pleasant is not established, how can desire arise? If the unpleasant is not established, how can hatred arise?\"},\"philosophy\":{\"insight\":\"Drawing the CONSEQUENCE: since pleasant is not established (v.10) → desire can't arise inherently. Since unpleasant is not established (v.11) → hatred can't arise inherently. Empty basis → empty afflictions. The argument culminates.\",\"madhyamaka\":\"Śubha na siddha cet, rāga katham utpadyate (if pleasant not established, how does desire arise?). Aśubha na siddha cet, dveṣa katham (if unpleasant not established, how does hatred arise?). Direct application of the emptiness of bases to the emptiness of afflictions.\",\"quantum\":\"If the measurement basis is undefined, the measurement outcome is undefined. No defined pleasant → no defined desire. No defined unpleasant → no defined hatred.\",\"bridge\":\"Both: undefined basis → undefined result. QM: undefined measurement → undefined outcome. V.12: unestablished pleasant/unpleasant → unestablished desire/hatred.\",\"accessible\":\"If \\\"expensive\\\" isn't established (it's relative), the desire for \\\"bargains\\\" isn't established either. The emotion depends on the evaluation, and the evaluation is empty.\",\"twoTruths\":\"Conventionally: desire and hatred arise. Ultimately: since their bases aren't inherently established, they aren't inherently established either.\",\"commonMisconception\":\"NOT saying desire and hatred don't happen. They CONVENTIONALLY arise. What's denied is INHERENT arising from an inherently established basis.\"},\"quantumResonance\":{\"concept\":\"Undefined Basis → Undefined Outcome\",\"score\":52,\"strength\":\"Medium\",\"explanation\":\"No defined measurement → no defined result. No established pleasant → no established desire. Both: the result inherits the status of its basis.\",\"caveat\":\"Measurement basis is physics. Evaluative basis is psychology.\"},\"animation\":{\"visualBridge\":\"Two pathways: Pleasant→Desire and Unpleasant→Hatred. When Pleasant and Unpleasant dissolve (empty), Desire and Hatred dissolve too. Caption: \\\"Empty basis → empty afflictions.\\\"\",\"educationalGoal\":\"When the evaluative basis is empty, the afflictions arising from it are empty too.\"},\"deeperDive\":[{\"q\":\"How does this follow from vv.10-11?\",\"a\":\"V.10: pleasant not established. V.11: unpleasant not established. V.12 draws the consequence: if pleasant isn't established, desire (which depends on pleasant) can't be established. Same for hatred.\",\"realLifeExample\":\"If \\\"rich\\\" isn't established (it's relative), then \\\"greed for riches\\\" isn't established either. The emotion inherits the status of its basis.\"},{\"q\":\"Does this mean we shouldn't have preferences?\",\"a\":\"No — conventional preferences are fine. V.12 targets INHERENT desire/hatred, not conventional preferences. You can prefer tea to coffee without inherent desire.\",\"realLifeExample\":\"Preferring a sunny day is normal. Inherently HATING rain is the affliction. V.12 targets the latter, not the former.\"},{\"q\":\"What about confusion/error?\",\"a\":\"V.12 addresses desire and hatred explicitly. Confusion (moha) will be addressed in subsequent verses. All three poisons are empty, but the argument proceeds systematically.\",\"realLifeExample\":\"Addressing two of three problems first, then the third. Systematic, not incomplete.\"},{\"q\":\"Practical significance?\",\"a\":\"Seeing that desire arises from an unestablished \\\"pleasant\\\" weakens the desire. \\\"I desire this because it's pleasant\\\" → \\\"But 'pleasant' is relative and unestablished\\\" → desire loosens.\",\"realLifeExample\":\"Craving a food because it's \\\"delicious\\\" → recognizing \\\"delicious\\\" is relative → craving diminishes. Not eliminated, but loosened.\"},{\"q\":\"How does the quantum parallel work?\",\"a\":\"If you can't define the measurement basis (what counts as \\\"position\\\"), you can't define the measurement outcome. Similarly, if you can't establish \\\"pleasant,\\\" you can't establish the desire that depends on it.\",\"realLifeExample\":\"If you can't define \\\"success\\\" (it's relative), you can't inherently establish \\\"desire for success.\\\" The desire is as relative as the definition.\"},{\"q\":\"Significance for Ch.23?\",\"a\":\"V.12 is the PAYOFF of vv.10-11: the emptiness of evaluative categories directly implies the emptiness of afflictions. This completes the core argument of Ch.23.\",\"deeper\":\"V.12 closes the logical chain: V.1 → afflictions depend on evaluations. V.10-11 → evaluations are mutually dependent (empty). V.12 → therefore afflictions are empty. This is the central argument of Ch.23, and it's complete by v.12. The remaining verses (13-25) explore consequences and address objections.\"}],\"quiz\":{\"beginner\":{\"question\":\"If pleasant isn't established, what happens to desire?\",\"options\":[\"A) Still arises inherently\",\"B) Can't arise inherently — desire depends on pleasant, and pleasant is unestablished. Empty basis → empty desire.\",\"C) Becomes stronger\",\"D) Transforms\"],\"correct\":\"B\",\"explanation\":\"Empty pleasant → empty desire. The affliction inherits the status of its basis.\"},\"intermediate\":{\"question\":\"What is the logical chain of vv.1-12?\",\"options\":[\"A) Incomplete\",\"B) V.1: afflictions depend on evaluations. V.10-11: evaluations are mutually dependent (empty). V.12: therefore afflictions are empty. Complete chain.\",\"C) Only two steps\",\"D) No chain\"],\"correct\":\"B\",\"explanation\":\"Three-step chain: dependence → basis empty → dependent empty. Complete.\"},\"advanced\":{\"question\":\"How does v.12 address the central thesis of Ch.23?\",\"options\":[\"A) It doesn't\",\"B) Ch.23 thesis: afflictions are empty. V.12 completes the proof: empty evaluative basis → empty afflictions. The core argument is closed; vv.13-25 address consequences and objections.\",\"C) Only partial\",\"D) Different thesis\"],\"correct\":\"B\",\"explanation\":\"Core argument complete at v.12. Remaining verses: consequences and objections.\"}},\"verseText\":\"If the pleasant is not established, how can desire arise? If the unpleasant is not established, how can hatred arise?\",\"madhyamakaConcept\":\"Śubha na siddha cet, rāga katham utpadyate (if pleasant not established, how does desire arise?). Aśubha na siddha cet, dveṣa katham (if unpleasant not established, how does hatred arise?). Direct application of the emptiness of bases to the emptiness of afflictions.\",\"quantumPhysicsParallel\":\"If the measurement basis is undefined, the measurement outcome is undefined. No defined pleasant → no defined desire. No defined unpleasant → no defined hatred.\"}},\"isShowcase\":false,\"chapterId\":23}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\

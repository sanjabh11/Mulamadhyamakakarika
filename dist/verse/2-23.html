176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":23,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_23\",\"number\":23,\"title\":\"The Twofold Motion Trap Revisited\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"A mover does not carry out a different motion From that by means of which he is manifest as a mover. Moreover, in one mover A twofold motion is unacceptable.\"},\"philosophy\":{\"insight\":\"V.22 showed the identifying and performing motions can't be the same (tautology). V.23 shows they can't be different either — that would require twofold motion in one mover, which v.5 already proved absurd. The mover is trapped: same motion = tautology, different motion = regress.\",\"madhyamaka\":\"Garfield: this verse closes the escape from v.22. If the mover's performed motion DIFFERS from its identifying motion, you get two motions in one mover — the v.5 absurdity. Kalupahana: the verse recapitulates v.5's infinite regress argument in the new identity/difference context. Siderits/Katsura: v.22-23 form a mini-dilemma within the larger v.18-25 section.\",\"quantum\":\"Quantum Identity / Indistinguishability: Identical quantum particles (e.g., two electrons) are fundamentally indistinguishable — you cannot assign separate \\\"identities\\\" or separate \\\"motions\\\" to them. Swapping two identical particles produces no observable difference. The concept of \\\"two separate motions belonging to one entity\\\" has no quantum analogue.\",\"bridge\":\"Both reject multiplicity within a single entity. Identical particles can't have distinguishable separate motions. A single mover can't have two separate motions. The attempt to multiply properties within one entity fails in both frameworks.\",\"accessible\":\"Can you walk two different walks at the same time? Your legs can't do two separate \\\"walkings\\\" simultaneously. One body, one walking. Similarly, one mover can't have two motions — one to be a mover and another to actually move.\",\"twoTruths\":\"Conventionally, motion exists as a functional reality — transportation works. Ultimately, motion depends on mover and path, which depend on motion — the entire structure is empty.\",\"commonMisconception\":\"Emptiness of motion does NOT mean transportation fails. It means the CONCEPT of inherent motion collapses under analysis — while conventional motion continues perfectly.\"},\"quantumResonance\":{\"concept\":\"Quantum Identity / Indistinguishability\",\"score\":83,\"strength\":\"High\",\"explanation\":\"Identical particles can't have distinguishable separate motions or identities. Parallels the impossibility of twofold motion in a single mover.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Splitting Entity Failure\",\"anchor\":\"A single figure attempts to split into two — one for \\\"being a mover\\\" and one for \\\"moving.\\\" The split fails; the figure snaps back. One entity can't perform two separate motions.\",\"texture\":\"Figure: Gold humanoid. Split attempt: Two translucent copies. Snap-back: Elastic flash.\",\"mood\":\"Strained, impossible, conclusive\",\"colors\":[\"#F59E0B\",\"#06B6D4\",\"#EF4444\",\"#1E293B\"],\"orchestration\":{\"start\":\"Single gold figure in center.\",\"click\":\"Click to try splitting — figure stretches into two copies that immediately snap back.\",\"reveal\":\"Text: \\\"One mover, one motion. Twofold motion is impossible.\\\"\"},\"interaction\":{\"click\":\"Click to attempt the split — watch it fail\",\"drag\":\"Drag to try pulling copies apart — elastic resistance\",\"hover\":\"Hover shows: \\\"Identifying motion ≠ Performed motion, but both can't exist\\\"\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.3},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Custom split-morph shader with elastic snap-back\",\"useSpring for stretch and snap animations\",\"drei MeshDistortMaterial for stretch distortion\",\"Bloom post-processing for snap-back flash\",\"drei Html for motion labels\"],\"camera\":{\"position\":[0,2,7],\"fov\":50,\"autoRotate\":false},\"fps\":60,\"performanceNotes\":\"\u003c200MB memory, 60 FPS. Single mesh with morph targets. Very lightweight.\",\"tripoPrompt\":\"A gold humanoid figure stretching into two translucent copies that snap back together, elastic effect, dark space, 8K.\",\"visualBridge\":\"The figure that can't split directly shows that one mover can't sustain two separate motions.\",\"educationalGoal\":\"User understands that the entire motion-mover-path structure is mutually dependent — no element is foundational, paralleling quantum holism.\"},\"deeperDive\":[{\"q\":\"Why can't the mover perform a different motion?\",\"a\":\"If the identifying motion (what makes X a mover) and the performed motion (what X does) are different, then one mover has two motions. V.5 proved twofold motion leads to absurdity: two movers, two subjects, infinite regress.\",\"realLifeExample\":\"If \\\"being a dancer\\\" requires one dance and \\\"actually dancing\\\" requires a different dance, one person needs two dances simultaneously. But you can only dance one dance at a time — the split is impossible.\"},{\"q\":\"How does this connect to v.22?\",\"a\":\"V.22: same motion → tautology. V.23: different motion → twofold motion (absurd per v.5). Together, v.22-23 form a dilemma: whether the identifying and performing motions are same or different, both options fail. The mover-motion relationship can't be inherently established.\",\"realLifeExample\":\"If \\\"being a chef\\\" requires the same cooking as \\\"actually cooking\\\" → tautology. If different cooking → you need to cook twice simultaneously. Neither works.\"},{\"q\":\"What is quantum indistinguishability precisely?\",\"a\":\"Two identical particles (same type, same quantum numbers) are fundamentally indistinguishable — there is no experiment that can tell which is which. Swapping them produces the exact same physical state. The \\\"identity\\\" of each particle is not a separate property — you can't assign \\\"this electron\\\" vs \\\"that electron.\\\"\",\"realLifeExample\":\"Imagine two identical red balls in a box. After shaking, you can't tell which is which. But in quantum mechanics, it's stronger: it's not that you CAN'T tell — it's that there ISN'T a difference. The balls are the same ball in a deep sense.\"},{\"q\":\"Does this verse repeat v.5?\",\"a\":\"It recapitulates v.5's result but in a new context. V.5 showed twofold motion is absurd directly. V.23 uses this result as the second horn of the v.22-23 dilemma. The argument gains force by showing v.5's conclusion applies even when you try to distinguish identifying and performing motions.\",\"realLifeExample\":\"A court ruling cited in a new case isn't \\\"repeated\\\" — it's applied to new facts. V.5's precedent is applied to the new v.22-23 context.\"},{\"q\":\"What are the implications for personal identity?\",\"a\":\"This analysis previews Ch. 18: can the self have two \\\"motions\\\" — one that makes it a self, another that it performs? No. The self can't be established through inherent identity or inherent action. It's dependently designated, like the mover.\",\"realLifeExample\":\"Do you have one \\\"self\\\" for being you and another for doing things? No — your \\\"being\\\" and \\\"doing\\\" aren't two separate selves. You're one integrated (but empty) process.\"},{\"q\":\"How do v.22-23 lead to v.24-25?\",\"a\":\"V.22-23 showed the mover can't be established through motion (same → tautology, different → regress). V.24 will show neither existent nor non-existent movers can move. V.25 delivers the grand conclusion: motion, mover, and path are all empty.\",\"deeper\":\"The chapter spirals inward: each section (v.1-11, v.12-14, v.15-17, v.18-23) leaves fewer escape routes. V.24-25 close the net completely.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why is \\\"twofold motion\\\" in one mover unacceptable?\",\"options\":[\"A) Because two is better than one\",\"B) One mover having two motions leads to absurd consequences — two subjects, infinite regress\",\"C) Because motion doesn't exist\",\"D) It's perfectly acceptable\"],\"correct\":\"B\",\"explanation\":\"V.5 proved that twofold motion implies two movers, two subjects — an infinite regress. One entity can't sustain two separate motions.\"},\"intermediate\":{\"question\":\"What makes identical quantum particles indistinguishable?\",\"options\":[\"A) They look similar\",\"B) There is fundamentally no property that distinguishes them — swapping produces the exact same physical state\",\"C) We just can't see the difference\",\"D) They are in different locations\"],\"correct\":\"B\",\"explanation\":\"Quantum indistinguishability is fundamental — not a measurement limitation. Swapping two identical particles produces no observable difference whatsoever.\"},\"advanced\":{\"question\":\"How do v.22-23 together form a dilemma?\",\"options\":[\"A) They don't form a dilemma\",\"B) Same motion → tautology (v.22); different motion → twofold regress (v.23). Both fail → inherent mover-motion relationship is impossible\",\"C) Only v.22 matters\",\"D) They prove motion exists\"],\"correct\":\"B\",\"explanation\":\"Whether identifying and performing motions are same or different, both lead to absurdity. The dilemma is complete — no inherent relationship between mover and motion can be established.\"}},\"verseText\":\"A mover does not carry out a different motion From that by means of which he is manifest as a mover. Moreover, in one mover A twofold motion is unacceptable.\",\"madhyamakaConcept\":\"Garfield: this verse closes the escape from v.22. If the mover's performed motion DIFFERS from its identifying motion, you get two motions in one mover — the v.5 absurdity. Kalupahana: the verse recapitulates v.5's infinite regress argument in the new identity/difference context. Siderits/Katsura: v.22-23 form a mini-dilemma within the larger v.18-25 section.\",\"quantumPhysicsParallel\":\"Quantum Identity / Indistinguishability: Identical quantum particles (e.g., two electrons) are fundamentally indistinguishable — you cannot assign separate \\\"identities\\\" or separate \\\"motions\\\" to them. Swapping two identical particles produces no observable difference. The concept of \\\"two separate motions belonging to one entity\\\" has no quantum analogue.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum R

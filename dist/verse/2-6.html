c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":6,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_6\",\"number\":6,\"title\":\"Twofold Motion Demands Twofold Subject\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If there were a twofold motion, The subject of that motion would be twofold. For without a subject of motion, There cannot be motion.\"},\"philosophy\":{\"insight\":\"If v.5's two motions each require their own subject, one mover absurdly becomes two movers. Since motion cannot be free-floating (it needs a subject), the entire \\\"motion as property\\\" view collapses.\",\"madhyamaka\":\"Garfield: this verse completes the v.5-6 reductio. Two motions demand two subjects — but we started with one mover. The single mover has been doubled by the analysis, which is absurd. Kalupahana: \\\"without a subject there cannot be motion\\\" is a premise the opponent must accept — motion is always motion OF something. This makes the doubling unavoidable.\",\"quantum\":\"Quantum Non-Separability / Holism: An entangled two-particle system cannot be described as two independent subsystems. The composite state |ψ⟩₁₂ ≠ |ψ⟩₁ ⊗ |ψ⟩₂. Trying to decompose an inseparable whole into independent parts fails — just as decomposing one mover into two subjects fails.\",\"bridge\":\"Both demonstrate that holistic processes resist decomposition into independent components. The entangled state cannot be split into separate particle-states; the mover-motion process cannot be split into separate mover-entities. Forced decomposition generates contradictions.\",\"accessible\":\"If a song has two melodies playing simultaneously, do you need two singers? One person can't be two people. Similarly, if treating motion as a property requires two motions (v.5), and each motion needs its own \\\"mover,\\\" you've absurdly turned one person into two.\",\"twoTruths\":\"Conventionally, one person performs many activities without becoming multiple people. Ultimately, if motion were an inherent separable property, decomposition into multiple subjects would be unavoidable.\",\"commonMisconception\":\"This is NOT about literal multiplication of persons. It shows that treating motion as a separable property forces absurd consequences — proving motion is not separable.\"},\"quantumResonance\":{\"concept\":\"Quantum Non-Separability / Holism\",\"score\":85,\"strength\":\"High\",\"explanation\":\"Entangled systems cannot be decomposed into independent subsystems. Parallels the impossibility of decomposing one mover into two subjects.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Splitting Mover\",\"anchor\":\"A single glowing figure that attempts to split into two — but the two halves flicker, glitch, and snap back together. They cannot sustain separation.\",\"texture\":\"Original figure: Solid violet. Split halves: Translucent, flickering, with static noise at the separation line.\",\"mood\":\"Absurd, glitchy, impossible\",\"colors\":[\"#8B5CF6\",\"#EF4444\",\"#06B6D4\",\"#1E293B\"],\"orchestration\":{\"start\":\"Single solid figure stands with one motion trail.\",\"click\":\"Click to attempt the split — figure divides into two ghostly halves, each with its own motion trail. They flicker unstably.\",\"reveal\":\"After 3 seconds, halves snap back together. Text: \\\"One mover cannot become two. The decomposition fails.\\\"\"},\"interaction\":{\"click\":\"Click to attempt splitting the mover — watch it fail\",\"drag\":\"Rotate to see the glitch from different angles\",\"hover\":\"Hover shows the \\\"two motions\\\" that forced the split\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.3},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Custom split shader with noise-based separation line\",\"InstancedMesh for flickering ghost halves\",\"Bloom + Glitch post-processing for instability effect\",\"useSpring for snap-back animation\",\"drei Billboard for floating \\\"Motion₁\\\" / \\\"Motion₂\\\" labels\"],\"camera\":{\"position\":[0,2,7],\"fov\":50,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c300MB memory, 60 FPS. Single mesh with split shader. Ghost halves are lightweight copies.\",\"tripoPrompt\":\"A glowing violet humanoid figure splitting into two translucent halves that flicker and snap back together, glitch effects, dark space, 8K.\",\"visualBridge\":\"The figure's inability to sustain splitting directly shows the absurdity of decomposing one mover into two subjects.\",\"educationalGoal\":\"User sees that decomposing a holistic process into independent parts generates absurdity — just as entangled quantum states resist decomposition.\"},\"deeperDive\":[{\"q\":\"Why does twofold motion imply a twofold subject?\",\"a\":\"Motion requires a subject — something that moves. If v.5's analysis produced two distinct motions, each needs its own subject. But we started with ONE mover. So one entity has been absurdly doubled into two.\",\"realLifeExample\":\"If a single employee somehow had two different jobs simultaneously, would they be two employees? No — but the payroll system would have to treat them as two, creating an absurd duplication of one person.\"},{\"q\":\"Why can't motion exist without a subject?\",\"a\":\"Because \\\"motion\\\" is always the motion OF something. You can't have running without a runner, spinning without a spinner. Motion is inherently relational — it describes what a subject does, not a free-floating entity.\",\"realLifeExample\":\"Can you have a \\\"grin\\\" without a face? Lewis Carroll's Cheshire Cat joke plays on this absurdity. A grin needs something to grin. Motion needs something to move.\"},{\"q\":\"How does quantum non-separability illustrate this?\",\"a\":\"An entangled pair of particles shares a quantum state that cannot be written as a product of individual states: |ψ⟩₁₂ ≠ |ψ⟩₁ ⊗ |ψ⟩₂. Trying to describe each particle independently fails — the system is holistic. Similarly, trying to decompose the mover-motion relationship into independent parts generates contradictions.\",\"realLifeExample\":\"A marriage is a shared relationship, not two separate \\\"marriage-halves.\\\" You can't fully describe one spouse's marriage without referencing the other. The relationship is non-decomposable.\"},{\"q\":\"Is this a formal logical argument?\",\"a\":\"Yes. Premise 1: Motion requires a subject (granted by opponent). Premise 2: Two motions exist (from v.5). Conclusion: Two subjects exist. But only one mover was posited. Contradiction. Therefore, the original assumption (motion inheres in the mover as a property) is false.\",\"realLifeExample\":\"If every shadow needs an object, and you claim there are two shadows, there must be two objects. But if there's only one tree casting those shadows, something has gone wrong with your shadow theory.\"},{\"q\":\"What does \\\"holism\\\" mean in quantum mechanics?\",\"a\":\"Quantum holism means composite systems have properties that don't reduce to properties of their parts. The whole is MORE than the sum of its parts — or rather, the parts don't have independent properties to sum. This is experimentally verified by Bell inequality violations.\",\"realLifeExample\":\"The taste of a dish isn't the \\\"sum\\\" of individual ingredient tastes. Chocolate and chilli together create a flavour that neither has alone. The combination is irreducible — holistic.\"},{\"q\":\"How does this verse complete the v.3-6 argument arc?\",\"a\":\"V.3: \\\"mover\\\" is context-dependent. V.4: inherent motion contradicts observed non-motion. V.5: treating motion as a property creates twofold motion. V.6: twofold motion creates twofold subject — absurd. The arc demolishes the opponent's v.2 claim that motion is \\\"in the moving.\\\"\",\"deeper\":\"The v.3-6 sequence is Nāgārjuna's strongest argument block in Chapter 2, establishing three independent lines of attack (circularity, contradiction, regress) against inherent motion.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why is it absurd for one mover to become two subjects?\",\"options\":[\"A) Because two is better than one\",\"B) Because we started with ONE mover — the analysis has doubled it, which is contradictory\",\"C) Because subjects don't move\",\"D) Because motion needs three subjects\"],\"correct\":\"B\",\"explanation\":\"The analysis started with one mover but required two motions (v.5), each needing its own subject — absurdly turning one into two.\"},\"intermediate\":{\"question\":\"What does quantum non-separability mean for entangled particles?\",\"options\":[\"A) They can be described independently\",\"B) Their composite state cannot be decomposed into independent individual states\",\"C) They don't interact\",\"D) They have identical properties\"],\"correct\":\"B\",\"explanation\":\"Entangled particles share a holistic quantum state that cannot be written as a product of separate states. The system resists decomposition, just as the mover resists being split into two subjects.\"},\"advanced\":{\"question\":\"What three lines of attack does the v.3-6 sequence establish against inherent motion?\",\"options\":[\"A) Historical, scientific, religious\",\"B) Circularity (v.3), contradiction with non-motion (v.4), infinite regress leading to subject-doubling (v.5-6)\",\"C) Only one argument repeated three times\",\"D) None — the argument fails\"],\"correct\":\"B\",\"explanation\":\"V.3 shows circularity between mover and motion. V.4 shows inherent motion contradicts observed stationarity. V.5-6 show treating motion as a property creates regress and subject-doubling. Three distinct, devastating arguments.\"}},\"verseText\":\"If there were a twofold motion, The subject of that motion would be twofold. For without a subject of motion, There cannot be motion.\",\"madhyamakaConcept\":\"Garfield: this verse completes the v.5-6 reductio. Two motions demand two subjects — but we started with one mover. The single mover has been doubled by the analysis, which is absurd. Kalupahana: \\\"without a subject there cannot be motion\\\" is a premise the opponent must accept — motion is always motion OF something. This makes the doubling unavoidable.\",\"quantumPhysicsParallel\":\"Quantum Non-Separability / Holism: An entangled two-particle system cannot be described as two independent subsystems. The composite state |ψ⟩₁₂ ≠ |ψ⟩₁ ⊗ |ψ⟩₂. Trying to decompose an inseparable whole into independent parts fails — just as decomposing one mover into two subjects fails.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"ro

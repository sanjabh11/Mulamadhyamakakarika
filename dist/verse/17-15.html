88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":17,\"verseId\":15,\"chapterTitle\":\"Examination of Action and Fruit\",\"totalVerses\":33,\"verseData\":{\"id\":\"v17_15\",\"number\":15,\"title\":\"Why Karma Requires Wisdom, Not Just Intention\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"By abandoning, that is not abandoned. Abandonment occurs through meditation. Therefore, through the nonexpired, The fruit of action arises.\"},\"philosophy\":{\"insight\":\"You can't eliminate karma just by WANTING to (abandoning by abandoning). You need meditative cultivation (bhāvanā) — specifically, wisdom (prajñā) that realizes emptiness. Until the root cause is addressed through practice, the \\\"nonexpired\\\" karmic potential continues to ripen. This has profound implications for Buddhist soteriology.\",\"madhyamaka\":\"Na prahāṇena prahīṇa (not abandoned by mere abandoning): willpower alone can't eliminate karma. Bhāvanā (meditative cultivation) — particularly prajñā-bhāvanā (wisdom meditation realizing emptiness) — is required. The avipraṇāśa (nonexpired karmic potential) continues to produce phala (fruit) until the root causes (avidyā, tṛṣṇā) are eradicated through wisdom.\",\"quantum\":\"Quantum state transformation requires specific interactions — you can't change a quantum state just by \\\"deciding\\\" to. You need the right operator (measurement, interaction). Like karma: changing your karmic trajectory requires the right practice (meditation/wisdom), not just intention.\",\"bridge\":\"Both karma and quantum states require specific processes for transformation. QM: a quantum state needs the right operator to change. Buddhism: karma needs the right practice (bhāvanā) to transform. Both: intention alone is insufficient; appropriate process is required.\",\"accessible\":\"Knowing you should exercise doesn't make you fit. You actually have to DO the exercise. Similarly, knowing karma exists doesn't free you from it. You need actual practice — meditation, developing wisdom — to address the root causes. Good intentions without practice = no transformation.\",\"twoTruths\":\"Conventionally, karma operates until addressed through practice. Ultimately, both karma and practice are empty. But the empty practice of realizing emptiness is what dissolves the empty karma. Emptiness operating on emptiness = liberation.\",\"commonMisconception\":\"NOT saying you can never be free from karma. You CAN — through meditative wisdom that realizes emptiness. The point is that mere INTENTION to be free is insufficient. Actual practice (bhāvanā) is required.\"},\"quantumResonance\":{\"concept\":\"Quantum State Transformation Requires Specific Operators\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"Quantum states change through specific interactions (operators), not through \\\"intention.\\\" Like karma: transformation requires the right practice (meditation/wisdom), not just desire to change.\",\"caveat\":\"Quantum operators are mathematical objects. Meditative wisdom is a cognitive/spiritual practice. The parallel is about the necessity of appropriate process for transformation.\"},\"animation\":{\"visualBridge\":\"A person trying to push away a dark cloud (karma) with bare hands (mere intention) — the cloud returns. Then the same person meditating (bhāvanā), generating light (wisdom/prajñā) that dissolves the cloud. The nonexpired potential ripens as fruit until the root is addressed.\",\"educationalGoal\":\"User sees why intention alone can't eliminate karma — meditative wisdom is required. Practice matters, not just knowledge.\"},\"deeperDive\":[{\"q\":\"Why can't mere intention eliminate karma?\",\"a\":\"Because karmic patterns are rooted in DEEP CONDITIONING — habitual tendencies (vāsanā) and fundamental ignorance (avidyā) that operate below the level of conscious intention. A surface-level decision to \\\"let go\\\" doesn't reach these deep roots. Like a weed: pulling the leaves (intention) doesn't kill the root (conditioning).\",\"realLifeExample\":\"Deciding to stop being anxious doesn't work — anxiety has deeper roots (past experiences, neural patterns, beliefs). You need actual therapy/practice to address the root causes. Mere intention is insufficient for deep change.\"},{\"q\":\"What kind of meditation (bhāvanā) is required?\",\"a\":\"Specifically prajñā-bhāvanā — the cultivation of wisdom that directly realizes emptiness. This is the meditation that penetrates to the root of saṃsāra: avidyā (ignorance of emptiness). Other meditations (śamatha, karuṇā) support this but don't directly cut the root.\",\"realLifeExample\":\"To cure a disease, you need the right medication (wisdom = specific treatment), not just general health practices (other meditations = general wellness). General health helps, but the specific cure is essential.\"},{\"q\":\"What is the \\\"nonexpired\\\" (avipraṇāśa)?\",\"a\":\"The karmic \\\"debt\\\" from v.14 — the uncancelled promissory note. Until wisdom eradicates the root causes (ignorance, craving), the karmic potential remains \\\"nonexpired\\\" and continues to produce fruits. It's the conventional persistence of karmic consequence.\",\"realLifeExample\":\"An unpaid student loan: it's \\\"nonexpired\\\" until you either pay it off (fruition) or get it forgiven (wisdom-based liberation). Simply wishing the loan away doesn't work. You need actual repayment or a formal process.\"},{\"q\":\"Does this verse support Buddhist practice?\",\"a\":\"Strongly. It establishes that PRACTICE (bhāvanā) is essential, not just intellectual understanding. This is a key Mādhyamika principle: emptiness must be REALIZED through meditation, not just understood conceptually. Conceptual understanding is necessary but not sufficient.\",\"realLifeExample\":\"Knowing how to swim (intellectual understanding) vs. actually swimming (meditative realization). You can't learn to swim by reading books alone. You must get in the water. V.15 says: \\\"Get in the water — practice, don't just think.\\\"\"},{\"q\":\"How does \\\"the fruit of action arises\\\" connect to the rest?\",\"a\":\"Until wisdom is developed, karmic fruits continue to arise through the nonexpired potential. This explains the ongoing experience of karma within saṃsāra: actions produce consequences that persist until liberation. The \\\"nonexpiring\\\" model (v.14) explains HOW; v.15 explains WHEN it stops (through wisdom).\",\"realLifeExample\":\"Interest on a loan continues accruing (fruits arising) until the principal is paid (root cause addressed). The loan (nonexpired karma) keeps generating interest (fruits) until the debt is resolved (wisdom-liberation).\"},{\"q\":\"What are the soteriological implications?\",\"a\":\"Profound: (1) Mere knowledge of emptiness is insufficient — you must REALIZE it through meditation. (2) Until realization, karma operates normally. (3) The path requires actual PRACTICE, not just study. This grounds the Buddhist path in concrete contemplative work rather than abstract philosophy.\",\"deeper\":\"V.15 connects Nāgārjuna's karma theory directly to Buddhist soteriology (the path to liberation). It bridges the gap between philosophical analysis (vv.1-14) and practical path (v.15). The message: understanding emptiness conceptually (from reading the MMK) isn't enough. You must REALIZE emptiness through bhāvanā (meditative cultivation). This is why the Buddhist path includes both prajñā (wisdom) AND samādhi (meditation) — wisdom must be experientially realized, not just intellectually grasped. V.15 is the most \\\"practice-oriented\\\" verse in Ch.17.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can't you eliminate karma just by wanting to?\",\"options\":[\"A) You can\",\"B) Karmic patterns are rooted in deep conditioning (ignorance, craving) below conscious intention. Only meditative wisdom (bhāvanā/prajñā) reaches these roots. Mere intention is like pulling leaves without removing the root.\",\"C) Karma is permanent\",\"D) Wanting is enough\"],\"correct\":\"B\",\"explanation\":\"Deep conditioning requires deep practice. Surface-level intention can't reach the roots of karma — meditative wisdom is needed.\"},\"intermediate\":{\"question\":\"What is the \\\"nonexpired\\\" (avipraṇāśa)?\",\"options\":[\"A) Nothing\",\"B) The karmic \\\"debt\\\" from v.14 — uncancelled karmic potential that persists conventionally until addressed through wisdom. It continues to produce fruits until the root causes are eradicated.\",\"C) A permanent entity\",\"D) An annihilated action\"],\"correct\":\"B\",\"explanation\":\"The nonexpired = the uncancelled promissory note (v.14). Karmic potential persists conventionally, producing fruits, until wisdom eliminates the root causes.\"},\"advanced\":{\"question\":\"How does v.15 bridge philosophy and practice?\",\"options\":[\"A) It doesn't\",\"B) It connects the philosophical analysis of karma (vv.1-14) to the practical path: conceptual understanding is insufficient — meditative realization (bhāvanā) is required. This grounds Mādhyamika in actual contemplative practice, not just abstract analysis.\",\"C) Only philosophy matters\",\"D) Practice replaces philosophy\"],\"correct\":\"B\",\"explanation\":\"V.15 bridges philosophy and practice: understanding emptiness must be completed by realizing it through meditation. Both are necessary; neither alone is sufficient.\"}},\"verseText\":\"By abandoning, that is not abandoned. Abandonment occurs through meditation. Therefore, through the nonexpired, The fruit of action arises.\",\"madhyamakaConcept\":\"Na prahāṇena prahīṇa (not abandoned by mere abandoning): willpower alone can't eliminate karma. Bhāvanā (meditative cultivation) — particularly prajñā-bhāvanā (wisdom meditation realizing emptiness) — is required. The avipraṇāśa (nonexpired karmic potential) continues to produce phala (fruit) until the root causes (avidyā, tṛṣṇā) are eradicated through wisdom.\",\"quantumPhysicsParallel\":\"Quantum state transformation requires specific interactions — you can't change a quantum state just by \\\"deciding\\\" to. You need the right operator (measurement, interaction). Like karma: changing your karmic trajectory requires the right practice (meditation/wisdom), not just intention.\"}},\"isShowcase\":false,\"chapterId\":17}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural quantum analogies.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"m

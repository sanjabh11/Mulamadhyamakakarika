176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":21,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_21\",\"number\":21,\"title\":\"The Dilemma's Conclusion: Inherent Existence Fails\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"When neither in identity Nor in difference Can they be established, How can these two be established at all?\"},\"philosophy\":{\"insight\":\"The conclusion of the identity/difference dilemma: since motion and mover can be established neither as identical (v.19) nor as different (v.20), they cannot be inherently established at all. Both are empty of svabhāva.\",\"madhyamaka\":\"Garfield: this is the chapter's most important conclusion — the failure of both identity and difference means inherent establishment (svabhāva-siddhi) is impossible for mover and motion. Kalupahana: the verse establishes emptiness not as nihilism but as the failure of inherent existence. They exist conventionally but not inherently. Siderits/Katsura: the dilemma is exhaustive — inherently existing things MUST be either identical or different; since both fail, inherent existence fails.\",\"quantum\":\"Quantum Superposition Transcending Binaries: A qubit exists in state α|0⟩ + β|1⟩ — neither definitively |0⟩ nor |1⟩. It transcends the binary classification entirely. The system cannot be \\\"established\\\" as either value until measured. The binary framework is insufficient to describe quantum reality.\",\"bridge\":\"Both reveal the failure of exhaustive binary classification for fundamental reality. Quantum systems transcend |0⟩ vs |1⟩. Mover-motion transcends identity vs difference. In both cases, the binary that seemed exhaustive proves insufficient — reality is richer than the categories.\",\"accessible\":\"Is light a wave or a particle? Neither answer works fully. The question itself is wrong — light is something that transcends the binary. Similarly, asking \\\"Are motion and mover the same or different?\\\" is the wrong question. They're dependently co-arising — beyond both categories.\",\"twoTruths\":\"Conventionally, motion and mover function together seamlessly. Ultimately, their unity cannot be established as inherent — both are empty, and their relation is too.\",\"commonMisconception\":\"Not saying things fall apart without inherent existence. Things COHERE through dependent arising, not through inherent unity.\"},\"quantumResonance\":{\"concept\":\"Superposition / Binary Transcendence\",\"score\":88,\"strength\":\"High\",\"explanation\":\"Quantum states transcend binary classification — neither definitively one value nor the other. Parallels the failure of both identity and difference for mover-motion.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Collapsing Binary Gate\",\"anchor\":\"A gate with two doors: \\\"IDENTITY\\\" and \\\"DIFFERENCE.\\\" Both doors are tried and both jam (won't open). The gate itself then dissolves, revealing an open landscape beyond — the space of dependent arising.\",\"texture\":\"Gate: Stone, imposing. Identity door: Red, locked. Difference door: Blue, locked. Landscape beyond: Soft golden light, open.\",\"mood\":\"Liberating, conclusive, transcendent\",\"colors\":[\"#EF4444\",\"#3B82F6\",\"#F59E0B\",\"#1E293B\"],\"orchestration\":{\"start\":\"Imposing gate with two closed doors.\",\"click\":\"Click Identity door — locked, shakes. Click Difference door — locked, shakes.\",\"reveal\":\"Gate crumbles and dissolves, revealing golden landscape. Text: \\\"Beyond identity and difference lies dependent arising.\\\"\"},\"interaction\":{\"click\":\"Click each door — both fail to open\",\"drag\":\"Drag on the gate to try forcing it — it crumbles\",\"hover\":\"Hover shows why each door is locked\"},\"controls\":{\"rotation\":{\"default\":false,\"speed\":0},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":60,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Custom dissolution shader for gate crumbling (particle-based fragmentation)\",\"drei Environment with golden HDR for landscape reveal\",\"InstancedMesh for gate fragment particles\",\"Bloom post-processing for golden light reveal\",\"useSpring for door shake and gate dissolution animations\"],\"camera\":{\"position\":[0,2,8],\"fov\":50,\"autoRotate\":false},\"fps\":60,\"performanceNotes\":\"\u003c300MB memory, 60 FPS. Gate mesh with dissolution shader. Landscape is HDR environment.\",\"tripoPrompt\":\"A stone gate with two locked doors (red and blue) crumbling to reveal a golden landscape beyond, dramatic lighting, 8K.\",\"visualBridge\":\"The collapsing gate with both locked doors directly shows that both identity and difference fail — and beyond them lies the open space of dependent arising.\",\"educationalGoal\":\"User sees that coherent function doesn't require inherent existence — quantum systems function perfectly despite lacking classical properties.\"},\"deeperDive\":[{\"q\":\"What does \\\"established\\\" mean here?\",\"a\":\"\\\"Established\\\" (siddha) means proven to have inherent existence — to exist by its own nature, independently, findable under analysis. The verse asks: if neither identity nor difference can be established, how can mover and motion be inherently established at all?\",\"realLifeExample\":\"If you can't prove someone is guilty AND can't prove they're innocent, you can't \\\"establish\\\" their legal status at all. The framework has failed to deliver a verdict.\"},{\"q\":\"Why is the identity/difference dilemma exhaustive?\",\"a\":\"For inherently existing things, there are only two logical possibilities: they are the same thing (identity) or they are different things (difference). There's no third option within essentialism. If both fail, the assumption that generated these options — inherent existence — must be false.\",\"realLifeExample\":\"A coin must land heads or tails (on a fair flip). If neither outcome occurs (it lands on edge), the binary assumption was wrong. Similarly, if neither identity nor difference works, the assumption of inherent existence was wrong.\"},{\"q\":\"How does superposition transcend binaries?\",\"a\":\"A qubit in state α|0⟩ + β|1⟩ is neither definitively |0⟩ nor |1⟩. Asking \\\"is it 0 or 1?\\\" is the wrong question before measurement. The system exists in a mode that the binary can't describe. Similarly, asking \\\"are mover and motion the same or different?\\\" is the wrong question — they exist in a dependent mode that the binary can't capture.\",\"realLifeExample\":\"Is a team \\\"one thing\\\" (the team) or \\\"many things\\\" (the players)? Neither answer is complete. The team is a relational unity — not reducible to either \\\"one\\\" or \\\"many.\\\" The question itself is too simple.\"},{\"q\":\"Does this mean nothing exists?\",\"a\":\"Absolutely not. Conventional existence is preserved. Mover and motion exist conventionally — people walk, cars drive, planets orbit. What's denied is INHERENT existence — existence by own nature, independent, findable under ultimate analysis. The denial of inherent existence IS the affirmation of dependent existence.\",\"realLifeExample\":\"Denying that a rainbow has inherent existence doesn't deny rainbows. It means rainbows exist dependently (on sunlight, water, viewing angle). They're real — just not independently, inherently real.\"},{\"q\":\"How does this conclusion relate to Chapter 24's key verse?\",\"a\":\"Ch. 24:18-19: \\\"Whatever is dependently arisen, that is explained to be emptiness. That, being a dependent designation, is itself the middle way.\\\" The emptiness established here (mover and motion lack inherent existence) IS dependent arising. They're two sides of the same insight.\",\"realLifeExample\":\"Saying \\\"a rainbow has no inherent existence\\\" and \\\"a rainbow arises dependently\\\" are the same statement from two perspectives. Emptiness = dependent arising. That's the middle way.\"},{\"q\":\"How does this verse connect to v.22-25?\",\"a\":\"V.21 establishes the theoretical conclusion. V.22-25 explore its implications: the mover cannot be prior to motion (v.22-23), neither existent nor non-existent movers move (v.24), and the grand conclusion: motion, mover, and path are all empty (v.25).\",\"deeper\":\"V.21 is the theoretical peak; v.22-25 draw out the practical and ontological consequences. The chapter moves from analysis → conclusion → implications.\"}],\"quiz\":{\"beginner\":{\"question\":\"According to verse 21, what happens when both identity and difference fail?\",\"options\":[\"A) We need a third option\",\"B) Motion and mover cannot be inherently established at all — they are empty of svabhāva\",\"C) They are both identical and different\",\"D) The analysis is wrong\"],\"correct\":\"B\",\"explanation\":\"If neither identity nor difference can establish mover and motion, inherent establishment itself fails. They exist conventionally but are empty of inherent existence.\"},\"intermediate\":{\"question\":\"Why can't quantum superposition be described by binary classification?\",\"options\":[\"A) It can be\",\"B) A superposition state is neither definitively |0⟩ nor |1⟩ — the binary framework is insufficient to describe quantum reality\",\"C) Superposition is always |0⟩\",\"D) Superposition is always |1⟩\"],\"correct\":\"B\",\"explanation\":\"Superposition transcends the binary. Before measurement, the system is in a state that can't be captured by \\\"0 or 1?\\\" — just as mover-motion can't be captured by \\\"same or different?\\\"\"},\"advanced\":{\"question\":\"How does the emptiness established in verse 21 relate to dependent arising?\",\"options\":[\"A) They are opposites\",\"B) Emptiness of inherent existence IS dependent arising — they are the same insight from two perspectives (Ch. 24:18-19)\",\"C) Emptiness means non-existence\",\"D) Dependent arising means inherent existence\"],\"correct\":\"B\",\"explanation\":\"As Ch. 24:18-19 states: \\\"Whatever is dependently arisen is emptiness.\\\" The failure of inherent existence (emptiness) is identical to existing dependently (pratītyasamutpāda). Two sides of one coin.\"}},\"verseText\":\"When neither in identity Nor in difference Can they be established, How can these two be established at all?\",\"madhyamakaConcept\":\"Garfield: this is the chapter's most important conclusion — the failure of both identity and difference means inherent establishment (svabhāva-siddhi) is impossible for mover and motion. Kalupahana: the verse establishes emptiness not as nihilism but as the failure of inherent existence. They exist conventionally but not inherently. Siderits/Katsura: the dilemma is exhaustive — inherently existing things MUST be either identical or different; since both fail, inherent existence fails.\",\"quantumPhysicsParallel\":\"Quantum Superposition Transcending Binaries: A qubit exists in state α|0⟩ + β|1⟩ — neither definitively |0⟩ nor |1⟩. It transcends the binary classification entirely. The system cannot be \\\"established\\\" as either value until measured. The binary framework is insufficient to describe quantum reality.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital hum

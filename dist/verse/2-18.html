176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":18,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_18\",\"number\":18,\"title\":\"Neither Identical Nor Different\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"That motion just is the mover itself Is not correct. Nor is it correct that They are completely different.\"},\"philosophy\":{\"insight\":\"The chapter's final section opens with the central Madhyamaka formula: motion and mover are neither identical (ekatva) nor completely different (anyatva). Both extremes fail. This \\\"neither/nor\\\" points to their emptiness and dependent co-arising.\",\"madhyamaka\":\"Garfield: this verse introduces the identity/difference analysis (na ekam na pṛthak) that Nāgārjuna employs throughout the MMK (cf. Ch.10 fire-fuel, Ch.18 self-aggregates, Ch.22 Tathāgata-aggregates). Kalupahana: the verse instantiates the Middle Way — avoiding the extreme of identity (eternalism/one-ness) and the extreme of difference (annihilationism/total separation). Candrakīrti: if identical, agent and action collapse; if different, they become unrelated.\",\"quantum\":\"Entanglement / Non-Separability: Entangled particles are neither identical (they can have different locations, spins) nor completely independent (measuring one instantly constrains the other). Their relationship transcends the classical identity/difference binary — they are non-separable without being the same.\",\"bridge\":\"Both show that fundamental relationships transcend the identity/difference binary. Entangled particles aren't the same particle, yet aren't independent. Motion and mover aren't the same thing, yet aren't unrelated. Both exist in a relational mode that classical categories cannot capture.\",\"accessible\":\"Are you the same as your job? No — you're more than your job. But are you completely separate from your job? No — it shapes your identity, schedule, and life. You're neither identical to nor completely separate from your work. That's Nāgārjuna's point about motion and mover.\",\"twoTruths\":\"Conventionally, we distinguish mover from motion for practical purposes. Ultimately, no real distinction can be drawn — they are mutually constituting aspects of one dependent process.\",\"commonMisconception\":\"Not claiming language is useless. Conventional distinctions WORK for navigation. The point is they don't track inherent, mind-independent divisions.\"},\"quantumResonance\":{\"concept\":\"Entanglement / Non-Separability\",\"score\":90,\"strength\":\"High\",\"explanation\":\"Entangled particles are neither identical nor independent — their relationship transcends the classical binary. Direct structural parallel to the neither-identical-nor-different analysis.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Overlapping-Yet-Distinct Orbs\",\"anchor\":\"Two orbs — one labelled \\\"Motion,\\\" the other \\\"Mover\\\" — partially overlapping like a Venn diagram. The overlap region pulses. Trying to merge them fully or separate them fully fails.\",\"texture\":\"Motion orb: Cyan, translucent. Mover orb: Gold, translucent. Overlap: Pulsing violet. Merge attempt: Red flash. Separate attempt: Elastic snap-back.\",\"mood\":\"Balanced, Middle Way, elegant tension\",\"colors\":[\"#06B6D4\",\"#F59E0B\",\"#8B5CF6\",\"#1E293B\"],\"orchestration\":{\"start\":\"Two partially overlapping orbs with pulsing overlap zone.\",\"click\":\"Click \\\"Merge\\\" button — orbs try to combine but flash red (identity fails). Click \\\"Separate\\\" — they try to pull apart but snap back (difference fails).\",\"reveal\":\"Text: \\\"Neither identical nor different. Both extremes fail. They co-arise dependently.\\\"\"},\"interaction\":{\"click\":\"Try merging or separating — both fail\",\"drag\":\"Drag orbs to try repositioning — overlap adjusts but never vanishes or becomes total\",\"hover\":\"Hover shows relationship labels in the overlap zone\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.3},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Custom intersection shader for overlap zone with pulsing emissive\",\"useSpring for merge/separate attempt animations with bounce-back\",\"Bloom + ChromaticAberration for failure flash effects\",\"drei Float for gentle orbital hover\",\"drei Html for interactive merge/separate buttons\"],\"camera\":{\"position\":[0,0,7],\"fov\":50,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c250MB memory, 60 FPS. Two sphere meshes with intersection shader. Lightweight scene.\",\"tripoPrompt\":\"Two partially overlapping translucent orbs — cyan and gold — with pulsing violet intersection zone, dark space, 8K.\",\"visualBridge\":\"The orbs that can neither fully merge nor fully separate directly show the neither-identical-nor-different relationship of motion and mover.\",\"educationalGoal\":\"User sees that the mover/motion distinction is conventional and useful but not ontologically fundamental — like complementary observables in quantum mechanics.\"},\"deeperDive\":[{\"q\":\"What would it mean for motion and mover to be identical?\",\"a\":\"If identical, there would be no distinction between the agent (mover) and the action (motion). A walker would BE the walking. But then you can't distinguish the person from their activity — which is absurd. Also, one mover couldn't have multiple motions, since mover = motion.\",\"realLifeExample\":\"If a singer IS the singing, the singer ceases to exist when the singing stops. But singers exist between songs. Identity of agent and action is absurd.\"},{\"q\":\"What would complete difference mean?\",\"a\":\"If completely different, mover and motion would have no necessary connection. A mover could exist without ever moving, and motion could exist without any mover. But v.7 showed they're mutually dependent — complete independence is equally absurd.\",\"realLifeExample\":\"If a driver were completely separate from driving, you could have a \\\"driver\\\" who never drives and \\\"driving\\\" without anyone behind the wheel. Both are incoherent.\"},{\"q\":\"How does entanglement transcend identity and difference?\",\"a\":\"Two entangled photons are clearly not the same particle (different locations, different detectors). But they're not independent either — measuring one's polarisation instantly constrains the other's. They exist in a relational mode: distinct yet non-separable. Neither \\\"same\\\" nor \\\"different\\\" captures their relationship.\",\"realLifeExample\":\"Identical twins are not the same person (different bodies, different experiences). But they're not totally independent — they share genetics, often synchronise behaviours. Their relationship transcends simple \\\"same\\\" or \\\"different.\\\"\"},{\"q\":\"Why is this called the \\\"Middle Way\\\"?\",\"a\":\"The Middle Way (madhyamā pratipad) avoids two extremes: eternalism (things have fixed, identical essences) and annihilationism (things are completely disconnected, random). The truth is between: things are dependently related — neither identical nor totally separate.\",\"realLifeExample\":\"Is a river \\\"the same river\\\" you visited last year? Not exactly (different water). But it's not \\\"completely different\\\" either (same banks, same name). The middle way: it's dependently continuous — neither the same nor different.\"},{\"q\":\"Does this formula appear elsewhere in the MMK?\",\"a\":\"Yes — it's Nāgārjuna's signature analytical tool. Ch.10 applies it to fire and fuel. Ch.18 to self and aggregates. Ch.22 to the Tathāgata and aggregates. In each case, neither identity nor difference can be established, revealing emptiness and dependent co-arising.\",\"realLifeExample\":\"The same question applies everywhere: Is a company the same as its employees? No. Is it completely separate? No. The relationship is always \\\"neither/nor\\\" — pointing to dependent co-arising.\"},{\"q\":\"How does this verse set up v.19-21?\",\"a\":\"V.18 states the thesis: neither identical nor different. V.19 shows what goes wrong if they're identical (agent = action). V.20 shows what goes wrong if they're different (independent existence). V.21 concludes: since neither works, both motion and mover are empty of inherent establishment.\",\"deeper\":\"The v.18-21 sequence is a dilemma (not a trilemma): two options, both fail, therefore the premise (inherent existence) is false. This is logically tighter than the trilemma of v.1.\"}],\"quiz\":{\"beginner\":{\"question\":\"According to verse 18, are motion and mover identical or completely different?\",\"options\":[\"A) They are identical\",\"B) They are completely different\",\"C) Neither — both extremes are incorrect\",\"D) Sometimes identical, sometimes different\"],\"correct\":\"C\",\"explanation\":\"Nāgārjuna's Middle Way rejects both identity (they're the same) and complete difference (they're unrelated). Motion and mover are dependently co-arising — neither identical nor separate.\"},\"intermediate\":{\"question\":\"How do entangled particles relate to the identity/difference question?\",\"options\":[\"A) They are identical particles\",\"B) They are completely independent\",\"C) They are neither identical nor independent — distinct yet non-separable, transcending the binary\",\"D) Entanglement has no relation to this\"],\"correct\":\"C\",\"explanation\":\"Entangled particles are different particles (different locations) yet non-separable (correlated measurements). Their relationship transcends the identity/difference binary, paralleling the Middle Way.\"},\"advanced\":{\"question\":\"Where else in the MMK does Nāgārjuna use the neither-identical-nor-different analysis?\",\"options\":[\"A) Nowhere — it's unique to Chapter 2\",\"B) Ch.10 (fire-fuel), Ch.18 (self-aggregates), Ch.22 (Tathāgata-aggregates) — it's his signature analytical tool\",\"C) Only in Chapter 1\",\"D) Only in the conclusion\"],\"correct\":\"B\",\"explanation\":\"The na ekam na pṛthak analysis appears throughout the MMK as Nāgārjuna's signature tool for revealing emptiness: fire-fuel, self-aggregates, Tathāgata-aggregates, and more.\"}},\"verseText\":\"That motion just is the mover itself Is not correct. Nor is it correct that They are completely different.\",\"madhyamakaConcept\":\"Garfield: this verse introduces the identity/difference analysis (na ekam na pṛthak) that Nāgārjuna employs throughout the MMK (cf. Ch.10 fire-fuel, Ch.18 self-aggregates, Ch.22 Tathāgata-aggregates). Kalupahana: the verse instantiates the Middle Way — avoiding the extreme of identity (eternalism/one-ness) and the extreme of difference (annihilationism/total separation). Candrakīrti: if identical, agent and action collapse; if different, they become unrelated.\",\"quantumPhysicsParallel\":\"Entanglement / Non-Separability: Entangled particles are neither identical (they can have different locations, spins) nor completely independent (measuring one instantly constrains the other). Their relationship transcends the classical identity/difference binary — they are non-separable without being the same.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":

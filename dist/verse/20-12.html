88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":20,\"verseId\":12,\"chapterTitle\":\"Examination of Cause and Effect (Saṃbhava)\",\"totalVerses\":24,\"verseData\":{\"id\":\"v20_12\",\"number\":12,\"title\":\"No Simultaneous Connection Between Past Effect and Any Cause\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"There is never a simultaneous connection Of a past effect With a past, a nonarisen, Or an arisen cause.\"},\"philosophy\":{\"insight\":\"Beginning the systematic elimination of simultaneous connection across temporal categories (vv.12-14): a PAST effect cannot be simultaneously connected with (1) a past cause, (2) a future/non-arisen cause, or (3) a present/arisen cause. Simultaneous connection across different time periods is incoherent.\",\"madhyamaka\":\"Atīta-phala na saṃprayuktam (a past effect is not simultaneously connected) with atīta-hetu (past cause), anutpanna-hetu (non-arisen cause), or utpanna-hetu (arisen cause). Cross-temporal inherent simultaneity is impossible. Past effects exist in the past; other causes exist in their respective times.\",\"quantum\":\"Relativity of simultaneity (Ch.19 v.3): simultaneity is frame-dependent. Cross-temporal \\\"simultaneous connection\\\" is even more problematic — events at different times can't be simultaneous by definition. Like v.12: inherent simultaneous connection across times is logically impossible.\",\"bridge\":\"Both relativity and v.12 deny cross-temporal simultaneity. Relativity: simultaneity is frame-dependent; cross-temporal simultaneity is impossible. V.12: a past effect can't be simultaneously connected with causes at any time. Both: inherent cross-temporal connection is incoherent.\",\"accessible\":\"Can something that happened yesterday be \\\"simultaneously connected\\\" with something happening today, tomorrow, or last week? No — \\\"simultaneous\\\" means \\\"at the same time,\\\" and yesterday ISN'T today. Cross-temporal simultaneity is a contradiction in terms.\",\"twoTruths\":\"Conventionally: past effects are connected to their causes through the causal continuum (dependency chains). Ultimately: this connection is conventional, not a matter of simultaneous inherent connection across times.\",\"commonMisconception\":\"NOT saying past effects are unrelated to their causes. Conventional causal history is real. What's denied is SIMULTANEOUS INHERENT CONNECTION between entities at different times. Conventional causal chains connect past effects to their causes through sequence, not through simultaneous inherent links.\"},\"quantumResonance\":{\"concept\":\"No Cross-Temporal Simultaneity\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"Relativity: simultaneity is frame-dependent; cross-temporal simultaneity is physically impossible. V.12: past effects can't be simultaneously connected with causes at any time. Both: inherent simultaneous connection across times is incoherent.\",\"caveat\":\"Relativity of simultaneity is a physics result. V.12 is a logical argument. The parallel is about the impossibility of cross-temporal simultaneous connection.\"},\"animation\":{\"visualBridge\":\"A past effect (faded) with three attempted connections to a past cause, a future cause, and a present cause. All three lines fail — they can't be \\\"simultaneous\\\" because the effect is in the past. Cross-temporal simultaneity is impossible.\",\"educationalGoal\":\"User sees: a past effect can't be simultaneously connected to causes at any time. Cross-temporal inherent connection fails systematically.\"},\"deeperDive\":[{\"q\":\"Why examine past/present/future combinations?\",\"a\":\"For COMPLETENESS. VV.12-14 examine all 9 possible combinations: past effect × (past, present, future) cause; present effect × (past, present, future) cause; future effect × (past, present, future) cause. V.12 handles the first three; v.13 the next three; v.14 the final three.\",\"realLifeExample\":\"Testing all possible key-lock combinations: key A with locks 1, 2, 3 (v.12); key B with locks 1, 2, 3 (v.13); key C with locks 1, 2, 3 (v.14). None opens the door of inherent simultaneous connection.\"},{\"q\":\"How is a past effect \\\"simultaneously connected\\\" to a past cause?\",\"a\":\"Both are past — but they may be at DIFFERENT past times. \\\"Simultaneous\\\" means at the EXACT same time. Two events at different past times aren't simultaneous. Even if both are \\\"past,\\\" they're not necessarily simultaneous.\",\"realLifeExample\":\"Two historical events (past cause, past effect) at different times: the signing of the Declaration (1776) and the end of the Civil War (1865). Both are \\\"past\\\" but NOT simultaneous. Cross-temporal \\\"simultaneity\\\" doesn't apply.\"},{\"q\":\"Can a past effect be connected to a non-arisen (future) cause?\",\"a\":\"A past effect connecting to something that hasn't yet arisen? This reverses causation (effect before cause) AND requires cross-temporal connection — doubly problematic. The past effect has already occurred; the future cause hasn't.\",\"realLifeExample\":\"Your yesterday's lunch being \\\"simultaneously connected\\\" to tomorrow's cooking? Absurd: tomorrow's cooking hasn't happened yet, and yesterday's lunch already occurred.\"},{\"q\":\"Can a past effect be connected to an arisen (present) cause?\",\"a\":\"The past effect no longer exists presently; the present cause exists now. They're at different times. Simultaneous connection requires co-existence at the same time — which past and present entities don't share.\",\"realLifeExample\":\"Yesterday's rain being \\\"simultaneously connected\\\" to today's sunshine? They can't be — one is past, one is present. They're not at the same time.\"},{\"q\":\"How does v.12 relate to Ch.19 (time)?\",\"a\":\"Ch.19 showed temporal categories are empty. V.12 applies this: if temporal categories (past, present, future) are empty, inherent simultaneous connection ACROSS these categories is even more impossible. Empty categories can't ground inherent cross-categorical connections.\",\"realLifeExample\":\"If the borders between countries are conventional (Ch.19), cross-border inherent treaties are even more problematic (v.12). The emptiness of the categories undermines inherent cross-category relations.\"},{\"q\":\"What is the purpose of this exhaustive analysis?\",\"a\":\"To close EVERY possible escape route for inherent simultaneous connection. By examining all 9 temporal combinations (3 effects × 3 causes), Nāgārjuna shows that NO combination allows inherent simultaneous connection. The analysis is exhaustive.\",\"deeper\":\"VV.12-14 form a remarkable 3×3 matrix analysis: 3 temporal states of the effect (past, present, future) × 3 temporal states of the cause (past, present, future) = 9 combinations. Each is shown to fail for inherent simultaneous connection. This systematic exhaustiveness is characteristic of Nāgārjuna's method: leave no logical possibility unexamined. The 9-combination analysis is one of the most architecturally precise arguments in the MMK.\"}],\"quiz\":{\"beginner\":{\"question\":\"Can a past effect be simultaneously connected to any cause?\",\"options\":[\"A) Yes\",\"B) No — a past effect exists in the past. It can't be \\\"simultaneous\\\" with past causes (different times), future causes (haven't occurred), or present causes (different time). Cross-temporal simultaneity is impossible.\",\"C) Only with past causes\",\"D) Only with present causes\"],\"correct\":\"B\",\"explanation\":\"Past effects can't be simultaneous with causes at any time. Cross-temporal simultaneous connection is logically impossible.\"},\"intermediate\":{\"question\":\"How do vv.12-14 form a 3×3 matrix?\",\"options\":[\"A) They don't\",\"B) 3 temporal states of effect (past, present, future) × 3 temporal states of cause (past, present, future) = 9 combinations. V.12: past effect. V.13: present effect. V.14: future effect. All 9 fail.\",\"C) Only 3 combinations\",\"D) The matrix is incomplete\"],\"correct\":\"B\",\"explanation\":\"3×3 = 9 combinations, systematically examined across vv.12-14. Every combination fails for inherent simultaneous connection.\"},\"advanced\":{\"question\":\"How does Ch.19's analysis of time ground vv.12-14?\",\"options\":[\"A) No connection\",\"B) Ch.19: temporal categories are empty. VV.12-14: inherent simultaneous connection across temporal categories fails. If the categories themselves are empty, cross-category inherent connections are doubly impossible. Empty categories can't ground inherent relations.\",\"C) Ch.19 is separate\",\"D) Time is irrelevant\"],\"correct\":\"B\",\"explanation\":\"Empty temporal categories (Ch.19) → inherent cross-temporal connections impossible (vv.12-14). The emptiness of time undermines inherent temporal connection.\"}},\"verseText\":\"There is never a simultaneous connection Of a past effect With a past, a nonarisen, Or an arisen cause.\",\"madhyamakaConcept\":\"Atīta-phala na saṃprayuktam (a past effect is not simultaneously connected) with atīta-hetu (past cause), anutpanna-hetu (non-arisen cause), or utpanna-hetu (arisen cause). Cross-temporal inherent simultaneity is impossible. Past effects exist in the past; other causes exist in their respective times.\",\"quantumPhysicsParallel\":\"Relativity of simultaneity (Ch.19 v.3): simultaneity is frame-dependent. Cross-temporal \\\"simultaneous connection\\\" is even more problematic — events at different times can't be simultaneous by definition. Like v.12: inherent simultaneous connection across times is logically impossible.\"}},\"isShowcase\":false,\"chapterId\":20}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"

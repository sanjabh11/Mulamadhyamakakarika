88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":10,\"verseId\":13,\"chapterTitle\":\"Examination of Fire and Fuel\",\"totalVerses\":16,\"verseData\":{\"id\":\"v10_13\",\"number\":13,\"title\":\"Fire Cannot Be Located\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Fire does not come from something else, Nor is fire in fuel itself. Moreover, fire and the rest are just like The moved, the not-moved, and the goer.\"},\"philosophy\":{\"insight\":\"Fire can't be inherently located: not from an external source (other-causation) and not within the fuel (self-causation). Nāgārjuna links this to Ch.2's motion analysis: just as motion can't be inherently located in the moved, the not-moved, or the goer, fire can't be inherently located anywhere.\",\"madhyamaka\":\"Rejection of self-causation (fire in fuel) and other-causation (fire from elsewhere). Fire doesn't pre-exist in the fuel, nor does it arrive from some external fire-source. It arises dependently through conditions — just like motion arises dependently without being locatable in any one state.\",\"quantum\":\"Quantum non-locality: a particle's position isn't \\\"in\\\" one place before measurement, nor does it \\\"come from\\\" somewhere else. The particle's location is indeterminate until measured. Similarly, fire's origin can't be inherently located in fuel or elsewhere.\",\"bridge\":\"Both quantum indeterminacy and Nāgārjuna's fire analysis show that trying to pinpoint the inherent location/origin of phenomena fails. Location and causation are conventional, not inherent.\",\"accessible\":\"Where does a melody \\\"come from\\\"? Not from the air (it was silent before). Not from within the instrument (it was silent inside). It arises through the interaction of musician, instrument, and air — not locatable in any single source.\",\"twoTruths\":\"Conventionally, fire arises from fuel through ignition conditions. Ultimately, fire's origin can't be inherently located in fuel (self-causation) or outside fuel (other-causation).\",\"commonMisconception\":\"NOT saying fire has no origin. Saying its origin can't be inherently pinpointed in a single location or source. It arises dependently from multiple conditions.\"},\"quantumResonance\":{\"concept\":\"Quantum Non-Locality and Indeterminacy\",\"score\":71,\"strength\":\"High\",\"explanation\":\"A particle's position before measurement is indeterminate — not \\\"in\\\" one place, not \\\"from\\\" another. Fire similarly can't be inherently located in fuel or from elsewhere. Both resist inherent localization.\",\"caveat\":\"Quantum indeterminacy is about the probabilistic nature of quantum states. The parallel is about the impossibility of inherent localization.\"},\"animation\":{\"visualBridge\":\"A flame that can't be pinpointed — not found inside the log, not arriving from outside. It arises from the convergence of conditions, like a hologram from intersecting beams.\",\"educationalGoal\":\"User sees that fire's origin can't be inherently located — it arises dependently, just like motion in Ch.2.\"},\"deeperDive\":[{\"q\":\"Why doesn't fire \\\"come from something else\\\"?\",\"a\":\"Other-causation: fire arriving from an external, inherently different source. But if the source is inherently different from fuel/conditions, how does it produce fire specifically? And where was this fire before? Inherent other-causation is incoherent (Ch.1).\",\"realLifeExample\":\"Does happiness \\\"come from\\\" outside? Not from an external happiness-factory. It arises through conditions (relationships, health, meaning) — not from an inherently separate source.\"},{\"q\":\"Why isn't fire \\\"in fuel itself\\\"?\",\"a\":\"Self-causation: fire pre-existing within fuel. But if fire were already in the fuel, the fuel would already be burning. The effect (fire) can't pre-exist inherently in the cause (fuel). This refutes the Sāṅkhya view of effects pre-existing in causes.\",\"realLifeExample\":\"Is the butterfly \\\"in\\\" the caterpillar? Not inherently — the caterpillar must undergo transformation through conditions. The butterfly doesn't pre-exist hiding inside.\"},{\"q\":\"How does Ch.2's motion analysis apply?\",\"a\":\"Ch.2: motion isn't in the moved (past), the not-yet-moved (future), or the moving (present). Same logic: fire isn't in the already-burned, the not-yet-burned, or the currently-burning. Fire, like motion, can't be inherently located in any temporal/spatial state.\",\"realLifeExample\":\"Where is a journey? Not in the departure (it hasn't started), not in the arrival (it's over), not in the traveling (it's still happening). The journey is the process, not locatable in any one state.\"},{\"q\":\"What does quantum non-locality reveal?\",\"a\":\"Before measurement, a particle's position is a probability distribution — it's not \\\"in\\\" one place. The particle's location becomes definite only upon measurement (interaction with conditions). Similarly, fire's \\\"location\\\" becomes definite only through the conditions of ignition.\",\"realLifeExample\":\"Where is a phone call? Not \\\"in\\\" your phone, not \\\"in\\\" the cell tower, not \\\"in\\\" the airwaves. It exists as a process through the network — not locatable in one component.\"},{\"q\":\"What does \\\"fire and the rest\\\" mean?\",\"a\":\"\\\"The rest\\\" includes fuel and the burning process. The analysis applies to ALL elements of the fire-fuel situation, not just fire. Nothing in the entire system can be inherently located — all arise dependently.\",\"realLifeExample\":\"Not just the song, but also the singer, the instrument, and the sound waves — NONE can be inherently located as the single \\\"source\\\" of the music.\"},{\"q\":\"How does this verse connect chs. 2 and 10?\",\"a\":\"Nāgārjuna explicitly references Ch.2 (\\\"just like the moved, the not-moved, and the goer\\\"). This shows the SAME logical structure applies across different phenomena: motion, fire, self, causation. The emptiness argument is universal.\",\"deeper\":\"Cross-referencing chapters is a key Nāgārjuna technique. It shows that each chapter's analysis isn't isolated but part of a unified demonstration of universal emptiness. The same logic (can't locate inherently) applies to motion, fire, self, action, and all phenomena.\"}],\"quiz\":{\"beginner\":{\"question\":\"Where does fire come from, according to Nāgārjuna?\",\"options\":[\"A) From inside the fuel\",\"B) From an external source\",\"C) It can't be inherently located — not from within fuel and not from elsewhere\",\"D) It comes from both\"],\"correct\":\"C\",\"explanation\":\"Fire arises dependently through conditions. It doesn't pre-exist in fuel (self-causation) or arrive from outside (other-causation). Its origin is conventional, not inherently locatable.\"},\"intermediate\":{\"question\":\"How does the Ch.2 motion analysis apply to fire?\",\"options\":[\"A) It doesn't\",\"B) Just as motion can't be inherently located in the moved/not-moved/goer, fire can't be inherently located in fuel/elsewhere/the burning process\",\"C) Motion proves fire exists\",\"D) Only motion has this problem\"],\"correct\":\"B\",\"explanation\":\"The same logical structure applies: phenomena can't be inherently located in any particular state, source, or process. Both motion and fire arise dependently and resist inherent localization.\"},\"advanced\":{\"question\":\"Why does this verse refute both self-causation and other-causation?\",\"options\":[\"A) It only refutes one\",\"B) Fire not \\\"in fuel\\\" refutes self-causation (effect in cause); fire not \\\"from elsewhere\\\" refutes other-causation (effect from separate cause). Both inherent causal models fail.\",\"C) Self-causation works\",\"D) Other-causation works\"],\"correct\":\"B\",\"explanation\":\"Self-causation (fire in fuel) means the effect pre-exists in the cause. Other-causation (fire from elsewhere) means the effect comes from an inherently separate source. Nāgārjuna refutes both.\"}},\"verseText\":\"Fire does not come from something else, Nor is fire in fuel itself. Moreover, fire and the rest are just like The moved, the not-moved, and the goer.\",\"madhyamakaConcept\":\"Rejection of self-causation (fire in fuel) and other-causation (fire from elsewhere). Fire doesn't pre-exist in the fuel, nor does it arrive from some external fire-source. It arises dependently through conditions — just like motion arises dependently without being locatable in any one state.\",\"quantumPhysicsParallel\":\"Quantum non-locality: a particle's position isn't \\\"in\\\" one place before measurement, nor does it \\\"come from\\\" somewhere else. The particle's location is indeterminate until measured. Similarly, fire's origin can't be inherently located in fuel or elsewhere.\"}},\"isShowcase\":false,\"chapterId\":10}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"conten

88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":12,\"verseId\":10,\"chapterTitle\":\"Examination of Suffering\",\"totalVerses\":10,\"verseData\":{\"id\":\"v12_10\",\"number\":10,\"title\":\"Universal Application of the Fourfold Negation\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Not only does suffering not exist In any of the fourfold ways: No external entity exists In any of the fourfold ways.\"},\"philosophy\":{\"insight\":\"The crucial generalization: the fourfold negation applies not just to suffering but to ALL external entities. No phenomenon whatsoever — tables, stars, atoms, persons — is inherently produced through self, other, both, or no cause. Universal emptiness of inherent production.\",\"madhyamaka\":\"This verse universalizes the chapter's conclusion. The analysis of suffering's emptiness of inherent production (catuṣkoṭi applied to duḥkha) applies to ALL bāhya bhāva (external entities). Nothing anywhere is inherently self-caused, other-caused, both-caused, or causeless. Everything arises dependently.\",\"quantum\":\"The failure of local realism (Bell's theorem) isn't specific to photon pairs — it applies to ALL quantum systems. Similarly, the fourfold negation isn't specific to suffering — it applies to all phenomena. Quantum principles are universal, just as emptiness is universal.\",\"bridge\":\"Both quantum mechanics and Mādhyamika claim universality. QM isn't just for electrons — it's the fundamental framework for all matter. Emptiness isn't just for suffering — it's the fundamental nature of all phenomena. Both are universal principles, not special cases.\",\"accessible\":\"The rules aren't just for suffering — they apply to EVERYTHING. Tables, mountains, atoms, galaxies — nothing is inherently self-made, other-made, both-made, or uncaused. Everything arises through conditions. This is the most sweeping conclusion possible.\",\"twoTruths\":\"Conventionally, external things exist and have causes — tables are made by carpenters, mountains form through geology. Ultimately, none of these involve inherent production through any of the four modes. Conventional existence and causation are preserved; inherent production is universally denied.\",\"commonMisconception\":\"NOT saying external things don't exist. Saying they don't exist through INHERENT PRODUCTION in any of the four modes. They exist conventionally through dependent origination — which is entirely sufficient for practical reality.\"},\"quantumResonance\":{\"concept\":\"Universality of Quantum Principles / Failure of Local Realism\",\"score\":72,\"strength\":\"High\",\"explanation\":\"Bell's theorem and QM principles apply universally to all physical systems, not just specific experiments. The fourfold negation similarly applies universally to all phenomena. Both claim their conclusions are not special cases but universal truths.\",\"caveat\":\"QM universality is about physical laws. Mādhyamika universality is about the nature of existence. The parallel is about the scope of the respective conclusions.\"},\"animation\":{\"visualBridge\":\"The fourfold negation expanding from a single \\\"Suffering\\\" node to encompass ALL objects — tables, stars, atoms — each showing the same pattern of dependent origination.\",\"educationalGoal\":\"User sees that the emptiness of inherent production is universal — what was proven for suffering applies to absolutely everything.\"},\"deeperDive\":[{\"q\":\"What are \\\"external entities\\\"?\",\"a\":\"All phenomena outside the subjective experience of suffering — physical objects (tables, mountains), natural phenomena (weather, stars), other beings, abstract entities. The point is that the analysis isn't limited to the psychological (suffering) but extends to the physical and everything else.\",\"realLifeExample\":\"Not just \\\"my headache isn't inherently caused\\\" but also \\\"this table isn't inherently caused, this mountain isn't inherently caused, this atom isn't inherently caused.\\\"\"},{\"q\":\"Why does the analysis generalize?\",\"a\":\"The logical structure of the fourfold negation doesn't depend on the specific content (suffering). It depends on the impossibility of inherent self-causation, other-causation, both, and causelessness — which are universal logical points. If the logic works for suffering, it works for everything.\",\"realLifeExample\":\"If you prove that perpetual motion is impossible (based on thermodynamics), the proof applies to ALL machines, not just the one you tested. The physics is universal.\"},{\"q\":\"How does Bell's theorem demonstrate universality?\",\"a\":\"Bell's theorem was originally derived for specific experimental setups (polarized photons). But the mathematical result applies to ALL quantum systems — any entangled pair, any measurement basis. The conclusion (no local hidden variables) is universal, not special.\",\"realLifeExample\":\"The law of gravity was discovered by observing apples and planets, but it applies to ALL mass — every object in the universe. Universal laws are discovered through specific cases.\"},{\"q\":\"Does this mean everything is illusory?\",\"a\":\"No. Everything is CONVENTIONALLY REAL — tables support books, mountains block wind, atoms form molecules. They're not inherently produced through self/other/both/none, but they function perfectly through dependent origination. Emptiness of inherent production ≠ non-existence.\",\"realLifeExample\":\"Money is not inherently valuable (it's paper or digital signals). But it functions perfectly as a medium of exchange. Conventional functionality doesn't require inherent production.\"},{\"q\":\"What is the significance of this verse for the MMK as a whole?\",\"a\":\"It connects Ch.12 (suffering) to the universal project of the MMK. Every chapter examines a specific topic (causation, motion, fire-fuel, suffering...) but the conclusion is always universal emptiness. V.10 makes this explicit: the suffering analysis is a universal template.\",\"realLifeExample\":\"A scientist discovering a principle in one experiment that applies everywhere has made a fundamental discovery. V.10 is Nāgārjuna's declaration of universality.\"},{\"q\":\"How does this complete Chapter 12?\",\"a\":\"Ch.12 moves from specific (suffering) to universal (all entities). V.1: thesis (four modes rejected). VV.2-8: detailed refutations. V.9: elimination of remaining options. V.10: GENERALIZATION. The chapter establishes universal emptiness of inherent production through the example of suffering.\",\"deeper\":\"This specific-to-universal pattern is the MMK's signature. Ch.1 (causation → universal), Ch.10 (fire-fuel → all relational pairs), Ch.11 (samsara → all existents), Ch.12 (suffering → all entities). Each chapter is both a specific analysis and a universal proof, reinforcing the same conclusion from different angles.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does v.10 generalize?\",\"options\":[\"A) Only suffering is empty\",\"B) The fourfold negation applies to ALL external entities, not just suffering — nothing is inherently produced through self, other, both, or no cause\",\"C) Only internal things are empty\",\"D) Some things are inherently produced\"],\"correct\":\"B\",\"explanation\":\"V.10 extends the chapter's conclusion universally: no entity whatsoever — internal or external — is inherently produced through any of the four modes. Universal emptiness of inherent production.\"},\"intermediate\":{\"question\":\"Why does the fourfold negation's logic generalize?\",\"options\":[\"A) It doesn't generalize\",\"B) The logical impossibility of inherent self-causation, other-causation, both, and causelessness doesn't depend on the specific content — it applies to any proposed inherently produced entity\",\"C) Only suffering has this property\",\"D) External things are different from suffering\"],\"correct\":\"B\",\"explanation\":\"The fourfold negation's logic is content-independent. The impossibility of inherent production modes applies universally, regardless of whether the topic is suffering, tables, atoms, or galaxies.\"},\"advanced\":{\"question\":\"How does v.10 connect Ch.12 to the overall project of the MMK?\",\"options\":[\"A) It doesn't connect\",\"B) Every chapter examines a specific topic but concludes with universal emptiness — Ch.12 explicitly makes this move from suffering to all entities, revealing the universal template\",\"C) Only Ch.12 is universal\",\"D) The MMK is only about suffering\"],\"correct\":\"B\",\"explanation\":\"The MMK uses specific analyses (causation, motion, fire-fuel, suffering) to establish universal emptiness. V.10 explicitly generalizes, showing that the suffering analysis is a template applicable to everything.\"}},\"verseText\":\"Not only does suffering not exist In any of the fourfold ways: No external entity exists In any of the fourfold ways.\",\"madhyamakaConcept\":\"This verse universalizes the chapter's conclusion. The analysis of suffering's emptiness of inherent production (catuṣkoṭi applied to duḥkha) applies to ALL bāhya bhāva (external entities). Nothing anywhere is inherently self-caused, other-caused, both-caused, or causeless. Everything arises dependently.\",\"quantumPhysicsParallel\":\"The failure of local realism (Bell's theorem) isn't specific to photon pairs — it applies to ALL quantum systems. Similarly, the fourfold negation isn't specific to suffering — it applies to all phenomena. Quantum principles are universal, just as emptiness is universal.\"}},\"isShowcase\":false,\"chapterId\":12}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self

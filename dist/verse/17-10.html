88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":17,\"verseId\":10,\"chapterTitle\":\"Examination of Action and Fruit\",\"totalVerses\":33,\"verseData\":{\"id\":\"v17_10\",\"number\":10,\"title\":\"Mental Karma: Neither Permanent nor Annihilated\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Since from the intention comes the continuum, And from the continuum the fruit arises, Action precedes the fruit. Therefore there is neither nonexistence nor permanence.\"},\"philosophy\":{\"insight\":\"The middle way conclusion applied to mental karma: intention ceases (no permanence), fruit arises through the mental continuum (no annihilation). Action precedes fruit — establishing conventional temporal order for mental karma just as v.8 did for physical karma.\",\"madhyamaka\":\"Mirrors v.8 for the mental realm: cetanā (intention) → santāna (continuum) → phala (fruit). The intention ceases (nityatva-nivṛtti — no permanence). The fruit arises through the continuum (uccheda-nivṛtti — no annihilation). The middle way is maintained for mental karma.\",\"quantum\":\"Quantum no-deletion theorem: quantum information cannot be destroyed — it persists through transformations. Like mental karma: the intention's influence isn't destroyed when the intention ceases; it persists through the mental continuum to produce its result.\",\"bridge\":\"Both quantum information and mental karma show information/influence persisting through transformation. QM: information persists (no-deletion) while states change (evolution). Buddhism: karmic influence persists (no annihilation) while intentions change (impermanence). Both: middle way between permanence and loss.\",\"accessible\":\"Your intentions don't last forever (you forget, your mood changes — no permanence), but their effects still show up later (habits form, decisions follow — no annihilation). The mental process carries the influence forward, just like the sprout carries the seed's potential to the fruit.\",\"twoTruths\":\"Conventionally, mental karma follows the seed-continuum-fruit pattern, avoiding both extremes. Ultimately, intention, continuum, and fruit are all empty — the middle way works because of emptiness, not despite it.\",\"commonMisconception\":\"NOT saying mental states are literally seeds. It's an analogy: mental causation PARALLELS physical seed-growth-fruit. The structure is the same (cause → intermediary → effect); the content differs (mental vs. physical).\"},\"quantumResonance\":{\"concept\":\"Quantum No-Deletion — Information Persists Through Transformation\",\"score\":60,\"strength\":\"Medium\",\"explanation\":\"Quantum information can't be deleted — it persists through transformations. Like mental karma: the intention's influence persists through the mental continuum even after the intention ceases.\",\"caveat\":\"No-deletion is a mathematical theorem about quantum information. Mental karmic persistence is a metaphysical/ethical principle. The parallel is about influence persisting through transformation.\"},\"animation\":{\"visualBridge\":\"Balance scale for mental karma: intention ceases (no permanence) while fruit arises through mental continuum (no annihilation). The middle way maintained across both physical and mental domains.\",\"educationalGoal\":\"User sees the middle way applied to mental karma — completing the parallel with physical karma from v.8.\"},\"deeperDive\":[{\"q\":\"How does v.10 mirror v.8?\",\"a\":\"V.8: seed → continuum → fruit (physical). V.10: intention → continuum → fruit (mental). Both conclude: \\\"therefore neither nonexistence nor permanence.\\\" The parallel structure shows the model's universality.\",\"realLifeExample\":\"Two columns in a spreadsheet showing the same formula applied to different data. Same structure, different content. The formula (seed-sprout-fruit) works universally.\"},{\"q\":\"What does \\\"action precedes the fruit\\\" establish?\",\"a\":\"Conventional temporal order: causes come before effects. This is the foundation of karmic ethics — you act NOW, and results come LATER. Without this temporal order, karma is meaningless (you could experience results before acting).\",\"realLifeExample\":\"You study for an exam (action) before passing it (result). If results came before actions, you could pass without studying — undermining the point of action.\"},{\"q\":\"Is the mental continuum permanent or impermanent?\",\"a\":\"Impermanent — it's a series of momentary mental events, each arising and ceasing. The \\\"continuity\\\" is conventional, like a river's apparent flow. Each moment is new; the continuity is a dependent designation.\",\"realLifeExample\":\"A candle flame appears continuous but is actually a series of combustion events. Similarly, the mental continuum appears continuous but is actually a series of momentary mental events.\"},{\"q\":\"Why does Nāgārjuna present both physical and mental models?\",\"a\":\"Completeness: karma operates in both domains (bodily/verbal AND mental). Showing the model works in BOTH domains makes the opponent's case as strong as possible. Nāgārjuna attacks the strongest version (vv.12-21).\",\"realLifeExample\":\"A product that works well in both warm and cold climates. Showing it works universally makes the case stronger — and makes the critique (when it comes) more devastating.\"},{\"q\":\"What comes after this \\\"thesis\\\" section?\",\"a\":\"V.11: conventional ethics (ten paths of action). V.12: Nāgārjuna's critique (\\\"this analysis is not tenable\\\"). VV.13-21: his solution through emptiness. The thesis (vv.1-11) is complete; the critique begins.\",\"realLifeExample\":\"The prosecution rests their case (vv.1-11). Now the defense (Nāgārjuna, vv.12+) presents their response.\"},{\"q\":\"How does this relate to rebirth theory?\",\"a\":\"The mental continuum is the basis for rebirth theory: at death, the last mental moment conditions the first mental moment of the next life. The seed-continuum-fruit model explains how karmic potential carries across lifetimes through the mental continuum.\",\"deeper\":\"VV.9-10 are crucial for understanding Buddhist rebirth theory. The mental continuum is what \\\"transmigrates\\\" — not a permanent soul (ātman) but a conventional series of conditioned mental moments. This is the Buddhist middle way between eternalism (permanent soul) and annihilationism (nothing continues). V.10's \\\"neither nonexistence nor permanence\\\" directly addresses the rebirth question: something continues (no annihilation) but nothing permanent persists (no eternalism). Ch.16 analyzed this at the level of bondage/liberation; Ch.17 vv.9-10 analyze it at the level of karmic mechanism.\"}],\"quiz\":{\"beginner\":{\"question\":\"How does the middle way apply to mental karma?\",\"options\":[\"A) It doesn't\",\"B) Intention ceases (no permanence) but fruit arises through the mental continuum (no annihilation). Mental karma follows the same middle way as physical karma.\",\"C) Intentions are permanent\",\"D) Mental effects don't exist\"],\"correct\":\"B\",\"explanation\":\"Mental karma follows the same pattern: intention ceases (impermanent) but its influence persists through the mental continuum (not annihilated) to produce results.\"},\"intermediate\":{\"question\":\"Why is vv.9-10 important for rebirth theory?\",\"options\":[\"A) Irrelevant to rebirth\",\"B) The mental continuum is what \\\"transmigrates\\\" across lifetimes — not a permanent soul but a conventional series of conditioned mental moments. V.10's middle way addresses rebirth: something continues (no annihilation) but nothing permanent persists (no eternalism).\",\"C) Rebirth requires a soul\",\"D) Mental continuum disproves rebirth\"],\"correct\":\"B\",\"explanation\":\"The mental continuum bridges lifetimes — conventional continuity without permanent soul. The middle way: continuation without permanence.\"},\"advanced\":{\"question\":\"Why does Nāgārjuna present the opponent's strongest case (vv.1-11) before critiquing?\",\"options\":[\"A) He can't critique\",\"B) By making the thesis as strong as possible (covering both physical and mental karma, explaining continuity, avoiding both extremes), his critique (v.12+) becomes more devastating. Attacking the strongest version proves the problem is fundamental.\",\"C) He agrees entirely\",\"D) The thesis is his view\"],\"correct\":\"B\",\"explanation\":\"Principle of charity: strongest thesis → most devastating critique. If even the best model fails under inherent existence, the problem is inherent existence itself.\"}},\"verseText\":\"Since from the intention comes the continuum, And from the continuum the fruit arises, Action precedes the fruit. Therefore there is neither nonexistence nor permanence.\",\"madhyamakaConcept\":\"Mirrors v.8 for the mental realm: cetanā (intention) → santāna (continuum) → phala (fruit). The intention ceases (nityatva-nivṛtti — no permanence). The fruit arises through the continuum (uccheda-nivṛtti — no annihilation). The middle way is maintained for mental karma.\",\"quantumPhysicsParallel\":\"Quantum no-deletion theorem: quantum information cannot be destroyed — it persists through transformations. Like mental karma: the intention's influence isn't destroyed when the intention ceases; it persists through the mental continuum to produce its result.\"}},\"isShowcase\":false,\"chapterId\":17}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"

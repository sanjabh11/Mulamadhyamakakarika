88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":20,\"verseId\":20,\"chapterTitle\":\"Examination of Cause and Effect (Saṃbhava)\",\"totalVerses\":24,\"verseData\":{\"id\":\"v20_20\",\"number\":20,\"title\":\"Identity Makes Producer and Produced Merge; Difference Makes Cause Like Non-Cause\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If cause and fruit were identical, producer and produce would be identical. If cause and fruit were other, cause and non-cause would be similar.\"},\"philosophy\":{\"insight\":\"Elaborating v.19's dilemma with CONSEQUENCES: (1) If identical: the producer (cause) and the produced (effect) are the SAME THING — collapsing the causal relationship entirely. (2) If different: the cause has no more connection to the effect than a non-cause does — causation becomes arbitrary.\",\"madhyamaka\":\"Hetu-phala ekatva cet, kartṛ-kārya ekatva (if cause-effect identical, producer-produced identical). Hetu-phala anyatva cet, hetu a-hetu sama (if cause-effect different, cause similar to non-cause). These are the reductio ad absurdum consequences of each horn.\",\"quantum\":\"Quantum contextuality (Kochen-Specker theorem): measurement outcomes depend on the measurement CONTEXT, not on pre-existing properties. Identity and difference of properties are context-dependent. Like v.20: the relationship between cause and effect is contextual, not inherently fixed as identity or difference.\",\"bridge\":\"Both contextuality and v.20 show that relationships are context-dependent, not inherently fixed. QM: properties depend on context. V.20: cause-effect is neither inherently identical (merger) nor inherently different (disconnection). Both: relationships are conventional/contextual.\",\"accessible\":\"If the recipe IS the dish (identical) — why cook? They're the same thing. If the recipe has NOTHING to do with the dish (different) — any recipe works for any dish, which is absurd. Neither identity nor difference makes sense for inherent causation.\",\"twoTruths\":\"Conventionally: recipes DO produce specific dishes (conventional connection). Ultimately: this isn't because recipes are identical to dishes (they're not) or completely unrelated (they're connected). It's dependent arising.\",\"commonMisconception\":\"NOT proving that cause and effect are unrelated. V.20 shows that INHERENT identity and INHERENT difference both lead to absurdity. Conventional relation (dependent arising) avoids both absurdities.\"},\"quantumResonance\":{\"concept\":\"Quantum Contextuality — Properties Depend on Context\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"Contextuality: measurement outcomes are context-dependent, not pre-existing. V.20: cause-effect is neither inherently identical nor different. Both: relationships and properties are contextual/conventional, not inherently fixed.\",\"caveat\":\"Contextuality is a physics result. V.20 is about inherent identity/difference. The parallel is about contextual vs. inherent relationships.\"},\"animation\":{\"visualBridge\":\"Two panels: (1) \\\"Identical\\\" — cause and effect merge into one blob, losing the causal relationship. (2) \\\"Different\\\" — cause and non-cause become indistinguishable (both equally unrelated to the effect). Neither works. Caption: \\\"Identity → merger. Difference → disconnection.\\\"\",\"educationalGoal\":\"User sees the consequences: identity collapses causation (merger); difference dissolves it (disconnection). Both are absurd.\"},\"deeperDive\":[{\"q\":\"What happens if producer and produced are identical?\",\"a\":\"If the cause IS the effect, there's no distinction between making and being made. The baker IS the bread. The parent IS the child. The entire asymmetry of causation — one MAKES the other — collapses into identity.\",\"realLifeExample\":\"If the painter IS the painting, there's no painting happening — they're the same thing. Art requires the artist to be different from the artwork (at least functionally).\"},{\"q\":\"Why does difference make cause like non-cause?\",\"a\":\"If cause and effect are COMPLETELY different (no inherent connection), the cause has no more claim to the effect than anything else. The seed is no more the cause of the sprout than a rock is. Difference eliminates causal specificity — revisiting v.4's point.\",\"realLifeExample\":\"If a teacher has NO connection to the student (completely other), any random person is equally \\\"the teacher.\\\" The teacher-student relationship requires connection — complete difference eliminates it.\"},{\"q\":\"How does this elaborate v.19?\",\"a\":\"V.19: neither identical nor different (statement). V.20: consequences — identical → merger; different → arbitrary. V.20 shows WHY vv.19's conclusion follows: the CONSEQUENCES of each horn are absurd.\",\"realLifeExample\":\"V.19: \\\"You can't go left or right\\\" (statement). V.20: \\\"Left leads to a cliff; right leads to a swamp\\\" (consequences). V.20 explains WHY v.19's conclusion is correct.\"},{\"q\":\"What is quantum contextuality's relevance?\",\"a\":\"The Kochen-Specker theorem: quantum properties don't have definite values independent of measurement context. \\\"Identical\\\" or \\\"different\\\" depend on how you look. Like v.20: cause-effect isn't inherently identical or different — the relationship is contextual/conventional, not fixed.\",\"realLifeExample\":\"Whether two items are \\\"the same\\\" depends on context: same color? Same shape? Same material? \\\"Sameness\\\" and \\\"difference\\\" are perspective-dependent, not absolute. V.20 applies this to cause-effect.\"},{\"q\":\"What does this mean for the identity/difference analysis?\",\"a\":\"The identity/difference framework — the binary of \\\"same\\\" or \\\"different\\\" — is inadequate for capturing the cause-effect relationship. Causation is a PROCESS that transcends static categories of identity and difference.\",\"realLifeExample\":\"The relationship between a river upstream and downstream: not the \\\"same\\\" water (it flowed), not \\\"different\\\" rivers (same river). The river is a PROCESS, not a static thing that can be categorized as same/different.\"},{\"q\":\"How do vv.19-20 connect to previous chapters?\",\"a\":\"Ch.2 vv.18-21: mover and moving neither identical nor different. Ch.6 vv.4-5: desire and desirous. Ch.10 vv.1-2: fire and fuel. Ch.20 vv.19-20: cause and effect. The same analysis applied throughout the MMK, always with the same result.\",\"deeper\":\"V.20 provides the standard Madhyamaka consequences (prasaṅga) for the identity/difference horns: identity → merger (loss of distinction); difference → disconnection (loss of relationship). These consequences appear wherever the identity/difference analysis is applied in the MMK. They demonstrate that inherent relationships are impossible: inherent identity collapses distinction; inherent difference eliminates connection. Only conventional, dependent relation avoids both.\"}],\"quiz\":{\"beginner\":{\"question\":\"What are the consequences of identity and difference?\",\"options\":[\"A) Both work\",\"B) Identity: producer and produced MERGE — no causation. Difference: cause becomes like non-cause — no specific connection. Both lead to absurdity.\",\"C) Only identity is absurd\",\"D) Only difference is absurd\"],\"correct\":\"B\",\"explanation\":\"Identity → merger (no causation). Difference → disconnection (no specificity). Both absurd.\"},\"intermediate\":{\"question\":\"How does v.20 elaborate v.19?\",\"options\":[\"A) It doesn't\",\"B) V.19: neither identical nor different (statement). V.20: shows the CONSEQUENCES — identical → merger; different → arbitrary. V.20 demonstrates WHY v.19's conclusion is correct through reductio ad absurdum.\",\"C) Same verse\",\"D) Different topic\"],\"correct\":\"B\",\"explanation\":\"V.19: the claim. V.20: the proof (by showing absurd consequences of both alternatives).\"},\"advanced\":{\"question\":\"How does the identity/difference analysis connect across the MMK?\",\"options\":[\"A) Only Ch.20\",\"B) The same analysis appears in Ch.2 (mover/moving), Ch.6 (desire/desirous), Ch.10 (fire/fuel), Ch.20 (cause/effect), etc. Always the same result: neither identity nor difference, but dependent arising. It's a fundamental Madhyamaka analytical tool.\",\"C) Each chapter is different\",\"D) Only the last application matters\"],\"correct\":\"B\",\"explanation\":\"Standard tool used throughout the MMK. Always the same result: transcendence of identity/difference through dependent arising.\"}},\"verseText\":\"If cause and fruit were identical, producer and produce would be identical. If cause and fruit were other, cause and non-cause would be similar.\",\"madhyamakaConcept\":\"Hetu-phala ekatva cet, kartṛ-kārya ekatva (if cause-effect identical, producer-produced identical). Hetu-phala anyatva cet, hetu a-hetu sama (if cause-effect different, cause similar to non-cause). These are the reductio ad absurdum consequences of each horn.\",\"quantumPhysicsParallel\":\"Quantum contextuality (Kochen-Specker theorem): measurement outcomes depend on the measurement CONTEXT, not on pre-existing properties. Identity and difference of properties are context-dependent. Like v.20: the relationship between cause and effect is contextual, not inherently fixed as identity or difference.\"}},\"isShowcase\":false,\"chapterId\":20}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital hum

88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":15,\"verseId\":11,\"chapterTitle\":\"Examination of Essence\",\"totalVerses\":11,\"verseData\":{\"id\":\"v15_11\",\"number\":11,\"title\":\"Defining the Two Extremes: Eternalism and Nihilism\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"\\\"Whatever exists through its essence cannot be nonexistent\\\" is eternalism. \\\"It existed before but doesn't now\\\" entails the error of nihilism.\"},\"philosophy\":{\"insight\":\"The chapter's culminating definition: Eternalism = \\\"what exists through essence can't become nonexistent\\\" (inherent existence is permanent). Nihilism = \\\"it existed before but doesn't now\\\" (complete annihilation). Both are errors. The middle way avoids both by understanding dependent origination — things neither inherently persist nor inherently cease.\",\"madhyamaka\":\"Eternalism (śāśvatavāda): If X exists through svabhāva, X's existence is permanent (svabhāva is unchanging). Therefore X can never become non-existent. This is eternalism — reification of all things as permanent entities. Nihilism (ucchedavāda): X existed before but no longer exists — complete annihilation. This denies continuity and undermines karma/causation. Both are dṛṣṭidoṣa (defects of view).\",\"quantum\":\"Quantum information conservation: information is never truly destroyed (no-hiding theorem). Yet quantum states constantly transform (decoherence, measurement). Neither \\\"permanent existence\\\" (eternalism) nor \\\"complete annihilation\\\" (nihilism) applies. Information persists through transformation — neither eternal nor annihilated.\",\"bridge\":\"Both quantum information conservation and the middle way navigate between persistence and annihilation. QM: information isn't destroyed but transforms — not eternal in original form, not annihilated. Middle way: things don't inherently persist or annihilate — they arise, transform, and cease dependently.\",\"accessible\":\"Eternalism: \\\"Once it exists, it ALWAYS exists\\\" (like saying a flame once lit can never go out). Nihilism: \\\"It used to exist but is completely GONE now\\\" (like saying a flame that went out is absolutely nothing). Reality: the flame transforms — the energy continues as heat and light, neither permanent nor annihilated.\",\"twoTruths\":\"Both extremes mistake conventional processes for ultimate facts. Conventionally, things arise, persist, and cease. Ultimately, this arising/ceasing is not inherent — things neither inherently persist (eternalism) nor inherently cease (nihilism). The two truths framework avoids both extremes.\",\"commonMisconception\":\"NOT saying continuity and change don't exist. They do — conventionally. The point: continuity isn't INHERENT permanence (eternalism), and change isn't INHERENT annihilation (nihilism). Conventional continuity + conventional change = middle way.\"},\"quantumResonance\":{\"concept\":\"Quantum Information Conservation — Neither Eternal nor Annihilated\",\"score\":71,\"strength\":\"High\",\"explanation\":\"Quantum information is never truly destroyed (not nihilism) but constantly transforms through decoherence and measurement (not eternalism). Like the middle way: things neither inherently persist nor are completely annihilated — they transform dependently.\",\"caveat\":\"Quantum information conservation is a specific physical principle (no-hiding theorem). The parallel is about navigating between permanence and annihilation.\"},\"animation\":{\"visualBridge\":\"Energy transforming from one form to another — never created, never destroyed, always changing. Neither eternal in one form nor annihilated. The middle way of energy conservation.\",\"educationalGoal\":\"User sees that reality avoids both extremes: things don't permanently persist in fixed form (eternalism) or vanish completely (nihilism). They transform — the middle way.\"},\"deeperDive\":[{\"q\":\"How does \\\"existing through essence\\\" lead to eternalism?\",\"a\":\"If X exists through svabhāva (inherent essence), svabhāva is unchanging (v.2). Therefore X exists permanently — it can never become nonexistent. This is eternalism: the view that things inherently exist and therefore persist forever. The logic is simple: unchanging essence → permanent existence.\",\"realLifeExample\":\"If a diamond had \\\"diamond-essence\\\" (truly inherent, unchanging), it could never be destroyed — it would exist eternally. But diamonds can burn (they're carbon). No diamond-essence = no eternal diamonds.\"},{\"q\":\"How does \\\"existed before but doesn't now\\\" constitute nihilism?\",\"a\":\"This implies COMPLETE annihilation — something that truly existed now truly doesn't exist at all. No trace, no continuity, no consequence. This undermines karma (actions have consequences) and dependent origination (effects follow causes). If things can completely vanish, causation breaks down.\",\"realLifeExample\":\"If a person who dies is COMPLETELY gone (no consequences, no influence, no continuity), their life was ultimately meaningless. This undermines ethics: why be good if everything ends in complete annihilation?\"},{\"q\":\"How does quantum information conservation avoid both extremes?\",\"a\":\"The no-hiding theorem says quantum information is never destroyed — it transforms but persists. Yet the original quantum state changes irreversibly through decoherence. Information isn't eternally unchanged (not eternalism) nor completely annihilated (not nihilism). It transforms.\",\"realLifeExample\":\"A log burns into ash, smoke, and heat. The matter/energy isn't annihilated (conservation laws) nor unchanged (the log is gone). It transforms. Neither eternalism nor nihilism applies — the middle way of conservation through transformation.\"},{\"q\":\"Why are both extremes \\\"errors\\\" (doṣa)?\",\"a\":\"Eternalism leads to attachment (if things are permanent, I must grasp them). Nihilism leads to despair and immorality (if nothing persists, nothing matters). Both generate suffering: eternalism through clinging, nihilism through abandoning ethics. The middle way generates wisdom and compassion.\",\"realLifeExample\":\"A parent who believes their child will never change (eternalism) resists growth. A parent who believes their influence disappears (nihilism) stops caring. The wise parent: influence transforms — not permanent but not lost.\"},{\"q\":\"How does v.11 complete Ch.15?\",\"a\":\"V.11 is the final formulation: it precisely defines the two extremes that the chapter has been demolishing. VV.1-5 showed essence is impossible. V.6: seeing essence = not seeing truth. V.7: the Buddha rejected both extremes. VV.8-9: why both fail. V.10: the wise person avoids both. V.11: what the extremes are. The chapter ends with complete clarity about what to avoid and why.\",\"realLifeExample\":\"A course that starts with problems (vv.1-5), shows the consequence of not solving them (v.6), presents the solution (v.7), explains why alternatives fail (vv.8-9), prescribes the right approach (v.10), and defines the wrong approaches (v.11) — that's a complete educational arc.\"},{\"q\":\"Why is Ch.15 considered the heart of the MMK?\",\"a\":\"It directly addresses the fundamental concept (svabhāva) that underlies ALL Mādhyamika analysis. Other chapters show specific things (motion, causation, self) lack svabhāva. Ch.15 attacks svabhāva ITSELF — the concept, not just its instances. And it ends with the clearest statement of the middle way in the entire text.\",\"deeper\":\"Ch.15 is the MMK in miniature: define the problem (essence), demolish it (vv.1-5), state the consequence (v.6), invoke the teaching (v.7), show why alternatives fail (vv.8-9), prescribe the solution (v.10), and define the errors (v.11). Every major theme of the MMK appears here in concentrated form: svabhāva, śūnyatā, pratītyasamutpāda, the two truths, the middle way, and the connection to the Buddha's teaching. This chapter alone could serve as a complete introduction to Mādhyamika.\"}],\"quiz\":{\"beginner\":{\"question\":\"What is the difference between eternalism and nihilism according to v.11?\",\"options\":[\"A) They're the same\",\"B) Eternalism: \\\"What exists through essence can't be nonexistent\\\" (inherent permanence). Nihilism: \\\"It existed before but doesn't now\\\" (complete annihilation). Both are errors.\",\"C) Only nihilism is wrong\",\"D) Only eternalism is wrong\"],\"correct\":\"B\",\"explanation\":\"Eternalism = things inherently persist forever. Nihilism = things completely annihilate. Both misrepresent reality. The middle way: things arise, transform, and cease dependently — neither permanent nor annihilated.\"},\"intermediate\":{\"question\":\"How does quantum information conservation navigate between the two extremes?\",\"options\":[\"A) It doesn't\",\"B) Information is never destroyed (not nihilism) but constantly transforms through decoherence (not eternalism). Information persists through transformation — neither permanently unchanged nor completely annihilated.\",\"C) Information is eternal\",\"D) Information is annihilated\"],\"correct\":\"B\",\"explanation\":\"Quantum information conservation shows a middle way: information transforms but persists. Not eternal in original form (not eternalism), not completely destroyed (not nihilism).\"},\"advanced\":{\"question\":\"Why is Ch.15 considered the MMK \\\"in miniature\\\"?\",\"options\":[\"A) It's too short to be complete\",\"B) It contains every major Mādhyamika theme: svabhāva analysis, śūnyatā, pratītyasamutpāda, two truths, middle way, scriptural grounding — all in 11 verses. It could serve as a complete introduction to Mādhyamika.\",\"C) Other chapters are more important\",\"D) Only vv.1-2 matter\"],\"correct\":\"B\",\"explanation\":\"Ch.15 concentrates every major theme into 11 verses: definition and demolition of svabhāva, emptiness, dependent arising, two truths, middle way, and scriptural authority. It's the most complete single chapter in the MMK.\"}},\"verseText\":\"\\\"Whatever exists through its essence cannot be nonexistent\\\" is eternalism. \\\"It existed before but doesn't now\\\" entails the error of nihilism.\",\"madhyamakaConcept\":\"Eternalism (śāśvatavāda): If X exists through svabhāva, X's existence is permanent (svabhāva is unchanging). Therefore X can never become non-existent. This is eternalism — reification of all things as permanent entities. Nihilism (ucchedavāda): X existed before but no longer exists — complete annihilation. This denies continuity and undermines karma/causation. Both are dṛṣṭidoṣa (defects of view).\",\"quantumPhysicsParallel\":\"Quantum information conservation: information is never truly destroyed (no-hiding theorem). Yet quantum states constantly transform (decoherence, measurement). Neither \\\"permanent existence\\\" (eternalism) nor \\\"complete annihilation\\\" (nihilism) applies. Information persists through transformation — neither eternal nor annihilated.\"}},\"isShowcase\":false,\"chapterId\":15}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",

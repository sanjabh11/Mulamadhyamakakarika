88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":24,\"verseId\":13,\"chapterTitle\":\"Examination of the Noble Truths\",\"totalVerses\":40,\"verseData\":{\"id\":\"v24_13\",\"number\":13,\"title\":\"Your Objection Does Not Apply to Emptiness\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Your objection does not apply to emptiness. You falsely attribute to emptiness a fault that is not there.\"},\"philosophy\":{\"insight\":\"DIRECT REBUTTAL: the faults the opponent attributes to emptiness (vv.1-6) don't actually belong to emptiness. The opponent projected their misunderstanding onto the theory. The objection is a STRAW MAN — attacking what emptiness isn't, not what it is.\",\"madhyamaka\":\"Tava doṣa-prasaṅgaḥ śūnyatāyāṃ na upapadyate (your fault-attribution doesn't apply to emptiness). Avidyamānam doṣam śūnyatāyām āropayasi (you attribute a non-existent fault to emptiness). Formal rejection of the objection.\",\"quantum\":\"\\\"Your objection doesn't apply to QM. You're attributing to QM a problem that belongs to your misunderstanding of QM.\\\" The theory is fine; the critique is based on a caricature.\",\"bridge\":\"Both: the objection attacks a misunderstanding, not the actual theory. The fault is in the comprehension, not the framework.\",\"accessible\":\"\\\"Your complaint about the food doesn't apply — you're eating the menu, not the meal.\\\" The opponent is critiquing a misunderstanding, not the real thing.\",\"twoTruths\":\"The \\\"fault\\\" comes from collapsing two truths. Emptiness properly understood (with two truths) has no such faults.\",\"commonMisconception\":\"The entire objection (vv.1-6) IS the misconception. V.13 explicitly rejects it.\"},\"quantumResonance\":{\"concept\":\"Critique Applies to Misunderstanding, Not Theory\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"Objections to QM often target a caricature. Objections to emptiness target a misunderstanding. Both: the critique doesn't apply to the actual theory.\",\"caveat\":\"QM debates are physics. V.13 is about emptiness.\"},\"animation\":{\"visualBridge\":\"Arrows (the objection) flying toward \\\"EMPTINESS\\\" but passing through — missing entirely. They hit a shadow labeled \\\"MISUNDERSTANDING.\\\" Caption: \\\"Your objection hits the wrong target.\\\"\",\"educationalGoal\":\"The objection doesn't apply to emptiness but to a misunderstanding of it.\"},\"deeperDive\":[{\"q\":\"Why doesn't the objection apply?\",\"a\":\"The objection assumes empty = non-existent. But empty = dependently arisen (not non-existent). The objection attacks a version of emptiness that Nāgārjuna doesn't hold.\",\"realLifeExample\":\"Criticizing a painting for being \\\"too loud\\\" — paintings aren't loud. The critique category doesn't apply.\"},{\"q\":\"What fault is falsely attributed?\",\"a\":\"The fault of nihilism — that emptiness means nothing exists. This is the opponent's projection, not emptiness's content. Emptiness means dependent arising, not non-existence.\",\"realLifeExample\":\"Attributing \\\"being cold\\\" to the sun. The sun is hot — the fault doesn't belong to it.\"},{\"q\":\"Is this a fair response?\",\"a\":\"Yes — IF Nāgārjuna can show that emptiness DOES mean dependent arising (not non-existence). Vv.14-40 will demonstrate this. V.13 states the claim; subsequent verses prove it.\",\"realLifeExample\":\"A lawyer saying \\\"my client is innocent\\\" — fair if they can prove it. V.13 = claim; vv.14-40 = proof.\"},{\"q\":\"How does this connect to vv.7-12?\",\"a\":\"V.7: you misunderstand emptiness. Vv.8-10: here's the framework (two truths). Vv.11-12: misunderstanding is dangerous. V.13: THEREFORE your objection doesn't apply. Logical progression.\",\"realLifeExample\":\"Diagnosis → framework → warning → conclusion. Systematic argumentation.\"},{\"q\":\"What comes next?\",\"a\":\"Vv.14-40: the POSITIVE case. Nāgārjuna will show that emptiness ENABLES (not destroys) the Noble Truths, conventions, causation, morality, and the path. The counterattack begins.\",\"realLifeExample\":\"After defending against the attack, now it's time to go on the offensive.\"},{\"q\":\"Significance?\",\"a\":\"V.13 formally REJECTS the objection and clears the ground for the positive argument. It's the transition from defense to offense.\",\"deeper\":\"V.13 is the formal rejection that transitions from defensive (vv.7-12) to offensive (vv.14-40) argumentation. The defense showed the objection is based on misunderstanding. V.13 explicitly states: the fault doesn't belong to emptiness. The positive case will now show where the fault DOES belong — to the opponent's own position (inherent existence).\"}],\"quiz\":{\"beginner\":{\"question\":\"Does the opponent's objection apply to emptiness?\",\"options\":[\"A) Yes\",\"B) No — the objection attacks a misunderstanding (emptiness = non-existence), not the actual theory (emptiness = dependent arising). Wrong target.\",\"C) Partially\",\"D) Only some\"],\"correct\":\"B\",\"explanation\":\"The objection targets a straw man. Emptiness properly understood has no such faults.\"},\"intermediate\":{\"question\":\"What is v.13's role in the argument?\",\"options\":[\"A) Minor\",\"B) Formal transition from defense (vv.7-12) to offense (vv.14-40). The objection is rejected; the positive case begins.\",\"C) Only defense\",\"D) Only offense\"],\"correct\":\"B\",\"explanation\":\"Transition point: defense complete, offense about to begin.\"},\"advanced\":{\"question\":\"What must Nāgārjuna now prove?\",\"options\":[\"A) Nothing\",\"B) That emptiness MEANS dependent arising (not non-existence), and that this ENABLES all the things the opponent thought were destroyed. The positive case.\",\"C) Only rejection\",\"D) Different point\"],\"correct\":\"B\",\"explanation\":\"The positive case: emptiness = dependent arising = enables everything. Vv.14-40.\"}},\"verseText\":\"Your objection does not apply to emptiness. You falsely attribute to emptiness a fault that is not there.\",\"madhyamakaConcept\":\"Tava doṣa-prasaṅgaḥ śūnyatāyāṃ na upapadyate (your fault-attribution doesn't apply to emptiness). Avidyamānam doṣam śūnyatāyām āropayasi (you attribute a non-existent fault to emptiness). Formal rejection of the objection.\",\"quantumPhysicsParallel\":\"\\\"Your objection doesn't apply to QM. You're attributing to QM a problem that belongs to your misunderstanding of QM.\\\" The theory is fine; the critique is based on a caricature.\"}},\"isShowcase\":false,\"chapterId\":24}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through interactive pedagogy, transparent AI assistance, and structural

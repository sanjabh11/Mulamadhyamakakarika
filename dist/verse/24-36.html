88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":24,\"verseId\":36,\"chapterTitle\":\"Examination of the Noble Truths\",\"totalVerses\":40,\"verseData\":{\"id\":\"v24_36\",\"number\":36,\"title\":\"If Things Had Inherent Existence, the World Would Be Unchanging\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If things existed by their own nature, the world would be unproduced and unceased, unchanging, and devoid of diversity.\"},\"philosophy\":{\"insight\":\"VIVID CONSEQUENCE: if things were inherent, the world would be FROZEN — no production, no cessation, no change, no diversity. A dead, static, featureless world. This is what the opponent's position actually implies.\",\"madhyamaka\":\"Svabhāvataḥ bhāvāḥ santi cet, jagat anutpanna aniruddha, avikriya, anānā (unproduced, unceased, unchanging, without diversity). The world of inherent existence is a dead world.\",\"quantum\":\"If all states were inherently fixed: no transitions, no dynamics, no evolution, no diversity of outcomes. A frozen quantum landscape.\",\"bridge\":\"Both: inherent fixity → dead, static, featureless universe. QM: fixed states → no physics. V.36: inherent existence → no world.\",\"accessible\":\"A photograph: frozen, unchanging, no diversity of movement. The opponent wants a photograph instead of a movie. But life is a movie, not a photograph.\",\"twoTruths\":\"Conventionally: the world is vibrant, changing, diverse. The opponent's position (inherent existence) contradicts this observable conventional reality.\",\"commonMisconception\":\"The opponent thought inherent existence would PROTECT the world. V.36: it would FREEZE the world. Protection becomes destruction.\"},\"quantumResonance\":{\"concept\":\"Fixed States → Dead Universe\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"All states fixed → no transitions → no dynamics → no diversity. Inherent existence → no production, cessation, change, or variety. Both: fixity = death of the universe.\",\"caveat\":\"Physical death vs. metaphysical death of the universe.\"},\"animation\":{\"visualBridge\":\"Two worlds: \\\"INHERENT\\\" (gray, frozen, identical, dead) vs. \\\"EMPTY\\\" (colorful, changing, diverse, alive). Caption: \\\"Inherent existence = frozen world. Emptiness = vibrant world.\\\"\",\"educationalGoal\":\"Inherent existence would create a dead, frozen, featureless world. Emptiness enables the vibrant world we experience.\"},\"deeperDive\":[{\"q\":\"What would an inherent world look like?\",\"a\":\"No production (nothing new), no cessation (nothing ends), no change (nothing transforms), no diversity (everything the same). A frozen, featureless, dead landscape.\",\"realLifeExample\":\"A world made of indestructible, unchangeable, identical blocks. No movement, no color, no life.\"},{\"q\":\"Why no diversity?\",\"a\":\"Diversity requires different things arising from different conditions. Inherent things don't arise from conditions → no different conditions → no diversity. Everything would be the same.\",\"realLifeExample\":\"A garden with only one type of inherent plant (can't change or diversify). No flowers, no variety, no beauty.\"},{\"q\":\"Is this what the opponent wants?\",\"a\":\"No — the opponent wants a vibrant, functioning world WITH inherent existence. V.36 shows this is impossible: inherent existence PREVENTS vibrance. You can't have both.\",\"realLifeExample\":\"Wanting a flexible rope that's also rigid. You can't have flexibility AND rigidity. Choose one.\"},{\"q\":\"How does this compare to our actual world?\",\"a\":\"Our world IS vibrant, changing, diverse — exactly what emptiness predicts and inherent existence prevents. The actual world confirms emptiness, not inherent existence.\",\"realLifeExample\":\"The observed world matches the prediction of emptiness (change, diversity) and contradicts inherent existence (stasis, uniformity).\"},{\"q\":\"Significance?\",\"a\":\"V.36 provides a VIVID IMAGE of what the opponent's position implies. The philosophical argument (vv.14-35) is now illustrated concretely.\",\"realLifeExample\":\"After the mathematical proof, a picture that shows what the proof means. V.36 is the picture.\"},{\"q\":\"Connection to v.1?\",\"a\":\"V.1: opponent fears emptiness creates a void. V.36: INHERENT EXISTENCE creates the void — a frozen, dead world. The opponent's fear is realized by their OWN position.\",\"deeper\":\"V.36 provides the most vivid image in Ch.24: the dead world of inherent existence. This image makes the abstract argument concrete and emotionally impactful. The reader can SEE what inherent existence implies — and it's terrifying. By contrast, the empty world is the vibrant, diverse, living world we actually experience.\"}],\"quiz\":{\"beginner\":{\"question\":\"What would a world of inherent existence look like?\",\"options\":[\"A) Vibrant\",\"B) FROZEN — no production, no cessation, no change, no diversity. A dead, static world. The opposite of what we experience.\",\"C) Partly active\",\"D) Same as now\"],\"correct\":\"B\",\"explanation\":\"Inherent = fixed → no change → dead world. The opposite of vibrant reality.\"},\"intermediate\":{\"question\":\"Why does inherent existence prevent diversity?\",\"options\":[\"A) It doesn't\",\"B) Diversity requires different conditions producing different results. Inherent things don't depend on conditions → no different results → no diversity. Uniformity, not variety.\",\"C) Only partially\",\"D) Different reason\"],\"correct\":\"B\",\"explanation\":\"No conditions → no different outcomes → no diversity. Inherent = uniform.\"},\"advanced\":{\"question\":\"How does v.36 relate to v.1?\",\"options\":[\"A) Unrelated\",\"B) V.1: opponent fears emptiness creates a void. V.36: inherent existence creates the void (frozen dead world). The opponent's fear is realized by their OWN position. Perfect irony.\",\"C) Same point\",\"D) Contradicts\"],\"correct\":\"B\",\"explanation\":\"The opponent's feared void is created by their own position, not by emptiness.\"}},\"verseText\":\"If things existed by their own nature, the world would be unproduced and unceased, unchanging, and devoid of diversity.\",\"madhyamakaConcept\":\"Svabhāvataḥ bhāvāḥ santi cet, jagat anutpanna aniruddha, avikriya, anānā (unproduced, unceased, unchanging, without diversity). The world of inherent existence is a dead world.\",\"quantumPhysicsParallel\":\"If all states were inherently fixed: no transitions, no dynamics, no evolution, no diversity of outcomes. A frozen quantum landscape.\"}},\"isShowcase\":false,\"chapterId\":24}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"A digital humanities platform for studying the MMK through

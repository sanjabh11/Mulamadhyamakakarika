c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":5,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_5\",\"number\":5,\"title\":\"The Infinite Regress of Twofold Motion\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If motion is in the mover, There would have to be a twofold motion: One in virtue of which it is a mover, And one in virtue of which it moves.\"},\"philosophy\":{\"insight\":\"If motion is a separate property \\\"possessed\\\" by the mover, you need two motions: (1) the motion that makes the entity a \\\"mover,\\\" and (2) the actual movement it performs. This launches an infinite regress — each motion needs its own motion.\",\"madhyamaka\":\"Garfield: this verse initiates the devastating infinite regress argument. Treating motion as a property separable from the mover forces a doubling: \\\"mover-constituting motion\\\" vs. \\\"actual movement.\\\" Kalupahana: the verse exposes the absurdity of reifying motion as a dharma separate from the agent. Candrakīrti elaborates: if the motion-property itself must move (to stay with the mover), it needs its own motion-property, ad infinitum.\",\"quantum\":\"Renormalisation Problem / Infinite Self-Energy: In early quantum field theory, treating an electron's self-interaction as a separable property led to infinite energies — each interaction generated further interactions, each needing renormalisation. The regress mirrors Nāgārjuna's: separating a property from its bearer creates infinite recursive structure.\",\"bridge\":\"Both show that treating a relational process as a separable, possessable property generates infinite regress. QFT solved this via renormalisation (absorbing infinities into redefined parameters). Madhyamaka solves it by denying the property is separable in the first place — motion and mover are conventionally one process.\",\"accessible\":\"If you need legs to walk, do your legs need their own legs? And those legs need legs? The absurdity shows \\\"walking\\\" isn't a separate thing your legs \\\"possess\\\" — it's what your legs DO. Similarly, motion isn't a thing the mover possesses; it's what the mover does.\",\"twoTruths\":\"Conventionally, one mover performs one motion — no regress. Ultimately, if motion were inherent, each motion would demand another, generating infinite regress.\",\"commonMisconception\":\"The regress doesn't happen in real life because motion ISN'T inherent. Conventional motion is a single, unanalysable dependent event — no infinite layers.\"},\"quantumResonance\":{\"concept\":\"Renormalisation Problem / Infinite Self-Energy\",\"score\":86,\"strength\":\"High\",\"explanation\":\"Infinite self-energy from particle self-interaction mirrors infinite regress. Renormalisation tames it — but the underlying infinity reveals the framework's limits.\",\"caveat\":\"Both encounter infinities when treating processes as inherently self-contained. The parallel is structural, not physical.\"},\"animation\":{\"geometry\":\"Nested Recursive Spheres\",\"anchor\":\"A large translucent sphere containing a smaller sphere, which contains a still smaller one — Russian doll structure revealing the infinite regress of motion-properties.\",\"texture\":\"Outer sphere: Translucent blue glass. Inner spheres: Progressively brighter, smaller. Innermost: Pulsing white core.\",\"mood\":\"Dizzying, recursive, revelatory absurdity\",\"colors\":[\"#3B82F6\",\"#8B5CF6\",\"#06B6D4\",\"#1E293B\"],\"orchestration\":{\"start\":\"Large sphere with one visible inner sphere.\",\"click\":\"Click to \\\"zoom in\\\" — reveals the inner sphere has its own inner sphere. Each click reveals another level (up to 5).\",\"reveal\":\"At level 5, text appears: \\\"Infinite regress. Motion is not a possessable property — it IS the process.\\\"\"},\"interaction\":{\"click\":\"Click to zoom deeper into the recursive structure\",\"drag\":\"Rotate to see the nesting from different angles\",\"hover\":\"Hover shows labels: \\\"Motion₁\\\", \\\"Motion₂\\\", \\\"Motion₃\\\"...\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.3},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":70,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"Nested drei Float groups for recursive sphere animation\",\"MeshPhysicalMaterial with transmission for glass-like transparency layers\",\"drei Zoom for click-to-zoom-in interaction\",\"Bloom post-processing for inner sphere glow through outer layers\",\"useSpring for smooth zoom transitions between recursion levels\"],\"camera\":{\"position\":[0,2,8],\"fov\":45,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c300MB memory, 60 FPS. Only 5 nested spheres rendered (not infinite). Each is a simple sphere with transmission material.\",\"tripoPrompt\":\"Nested translucent blue spheres, each containing a smaller glowing sphere inside, Russian doll structure, dark space, volumetric lighting, 8K.\",\"visualBridge\":\"The recursive nesting visually demonstrates the infinite regress — every \\\"motion-property\\\" needs its own \\\"motion-property,\\\" endlessly.\",\"educationalGoal\":\"User sees that inherent motion generates infinite regress — undermining the very thing it tries to explain.\"},\"deeperDive\":[{\"q\":\"Why would there be a twofold motion?\",\"a\":\"If motion is a distinct property \\\"possessed\\\" by the mover (like a hat on a head), then you need: (1) the motion that constitutes the entity as a \\\"mover\\\" (its qualification), and (2) the actual movement the mover performs (its action). Treating motion as a property forces this split.\",\"realLifeExample\":\"If \\\"cooking\\\" were a possession of the chef (not just an activity), you'd need: (1) the \\\"cooking\\\" that makes them a chef, and (2) the actual cooking they do. These are absurdly different — but that's what happens when you reify a process into a property.\"},{\"q\":\"Isn't \\\"being a mover\\\" and \\\"moving\\\" the same thing?\",\"a\":\"Conventionally, yes — that's Nāgārjuna's point! But the opponent who treats motion as an inherent property implicitly separates them: the mover is one thing, its motion is another thing it \\\"has.\\\" This innocent-seeming separation is what generates the regress.\",\"realLifeExample\":\"Is \\\"being a singer\\\" different from \\\"singing\\\"? Conventionally, no — a singer is just someone who sings. But if you insist \\\"singer\\\" is an inherent identity separate from the act, you must explain how the \\\"singer-essence\\\" relates to the act of singing — and you're stuck in a loop.\"},{\"q\":\"How does this regress work technically?\",\"a\":\"Step 1: The mover has motion (Motion₁). Step 2: Does Motion₁ itself move (to stay with the mover)? If yes, it needs Motion₂. Step 3: Does Motion₂ move? It needs Motion₃. This continues infinitely. If at any step the motion DOESN'T move, it separates from the mover, contradicting the premise.\",\"realLifeExample\":\"If a driver's licence \\\"proves\\\" you can drive, what \\\"proves\\\" the licence is valid? Another certificate. What validates that certificate? Another one. The regress shows the original proof isn't self-standing.\"},{\"q\":\"How does renormalisation in physics relate to this?\",\"a\":\"In QFT, an electron interacts with its own electromagnetic field. This self-interaction generates corrections, which generate further corrections, each requiring renormalisation. The infinities arise from treating the self-interaction as a separable property. Renormalisation absorbs these infinities into redefined parameters — effectively admitting the separation was artificial.\",\"realLifeExample\":\"Compound interest on interest on interest — if you treat each layer of interest as a separate \\\"possession,\\\" the amounts grow infinitely. The bank solves it by simply computing the total relationally (APR), not by stacking infinite layers.\"},{\"q\":\"What is Nāgārjuna's solution to the regress?\",\"a\":\"Don't start it. Motion isn't a separate property \\\"possessed\\\" by the mover. Motion and mover are conventionally inseparable aspects of one dependently arisen process. No separation → no doubling → no regress. The problem dissolves.\",\"realLifeExample\":\"A dance isn't a \\\"thing\\\" separate from the dancer. The dancer dances — one process, not a dancer-entity plus a dance-property. Once you see them as inseparable (conventionally), the regress never starts.\"},{\"q\":\"How does this verse connect to v.6?\",\"a\":\"V.5 establishes the twofold motion. V.6 draws the absurd consequence: two motions require two subjects (movers). But we started with one mover — so the analysis has produced an absurdity. The regress and the subject-doubling together demolish the \\\"motion as property\\\" view.\",\"deeper\":\"Garfield notes the v.5-6 pair forms a tight reductio: premise (motion inheres in mover) → consequence 1 (twofold motion) → consequence 2 (twofold subject) → absurdity (one mover became two). Therefore, the premise is false.\"}],\"quiz\":{\"beginner\":{\"question\":\"What happens when you treat motion as a separate property of the mover?\",\"options\":[\"A) Everything works perfectly\",\"B) You need two motions — one to make it a mover, one for the actual movement\",\"C) The mover disappears\",\"D) Time stops\"],\"correct\":\"B\",\"explanation\":\"Separating motion from the mover forces a split: \\\"mover-constituting motion\\\" and \\\"actual movement.\\\" This creates the doubling problem that leads to infinite regress.\"},\"intermediate\":{\"question\":\"What problem did early quantum field theory face with electron self-interaction?\",\"options\":[\"A) Electrons disappeared\",\"B) Treating self-interaction as separable generated infinite energies requiring renormalisation\",\"C) Electrons gained mass\",\"D) Nothing — it worked perfectly\"],\"correct\":\"B\",\"explanation\":\"The electron's self-interaction, treated as a separate property, generated infinite corrections — a regress solved by renormalisation. This structurally parallels the twofold motion regress.\"},\"advanced\":{\"question\":\"How does Nāgārjuna resolve the infinite regress?\",\"options\":[\"A) By accepting infinite motions exist\",\"B) By denying motion exists entirely\",\"C) By refusing to separate motion from the mover — they are conventionally inseparable aspects of one process\",\"D) By invoking a creator god\"],\"correct\":\"C\",\"explanation\":\"The regress arises only if motion is treated as a separable property. Nāgārjuna's solution: don't separate them. Motion and mover are one dependent process. No separation → no doubling → no regress.\"}},\"verseText\":\"If motion is in the mover, There would have to be a twofold motion: One in virtue of which it is a mover, And one in virtue of which it moves.\",\"madhyamakaConcept\":\"Garfield: this verse initiates the devastating infinite regress argument. Treating motion as a property separable from the mover forces a doubling: \\\"mover-constituting motion\\\" vs. \\\"actual movement.\\\" Kalupahana: the verse exposes the absurdity of reifying motion as a dharma separate from the agent. Candrakīrti elaborates: if the motion-property itself must move (to stay with the mover), it needs its own motion-property, ad infinitum.\",\"quantumPhysicsParallel\":\"Renormalisation Problem / Infinite Self-Energy: In early quantum field theory, treating an electron's self-interaction as a separable property led to infinite energies — each interaction generated further interactions, each needing renormalisation. The regress mirrors Nāgārjuna's: separating a property from its bearer creates infinite recursive structure.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",

176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":7,\"verseId\":11,\"chapterTitle\":\"Examination of Arising, Abiding, and Ceasing\",\"totalVerses\":34,\"verseData\":{\"id\":\"v7_11\",\"number\":11,\"title\":\"The Universal Lamp Absurdity\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If darkness is dispelled even though it does not encounter lamplight, this [lamplight] dwelling here would eliminate the darkness that dwells in all the worlds.\"},\"philosophy\":{\"insight\":\"Nāgārjuna delivers a devastating reductio: if light can dispel darkness without encountering it (as the opponent must claim after v.10), then a SINGLE lamp should illuminate the entire universe. Since it obviously doesn't, the opponent's model of action-without-contact is absurd.\",\"madhyamaka\":\"If interaction is not required for causation (as the opponent's lamp analogy implies after v.10's critique), then there is no reason the lamp's illumination should be limited to its vicinity. It should dispel ALL darkness everywhere. This absurd consequence refutes the premise. Garfield: \\\"The most vivid reductio in the chapter.\\\"\",\"quantum\":\"This is non-locality used as a reductio ad absurdum. While quantum entanglement involves real non-local correlations, unlimited non-local causation (one lamp illuminating the universe) is absurd even by quantum standards. The no-signaling theorem prevents such unlimited non-local effects.\",\"bridge\":\"Both Nāgārjuna and physics place limits on non-local effects. Physics allows entanglement correlations but not non-local signaling or causation. Nāgārjuna shows that removing ALL locality constraints (action without contact) leads to absurd universality — effects become unlimited.\",\"accessible\":\"If turning on your bedroom lamp magically lit up every house on Earth simultaneously — that would be action without needing to \\\"reach\\\" the darkness. Obviously absurd! Nāgārjuna argues: if the opponent removes the requirement for contact, they can't limit the effect.\",\"twoTruths\":\"Conventionally, lamps illuminate nearby areas because light travels and interacts with local darkness. Removing the interaction requirement (as the opponent's model does) eliminates the basis for any limitation, leading to universal absurdity.\",\"commonMisconception\":\"NOT arguing against quantum non-locality. Quantum entanglement involves constrained correlations, not unlimited causation. Nāgārjuna is showing that UNCONSTRAINED action-without-contact is absurd.\"},\"quantumResonance\":{\"concept\":\"Non-Locality and the No-Signaling Theorem\",\"score\":77,\"strength\":\"High\",\"explanation\":\"Quantum mechanics allows non-local correlations (entanglement) but the no-signaling theorem prevents non-local causation. Nāgārjuna's reductio shows that removing ALL locality constraints leads to absurd unlimited effects — structurally parallel to why the no-signaling theorem is needed.\",\"caveat\":\"Nāgārjuna's argument is about unlimited action-without-contact, not the subtle non-locality of entanglement. The parallel is about the need for constraints on non-local effects.\"},\"animation\":{\"visualBridge\":\"A single lamp whose light waves expand to fill the entire universe — absurdly illuminating galaxies billions of light-years away. Visualizes the reductio.\",\"educationalGoal\":\"User viscerally sees the absurd consequence: without contact requirement, one lamp illuminates everything. The premise must be wrong.\"},\"deeperDive\":[{\"q\":\"What kind of argument is Nāgārjuna making?\",\"a\":\"A reductio ad absurdum — accepting the opponent's premise (action without contact) and following it to its absurd conclusion (universal illumination from one lamp). Since the conclusion is obviously false, the premise must be false too.\",\"realLifeExample\":\"If shouting could reach anyone without needing sound waves to travel, one person's whisper would deafen the entire planet. Absurd — so the premise (no transmission needed) must be wrong.\"},{\"q\":\"Why should the lamp's effect be universal if contact isn't needed?\",\"a\":\"If light doesn't need to encounter darkness to dispel it, there's no mechanism limiting its range. What would stop it? Distance? But distance only matters if the effect requires physical transmission/contact. Remove the contact requirement and all limitations vanish.\",\"realLifeExample\":\"If a heater didn't need to radiate heat through space to warm things, it would warm the entire universe equally. The limitation comes from the transmission mechanism.\"},{\"q\":\"Does quantum entanglement make this argument obsolete?\",\"a\":\"No. Quantum entanglement involves correlations between measurements, constrained by the no-signaling theorem. It cannot transmit causal influence, information, or energy faster than light. Nāgārjuna's argument is about unlimited, unconstrained causation — which even quantum mechanics prohibits.\",\"realLifeExample\":\"Entangled particles are like two synchronized clocks — they show correlated times, but adjusting one doesn't change the other. Correlation, not causation.\"},{\"q\":\"What is the no-signaling theorem?\",\"a\":\"It proves that quantum entanglement cannot be used to transmit information or causal influence faster than light. Even though entangled particles show correlated measurements, the correlations cannot be controlled or used to send signals. This constrains non-locality to preserve causality.\",\"realLifeExample\":\"You and a friend each open an envelope containing matching colored cards (prepared in advance). You see your color and know theirs — but you can't CHANGE their color by changing yours.\"},{\"q\":\"How does this reductio relate to the lamp analogy overall?\",\"a\":\"V.9: Light can't illuminate itself (no darkness to dispel). V.10: Light can't encounter darkness (mechanism is unlocatable). V.11: Without encounter, effects would be universal (absurd). Each verse closes another escape route, systematically demolishing the lamp as a model for self-causation.\",\"realLifeExample\":\"Like blocking every exit in a maze: first the north path (v.9), then east (v.10), now west (v.11). Only south remains (v.12 will block it).\"},{\"q\":\"What philosophical principle is at stake?\",\"a\":\"The principle that causation requires some form of contact or mechanism. Without this, effects become arbitrary and unlimited. Nāgārjuna is not defending a specific causal theory but showing that the opponent's model (inherent causation without mechanism) collapses into absurdity.\",\"deeper\":\"This connects to the broader Mādhyamika project: all inherent causation models fail. Conventional causation works via dependently arisen mechanisms; inherent causation requires mechanisms that cannot be coherently specified.\"}],\"quiz\":{\"beginner\":{\"question\":\"What absurd consequence does Nāgārjuna derive?\",\"options\":[\"A) Lamps would stop working\",\"B) One lamp would illuminate the entire universe\",\"C) Darkness would become permanent\",\"D) All lamps would go out\"],\"correct\":\"B\",\"explanation\":\"If light doesn't need to encounter darkness to dispel it, there's no reason one lamp's effect should be limited — it should illuminate everything.\"},\"intermediate\":{\"question\":\"What logical technique is this?\",\"options\":[\"A) Proof by example\",\"B) Reductio ad absurdum — accepting the premise and showing it leads to absurdity\",\"C) Argument from authority\",\"D) Empirical observation\"],\"correct\":\"B\",\"explanation\":\"Nāgārjuna accepts \\\"light can act without contact\\\" and shows it leads to \\\"one lamp illuminates the universe\\\" — absurd, so the premise is false.\"},\"advanced\":{\"question\":\"Why doesn't quantum entanglement undermine Nāgārjuna's argument?\",\"options\":[\"A) It does undermine it\",\"B) Entanglement is constrained by the no-signaling theorem — it cannot produce unlimited non-local causation\",\"C) Entanglement only works with lamps\",\"D) Nāgārjuna anticipated quantum mechanics\"],\"correct\":\"B\",\"explanation\":\"The no-signaling theorem constrains entanglement to correlations, not causation. Nāgārjuna's reductio targets UNCONSTRAINED non-local causation, which even quantum mechanics prohibits.\"}},\"verseText\":\"If darkness is dispelled even though it does not encounter lamplight, this [lamplight] dwelling here would eliminate the darkness that dwells in all the worlds.\",\"madhyamakaConcept\":\"If interaction is not required for causation (as the opponent's lamp analogy implies after v.10's critique), then there is no reason the lamp's illumination should be limited to its vicinity. It should dispel ALL darkness everywhere. This absurd consequence refutes the premise. Garfield: \\\"The most vivid reductio in the chapter.\\\"\",\"quantumPhysicsParallel\":\"This is non-locality used as a reductio ad absurdum. While quantum entanglement involves real non-local correlations, unlimited non-local causation (one lamp illuminating the universe) is absurd even by quantum standards. The no-signaling theorem prevents such unlimited non-local effects.\"}},\"isShowcase\":false,\"chapterId\":7}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\

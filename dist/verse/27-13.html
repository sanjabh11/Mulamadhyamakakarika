88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":27,\"verseId\":13,\"chapterTitle\":\"Examination of Views\",\"totalVerses\":30,\"verseData\":{\"id\":\"v27_13\",\"number\":13,\"title\":\"Views About the Future Are Untenable\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Thus views regarding the future — \\\"I will exist,\\\" \\\"I will not exist,\\\" etc. — are not tenable.\"},\"philosophy\":{\"insight\":\"CONCLUSION on future-views: all four tetralemma positions fail for future existence, just as they did for past existence (v.8). No view about the future inherent self is sustainable.\",\"madhyamaka\":\"Aparānta-kalpanāḥ — bhaviṣyāmi, na bhaviṣyāmi, ubhayam, anubhayam — na upapadyante. Symmetric conclusion to v.8.\",\"quantum\":\"All four classical descriptions of future states fail just as they do for past states. Time-symmetric limitation of classical concepts.\",\"bridge\":\"Both: the tetralemma failure is time-symmetric. QM: classical descriptions fail for future. V.13: inherent descriptions fail for future self.\",\"accessible\":\"Will you exist in the future? Yes? No? Both? Neither? None works — for the same reasons views about the past failed.\",\"twoTruths\":\"Conventionally: we plan for the future. Ultimately: no inherent future self can be established.\",\"commonMisconception\":\"NOT advising against planning. Conventional planning is fine. But don't plan for an INHERENT self — plan within dependent arising.\"},\"quantumResonance\":{\"concept\":\"Time-Symmetric Tetralemma Failure\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"The tetralemma fails for future states just as for past. Classical descriptions are inadequate in both directions.\",\"caveat\":\"Physical time-symmetry vs. philosophical symmetry.\"},\"animation\":{\"visualBridge\":\"Four future-view statements dissolving, mirroring v.8's past-view dissolution. Complete symmetry.\",\"educationalGoal\":\"All four tetralemma positions about the future self fail. Future views are as untenable as past views.\"},\"deeperDive\":[{\"q\":\"Why mirror v.8?\",\"a\":\"The logic is time-symmetric. If you can't establish an inherent past self, you can't establish an inherent future self. Same analysis, same conclusion.\",\"realLifeExample\":\"The reasons you can't find yesterday's inherent you = the reasons you can't find tomorrow's inherent you.\"},{\"q\":\"Does this address death anxiety?\",\"a\":\"Directly. Fear of death assumes an inherent self that will end. If no inherent self exists, \\\"death\\\" isn't the destruction of a thing — it's a change in conditions.\",\"realLifeExample\":\"A wave ending: the water continues, only the pattern dissolves. No \\\"thing\\\" is destroyed.\"},{\"q\":\"Does this address hope?\",\"a\":\"It transforms hope from \\\"I will be X\\\" (inherent self achieving a state) to \\\"conditions can lead to X\\\" (dependent arising without inherent self). Healthier, less clinging.\",\"realLifeExample\":\"Instead of \\\"I will be successful\\\" → \\\"I can create conditions for success.\\\" Less ego, more effectiveness.\"},{\"q\":\"Vv.8 and 13 together?\",\"a\":\"Together they cover ALL temporal views: past and future. With the present self shown empty (vv.4-7), the self is empty in all three times.\",\"realLifeExample\":\"Past, present, future — all covered. No temporal escape from emptiness.\"},{\"q\":\"What remains?\",\"a\":\"Vv.14-30: views about permanence, self-nature, finitude, and the final conclusions of the MMK.\",\"realLifeExample\":\"The temporal analysis is complete. Now: non-temporal views.\"},{\"q\":\"Significance?\",\"a\":\"V.13 closes the future section. Combined with v.8 (past), all temporal self-views are dissolved.\",\"deeper\":\"V.13 completes the temporal dissolution. No inherent self in any time. The MMK has now dissolved views about the self at a moment (Ch.18), across past (vv.1-8), and into the future (vv.9-13). Complete temporal emptiness.\"}],\"quiz\":{\"beginner\":{\"question\":\"Are views about the future self tenable?\",\"options\":[\"A) Yes\",\"B) NO — all four positions fail, for the same reasons past-views failed. Time-symmetric analysis.\",\"C) Some are\",\"D) Only \\\"I will exist\\\"\"],\"correct\":\"B\",\"explanation\":\"All four fail. Same logic as past-views.\"},\"intermediate\":{\"question\":\"How does this address death anxiety?\",\"options\":[\"A) Doesn't\",\"B) Fear assumes an inherent self that will end. If no inherent self, \\\"death\\\" is change in conditions, not destruction of a thing.\",\"C) Increases anxiety\",\"D) Only for monks\"],\"correct\":\"B\",\"explanation\":\"No inherent self → death is not destruction of a thing.\"},\"advanced\":{\"question\":\"What has the MMK dissolved about the self?\",\"options\":[\"A) Nothing\",\"B) The self at a moment (Ch.18), across the past (vv.1-8), into the future (vv.9-13). COMPLETE temporal emptiness of self.\",\"C) Only present\",\"D) Only past\"],\"correct\":\"B\",\"explanation\":\"Complete: past, present, future. No inherent self in any time.\"}},\"verseText\":\"Thus views regarding the future — \\\"I will exist,\\\" \\\"I will not exist,\\\" etc. — are not tenable.\",\"madhyamakaConcept\":\"Aparānta-kalpanāḥ — bhaviṣyāmi, na bhaviṣyāmi, ubhayam, anubhayam — na upapadyante. Symmetric conclusion to v.8.\",\"quantumPhysicsParallel\":\"All four classical descriptions of future states fail just as they do for past states. Time-symmetric limitation of classical concepts.\"}},\"isShowcase\":false,\"chapterId\":27}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":

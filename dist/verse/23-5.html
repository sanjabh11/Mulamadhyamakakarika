176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":23,\"verseId\":5,\"chapterTitle\":\"Examination of Error\",\"totalVerses\":25,\"verseData\":{\"id\":\"v23_5\",\"number\":5,\"title\":\"Afflictions Do Not Exist in the Afflicted in Any of the Five Ways\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Like the view of the self, afflictions do not exist in the afflicted in the fivefold way. Like the view of the self, the afflicted does not exist in afflictions in the fivefold way.\"},\"philosophy\":{\"insight\":\"FIVEFOLD ANALYSIS applied to the affliction-person relation (same as Ch.18/Ch.22 applied to self/aggregates and Tathāgata/aggregates): afflictions are (1) not identical to, (2) not different from, (3) not contained in, (4) not containing, (5) not possessed by the afflicted person. Universal analytical tool yields universal result.\",\"madhyamaka\":\"Ātma-dṛṣṭi-vat kleśāḥ kliṣṭe pañca-vidhā na vidyante (like self-view, afflictions not in afflicted fivefold). Same analysis as Ch.18 (self) and Ch.22 (Tathāgata) now applied to affliction-person. Same method, same result.\",\"quantum\":\"Like applying the same mathematical formalism to different physical systems: the Schrödinger equation works for electrons, photons, and molecules. The fivefold analysis works for self, Tathāgata, and afflictions. Universal framework.\",\"bridge\":\"Both: a universal analytical framework applied to different subjects yields consistent results. QM: Schrödinger equation for all systems. V.5: fivefold analysis for all relations. Both: universality of the method.\",\"accessible\":\"The same \\\"treasure hunt\\\" technique that found no inherent self (Ch.18) and no inherent Buddha (Ch.22) now finds no inherent affliction-person relation. Same search, same result: nothing inherent.\",\"twoTruths\":\"Conventionally: persons experience afflictions. Ultimately: the relation is unfindable through fivefold analysis. Convention works; inherent findability doesn't.\",\"commonMisconception\":\"NOT saying persons don't experience afflictions. They DO conventionally. The fivefold analysis targets INHERENT relations, not conventional ones.\"},\"quantumResonance\":{\"concept\":\"Universal Formalism Applied Consistently\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"QM: same formalism for all systems → consistent results. V.5: same fivefold analysis for all relations → consistent unfindability. Both: universality of method demonstrates universality of result.\",\"caveat\":\"Schrödinger equation is physics. Fivefold analysis is Buddhist logic. Parallel is about method universality.\"},\"animation\":{\"visualBridge\":\"The five search beams (from Ch.22) now scanning between \\\"Person\\\" and \\\"Affliction.\\\" All five return empty. Caption: \\\"Same search, same result: nothing inherent.\\\"\",\"educationalGoal\":\"Universal method yields universal result. Affliction-person relation is as empty as self-aggregate relation.\"},\"deeperDive\":[{\"q\":\"Why apply the fivefold analysis here?\",\"a\":\"The fivefold analysis is Madhyamaka's universal tool for testing inherent relations. It was used for self-aggregates (Ch.18) and Tathāgata-aggregates (Ch.22). V.5 applies it to affliction-person, showing the analysis is universal.\",\"realLifeExample\":\"A pH test: works for water, juice, coffee. Universal tool. The fivefold analysis: works for self, Buddha, afflictions. Universal tool.\"},{\"q\":\"What does \\\"not identical\\\" mean here?\",\"a\":\"The person is NOT identical to their afflictions. You are not YOUR anger. If identical, you'd always be angry (affliction would be permanent). But anger comes and goes.\",\"realLifeExample\":\"You are not your cold. If identical with a cold, you'd always be sick. But colds come and go. Person ≠ affliction.\"},{\"q\":\"What does \\\"not different\\\" mean?\",\"a\":\"The person is not COMPLETELY other than their afflictions either. If totally different, afflictions couldn't affect the person. But they do affect us conventionally.\",\"realLifeExample\":\"A musician isn't completely separate from their music — it affects them, changes them. Total difference breaks the relation.\"},{\"q\":\"\\\"Like the view of the self\\\" — what connection?\",\"a\":\"Explicitly connecting this analysis to Ch.18's analysis of the self. The same five relations that fail for self-aggregates fail for affliction-person. The parallel is exact and intentional.\",\"realLifeExample\":\"The detective uses the same technique on a new case. Same technique → same kind of result: no inherent entity found.\"},{\"q\":\"What is the significance of universality?\",\"a\":\"If the fivefold analysis yields the same result (unfindability) for every subject analyzed, the result is UNIVERSAL: no inherent relation exists between any entity and its properties. This is universal emptiness demonstrated by universal method.\",\"realLifeExample\":\"If every patient tested shows the same result (no disease), it's not about one patient — it's a universal finding.\"},{\"q\":\"How does this advance Ch.23?\",\"a\":\"V.5 provides the definitive analytical proof that afflictions and persons don't have an inherent relation. This prepares for the rest of the chapter, which explores specific aspects of this conclusion.\",\"deeper\":\"V.5 is methodologically crucial: it demonstrates that the fivefold analysis is not topic-specific but universal. Every relation analyzed yields the same result. This universality is the strongest evidence for universal emptiness — it's not that particular phenomena happen to be empty, but that emptiness is the universal nature of all relations.\"}],\"quiz\":{\"beginner\":{\"question\":\"What does the fivefold analysis find about afflictions and persons?\",\"options\":[\"A) They're identical\",\"B) No inherent relation: not identical, not different, not contained in each other, not possessing. Same result as for self and Tathāgata.\",\"C) They're different\",\"D) One contains the other\"],\"correct\":\"B\",\"explanation\":\"Five relations tested, all fail. Universal method, universal result.\"},\"intermediate\":{\"question\":\"Why is universality of the method significant?\",\"options\":[\"A) It isn't\",\"B) If the same analysis yields emptiness for self, Tathāgata, AND afflictions, the result is universal. It's not topic-specific but reveals universal emptiness.\",\"C) Only works once\",\"D) Different results\"],\"correct\":\"B\",\"explanation\":\"Same method → same result across all subjects = universal emptiness.\"},\"advanced\":{\"question\":\"How does v.5 connect Chapters 18, 22, and 23?\",\"options\":[\"A) No connection\",\"B) Same fivefold analysis applied in all three: Ch.18 (self), Ch.22 (Tathāgata), Ch.23 (afflictions). Same result: inherent unfindability. Demonstrates systematic nature of Madhyamaka.\",\"C) Different analyses\",\"D) Only two connect\"],\"correct\":\"B\",\"explanation\":\"One universal method, three applications, one consistent result: universal emptiness.\"}},\"verseText\":\"Like the view of the self, afflictions do not exist in the afflicted in the fivefold way. Like the view of the self, the afflicted does not exist in afflictions in the fivefold way.\",\"madhyamakaConcept\":\"Ātma-dṛṣṭi-vat kleśāḥ kliṣṭe pañca-vidhā na vidyante (like self-view, afflictions not in afflicted fivefold). Same analysis as Ch.18 (self) and Ch.22 (Tathāgata) now applied to affliction-person. Same method, same result.\",\"quantumPhysicsParallel\":\"Like applying the same mathematical formalism to different physical systems: the Schrödinger equation works for electrons, photons, and molecules. The fivefold analysis works for self, Tathāgata, and afflictions. Universal framework.\"}},\"isShowcase\":false,\"chapterId\":23}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\"

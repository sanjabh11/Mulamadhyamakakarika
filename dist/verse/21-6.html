176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":21,\"verseId\":6,\"chapterTitle\":\"Examination of Becoming and Destruction\",\"totalVerses\":21,\"verseData\":{\"id\":\"v21_6\",\"number\":6,\"title\":\"No Becoming or Destruction of the Disappeared or Non-Disappeared\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"There is no becoming of the disappeared. There is no becoming of the non-disappeared. There is no destruction of the disappeared. There is no destruction of the non-disappeared.\"},\"philosophy\":{\"insight\":\"Opening the CATEGORICAL section (vv.6-9): analyzing becoming/destruction through past (disappeared) and present (non-disappeared) categories. (1) No becoming of what's past — it's already gone. (2) No becoming of what's present — it's already here. (3) No destruction of what's past — already ceased. (4) No destruction of what's present — if inherent, it's permanent.\",\"madhyamaka\":\"Vinaṣṭasya na saṃbhava (no becoming of the disappeared). Avinaṣṭasya na saṃbhava (no becoming of the non-disappeared). Vinaṣṭasya na vibhava (no destruction of the disappeared). Avinaṣṭasya na vibhava (no destruction of the non-disappeared). Four-fold denial across two categories.\",\"quantum\":\"Quantum measurement: you can't create a state that's already collapsed (disappeared), and you can't create a state that's already in its eigenstate (non-disappeared/present). Similarly, you can't destroy what's already decohered or what's inherently stable.\",\"bridge\":\"Both QM and v.6 show that neither past nor present states can inherently undergo creation or destruction. QM: collapsed states can't be re-created; eigenstates can't be further created. V.6: disappeared can't become; non-disappeared can't become. Both: inherent becoming/destruction fails across categories.\",\"accessible\":\"Yesterday (disappeared) can't \\\"become\\\" again — it's past. Today (non-disappeared) can't \\\"become\\\" — it's already here. Yesterday can't be destroyed — it's already gone. Today (if inherent) can't be destroyed — inherent things are permanent.\",\"twoTruths\":\"Conventionally: things arise (become present) and cease (become past). Ultimately: the categories \\\"past\\\" and \\\"present\\\" don't support inherent becoming or destruction.\",\"commonMisconception\":\"NOT saying nothing happens to past or present things. Conventional becoming and destruction apply to conventionally past/present entities. What's denied is INHERENT becoming/destruction of INHERENTLY past or present entities.\"},\"quantumResonance\":{\"concept\":\"No Re-Creation of Collapsed States\",\"score\":50,\"strength\":\"Medium\",\"explanation\":\"QM: collapsed (past) states can't be recreated; existing (present) eigenstates can't be further created. V.6: disappeared can't become; non-disappeared can't become. Both: inherent creation/destruction fails for both past and present states.\",\"caveat\":\"Quantum collapse is a physics process. V.6 is about inherent categorical becoming/destruction. The parallel is about the impossibility of inherent state creation across categories.\"},\"animation\":{\"visualBridge\":\"Four failed scenarios: (1) Past entity trying to \\\"become\\\" — can't, it's gone. (2) Present entity trying to \\\"become\\\" — can't, it's already here. (3) Past entity trying to be \\\"destroyed\\\" — already gone. (4) Present entity trying to be \\\"destroyed\\\" — if inherent, it's permanent.\",\"educationalGoal\":\"User sees: four-fold categorical denial. Neither past nor present entities can inherently become or be destroyed.\"},\"deeperDive\":[{\"q\":\"Why no becoming of the disappeared?\",\"a\":\"The \\\"disappeared\\\" (past) entity no longer exists. For it to \\\"become,\\\" it would need to arise again — but then it's not the \\\"disappeared\\\" entity; it's a new one. Inherent becoming of something inherently past is contradictory.\",\"realLifeExample\":\"Yesterday's sunset can't \\\"become\\\" again. If another sunset occurs, it's a NEW sunset, not yesterday's becoming. The past is past.\"},{\"q\":\"Why no becoming of the non-disappeared?\",\"a\":\"The \\\"non-disappeared\\\" (present) entity already exists. \\\"Becoming\\\" means coming into existence. Something that already exists doesn't need to come into existence — it's already there. Inherent becoming of what's inherently present is redundant.\",\"realLifeExample\":\"You can't \\\"arrive\\\" at a place you're already at. You're already here. Similarly, a present entity can't \\\"become\\\" — it's already present.\"},{\"q\":\"Why no destruction of the disappeared?\",\"a\":\"The \\\"disappeared\\\" has already ceased. Destruction means ceasing to exist. Something already ceased can't cease again — it's double cessation, which is meaningless. You can't destroy what's already destroyed.\",\"realLifeExample\":\"You can't knock down a building that's already demolished. The destruction is complete. Inherent re-destruction is impossible.\"},{\"q\":\"Why no destruction of the non-disappeared?\",\"a\":\"If the \\\"non-disappeared\\\" exists inherently, its existence is its unchangeable nature. Destruction would mean changing its inherent nature — which is impossible (svabhāva is unchangeable). Inherent existence → permanence → no destruction.\",\"realLifeExample\":\"If a diamond is inherently indestructible, it can't be destroyed. Similarly, if present existence is inherent, destruction is impossible.\"},{\"q\":\"How does this open the categorical section?\",\"a\":\"VV.1-5 analyzed temporal relations. VV.6-9 analyze CATEGORIES: past (disappeared) and present (non-disappeared). V.6 shows that neither category supports inherent becoming or destruction. VV.7-9 will deepen this analysis.\",\"realLifeExample\":\"After examining timing (vv.1-5), the investigation categorizes: \\\"Is the evidence past or present?\\\" Neither category supports inherent becoming/destruction (v.6).\"},{\"q\":\"What is the philosophical structure?\",\"a\":\"V.6 employs a 2×2 matrix: {disappeared, non-disappeared} × {becoming, destruction} = 4 combinations. All 4 fail. This is systematic: every combination of category and process is tested and found wanting.\",\"deeper\":\"V.6 applies the \\\"disappeared/non-disappeared\\\" (vinaṣṭa/avinaṣṭa) framework — used previously in Ch.7 and Ch.19 — to becoming and destruction. The 2×2 matrix (2 categories × 2 processes = 4 combinations) ensures completeness. Each combination fails for inherent existence: past things can't inherently become or be destroyed (already past); present things can't inherently become (already present) or be destroyed (if inherent, they're permanent). This categorical analysis complements the temporal analysis of vv.1-5.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can't a past (disappeared) entity \\\"become\\\"?\",\"options\":[\"A) It can\",\"B) It no longer exists — it's past. For it to \\\"become\\\" would mean arising again, but then it's a new entity, not the past one. Inherent becoming of what's inherently past is contradictory.\",\"C) Only future can become\",\"D) Past always returns\"],\"correct\":\"B\",\"explanation\":\"Past = gone. Becoming = arising. Gone things can't arise again (as the same entity). Inherent re-becoming is impossible.\"},\"intermediate\":{\"question\":\"How does v.6 use a 2×2 matrix?\",\"options\":[\"A) It doesn't\",\"B) {Disappeared, Non-disappeared} × {Becoming, Destruction} = 4 combinations. All 4 fail: past can't become/be destroyed; present can't become (already here) or be destroyed (inherent = permanent). Complete categorical refutation.\",\"C) Only 2 combinations\",\"D) Some work\"],\"correct\":\"B\",\"explanation\":\"4 combinations, all fail. Past and present entities can't inherently undergo becoming or destruction.\"},\"advanced\":{\"question\":\"How does the disappeared/non-disappeared framework connect across the MMK?\",\"options\":[\"A) Only Ch.21\",\"B) The same framework appears in Ch.7 (arising/ceasing) and Ch.19 (time). In each case, it's used to show that neither past nor present entities can inherently undergo the process being analyzed. It's a reusable analytical tool.\",\"C) Each use is different\",\"D) Only the first use matters\"],\"correct\":\"B\",\"explanation\":\"Same framework, reapplied: Ch.7, Ch.19, Ch.21. Past and present categories always fail for inherent processes.\"}},\"verseText\":\"There is no becoming of the disappeared. There is no becoming of the non-disappeared. There is no destruction of the disappeared. There is no destruction of the non-disappeared.\",\"madhyamakaConcept\":\"Vinaṣṭasya na saṃbhava (no becoming of the disappeared). Avinaṣṭasya na saṃbhava (no becoming of the non-disappeared). Vinaṣṭasya na vibhava (no destruction of the disappeared). Avinaṣṭasya na vibhava (no destruction of the non-disappeared). Four-fold denial across two categories.\",\"quantumPhysicsParallel\":\"Quantum measurement: you can't create a state that's already collapsed (disappeared), and you can't create a state that's already in its eigenstate (non-disappeared/present). Similarly, you can't destroy what's already decohered or what's inherently stable.\"}},\"isShowcase\":false,\"chapterId\":21}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully

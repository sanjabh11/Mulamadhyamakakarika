c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":6,\"verseId\":7,\"chapterTitle\":\"Examination of Desire and the Desirous\",\"totalVerses\":10,\"verseData\":{\"id\":\"v6_7\",\"number\":7,\"title\":\"If Different, Why Simultaneous?\",\"sanskrit\":{\"text\":\"rāgarāgiṇoḥ siddhaṃ pṛthaktvam yadi manyase | rāgaṃ ca rāgiṇaṃ caiva kiṃ arthaṃ saṃsṛjed bhavān ||\",\"transliteration\":\"rāgarāgiṇoḥ siddhaṃ pṛthaktvam yadi manyase | rāgaṃ ca rāgiṇaṃ caiva kiṃ arthaṃ saṃsṛjed bhavān\",\"translation\":\"If desire and the desirous one are established as different, then why would you think that they are simultaneous?\"},\"philosophy\":{\"insight\":\"A sharp rhetorical question: if you've successfully established desire and the desirous one as inherently different and independent, then WHY would they always appear together? Independent things have no obligation to co-occur. The very simultaneity you observe ARGUES AGAINST inherent difference. If they're truly separate, their togetherness is a mystery. If they're dependent, their togetherness is natural.\",\"madhyamaka\":\"Garfield: this is a reductio argument. The opponent claims: (1) desire and the desirous one are inherently different, and (2) they are simultaneous. Nāgārjuna shows (1) undermines (2): if genuinely independent, there's no reason for simultaneity. The observed simultaneity is actually evidence FOR dependence (against inherent difference), not evidence for the opponent's position. Siderits/Katsura: \\\"kiṃ artham\\\" (for what purpose/why) is a direct challenge — the opponent must explain the mechanism of simultaneity between independent entities.\",\"quantum\":\"EPR Paradox and Non-Locality: Einstein, Podolsky, and Rosen argued that entangled particles must have pre-existing properties (hidden variables) because truly independent particles shouldn't correlate. Their argument ASSUMED independence and concluded hidden variables must explain the correlation. Bell later proved hidden variables don't work. The \\\"EPR paradox\\\" parallels Nāgārjuna's question: IF the particles are independent, WHY do they correlate? The answer: they're NOT independent — they're entangled (dependent).\",\"bridge\":\"Both ask the same question: if two things are independent, why do they correlate/co-occur? Nāgārjuna: if desire and the desirous one are different, why simultaneous? EPR: if entangled particles are independent, why correlated? Both conclude: the correlation argues against independence, not for it.\",\"accessible\":\"If two strangers have no connection, why do they always arrive at the same restaurant at the same time? Either they have a hidden connection (not really independent), or it's an extraordinary coincidence (not a reliable pattern). The observed pattern argues FOR connection, not against it.\",\"twoTruths\":\"Conventionally, we observe desire and the desirous one together — that's evidence of their dependence. Ultimately, this togetherness is NATURAL given dependent arising, and MYSTERIOUS given inherent difference.\",\"commonMisconception\":\"NOT saying desire and the desirous one shouldn't be together. Saying their togetherness is EVIDENCE for dependent arising, not for inherent difference. The observed pattern supports Nāgārjuna's view, not the opponent's.\"},\"quantumResonance\":{\"concept\":\"EPR Paradox — Correlation Argues Against Independence\",\"score\":85,\"strength\":\"High\",\"explanation\":\"EPR asked: if particles are independent, why do they correlate? The answer was: they're NOT independent (entangled). Parallels Nāgārjuna's question: if desire/desirous are different, why simultaneous? Answer: they're NOT inherently different (dependently arisen).\",\"caveat\":\"EPR is about physical correlations; Nāgārjuna's is about conceptual co-occurrence. Both use the same logical structure: observed correlation as evidence against assumed independence.\"},\"animation\":{\"geometry\":\"Correlation as Evidence\",\"anchor\":\"Two separate boxes (representing inherent difference). Each time one opens, the other opens too — perfectly correlated. Question appears: \\\"If they're independent, WHY do they always match?\\\" The correlation itself argues against independence. Glowing threads appear between the boxes — revealing their hidden dependence.\",\"texture\":\"Boxes: Red/orange, separate positions. Correlation: Perfect synchronized opening. Question: White text. Threads: Purple glow revealing dependence.\",\"mood\":\"Puzzlement → question → revelation of dependence\",\"colors\":[\"#EF4444\",\"#F59E0B\",\"#FFFFFF\",\"#8B5CF6\"],\"orchestration\":{\"start\":\"Two separate boxes. They open and close in perfect synchrony.\",\"click\":\"Click: \\\"If they're independent, WHY do they always match?\\\" Question appears.\",\"reveal\":\"Glowing threads appear between boxes. Text: \\\"The correlation argues FOR dependence, not against it.\\\"\"},\"interaction\":{\"click\":\"Click to reveal the question about correlation\",\"drag\":\"Rotate the scene\",\"hover\":\"Hover over boxes: \\\"Desire\\\" / \\\"Desirous One.\\\" Hover over threads: \\\"Dependent arising.\\\"\"},\"controls\":{\"rotation\":{\"default\":true,\"speed\":0.3},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":50,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true,\"autoRevealToggle\":true},\"r3fTechniques\":[\"Animated box geometry with synchronized opening\",\"drei Text for question\",\"Line geometry for dependence threads\",\"Bloom for thread glow\",\"useSpring for box and reveal animations\"],\"camera\":{\"position\":[0,3,8],\"fov\":50,\"autoRotate\":true},\"fps\":60,\"performanceNotes\":\"\u003c200MB memory, 60 FPS. Two boxes + text + lines.\",\"visualBridge\":\"The perfectly correlated boxes and the \\\"why?\\\" question encode the verse: if independent, why simultaneous? Revealed threads encode: correlation argues for dependence.\",\"educationalGoal\":\"User sees the puzzling correlation between supposedly independent things and realises the correlation itself is evidence for dependence.\"},\"deeperDive\":[{\"q\":\"Why does observed simultaneity argue AGAINST inherent difference?\",\"a\":\"If two things are genuinely independent (inherently different), there's no MECHANISM for their constant co-occurrence. Independent entities have independent causes and conditions. Their simultaneous appearance would be a perpetual coincidence — which is implausible for something as reliable as the desire-desirous connection. The reliability of the connection argues that they're NOT independent.\",\"realLifeExample\":\"If your neighbor's lights always turn on exactly when yours do, you suspect a connection (same power grid, shared circuit). The pattern argues FOR a hidden connection, not FOR independence.\"},{\"q\":\"How does the EPR paradox parallel this?\",\"a\":\"Einstein, Podolsky, and Rosen observed that entangled particles show perfect correlations across distances. Assuming the particles are independent, they concluded hidden variables must explain it. Bell later proved hidden variables fail. The real explanation: the particles aren't independent — they're entangled. Similarly, Nāgārjuna shows: assuming desire/desirous are independent leads to the mystery of their constant co-occurrence. The real explanation: they're not independent — they're dependently arisen.\",\"realLifeExample\":\"Two phones ringing simultaneously every day. EPR says: \\\"maybe they have the same alarm set\\\" (hidden variables). Bell proves: \\\"no pre-set alarm can explain every correlation.\\\" The real answer: they're connected (same caller). Same logic here.\"},{\"q\":\"Is this argument empirical or logical?\",\"a\":\"Both. The OBSERVATION is empirical: desire and the desirous one always co-occur. The LOGIC is philosophical: if they're inherently different, this co-occurrence is unexplainable. The combination of empirical observation and logical analysis creates a powerful argument. Nāgārjuna uses what we observe to undermine what the opponent claims.\",\"realLifeExample\":\"Science works the same way: observe a pattern (empirical), then ask if the proposed explanation can account for it (logical). If the explanation (inherent difference) can't explain the pattern (constant co-occurrence), the explanation is wrong.\"},{\"q\":\"Can the opponent explain the co-occurrence through karma or causation?\",\"a\":\"They might try, but this creates new problems. If desire and the desirous one are CAUSED to co-occur by some third factor (karma, natural law), then they're dependent on that cause — which means they're not inherently independent after all. Every attempt to explain the co-occurrence reintroduces dependence, which undermines inherent difference.\",\"realLifeExample\":\"If someone says two unrelated events always coincide \\\"because of fate,\\\" they've introduced a connection (fate). The events are now NOT independent — they're dependent on fate. The explanation undermines the claim of independence.\"},{\"q\":\"What is the rhetorical force of \\\"why would you think\\\"?\",\"a\":\"\\\"Kiṃ artham\\\" (for what purpose/why) isn't just asking for an explanation — it's challenging the MOTIVATION. Why would the opponent WANT to say they're simultaneous if they're also inherently different? The desire for simultaneity comes from observing their co-occurrence. But that very observation argues for dependence. The opponent's own evidence supports Nāgārjuna's conclusion.\",\"deeper\":\"Garfield: this is a masterful rhetorical move. Nāgārjuna turns the opponent's own observation (co-occurrence) into an argument for his position (dependence) and against the opponent's position (inherent difference).\"},{\"q\":\"How does this fit the chapter's dialectical progression?\",\"a\":\"V.4: identity → no simultaneity; difference → problematic simultaneity. V.5: neither identity nor difference grounds association. V.6: inherent difference can't be established. V.7 (here): even IF established, difference makes simultaneity unexplainable. Each verse tightens the noose: the opponent's position becomes increasingly untenable with each step. V.8 will deliver the coup de grâce: the opponent's assertions are mutually contradictory.\",\"realLifeExample\":\"A prosecutor building a case: each piece of evidence makes the defendant's story less credible. V.7 is like showing the defendant's alibi actually places them AT the crime scene — their own evidence works against them.\"}],\"quiz\":{\"beginner\":{\"question\":\"If desire and the desirous one are inherently different, why would they always appear together?\",\"options\":[\"A) Because they're independently programmed to coincide\",\"B) There's no good reason — the constant co-occurrence actually argues FOR dependence, not for inherent difference\",\"C) They don't appear together\",\"D) Inherent difference explains co-occurrence\"],\"correct\":\"B\",\"explanation\":\"Independent things have no reason for constant co-occurrence. The observed togetherness is evidence FOR dependent arising, not for inherent difference.\"},\"intermediate\":{\"question\":\"How does the EPR paradox parallel this argument?\",\"options\":[\"A) No parallel\",\"B) EPR asked: if particles are independent, why do they correlate? The correlation argued against independence. Similarly, the desire-desirous co-occurrence argues against inherent difference.\",\"C) EPR proves independence\",\"D) EPR is unrelated to philosophy\"],\"correct\":\"B\",\"explanation\":\"EPR and Nāgārjuna use the same logic: observed correlation between supposedly independent things is evidence that they're NOT independent but dependent/entangled.\"},\"advanced\":{\"question\":\"Why is it significant that the opponent's own evidence supports Nāgārjuna?\",\"options\":[\"A) It's not significant\",\"B) The opponent's observation (co-occurrence) was meant to support simultaneity between different entities, but it actually supports dependent arising — the opponent's evidence undermines their own position\",\"C) The evidence is ambiguous\",\"D) Nāgārjuna ignores the evidence\"],\"correct\":\"B\",\"explanation\":\"Nāgārjuna turns the opponent's own observation into an argument for dependence. The co-occurrence that motivated the simultaneity claim actually argues for dependent arising, not inherent difference.\"}},\"verseText\":\"If desire and the desirous one are established as different, then why would you think that they are simultaneous?\",\"madhyamakaConcept\":\"Garfield: this is a reductio argument. The opponent claims: (1) desire and the desirous one are inherently different, and (2) they are simultaneous. Nāgārjuna shows (1) undermines (2): if genuinely independent, there's no reason for simultaneity. The observed simultaneity is actually evidence FOR dependence (against inherent difference), not evidence for the opponent's position. Siderits/Katsura: \\\"kiṃ artham\\\" (for what purpose/why) is a direct challenge — the opponent must explain the mechanism of simultaneity between independent entities.\",\"quantumPhysicsParallel\":\"EPR Paradox and Non-Locality: Einstein, Podolsky, and Rosen argued that entangled particles must have pre-existing properties (hidden variables) because truly independent particles shouldn't correlate. Their argument ASSUMED independence and concluded hidden variables must explain the correlation. Bell later proved hidden variables don't work. The \\\"EPR paradox\\\" parallels Nāgārjuna's question: IF the particles are independent, WHY do they correlate? The answer: they're NOT independent — they're entangled (dependent).\"}},\"isShowcase\":false,\"chapterId\":6}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]

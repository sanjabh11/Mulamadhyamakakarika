88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":23,\"verseId\":10,\"chapterTitle\":\"Examination of Error\",\"totalVerses\":25,\"verseData\":{\"id\":\"v23_10\",\"number\":10,\"title\":\"The Pleasant Is Dependent on the Unpleasant\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"The pleasant is dependent on the unpleasant. The pleasant does not exist without the unpleasant. Therefore the pleasant is not established.\"},\"philosophy\":{\"insight\":\"MUTUAL DEPENDENCE: the pleasant depends on the unpleasant for its definition. Without the concept of \\\"unpleasant,\\\" \\\"pleasant\\\" has no meaning. Mutual dependence → neither is independently established → both are empty.\",\"madhyamaka\":\"Śubha aśubha apekṣya (pleasant depends on unpleasant). Śubha aśubha vinā na vidyate (pleasant doesn't exist without unpleasant). Śubham na siddham (pleasant not established). Classic pratītyasamutpāda argument: mutual dependence = mutual emptiness.\",\"quantum\":\"Complementary observables: position is defined relative to momentum, and vice versa. Neither is independently meaningful. Similarly, pleasant is defined relative to unpleasant.\",\"bridge\":\"Both: mutually dependent concepts lack independent establishment. QM: position/momentum. V.10: pleasant/unpleasant. Both: defined only in relation.\",\"accessible\":\"\\\"Tall\\\" only makes sense relative to \\\"short.\\\" Without \\\"short,\\\" \\\"tall\\\" is meaningless. Similarly, \\\"pleasant\\\" only makes sense relative to \\\"unpleasant.\\\"\",\"twoTruths\":\"Conventionally: we distinguish pleasant from unpleasant. Ultimately: they're mutually dependent and therefore neither is independently established.\",\"commonMisconception\":\"NOT saying we can't distinguish pleasant from unpleasant. We CAN conventionally. What's denied is INDEPENDENT establishment — pleasant as inherently pleasant without reference to unpleasant.\"},\"quantumResonance\":{\"concept\":\"Complementary Observables — Mutually Defined\",\"score\":55,\"strength\":\"Medium\",\"explanation\":\"Position defined relative to momentum. Pleasant defined relative to unpleasant. Both: mutually dependent concepts lack independent meaning.\",\"caveat\":\"Complementarity is physics. V.10 is about evaluative concepts.\"},\"animation\":{\"visualBridge\":\"Two sides of a coin: \\\"Pleasant\\\" and \\\"Unpleasant.\\\" Try to see one without the other — impossible. They define each other. Caption: \\\"Mutual dependence → mutual emptiness.\\\"\",\"educationalGoal\":\"Pleasant and unpleasant are mutually dependent. Neither exists independently.\"},\"deeperDive\":[{\"q\":\"Why does pleasant depend on unpleasant?\",\"a\":\"\\\"Pleasant\\\" is defined as \\\"not unpleasant\\\" (and more). Without the contrast, the concept has no content. Like \\\"left\\\" requires \\\"right\\\" — they're defined in opposition.\",\"realLifeExample\":\"If you'd never experienced any discomfort, you wouldn't know what \\\"pleasant\\\" means. It's defined by contrast.\"},{\"q\":\"How does mutual dependence imply emptiness?\",\"a\":\"If A depends on B for its definition, and B depends on A, neither is independently established. They're like two cards leaning against each other — remove one, both fall.\",\"realLifeExample\":\"\\\"Teacher\\\" and \\\"student\\\" are mutually defined. Without students, no teacher. Without teacher, no students. Neither independently established.\"},{\"q\":\"How does complementarity illustrate this?\",\"a\":\"In QM, position and momentum are complementary — precisely defining one makes the other uncertain. They're not independently established quantities. Similarly, pleasant/unpleasant are complementary evaluations.\",\"realLifeExample\":\"\\\"Hot\\\" and \\\"cold\\\" are defined relative to each other. Absolute temperature is a convention; the experience is relative.\"},{\"q\":\"What about neutral experiences?\",\"a\":\"Neutral (upekṣā) is defined as \\\"neither pleasant nor unpleasant\\\" — still dependent on the pleasant/unpleasant framework. Even the \\\"middle\\\" depends on the \\\"extremes\\\" for definition.\",\"realLifeExample\":\"\\\"Medium\\\" size: defined as \\\"neither large nor small.\\\" Remove large/small, and \\\"medium\\\" is meaningless.\"},{\"q\":\"Connection to v.1?\",\"a\":\"V.1: afflictions depend on pleasant/unpleasant. V.10: pleasant depends on unpleasant. The entire chain is mutually dependent, and mutual dependence = emptiness.\",\"realLifeExample\":\"V.1: the building depends on the foundation. V.10: the foundation depends on the ground. V.10 shows the foundation itself is dependently arisen.\"},{\"q\":\"Significance?\",\"a\":\"V.10 introduces the MUTUAL DEPENDENCE argument. Vv.11-12 will apply this to unpleasant and error. Together: all three evaluative categories are empty through mutual dependence.\",\"deeper\":\"V.10 deploys the mutual dependence argument — one of Madhyamaka's most elegant proofs of emptiness. If A is defined in terms of B, and B in terms of A, neither is self-standing. Applied to pleasant/unpleasant: the very categories through which we evaluate experience are mutually dependent and therefore empty. The afflictions based on these empty categories are equally empty.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why does \\\"pleasant\\\" depend on \\\"unpleasant\\\"?\",\"options\":[\"A) It doesn't\",\"B) \\\"Pleasant\\\" is defined by contrast with \\\"unpleasant.\\\" Without the contrast, the concept has no meaning. They're mutually defined.\",\"C) Only one-way\",\"D) Independent\"],\"correct\":\"B\",\"explanation\":\"Mutual definition: each requires the other for meaning.\"},\"intermediate\":{\"question\":\"How does mutual dependence imply emptiness?\",\"options\":[\"A) It doesn't\",\"B) If A depends on B and B on A, neither is independently established. Like two cards leaning on each other. Mutual dependence = mutual emptiness.\",\"C) Only one is empty\",\"D) Strengthens both\"],\"correct\":\"B\",\"explanation\":\"Neither independently established → both empty of independent existence.\"},\"advanced\":{\"question\":\"How does complementarity parallel v.10?\",\"options\":[\"A) No parallel\",\"B) Position/momentum: complementary, mutually constraining. Pleasant/unpleasant: complementary, mutually defined. Both: concepts that lack independent establishment.\",\"C) Same thing\",\"D) Opposite\"],\"correct\":\"B\",\"explanation\":\"Complementary pairs: mutually defined, neither independently meaningful.\"}},\"verseText\":\"The pleasant is dependent on the unpleasant. The pleasant does not exist without the unpleasant. Therefore the pleasant is not established.\",\"madhyamakaConcept\":\"Śubha aśubha apekṣya (pleasant depends on unpleasant). Śubha aśubha vinā na vidyate (pleasant doesn't exist without unpleasant). Śubham na siddham (pleasant not established). Classic pratītyasamutpāda argument: mutual dependence = mutual emptiness.\",\"quantumPhysicsParallel\":\"Complementary observables: position is defined relative to momentum, and vice versa. Neither is independently meaningful. Similarly, pleasant is defined relative to unpleasant.\"}},\"isShowcase\":false,\"chapterId\":23}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\

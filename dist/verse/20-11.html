88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":20,\"verseId\":11,\"chapterTitle\":\"Examination of Cause and Effect (Saṃbhava)\",\"totalVerses\":24,\"verseData\":{\"id\":\"v20_11\",\"number\":11,\"title\":\"Without Connection to Cause, No Effect Can Arise\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Moreover, if not joined with its cause, What effect can be made to arise? Neither seen nor unseen by causes Are effects produced.\"},\"philosophy\":{\"insight\":\"Transitioning to the CONNECTION analysis (vv.11-15): if the effect is NOT JOINED (connected) to its cause, it can't arise from it. Effects are not produced whether the cause \\\"sees\\\" (directly contacts) the effect or \\\"doesn't see\\\" it. Neither direct nor indirect inherent connection enables inherent production.\",\"madhyamaka\":\"Hetu-asaṃyukta phala katham utpādyate (if not joined with cause, what effect arises?). Na dṛṣṭa na adṛṣṭa hetubhiḥ phala utpādyate (effects are produced neither seen nor unseen by causes). Inherent connection fails in all modes.\",\"quantum\":\"Quantum non-locality: entangled particles influence each other without classical \\\"connection\\\" (no signal passes between them). Yet the correlation exists. Like v.11: inherent connection (seen/unseen) doesn't explain production — but conventional correlation works.\",\"bridge\":\"Both quantum non-locality and v.11 challenge the idea that production requires inherent connection. QM: entangled particles correlate without classical connection. V.11: effects arise without inherent connection to causes. Both: production is conventional/correlational, not based on inherent connection.\",\"accessible\":\"For a cause to produce an effect, they must be connected somehow. But what kind of connection? If they touch (seen) — the spatial problems of vv.1-4 apply. If they don't touch (unseen) — what connects them? Neither option works for inherent production.\",\"twoTruths\":\"Conventionally: causes and effects ARE connected — through conventional dependent arising. Ultimately: this connection isn't inherent — it's a conventional regularity. Conventional connection works; inherent connection is incoherent.\",\"commonMisconception\":\"NOT saying causes and effects are unconnected. Conventional connection is real and necessary. The verse shows that INHERENT connection (whether direct or indirect) can't explain inherent production.\"},\"quantumResonance\":{\"concept\":\"Quantum Non-Locality — Correlation Without Classical Connection\",\"score\":60,\"strength\":\"Medium\",\"explanation\":\"Entangled particles: correlated without classical connection (no signal). V.11: effects arise without inherent connection to causes. Both: production/correlation works without inherent connection — conventional correlation suffices.\",\"caveat\":\"Quantum non-locality is a physics phenomenon. V.11 is about inherent connection. The parallel is about production without inherent connection.\"},\"animation\":{\"visualBridge\":\"A cause and effect with no visible connection between them. \\\"Seen\\\" (direct line) and \\\"Unseen\\\" (dotted line) both fail to establish inherent connection. Caption: \\\"Neither direct nor indirect inherent connection works.\\\"\",\"educationalGoal\":\"User sees: inherent connection (whether direct or indirect) can't explain production. Production works conventionally, not through inherent mechanisms.\"},\"deeperDive\":[{\"q\":\"What does \\\"joined with its cause\\\" mean?\",\"a\":\"Having an inherent CONNECTION — some real, inherent link between cause and effect. V.11 asks: without this inherent link, how can the effect arise from the cause? The answer: it can't, INHERENTLY. But it CAN conventionally.\",\"realLifeExample\":\"Two people are \\\"connected\\\" by a contract. But the contract is a convention, not an inherent bond. Remove the contract (convention), and the connection dissolves. Inherent connection doesn't exist; conventional connection works.\"},{\"q\":\"What does \\\"seen/unseen by causes\\\" mean?\",\"a\":\"\\\"Seen\\\" = direct contact/interaction. \\\"Unseen\\\" = action at a distance. V.11 says neither works for INHERENT production: direct contact faces the spatial problems (vv.1-4); indirect action faces the connection problem (what mediates?). Both fail inherently.\",\"realLifeExample\":\"Can you control a toy by touching it (seen)? Yes, conventionally. By thinking about it (unseen)? Not inherently. V.11: neither direct nor indirect inherent control (production) works.\"},{\"q\":\"How does this open the connection section?\",\"a\":\"VV.1-4: spatial analysis. VV.5-10: temporal analysis. VV.11-15: connectional analysis — HOW cause and effect are linked. V.11 introduces the problem: no inherent connection → no inherent production. VV.12-14 will examine simultaneity of connection. V.15 will summarize.\",\"realLifeExample\":\"After examining WHERE (spatial) and WHEN (temporal), the investigation examines HOW (connection). V.11 opens the \\\"how\\\" investigation.\"},{\"q\":\"How does quantum non-locality illustrate this?\",\"a\":\"Entangled particles are correlated WITHOUT any classical signal passing between them — no \\\"inherent connection\\\" yet perfect correlation. V.11: effects arise without inherent connection to causes — yet conventional causation works. Both: correlation/production without inherent connection.\",\"realLifeExample\":\"Two synchronized clocks in different cities keep perfect time without any wire between them. The correlation exists without a direct connection. Conventional synchronization (calibration) explains it, not an inherent link.\"},{\"q\":\"What is the relationship to Ch.14 (connection)?\",\"a\":\"Ch.14 examined inherent connection (saṃsarga) directly and found it incoherent. V.11 applies this finding to causation: since inherent connection is impossible (Ch.14), inherent production (which requires connection) is also impossible. Ch.14 provides the foundation; Ch.20 v.11 applies it.\",\"realLifeExample\":\"A legal precedent (Ch.14: no inherent connection) applied to a new case (Ch.20 v.11: therefore no inherent production). The earlier finding is the basis for the current argument.\"},{\"q\":\"What is the philosophical significance?\",\"a\":\"V.11 shifts the analysis from WHEN (temporal) to HOW (connectional). This is a new dimension of the critique: even if somehow the temporal problems were resolved, the connection problem remains. HOW are cause and effect linked? Neither direct nor indirect inherent connection works.\",\"deeper\":\"V.11 marks the transition to the third major section of Ch.20: the connectional analysis (vv.11-15). While the spatial section asked WHERE the effect is relative to the cause, and the temporal section asked WHEN the cause relates to the effect, the connectional section asks HOW they are linked. This three-dimensional analysis (space, time, connection) is remarkably thorough — like a physicist analyzing a system in every dimension before concluding.\"}],\"quiz\":{\"beginner\":{\"question\":\"Can effects be produced without connection to causes?\",\"options\":[\"A) Yes\",\"B) No — without connection, the effect has no link to the cause and can't arise from it. But neither \\\"direct\\\" nor \\\"indirect\\\" INHERENT connection works. Only conventional connection functions.\",\"C) Sometimes\",\"D) Only direct connection works\"],\"correct\":\"B\",\"explanation\":\"No inherent connection → no inherent production. Conventional connection works; inherent connection doesn't.\"},\"intermediate\":{\"question\":\"How does v.11 open the \\\"connection\\\" section of Ch.20?\",\"options\":[\"A) It doesn't\",\"B) VV.1-4: spatial (WHERE). VV.5-10: temporal (WHEN). V.11 begins the connectional analysis (HOW): neither direct nor indirect inherent connection enables production. A new dimension of critique.\",\"C) Only spatial matters\",\"D) Connection is irrelevant\"],\"correct\":\"B\",\"explanation\":\"Three dimensions: space, time, connection. V.11 opens the third dimension: HOW cause and effect are inherently linked (they can't be).\"},\"advanced\":{\"question\":\"How does Ch.14's analysis of connection ground v.11?\",\"options\":[\"A) No relation\",\"B) Ch.14: inherent connection (saṃsarga) is incoherent. V.11: inherent production requires connection; but inherent connection is impossible (Ch.14). Therefore: inherent production is impossible. Ch.14 provides the premise; v.11 draws the conclusion.\",\"C) Ch.14 is separate\",\"D) V.11 doesn't need Ch.14\"],\"correct\":\"B\",\"explanation\":\"Ch.14: no inherent connection possible. V.11: production needs connection. Conclusion: no inherent production. The earlier analysis grounds the current one.\"}},\"verseText\":\"Moreover, if not joined with its cause, What effect can be made to arise? Neither seen nor unseen by causes Are effects produced.\",\"madhyamakaConcept\":\"Hetu-asaṃyukta phala katham utpādyate (if not joined with cause, what effect arises?). Na dṛṣṭa na adṛṣṭa hetubhiḥ phala utpādyate (effects are produced neither seen nor unseen by causes). Inherent connection fails in all modes.\",\"quantumPhysicsParallel\":\"Quantum non-locality: entangled particles influence each other without classical \\\"connection\\\" (no signal passes between them). Yet the correlation exists. Like v.11: inherent connection (seen/unseen) doesn't explain production — but conventional correlation works.\"}},\"isShowcase\":false,\"chapterId\":20}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\"

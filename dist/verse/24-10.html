88e176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":24,\"verseId\":10,\"chapterTitle\":\"Examination of the Noble Truths\",\"totalVerses\":40,\"verseData\":{\"id\":\"v24_10\",\"number\":10,\"title\":\"Without Relying on Convention, the Ultimate Cannot Be Taught\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Without relying on convention, the ultimate cannot be taught. Without understanding the ultimate, nirvana cannot be attained.\"},\"philosophy\":{\"insight\":\"The RELATIONSHIP between the two truths: (1) You need CONVENTIONAL language/concepts to TEACH ultimate truth. (2) You need ULTIMATE understanding to attain nirvana. Both truths are needed; neither alone suffices. Convention is the VEHICLE for ultimate understanding.\",\"madhyamaka\":\"Vyavahāram anāśritya paramārtho na deśyate (without relying on convention, ultimate not taught). Paramārtham anāgamya nirvāṇaṃ nādhigamyate (without reaching ultimate, nirvana not attained). Convention → ultimate → nirvana.\",\"quantum\":\"You need classical language to TEACH quantum mechanics (using words, equations, diagrams). But you need QM understanding to DO quantum physics. Classical → quantum → applications.\",\"bridge\":\"Both: the conventional/classical framework is needed to TEACH the deeper framework. But the deeper framework is needed for the GOAL. Convention teaches ultimate; ultimate achieves liberation/prediction.\",\"accessible\":\"You need a ladder to reach the roof. Convention is the ladder; the ultimate is the roof; nirvana is the view from the roof. You can't skip the ladder (convention is necessary) but the ladder isn't the destination (ultimate truth is).\",\"twoTruths\":\"V.10 establishes the FUNCTIONAL relationship: convention is the vehicle, ultimate is the destination, nirvana is the goal. Each depends on the previous.\",\"commonMisconception\":\"NOT saying ultimate truth is \\\"better\\\" than conventional. Both are truths. Convention is NECESSARY for teaching and understanding. Dismissing convention is as wrong as dismissing ultimate.\"},\"quantumResonance\":{\"concept\":\"Classical Language Needed to Teach Quantum Reality\",\"score\":58,\"strength\":\"Medium\",\"explanation\":\"QM taught using classical language/concepts. Ultimate taught using conventional language. Both: the \\\"lower\\\" framework is the vehicle for the \\\"higher.\\\" But the higher is needed for the goal.\",\"caveat\":\"Classical-quantum pedagogy is physics. Convention-ultimate pedagogy is Buddhist teaching.\"},\"animation\":{\"visualBridge\":\"A ladder (Convention) leading to a platform (Ultimate) overlooking nirvana. You need the ladder to reach the platform. Caption: \\\"Convention → Ultimate → Nirvana.\\\"\",\"educationalGoal\":\"Convention is the vehicle for ultimate understanding. Ultimate understanding leads to nirvana. Both needed.\"},\"deeperDive\":[{\"q\":\"Why can't the ultimate be taught without convention?\",\"a\":\"Teaching requires language, concepts, examples — all conventional. You can't point to emptiness directly (it's not an object). You must use conventional tools (words, analogies, reasoning) to lead the student to ultimate understanding.\",\"realLifeExample\":\"You can't teach calculus without using English (or some language). The language is conventional; the mathematics is deeper. But you need the language to convey the math.\"},{\"q\":\"Why can't nirvana be attained without the ultimate?\",\"a\":\"Nirvana is the cessation of suffering through understanding emptiness. Without understanding emptiness (ultimate truth), you can't see through the afflictions that perpetuate suffering.\",\"realLifeExample\":\"You can't cure a disease without understanding its cause. Understanding (ultimate) → cure (nirvana).\"},{\"q\":\"Does convention have value beyond teaching?\",\"a\":\"Yes — convention is where life is lived, practice happens, and compassion is expressed. Convention isn't just a stepping stone but the arena of action. The bodhisattva operates in convention.\",\"realLifeExample\":\"Language isn't just for teaching physics — it's for communicating, expressing love, and building community. Convention is the arena of life.\"},{\"q\":\"How does the QM parallel work?\",\"a\":\"You teach QM using classical concepts (position, momentum, energy). Students learn QM through these concepts. But to DO quantum physics (build quantum computers, etc.), you need QM understanding beyond classical. Classical teaches; QM enables.\",\"realLifeExample\":\"You learn to code using tutorials (conventional). But to build real software, you need programming understanding (ultimate). Tutorials teach; understanding enables.\"},{\"q\":\"Connection to the objection?\",\"a\":\"The opponent rejected convention (by demanding inherent existence) AND misunderstood ultimate truth (by equating emptiness with nothingness). V.10 shows both are needed and interdependent.\",\"realLifeExample\":\"The opponent threw away both the ladder and the destination. V.10 restores both.\"},{\"q\":\"Significance?\",\"a\":\"V.10 establishes the PRACTICAL RELATIONSHIP between the two truths. This isn't just a theoretical distinction but a practical pedagogy: convention → ultimate → liberation.\",\"deeper\":\"V.10 is practically essential: it shows how the two truths WORK TOGETHER. Convention is the method; ultimate is the understanding; nirvana is the result. This sequence — method → understanding → result — is the Buddhist path in miniature. The two truths aren't just an epistemological framework but a SOTERIOLOGICAL one.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why is convention needed for ultimate truth?\",\"options\":[\"A) It isn't\",\"B) Teaching requires language and concepts (conventional). You can't teach emptiness without words. Convention is the vehicle for ultimate understanding.\",\"C) Only for beginners\",\"D) Convention is false\"],\"correct\":\"B\",\"explanation\":\"Teaching requires conventional tools. Convention is the vehicle, not the destination.\"},\"intermediate\":{\"question\":\"What is the practical sequence?\",\"options\":[\"A) No sequence\",\"B) Convention → Ultimate → Nirvana. Convention teaches, ultimate understands, nirvana is attained. Each step depends on the previous.\",\"C) Only ultimate matters\",\"D) Convention alone\"],\"correct\":\"B\",\"explanation\":\"Method → understanding → result. Convention → ultimate → nirvana.\"},\"advanced\":{\"question\":\"How is v.10 both epistemological and soteriological?\",\"options\":[\"A) Only one\",\"B) Epistemological: two truths are ways of knowing. Soteriological: the sequence convention → ultimate → nirvana IS the path. The two truths framework is simultaneously a theory of knowledge AND a path to liberation.\",\"C) Only theoretical\",\"D) Only practical\"],\"correct\":\"B\",\"explanation\":\"Both: theory of knowledge AND path to liberation. Two truths serve both functions.\"}},\"verseText\":\"Without relying on convention, the ultimate cannot be taught. Without understanding the ultimate, nirvana cannot be attained.\",\"madhyamakaConcept\":\"Vyavahāram anāśritya paramārtho na deśyate (without relying on convention, ultimate not taught). Paramārtham anāgamya nirvāṇaṃ nādhigamyate (without reaching ultimate, nirvana not attained). Convention → ultimate → nirvana.\",\"quantumPhysicsParallel\":\"You need classical language to TEACH quantum mechanics (using words, equations, diagrams). But you need QM understanding to DO quantum physics. Classical → quantum → applications.\"}},\"isShowcase\":false,\"chapterId\":24}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>s

176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":7,\"verseId\":25,\"chapterTitle\":\"Examination of Arising, Abiding, and Ceasing\",\"totalVerses\":34,\"verseData\":{\"id\":\"v7_25\",\"number\":25,\"title\":\"Stasis Cannot Self-Sustain\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"Stasis cannot endure through itself Or through another stasis. Just as arising cannot arise from itself Or from another arising.\"},\"philosophy\":{\"insight\":\"Having dismantled arising (vv.1-12), Nāgārjuna now turns to abiding/stasis: it cannot sustain itself (self-causation paradox) nor be sustained by another instance of stasis (infinite regress). The same logical structure that destroyed arising destroys abiding.\",\"madhyamaka\":\"Stasis cannot inherently sustain itself (a thing already abiding doesn't need to \\\"make itself abide\\\") nor be sustained by another stasis (which itself needs sustaining — infinite regress). Garfield: \\\"The argument parallels the analysis of arising exactly, showing the universality of the emptiness argument.\\\"\",\"quantum\":\"The Quantum Zeno Effect shows that frequent measurement can \\\"freeze\\\" a quantum system in its current state. But this apparent stasis is actually maintained by continuous external interaction (measurement), not by the system itself. Even quantum \\\"stasis\\\" requires external conditions.\",\"bridge\":\"Both Nāgārjuna and quantum mechanics show that stability is not self-grounding. The Quantum Zeno Effect's \\\"frozen\\\" state requires continuous measurement; conventional stability requires ongoing conditions. Neither is inherently self-sustaining.\",\"accessible\":\"Try holding yourself up by pulling on your own hair — it doesn't work (self-caused stasis fails). Now imagine needing another \\\"you\\\" to hold you up, who needs another \\\"you\\\" to hold them... forever (other-caused stasis fails). Neither strategy works.\",\"twoTruths\":\"Conventionally, things persist — mountains endure, rivers flow continuously. Ultimately, this persistence is maintained by ongoing conditions (geological forces, water supply), not by an inherent property of \\\"stasis.\\\"\",\"commonMisconception\":\"NOT denying that things persist or endure. Denying that persistence is caused by an inherent property of \\\"stasis\\\" that either self-sustains or is sustained by another stasis. Conventional persistence works through conditions.\"},\"quantumResonance\":{\"concept\":\"Quantum Zeno Effect\",\"score\":80,\"strength\":\"High\",\"explanation\":\"The Quantum Zeno Effect \\\"freezes\\\" a system through continuous measurement — apparent stasis maintained by external interaction, not self-sustaining. This parallels Nāgārjuna's point: abiding is not self-grounding but condition-dependent.\",\"caveat\":\"The QZE is a real physical phenomenon. The analogy is about the non-self-grounding nature of stability, not about measurement in Buddhist philosophy.\"},\"animation\":{\"visualBridge\":\"A particle \\\"frozen\\\" by measurement arrows (Zeno Effect) — remove the arrows and it immediately changes state. Stasis is maintained externally, not inherently.\",\"educationalGoal\":\"User sees that stability requires ongoing conditions, not inherent self-sustaining properties.\"},\"deeperDive\":[{\"q\":\"Why can't stasis sustain itself?\",\"a\":\"If something is already abiding/stable, it doesn't need to \\\"make itself abide\\\" — it's already doing it. Self-causation of stasis is redundant. And if it's NOT yet stable, it can't cause itself to be stable (it doesn't have the property yet). The same dilemma from v.1 applies.\",\"realLifeExample\":\"A balanced rock doesn't \\\"balance itself\\\" — it's already balanced. The balance comes from conditions (center of gravity, friction), not from an inherent \\\"self-balancing\\\" property.\"},{\"q\":\"Why can't another stasis sustain the first?\",\"a\":\"If stasis A needs stasis B to sustain it, then B needs stasis C, and so on infinitely. The regress never terminates, so inherent stasis is never grounded. This is the same infinite regress that defeated arising in v.3.\",\"realLifeExample\":\"A bookshelf needs a floor, the floor needs a foundation, the foundation needs bedrock, bedrock needs tectonic plates... each level of support needs its own support.\"},{\"q\":\"What is the Quantum Zeno Effect?\",\"a\":\"When a quantum system is measured very frequently, it gets \\\"frozen\\\" in its current state — the probability of transitioning to another state becomes nearly zero. This was named after Zeno's paradox of the arrow. The key insight: the apparent stasis is maintained by external intervention (measurement), not by the system itself.\",\"realLifeExample\":\"Constantly checking on a pot of water (\\\"a watched pot never boils\\\") — in quantum mechanics, this literally prevents the \\\"boiling\\\" (state transition).\"},{\"q\":\"How does this parallel Nāgārjuna's analysis?\",\"a\":\"The QZE shows that even quantum \\\"stasis\\\" requires external conditions (measurement). Remove the measurement and the system immediately begins changing. Similarly, Nāgārjuna shows conventional stasis requires conditions — it's not an inherent self-sustaining property.\",\"realLifeExample\":\"A building stands because of its foundation, materials, and design — not because of an inherent \\\"standing\\\" property. Remove the foundation and it collapses.\"},{\"q\":\"How does this relate to the earlier analysis of arising?\",\"a\":\"Nāgārjuna explicitly draws the parallel: \\\"Just as arising cannot arise from itself or from another arising.\\\" The SAME logical structure (self-causation paradox + infinite regress) that destroyed inherent arising now destroys inherent abiding. The argument is universal.\",\"realLifeExample\":\"Using the same key to unlock two different doors — the logical structure is the same tool applied to different targets.\"},{\"q\":\"What does this mean for permanence?\",\"a\":\"Nothing is inherently permanent or stable. Conventional persistence requires ongoing conditions. When conditions change, things change. This doesn't mean everything is instantaneous — things DO persist conventionally — but their persistence is condition-dependent, not inherent.\",\"deeper\":\"This verse is crucial for understanding anicca (impermanence) in Buddhist philosophy: impermanence is not just the observation that things change, but the deeper insight that persistence itself lacks inherent foundation.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why can't stasis sustain itself?\",\"options\":[\"A) It's too lazy\",\"B) If already stable, self-sustaining is redundant; if not yet stable, it can't cause stability\",\"C) Stasis is impossible\",\"D) Only arising can self-sustain\"],\"correct\":\"B\",\"explanation\":\"Self-caused stasis faces the same dilemma as self-caused arising: if already present, it's redundant; if not yet present, it can't cause itself.\"},\"intermediate\":{\"question\":\"What does the Quantum Zeno Effect demonstrate about stasis?\",\"options\":[\"A) Things are naturally stable\",\"B) Apparent stasis requires continuous external interaction (measurement), not inherent self-sustaining\",\"C) Quantum systems never change\",\"D) Measurement has no effect on quantum states\"],\"correct\":\"B\",\"explanation\":\"The QZE \\\"freezes\\\" states through frequent measurement — proving that even quantum stasis is maintained externally, not inherently.\"},\"advanced\":{\"question\":\"How does this verse demonstrate the universality of the emptiness argument?\",\"options\":[\"A) It doesn't — stasis is different from arising\",\"B) The SAME logical structure (self-causation paradox + infinite regress) that refuted arising now refutes abiding, showing it applies to all characteristics\",\"C) Only arising is empty\",\"D) The argument only works for physical phenomena\"],\"correct\":\"B\",\"explanation\":\"Nāgārjuna explicitly parallels the arguments, showing the logical structure is universal — it applies to arising, abiding, AND ceasing equally.\"}},\"verseText\":\"Stasis cannot endure through itself Or through another stasis. Just as arising cannot arise from itself Or from another arising.\",\"madhyamakaConcept\":\"Stasis cannot inherently sustain itself (a thing already abiding doesn't need to \\\"make itself abide\\\") nor be sustained by another stasis (which itself needs sustaining — infinite regress). Garfield: \\\"The argument parallels the analysis of arising exactly, showing the universality of the emptiness argument.\\\"\",\"quantumPhysicsParallel\":\"The Quantum Zeno Effect shows that frequent measurement can \\\"freeze\\\" a quantum system in its current state. But this apparent stasis is actually maintained by continuous external interaction (measurement), not by the system itself. Even quantum \\\"stasis\\\" requires external conditions.\"}},\"isShowcase\":false,\"chapterId\":7}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,

176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":2,\"verseId\":11,\"chapterTitle\":\"Examination of Motion\",\"totalVerses\":25,\"verseData\":{\"id\":\"v2_11\",\"number\":11,\"title\":\"Regress Restated: Closing the Net\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"If a mover were to move, There would be a twofold motion: One in virtue of which he is a mover, And one in virtue of which the mover moves.\"},\"philosophy\":{\"insight\":\"Nāgārjuna restates the v.5 regress after the v.7-10 analysis. The repetition is strategic: having shown mutual dependence (v.7), tautology (v.9), and self-undermining (v.10), the regress now appears even more devastating. The \\\"motion as property\\\" view is attacked from all sides.\",\"madhyamaka\":\"Garfield: the repetition is not redundant — it closes the net. After v.7-10 showed the conceptual problems, v.11 reintroduces the formal regress to drive the final nail. Kalupahana: the verse transitions from the mover-motion analysis to the beginning-of-motion analysis (v.12-14). Siderits/Katsura: rhetorical repetition in Indian philosophical debate signals that the argument is considered conclusive.\",\"quantum\":\"Self-Reference / Gödel-type Incompleteness: Systems that try to ground themselves create self-referential loops. A formal system cannot prove its own consistency (Gödel, 1931). Similarly, motion cannot \\\"ground\\\" itself as a property — the attempt generates infinite regress, revealing the system's inability to self-justify.\",\"bridge\":\"Both show that self-grounding generates infinite regress or paradox. A system cannot prove its own axioms. Motion cannot be its own foundation as a property. The attempt at self-justification always requires one more level — ad infinitum.\",\"accessible\":\"Trying to lift yourself by your own bootstraps. Each attempt needs another attempt beneath it. Nāgārjuna restates this absurdity one final time: treating motion as a thing the mover \\\"has\\\" always needs another motion to explain the first one.\",\"twoTruths\":\"Conventionally, motion has a clear starting point. Ultimately, before motion begins, there is no 'mover' — but without a mover, motion cannot begin. The bootstrap problem reveals emptiness.\",\"commonMisconception\":\"Not claiming motion never starts. Showing that an INHERENT start requires pre-existing mover and motion, creating a chicken-and-egg problem that proves neither is inherent.\"},\"quantumResonance\":{\"concept\":\"Self-Reference / Formal System Incompleteness\",\"score\":83,\"strength\":\"High\",\"explanation\":\"Self-grounding systems generate regress or paradox. Motion as a self-grounding property generates infinite regress. Structural parallel to incompleteness.\",\"caveat\":\"Structural analogy illustrating shared patterns between quantum physics and Madhyamaka analysis. Educational metaphor, not literal equivalence.\"},\"animation\":{\"geometry\":\"Infinite Mirror Regress\",\"anchor\":\"Two parallel mirrors facing each other, each reflecting a \\\"mover → motion\\\" pair. The reflections regress infinitely into the distance, each smaller than the last.\",\"texture\":\"Mirrors: Polished chrome. Reflections: Progressively dimmer and smaller. First pair: Bright cyan and violet.\",\"mood\":\"Dizzying, conclusive, infinite\",\"colors\":[\"#06B6D4\",\"#8B5CF6\",\"#94A3B8\",\"#1E293B\"],\"orchestration\":{\"start\":\"First mover-motion pair visible between mirrors.\",\"click\":\"Click to \\\"zoom in\\\" — reveals the next level of reflection. Each level shows a smaller pair.\",\"reveal\":\"After 4 levels, mirrors shatter. Text: \\\"No bottom level. The regress is infinite. Motion is not a property.\\\"\"},\"interaction\":{\"click\":\"Click to zoom deeper into the infinite regress\",\"drag\":\"Rotate to see mirrors from the side — revealing the illusion of depth\",\"hover\":\"Hover shows level number: \\\"Regress level 1, 2, 3...\\\"\"},\"controls\":{\"rotation\":{\"default\":false,\"speed\":0},\"speed\":{\"default\":50,\"min\":0,\"max\":100},\"complexity\":{\"default\":60,\"min\":0,\"max\":100},\"zoom\":{\"default\":100,\"min\":50,\"max\":200},\"colorPicker\":true},\"r3fTechniques\":[\"drei MeshReflectorMaterial for mirror surfaces\",\"InstancedMesh for progressively smaller mover-motion pairs (6 levels)\",\"Custom fog shader for depth fade in reflections\",\"Bloom post-processing for mirror edge glow\",\"useSpring for zoom transitions between levels\"],\"camera\":{\"position\":[0,0,6],\"fov\":50,\"autoRotate\":false},\"fps\":60,\"performanceNotes\":\"\u003c350MB memory, 60 FPS. Mirror reflections faked with instanced geometry (not real-time reflections). 6 levels maximum.\",\"tripoPrompt\":\"Two parallel chrome mirrors with infinite reflections of glowing mover-motion pairs, progressively smaller, dark space, 8K.\",\"visualBridge\":\"The infinite mirror regress directly shows the endless recursion: every motion-property needs its own motion-property.\",\"educationalGoal\":\"User understands the bootstrap paradox: inherent motion needs a pre-existing mover, but the mover needs motion to exist — neither can come first.\"},\"deeperDive\":[{\"q\":\"Why repeat the argument from verse 5?\",\"a\":\"Strategic emphasis. After v.7-10 attacked from mutual dependence, tautology, and self-undermining angles, the regress now hits with full force. The opponent has no escape left. In Indian debate, repetition signals the argument is conclusive.\",\"realLifeExample\":\"A prosecutor summarising key evidence in closing arguments. The evidence was presented earlier, but the summary drives it home before the verdict.\"},{\"q\":\"What is the core absurdity?\",\"a\":\"Needing multiple motions (and multiple subjects) to account for one entity's movement. Each motion generates the need for another, infinitely. No \\\"bottom level\\\" exists to ground the explanation.\",\"realLifeExample\":\"Needing a permit to get a permit to get a permit... Bureaucratic infinite regress shows the system can't ground itself. At some point you need a different approach entirely.\"},{\"q\":\"How does Gödel's incompleteness relate?\",\"a\":\"Gödel proved (1931) that any consistent formal system powerful enough to describe arithmetic cannot prove its own consistency. It needs an external system to validate it — but that system needs its own validation. The regress is structural, not a failure of cleverness.\",\"realLifeExample\":\"Who watches the watchmen? If you hire guards to watch the guards, who watches those guards? The self-policing problem has no internal solution.\"},{\"q\":\"Is the regress actual or just conceptual?\",\"a\":\"It's a logical consequence of a faulty conceptual framework. Nāgārjuna isn't saying infinite motions literally exist — he's showing the framework DEMANDS them, which is absurd, so the framework is wrong.\",\"realLifeExample\":\"Calculating compound interest with infinite compounding periods gives a mathematical result (e^rt), but no bank literally compounds infinitely. The math reveals the structure, not the literal reality.\"},{\"q\":\"What does this verse transition to?\",\"a\":\"Having demolished \\\"motion as property of mover\\\" (v.3-11), Nāgārjuna now turns to \\\"the beginning of motion\\\" (v.12-14). Can motion's START be located? The trilemma returns in temporal form.\",\"realLifeExample\":\"A detective eliminates \\\"who\\\" suspects, then moves to \\\"when\\\" — when did the crime begin? Each line of inquiry faces its own problems.\"},{\"q\":\"How does the v.3-11 argument block summarise?\",\"a\":\"V.3: circular definition. V.4: contradiction with non-motion. V.5-6: regress + subject doubling. V.7: mutual dependence. V.8: category exhaustion. V.9: tautology. V.10: self-undermining. V.11: regress restated conclusively. Nine verses, six distinct arguments, all converging on one conclusion: motion cannot be an inherent property.\",\"deeper\":\"This is among the most sustained philosophical arguments in the MMK. Nine verses systematically dismantle one claim from every conceivable angle — a masterclass in prasaṅga methodology.\"}],\"quiz\":{\"beginner\":{\"question\":\"Why does Nāgārjuna repeat the regress argument from verse 5?\",\"options\":[\"A) He forgot he already made it\",\"B) To close the net — after additional arguments (v.7-10), the regress is now conclusive\",\"C) Because it's a different argument\",\"D) To fill space\"],\"correct\":\"B\",\"explanation\":\"The repetition is strategic. After showing mutual dependence, tautology, and self-undermining paradoxes, restating the regress drives the final nail into the \\\"motion as property\\\" view.\"},\"intermediate\":{\"question\":\"What did Gödel's incompleteness theorem prove?\",\"options\":[\"A) All math is wrong\",\"B) A consistent formal system cannot prove its own consistency — it needs an external system, creating potential regress\",\"C) Math is complete\",\"D) Logic is useless\"],\"correct\":\"B\",\"explanation\":\"Gödel showed self-grounding creates regress. A system cannot validate itself without external support, which needs its own support. This parallels motion's inability to ground itself as a property.\"},\"advanced\":{\"question\":\"How many distinct arguments does the v.3-11 block contain against inherent motion?\",\"options\":[\"A) One argument repeated nine times\",\"B) Six: circularity, contradiction, regress + doubling, mutual dependence, category exhaustion, tautology + self-undermining\",\"C) Two: for and against\",\"D) None — the argument fails\"],\"correct\":\"B\",\"explanation\":\"The block contains six distinct argument types systematically attacking inherent motion from every angle — a masterclass in Madhyamaka prasaṅga methodology.\"}},\"verseText\":\"If a mover were to move, There would be a twofold motion: One in virtue of which he is a mover, And one in virtue of which the mover moves.\",\"madhyamakaConcept\":\"Garfield: the repetition is not redundant — it closes the net. After v.7-10 showed the conceptual problems, v.11 reintroduces the formal regress to drive the final nail. Kalupahana: the verse transitions from the mover-motion analysis to the beginning-of-motion analysis (v.12-14). Siderits/Katsura: rhetorical repetition in Indian philosophical debate signals that the argument is considered conclusive.\",\"quantumPhysicsParallel\":\"Self-Reference / Gödel-type Incompleteness: Systems that try to ground themselves create self-referential loops. A formal system cannot prove its own consistency (Gödel, 1931). Similarly, motion cannot \\\"ground\\\" itself as a property — the attempt generates infinite regress, revealing the system's inability to self-justify.\"}},\"isShowcase\":false,\"chapterId\":2}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#001F3F\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Nagarjuna Quantum Reflections\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A digital humanities learning and research platform for studying Nagarjuna’s Mūlamadhyamakakārikā with interactive verse exploration, transparent AI assistance, and carefully caveated quantum analogies.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"Madhyamaka,Nagarjuna,Mūlamadhyamakakārikā,digital humanities,Buddhist philosophy,quantum analogies,research transparency,interactive pedagogy\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Nagarjuna

176c6d.js\",\"690\",\"static/chunks/app/verse/%5Bid%5D/page-179c881197ecc822.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$L13\",null,{\"data\":{\"chapterId\":23,\"verseId\":4,\"chapterTitle\":\"Examination of Error\",\"totalVerses\":25,\"verseData\":{\"id\":\"v23_4\",\"number\":4,\"title\":\"The Afflictions Belong to Someone — But Who?\",\"sanskrit\":{\"text\":\"\",\"transliteration\":\"\",\"translation\":\"The afflictions are someone's afflictions. But that someone is not established. Without the owner, to whom do the afflictions belong?\"},\"philosophy\":{\"insight\":\"Ownership problem: afflictions must belong to SOMEONE (they don't float freely). But the \\\"someone\\\" (self) isn't inherently established (v.3). Without an established owner, inherent ownership fails. Afflictions without an owner are empty afflictions.\",\"madhyamaka\":\"Kleśāḥ kasyacit (afflictions are someone's). Sa ca na siddha (but that someone is not established). Svāmin vinā kasya kleśāḥ (without owner, whose afflictions?). The possessor-possessed relation breaks down without an established possessor.\",\"quantum\":\"Entangled properties: \\\"spin-up\\\" belongs to which particle? In an entangled pair, individual properties aren't well-defined until measurement. \\\"Ownership\\\" of the property is ambiguous.\",\"bridge\":\"Both: the \\\"owner\\\" of the property is ambiguous/unestablished. QM: which particle \\\"has\\\" the spin? V.4: which self \\\"has\\\" the affliction? Both: ownership presupposes what isn't established.\",\"accessible\":\"A lost wallet: it \\\"belongs to someone\\\" — but if you can't find or establish who, the ownership relation is empty. Similarly, afflictions \\\"belong to someone\\\" — but the self is unfindable.\",\"twoTruths\":\"Conventionally: persons have afflictions (\\\"I'm angry\\\"). Ultimately: the self to whom afflictions belong is unestablished. Conventional ownership without inherent possession.\",\"commonMisconception\":\"NOT saying no one suffers. People CONVENTIONALLY suffer. What's denied is INHERENT ownership — a fixed, findable self that inherently possesses afflictions.\"},\"quantumResonance\":{\"concept\":\"Ambiguous Property Ownership in Entanglement\",\"score\":52,\"strength\":\"Medium\",\"explanation\":\"Entangled particles: \\\"whose\\\" spin is up? Individual properties undefined. V.4: \\\"whose\\\" affliction? Self undefined. Both: property ownership presupposes what's not established.\",\"caveat\":\"Entanglement is physics. V.4 is about self-affliction relation.\"},\"animation\":{\"visualBridge\":\"Afflictions (colored orbs) floating in space, trying to attach to a \\\"self\\\" that keeps dissolving. Caption: \\\"Without an established owner, to whom do afflictions belong?\\\"\",\"educationalGoal\":\"Afflictions need an owner, but the self is unfindable. Ownership fails.\"},\"deeperDive\":[{\"q\":\"Why must afflictions belong to someone?\",\"a\":\"Afflictions are EXPERIENCES — desire, hatred, confusion. Experiences require an experiencer. They can't exist free-floating. But the experiencer (self) is empty (Ch.18, v.3).\",\"realLifeExample\":\"Pain must be felt by someone. But if the \\\"someone\\\" is empty, the pain-ownership is empty too. Pain conventionally exists; inherent ownership doesn't.\"},{\"q\":\"How does this differ from nihilism?\",\"a\":\"Nihilism: no one suffers. V.4: no one INHERENTLY possesses afflictions. Conventional suffering is real. Inherent possession is what's denied. Middle Way between \\\"solid self with solid afflictions\\\" and \\\"no self, no suffering.\\\"\",\"realLifeExample\":\"A movie character suffers (conventionally real in the movie). But no one INHERENTLY suffers in the movie (it's a movie). V.4: conventional suffering without inherent possession.\"},{\"q\":\"What is the practical benefit?\",\"a\":\"When you stop identifying afflictions as MINE (inherently possessed), they lose power. \\\"There is anger\\\" vs. \\\"I AM angry\\\" — the first recognizes the affliction without inherent ownership. This is the basis of mindfulness practice.\",\"realLifeExample\":\"Meditation instruction: \\\"Notice anger arising\\\" (no ownership) vs. \\\"I am angry\\\" (inherent ownership). The first is liberating; the second is binding.\"},{\"q\":\"How does entanglement illustrate this?\",\"a\":\"In an entangled pair, you can't say which particle \\\"owns\\\" the spin-up property — it's shared/undefined until measurement. Similarly, afflictions are shared/undefined in terms of inherent ownership. The self that \\\"owns\\\" them is undefined.\",\"realLifeExample\":\"Whose fault is a team loss? Each player? The coach? Ownership of blame is ambiguous because the \\\"owner\\\" isn't cleanly identifiable.\"},{\"q\":\"How does this build on vv.1-3?\",\"a\":\"V.1: afflictions arise from thought. V.2: empty because basis is empty. V.3: empty because self is empty. V.4: empty because ownership is empty. Three layers of emptiness analysis.\",\"realLifeExample\":\"Three reasons a painting isn't \\\"inherently valuable\\\": (1) beauty is subjective, (2) no inherent owner, (3) ownership itself is a convention. Triple emptiness.\"},{\"q\":\"Significance?\",\"a\":\"V.4 completes the initial analysis by showing that the self-affliction relation is empty. This prepares for vv.5-24's detailed examination of how afflictions relate to persons.\",\"deeper\":\"V.4 addresses the \\\"relational\\\" emptiness of afflictions — not just that they're empty in themselves (v.2) or that their owner is empty (v.3), but that the RELATION of ownership is empty. This triple emptiness (of the affliction, the owner, and the ownership relation) is a thorough demonstration.\"}],\"quiz\":{\"beginner\":{\"question\":\"What is the ownership problem for afflictions?\",\"options\":[\"A) No problem\",\"B) Afflictions need an owner (experiencer). But the self is unfindable. Without an established owner, inherent ownership fails.\",\"C) Afflictions own themselves\",\"D) Only some need owners\"],\"correct\":\"B\",\"explanation\":\"Afflictions need an owner. Owner (self) is empty. Ownership fails inherently.\"},\"intermediate\":{\"question\":\"How does v.4 relate to mindfulness?\",\"options\":[\"A) No relation\",\"B) \\\"There is anger\\\" (no ownership) vs. \\\"I AM angry\\\" (inherent ownership). V.4 supports the first approach — recognizing afflictions without claiming inherent possession. This is mindfulness.\",\"C) Only for meditation\",\"D) Opposite of mindfulness\"],\"correct\":\"B\",\"explanation\":\"Mindfulness: recognizing afflictions without inherent ownership. V.4 provides the philosophical basis.\"},\"advanced\":{\"question\":\"What is the \\\"triple emptiness\\\" in vv.2-4?\",\"options\":[\"A) One emptiness\",\"B) V.2: affliction empty (basis empty). V.3: owner empty (self empty). V.4: ownership relation empty. Three layers of analysis showing afflictions are thoroughly empty.\",\"C) Only double\",\"D) Not a pattern\"],\"correct\":\"B\",\"explanation\":\"Object, subject, and relation all empty. Triple emptiness of afflictions.\"}},\"verseText\":\"The afflictions are someone's afflictions. But that someone is not established. Without the owner, to whom do the afflictions belong?\",\"madhyamakaConcept\":\"Kleśāḥ kasyacit (afflictions are someone's). Sa ca na siddha (but that someone is not established). Svāmin vinā kasya kleśāḥ (without owner, whose afflictions?). The possessor-possessed relation breaks down without an established possessor.\",\"quantumPhysicsParallel\":\"Entangled properties: \\\"spin-up\\\" belongs to which particle? In an entangled pair, individual properties aren't well-defined until measurement. \\\"Ownership\\\" of the property is ambiguous.\"}},\"isShowcase\":false,\"chapterId\":23}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta

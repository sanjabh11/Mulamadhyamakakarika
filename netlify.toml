[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Netlify handles Next.js redirects automatically. 
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify handles Next.js redirects automatically. 
# We only need custom ones if they aren't handled by next.config.js.

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://whop.com https://*.whop.com; form-action 'self' https://whop.com https://*.whop.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://storage.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.fal.ai https://cdn.jsdelivr.net; frame-src 'self' https://discord.com https://whop.com https://*.whop.com;"

[[redirects]]
  from = "/verse"
  to = "/verse/1-1"
  status = 302
